                              Surface(color = if (idx == currentIndex) preset.primary.copy(alpha = 0.25f) else preset.card.copy(alpha = 0.85f), shape = RoundedCornerShape(12.dp), border = BorderStroke(1.dp, if (idx == currentIndex) preset.primary else preset.border), modifier = Modifier.fillMaxWidth().clickable { onSelectTrack(idx) }) {
                                  Row(Modifier.padding(12.dp), horizontalArrangement = Arrangement.SpaceBetween) {
                                      Text(track.title, color = DesignTokens.TextPrimary, fontWeight = FontWeight.Bold, maxLines = 1, modifier = Modifier.weight(1f))
                                      Text(track.artist, color = DesignTokens.TextSecondary, fontSize = 12.sp)
                                  }
                              }
                          }
                      }
                  }
              }
          }

