          package com.universal.carlauncher.ui.screens

          import android.content.Intent
          import android.provider.Settings
          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.StrokeCap
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.universal.carlauncher.core.designsystem.DesignTokens
          import com.universal.carlauncher.core.designsystem.LocalCockpitPreset
          import com.universal.carlauncher.core.hardware.HardwareDiagnosticReport
          import com.universal.carlauncher.core.responsive.ResponsiveLayoutMetrics
          import com.universal.carlauncher.core.storage.LauncherStorage
          import com.universal.carlauncher.domain.islamic.DailyPrayerSchedule
          import com.universal.carlauncher.ui.navigation.CockpitSection
          import java.util.Locale

          data class LiveDrivingTelemetry(
              val speedKmh: Int?,
              val accuracyMeters: Int?,
              val distanceKm: Float,
              val maxSpeedKmh: Int,
              val bearingDegrees: Int?,
              val durationFormatted: String,
              val tripStartTimeFormatted: String,
              val gpsStatusMessage: String
          )

          @Composable
          fun DashboardScreen(
              metrics: ResponsiveLayoutMetrics,
              timeFormatted: String,
              secondsFormatted: String,
              gregorianDate: String,
              hijriDate: String,
              telemetry: LiveDrivingTelemetry,
              hardware: HardwareDiagnosticReport,
              prayers: DailyPrayerSchedule,
              currentTrackTitle: String,
              isPlayingMusic: Boolean,
              storage: LauncherStorage,
              onToggleMusicPlay: () -> Unit,
              onNextTrack: () -> Unit,
              onResetTrip: () -> Unit,
              onNavigateTo: (CockpitSection) -> Unit,
              onRequestGpsPermission: () -> Unit
          ) {
              val preset = LocalCockpitPreset.current
              val context = LocalContext.current
              val displaySpeed = if (telemetry.speedKmh != null) {
                  if (storage.useMphUnit) (telemetry.speedKmh * 0.621371f).toInt() else telemetry.speedKmh
              } else 0
              val speedUnitLabel = if (storage.useMphUnit) "MPH" else "كم / ساعة"
              val isOverSpeed = (telemetry.speedKmh ?: 0) >= storage.speedAlertLimit

              Column(
                  modifier = Modifier.fillMaxSize().padding(metrics.outerPadding),
                  verticalArrangement = Arrangement.spacedBy(metrics.outerPadding)
              ) {
                  // 1. الشريط العلوي: الساعة، التاريخ، وحالة السيارة الحقيقية
                  Surface(
                      color = preset.card,
                      shape = androidx.compose.foundation.shape.RoundedCornerShape(DesignTokens.RadiusM),
                      border = BorderStroke(1.dp, preset.border),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth().padding(horizontal = 14.dp, vertical = 10.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                              Row(verticalAlignment = Alignment.Bottom) {
                                  Text(timeFormatted, style = MaterialTheme.typography.headlineMedium, color = DesignTokens.TextPrimary, fontWeight = FontWeight.Black)
                                  if (storage.showSeconds) {
                                      Spacer(Modifier.width(4.dp))
                                      Text(secondsFormatted, fontSize = 13.sp, color = preset.primary, fontWeight = FontWeight.Bold)
                                  }
                              }
                              Column {
                                  Text(gregorianDate, style = MaterialTheme.typography.bodyLarge, color = DesignTokens.TextPrimary)
                                  if (storage.showHijriDate) {
                                      Text(hijriDate, style = MaterialTheme.typography.labelMedium, color = preset.secondary)
                                  }
                              }
                          }

                          // مؤشرات حالة السيارة الحقيقية
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp), verticalAlignment = Alignment.CenterVertically) {
                              HardwareStatusChip(
                                  icon = Icons.Default.GpsFixed,
                                  label = if (telemetry.speedKmh != null) "GPS نشط" else if (hardware.isGpsEnabled) "GPS جاهز" else "GPS مغلق",
                                  color = if (telemetry.speedKmh != null) DesignTokens.StatusSuccess else DesignTokens.StatusWarning,
                                  onClick = onRequestGpsPermission
                              )
                              HardwareStatusChip(
                                  icon = Icons.Default.Bluetooth,
                                  label = if (hardware.isBluetoothEnabled) "BT متصل" else "BT مغلق",
                                  color = if (hardware.isBluetoothEnabled) DesignTokens.StatusInfo else DesignTokens.TextMuted,
                                  onClick = { runCatching { context.startActivity(Intent(Settings.ACTION_BLUETOOTH_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) } }
                              )
                              HardwareStatusChip(
                                  icon = Icons.Default.Wifi,
                                  label = hardware.connectionTypeAr,
                                  color = if (hardware.isInternetConnected) DesignTokens.StatusSuccess else DesignTokens.TextMuted,
                                  onClick = { runCatching { context.startActivity(Intent(Settings.ACTION_WIFI_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) } }
                              )
                          }
                      }
                  }

                  // 2. منطقة القيادة الرئيسية (عداد السرعة + البطاقات الذكية)
                  if (metrics.isLandscape) {
                      Row(
                          modifier = Modifier.weight(1f).fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(metrics.outerPadding)
                      ) {
                          SpeedometerLuxuryPanel(
                              displaySpeed = displaySpeed,
                              hasLiveFix = telemetry.speedKmh != null,
                              unitLabel = speedUnitLabel,
                              isOverSpeed = isOverSpeed,
                              statusMessage = telemetry.gpsStatusMessage,
                              circularStyle = storage.circularGaugeStyle,
                              gaugeSize = metrics.gaugeDiameter,
                              modifier = Modifier.weight(0.36f).fillMaxHeight()
                          )

                          DashboardCardsGrid(
                              modifier = Modifier.weight(0.64f).fillMaxHeight(),
                              columns = metrics.gridColumns,
                              spacing = metrics.outerPadding,
                              telemetry = telemetry,
                              hardware = hardware,
                              prayers = prayers,
                              currentTrackTitle = currentTrackTitle,
                              isPlayingMusic = isPlayingMusic,
                              storage = storage,
                              onToggleMusicPlay = onToggleMusicPlay,
                              onNextTrack = onNextTrack,
                              onResetTrip = onResetTrip,
                              onNavigateTo = onNavigateTo
                          )
                      }
                  } else {
                      Column(
                          modifier = Modifier.weight(1f).fillMaxWidth(),
                          verticalArrangement = Arrangement.spacedBy(metrics.outerPadding)
                      ) {
                          SpeedometerLuxuryPanel(
                              displaySpeed = displaySpeed,
                              hasLiveFix = telemetry.speedKmh != null,
                              unitLabel = speedUnitLabel,
                              isOverSpeed = isOverSpeed,
                              statusMessage = telemetry.gpsStatusMessage,
                              circularStyle = storage.circularGaugeStyle,
                              gaugeSize = metrics.gaugeDiameter,
                              modifier = Modifier.fillMaxWidth().weight(0.42f)
                          )

                          DashboardCardsGrid(
                              modifier = Modifier.fillMaxWidth().weight(0.58f),
                              columns = metrics.gridColumns,
                              spacing = metrics.outerPadding,
                              telemetry = telemetry,
                              hardware = hardware,
                              prayers = prayers,
                              currentTrackTitle = currentTrackTitle,
                              isPlayingMusic = isPlayingMusic,
                              storage = storage,
                              onToggleMusicPlay = onToggleMusicPlay,
                              onNextTrack = onNextTrack,
                              onResetTrip = onResetTrip,
                              onNavigateTo = onNavigateTo
                          )
                      }
                  }
              }
          }

          @Composable
          private fun SpeedometerLuxuryPanel(
              displaySpeed: Int,
              hasLiveFix: Boolean,
              unitLabel: String,
              isOverSpeed: Boolean,
              statusMessage: String,
              circularStyle: Boolean,
              gaugeSize: androidx.compose.ui.unit.Dp,
              modifier: Modifier
          ) {
              val preset = LocalCockpitPreset.current
              val activeColor = if (isOverSpeed) DesignTokens.StatusDanger else preset.primary

              Card(
                  modifier = modifier,
                  colors = CardDefaults.cardColors(containerColor = preset.card),
                  border = BorderStroke(1.5.dp, if (isOverSpeed) DesignTokens.StatusDanger else preset.border),
                  shape = androidx.compose.foundation.shape.RoundedCornerShape(DesignTokens.RadiusL)
              ) {
                  Column(
                      modifier = Modifier.fillMaxSize().padding(12.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.SpaceBetween
                  ) {
                      Surface(
                          color = preset.background,
                          shape = androidx.compose.foundation.shape.RoundedCornerShape(DesignTokens.RadiusPill)
                      ) {
                          Text(
                              text = if (hasLiveFix) "قراءة GPS حقيقية" else "في انتظار إشارة GPS",
                              fontSize = 11.sp,
                              color = if (hasLiveFix) DesignTokens.StatusSuccess else DesignTokens.StatusWarning,
                              modifier = Modifier.padding(horizontal = 12.dp, vertical = 4.dp)
                          )
                      }

                      Box(modifier = Modifier.size(gaugeSize), contentAlignment = Alignment.Center) {
                          if (circularStyle) {
                              Canvas(modifier = Modifier.fillMaxSize().padding(6.dp)) {
                                  val stroke = 14.dp.toPx()
                                  val d = minOf(size.width, size.height) - stroke
                                  val topLeft = Offset((size.width - d) / 2f, (size.height - d) / 2f)
                                  drawArc(
                                      color = preset.cardElevated, startAngle = 135f, sweepAngle = 270f,
                                      useCenter = false, topLeft = topLeft, size = Size(d, d),
                                      style = Stroke(stroke, cap = StrokeCap.Round)
                                  )
                                  val frac = (displaySpeed.coerceIn(0, 240) / 240f)
                                  drawArc(
                                      brush = Brush.sweepGradient(listOf(activeColor, preset.secondary)),
                                      startAngle = 135f, sweepAngle = 270f * frac,
                                      useCenter = false, topLeft = topLeft, size = Size(d, d),
                                      style = Stroke(stroke, cap = StrokeCap.Round)
                                  )
                              }
                          }
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Text(
                                  text = if (hasLiveFix) "$displaySpeed" else "--",
                                  style = MaterialTheme.typography.displayLarge,
                                  color = if (isOverSpeed) DesignTokens.StatusDanger else DesignTokens.TextPrimary
                              )
                              Text(unitLabel, style = MaterialTheme.typography.titleMedium, color = activeColor)
                          }
                      }

                      Text(
                          text = statusMessage,
                          style = MaterialTheme.typography.labelMedium,
                          color = DesignTokens.TextSecondary,
                          maxLines = 1
                      )
                  }
              }
          }

          @Composable
          private fun DashboardCardsGrid(
              modifier: Modifier,
              columns: Int,
              spacing: androidx.compose.ui.unit.Dp,
              telemetry: LiveDrivingTelemetry,
              hardware: HardwareDiagnosticReport,
              prayers: DailyPrayerSchedule,
              currentTrackTitle: String,
              isPlayingMusic: Boolean,
              storage: LauncherStorage,
              onToggleMusicPlay: () -> Unit,
              onNextTrack: () -> Unit,
              onResetTrip: () -> Unit,
              onNavigateTo: (CockpitSection) -> Unit
          ) {
              val preset = LocalCockpitPreset.current
              LazyVerticalGrid(
                  columns = GridCells.Fixed(columns),
                  modifier = modifier,
                  verticalArrangement = Arrangement.spacedBy(spacing),
                  horizontalArrangement = Arrangement.spacedBy(spacing)
              ) {
                  // بطاقة معلومات الرحلة
                  if (storage.isCardVisible("trip")) {
                      item {
                          CockpitCardBox("بيانات الرحلة", Icons.Default.Route, onClick = { onNavigateTo(CockpitSection.VEHICLE) }) {
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                  StatMini("المسافة", String.format(Locale.US, "%.2f كم", telemetry.distanceKm))
                                  StatMini("المدة", telemetry.durationFormatted)
                                  StatMini("الأقصى", "${telemetry.maxSpeedKmh} كم/س")
                              }
                              Spacer(Modifier.height(6.dp))
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                  Text("البداية: ${telemetry.tripStartTimeFormatted}", fontSize = 11.sp, color = DesignTokens.TextSecondary)
                                  TextButton(onClick = onResetTrip, contentPadding = PaddingValues(0.dp)) {
                                      Text("تصفير", fontSize = 12.sp, color = preset.primary)
                                  }
                              }
                          }
                      }
                  }

                  // بطاقة مواقيت الصلاة والقبلة
                  if (storage.isCardVisible("prayer")) {
                      item {
                          CockpitCardBox("الصلاة القادمة: ${prayers.nextPrayerName}", Icons.Default.Mosque, onClick = { onNavigateTo(CockpitSection.ISLAMIC) }) {
                              Text("موعد الأذان: ${prayers.nextPrayerTime}", style = MaterialTheme.typography.titleLarge, color = preset.secondary)
                              Spacer(Modifier.height(4.dp))
                              Text("القبلة: ${prayers.qiblaDegrees}° • الفجر ${prayers.fajr} | المغرب ${prayers.maghrib}", fontSize = 11.sp, color = DesignTokens.TextSecondary)
                          }
                      }
                  }

                  // بطاقة مشغل الموسيقى المصغر
                  if (storage.isCardVisible("music")) {
                      item {
                          CockpitCardBox("مشغل الموسيقى", Icons.Default.MusicNote, onClick = { onNavigateTo(CockpitSection.MUSIC) }) {
                              Text(currentTrackTitle, style = MaterialTheme.typography.bodyLarge, color = DesignTokens.TextPrimary, maxLines = 1)
                              Spacer(Modifier.height(6.dp))
                              Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                  Button(onClick = onToggleMusicPlay, contentPadding = PaddingValues(horizontal = 14.dp, vertical = 4.dp)) {
                                      Text(if (isPlayingMusic) "إيقاف" else "تشغيل", fontSize = 12.sp)
                                  }
                                  OutlinedButton(onClick = onNextTrack, contentPadding = PaddingValues(horizontal = 12.dp, vertical = 4.dp)) {
                                      Text("التالي", fontSize = 12.sp)
                                  }
                              }
                          }
                      }
                  }

                  // بطاقة البوصلة والطقس الحقيقي
                  if (storage.isCardVisible("weather_compass")) {
                      item {
                          CockpitCardBox("البوصلة والطقس", Icons.Default.Explore, onClick = { onNavigateTo(CockpitSection.NAVIGATION) }) {
                              val dir = telemetry.bearingDegrees?.let { "$it°" } ?: "بانتظار الحركة"
                              Text("الاتجاه: $dir", style = MaterialTheme.typography.titleMedium, color = preset.primary)
                              Spacer(Modifier.height(4.dp))
                              val weatherMsg = when {
                                  hardware.hasAmbientTempSensor -> "حساس حرارة السيارة متاح"
                                  !hardware.isInternetConnected -> "الطقس: Offline (لا بيانات وهمية)"
                                  else -> "الطقس: يتطلب مزود خدمة خارجي"
                              }
                              Text(weatherMsg, fontSize = 11.sp, color = DesignTokens.TextSecondary)
                          }
                      }
                  }

                  // بطاقة الاختصارات السريعة
                  if (storage.isCardVisible("shortcuts")) {
                      item {
                          CockpitCardBox("اختصارات سريعة", Icons.Default.GridView, onClick = { onNavigateTo(CockpitSection.APPS) }) {
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                  QuickActionChip("الخرائط", Icons.Default.Map) { onNavigateTo(CockpitSection.NAVIGATION) }
                                  QuickActionChip("الأذكار", Icons.Default.MenuBook) { onNavigateTo(CockpitSection.ISLAMIC) }
                                  QuickActionChip("الراديو", Icons.Default.Radio) { onNavigateTo(CockpitSection.RADIO) }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun CockpitCardBox(
              title: String,
              icon: ImageVector,
              onClick: () -> Unit,
              content: @Composable ColumnScope.() -> Unit
          ) {
              val preset = LocalCockpitPreset.current
              Card(
                  colors = CardDefaults.cardColors(containerColor = preset.card),
                  border = BorderStroke(1.dp, preset.border),
                  shape = androidx.compose.foundation.shape.RoundedCornerShape(DesignTokens.RadiusM),
                  modifier = Modifier.fillMaxWidth().clickable(onClick = onClick)
              ) {
                  Column(modifier = Modifier.padding(12.dp)) {
                      Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          Icon(icon, contentDescription = title, tint = preset.primary, modifier = Modifier.size(18.dp))
                          Text(title, style = MaterialTheme.typography.titleMedium, color = DesignTokens.TextPrimary, maxLines = 1)
                      }
                      Spacer(Modifier.height(8.dp))
                      content()
                  }
              }
          }

          @Composable
          private fun StatMini(label: String, value: String) {
              Column {
                  Text(label, fontSize = 11.sp, color = DesignTokens.TextSecondary)
                  Text(value, fontSize = 13.sp, fontWeight = FontWeight.Bold, color = DesignTokens.TextPrimary)
              }
          }

          @Composable
          private fun QuickActionChip(label: String, icon: ImageVector, onClick: () -> Unit) {
              val preset = LocalCockpitPreset.current
              Surface(
                  color = preset.cardElevated,
                  shape = androidx.compose.foundation.shape.RoundedCornerShape(DesignTokens.RadiusS),
                  modifier = Modifier.clickable(onClick = onClick)
              ) {
                  Column(
                      modifier = Modifier.padding(horizontal = 10.dp, vertical = 6.dp),
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Icon(icon, contentDescription = label, tint = preset.secondary, modifier = Modifier.size(18.dp))
                      Text(label, fontSize = 11.sp, color = DesignTokens.TextPrimary)
                  }
              }
          }

          @Composable
          private fun HardwareStatusChip(icon: ImageVector, label: String, color: Color, onClick: () -> Unit) {
              val preset = LocalCockpitPreset.current
              Surface(
                  color = preset.cardElevated,
                  shape = androidx.compose.foundation.shape.RoundedCornerShape(DesignTokens.RadiusPill),
                  modifier = Modifier.clickable(onClick = onClick)
              ) {
                  Row(
                      modifier = Modifier.padding(horizontal = 10.dp, vertical = 5.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(5.dp)
                  ) {
                      Icon(icon, contentDescription = label, tint = color, modifier = Modifier.size(14.dp))
                      Text(label, fontSize = 11.sp, color = DesignTokens.TextPrimary)
                  }
              }
          }
          EOF

          # 11. Internal Screens (Navigation, Music, Radio, Phone, Islamic, Vehicle, Apps, Settings)
