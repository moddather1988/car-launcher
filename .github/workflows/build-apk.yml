          cat << 'EOF' > "$BASE/core/media/CarMusicEngine.kt"
          package com.universal.carlauncher.core.media
          import android.Manifest
          import android.content.ContentUris
          import android.content.Context
          import android.content.pm.PackageManager
          import android.media.*
          import android.net.Uri
          import android.os.Build
          import android.provider.MediaStore
          import androidx.compose.runtime.*
          import androidx.compose.ui.graphics.ImageBitmap
          import androidx.core.content.ContextCompat

          data class AudioTrackItem(val id: Long, val title: String, val artist: String, val album: String, val albumId: Long, val durationMs: Long, val contentUri: Uri)

          class CarMusicEngine(private val context: Context) {
              private var mediaPlayer: MediaPlayer? = null
              var allTracks by mutableStateOf<List<AudioTrackItem>>(emptyList())
                  private set
              var currentTrackIndex by mutableIntStateOf(0)
                  private set
              var isPlaying by mutableStateOf(false)
                  private set
              var currentPositionMs by mutableIntStateOf(0)
                  private set
              var currentDurationMs by mutableIntStateOf(1)
                  private set
              var hasAudioPermission by mutableStateOf(false)
                  private set
              var currentAlbumArt by mutableStateOf<ImageBitmap?>(null)
                  private set
              var isRadioStreamActive by mutableStateOf(false)
                  private set
              var activeRadioStreamTitle by mutableStateOf("")
                  private set

              init { checkPermissionAndScan() }

              fun requiredAudioPermission() = if (Build.VERSION.SDK_INT >= 33) Manifest.permission.READ_MEDIA_AUDIO else Manifest.permission.READ_EXTERNAL_STORAGE

              fun checkPermissionAndScan(): Boolean {
                  val granted = ContextCompat.checkSelfPermission(context, requiredAudioPermission()) == PackageManager.PERMISSION_GRANTED
                  hasAudioPermission = granted
                  if (granted) scanDeviceMusic()
                  return granted
              }

              fun scanDeviceMusic() {
                  if (!hasAudioPermission) return
                  val found = mutableListOf<AudioTrackItem>()
                  runCatching {
                      context.contentResolver.query(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, arrayOf(MediaStore.Audio.Media._ID, MediaStore.Audio.Media.TITLE, MediaStore.Audio.Media.ARTIST, MediaStore.Audio.Media.ALBUM, MediaStore.Audio.Media.ALBUM_ID, MediaStore.Audio.Media.DURATION), "${MediaStore.Audio.Media.IS_MUSIC} != 0", null, null)?.use { c ->
                          val idC = c.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                          val tC = c.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE)
                          val aC = c.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST)
                          val alC = c.getColumnIndexOrThrow(MediaStore.Audio.Media.ALBUM)
                          val alIdC = c.getColumnIndexOrThrow(MediaStore.Audio.Media.ALBUM_ID)
                          val dC = c.getColumnIndexOrThrow(MediaStore.Audio.Media.DURATION)
                          while (c.moveToNext() && found.size < 200) {
                              val dur = c.getLong(dC)
                              if (dur > 1500L) {
                                  found.add(AudioTrackItem(c.getLong(idC), c.getString(tC) ?: "مقطع", c.getString(aC) ?: "فنان", c.getString(alC) ?: "ألبوم", c.getLong(alIdC), dur, ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, c.getLong(idC))))
                              }
                          }
                      }
                  }
                  allTracks = found
              }

              fun playTrackAt(idx: Int) {
                  val track = allTracks.getOrNull(idx) ?: return
                  isRadioStreamActive = false
                  runCatching {
                      mediaPlayer?.release()
                      mediaPlayer = MediaPlayer().apply {
                          setDataSource(context, track.contentUri)
                          prepare(); start()
                      }
                      currentTrackIndex = idx
                      currentDurationMs = track.durationMs.toInt()
                      isPlaying = true
                  }
              }

              fun togglePlayPause() {
                  if (isRadioStreamActive) { stopRadioStream(); return }
                  val mp = mediaPlayer
                  if (mp != null && isPlaying) { mp.pause(); isPlaying = false }
                  else if (mp != null && !isPlaying) { mp.start(); isPlaying = true }
                  else if (allTracks.isNotEmpty()) playTrackAt(currentTrackIndex)
              }

              fun nextTrack() { if (allTracks.isNotEmpty()) playTrackAt((currentTrackIndex + 1) % allTracks.size) }
              fun prevTrack() { if (allTracks.isNotEmpty()) playTrackAt((currentTrackIndex - 1 + allTracks.size) % allTracks.size) }
              fun seekTo(pos: Int) { runCatching { mediaPlayer?.seekTo(pos); currentPositionMs = pos } }

              fun playRadioStream(url: String, name: String) {
                  runCatching {
                      mediaPlayer?.release()
                      isPlaying = false; isRadioStreamActive = true; activeRadioStreamName = "بث مباشر: $name"
                      mediaPlayer = MediaPlayer().apply { setDataSource(url); prepareAsync(); setOnPreparedListener { it.start(); isPlaying = true } }
                  }
              }

              fun stopRadioStream() { runCatching { mediaPlayer?.stop(); mediaPlayer?.release() }; mediaPlayer = null; isPlaying = false; isRadioStreamActive = false }

              fun syncProgressEverySecond() {
                  if (isPlaying && !isRadioStreamActive) runCatching { mediaPlayer?.let { if (it.isPlaying) currentPositionMs = it.currentPosition } }
              }

              fun currentTrack(): AudioTrackItem? = allTracks.getOrNull(currentTrackIndex)
              fun release() { mediaPlayer?.release(); mediaPlayer = null }

              companion object {
                  fun formatTimeMs(ms: Int): String {
                      val s = (ms / 1000).coerceAtLeast(0)
                      return String.format(Locale.US, "%02d:%02d", s / 60, s % 60)
                  }
              }
          }
          EOF

          cat << 'EOF' > "$BASE/core/hardware/VehicleHardwareService.kt"
