name: Build Car Launcher Universal v6.0 Next-Gen

on:
  push:
    branches: [ "main", "master", "v6.0-next-generation" ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-test-v6:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Complete v6.0 Next-Generation Modular Project
        run: |
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties
          BASE="app/src/main/java/com/universal/carlauncher"
          TEST_BASE="app/src/test/java/com/universal/carlauncher"
          mkdir -p "$BASE/core/designsystem" "$BASE/core/responsive" "$BASE/core/hardware" "$BASE/core/storage" "$BASE/core/receiver" "$BASE/core/diagnostics" "$BASE/domain/islamic" "$BASE/domain/analytics" "$BASE/domain/plugins" "$BASE/ui/components" "$BASE/ui/navigation" "$BASE/ui/screens" "$TEST_BASE"

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "CarLauncherUniversal"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.universal.carlauncher"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.universal.carlauncher"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 7
                  versionName = "6.0.0-NextGeneration"
              }
              buildTypes {
                  debug { isMinifyEnabled = false }
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation(platform("androidx.compose:compose-bom:2024.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              testImplementation("junit:junit:4.13.2")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.INTERNET" />
