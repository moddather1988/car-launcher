          @Composable
          fun ContactsScreen(onBackToDialer: () -> Unit) {
              val preset = LocalCockpitPreset.current
              val context = LocalContext.current
              var query by remember { mutableStateOf("") }

              val contacts = remember {
                  val list = mutableListOf<ContactEntry>()
                  runCatching {
                      context.contentResolver.query(
                          ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                          arrayOf(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER),
                          null, null,
                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " ASC"
                      )?.use { c ->
                          val nameIdx = c.getColumnIndex(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME)
                          val numIdx = c.getColumnIndex(ContactsContract.CommonDataKinds.Phone.NUMBER)
                          while (c.moveToNext() && list.size < 100) {
                              list.add(ContactEntry(c.getString(nameIdx) ?: "بدون اسم", c.getString(numIdx) ?: ""))
                          }
                      }
                  }
                  list
              }

              val filtered = contacts.filter { it.name.contains(query, ignoreCase = true) || it.phone.contains(query) }

              Column(Modifier.fillMaxSize().padding(6.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                      Text("جهات الاتصال (${contacts.size})", style = MaterialTheme.typography.titleLarge, color = DesignTokens.TextPrimary)
                      Button(onClick = onBackToDialer, colors = ButtonDefaults.buttonColors(containerColor = DesignTokens.AmberGold)) {
                          Text("لوحة الأرقام", color = Color.Black, fontWeight = FontWeight.Bold)
                      }
                  }
                  OutlinedTextField(
                      value = query,
                      onValueChange = { query = it },
                      placeholder = { Text("ابحث بالاسم أو الرقم...") },
                      modifier = Modifier.fillMaxWidth(),
                      singleLine = true
                  )
                  if (filtered.isEmpty()) {
                      Box(Modifier.weight(1f).fillMaxWidth(), contentAlignment = Alignment.Center) {
                          Text("لا توجد جهات اتصال محفوظة أو لم يتم منح صلاحية جهات الاتصال.", color = DesignTokens.TextSecondary)
                      }
                  } else {
                      LazyColumn(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                          items(filtered) { item ->
                              Surface(
                                  color = preset.card.copy(alpha = 0.85f),
                                  shape = RoundedCornerShape(12.dp),
                                  modifier = Modifier.fillMaxWidth().clickable {
                                      runCatching { context.startActivity(Intent(Intent.ACTION_DIAL, Uri.parse("tel:${item.phone}")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) }
                                  }
                              ) {
                                  Row(Modifier.padding(12.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                      Column {
                                          Text(item.name, color = DesignTokens.TextPrimary, fontWeight = FontWeight.Bold)
                                          Text(item.phone, color = DesignTokens.TextSecondary, fontSize = 12.sp)
                                      }
                                      Icon(Icons.Default.Call, contentDescription = null, tint = DesignTokens.StatusSuccess)
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun InstalledAppsScreen(
              storage: LauncherStorage?,
              showFavoritesOnly: Boolean,
              onToggleMode: () -> Unit
          ) {
              val preset = LocalCockpitPreset.current
              val context = LocalContext.current
              var query by remember { mutableStateOf("") }
              var favorites by remember { mutableStateOf(storage?.getFavoritePackages() ?: emptySet()) }

              val allApps = remember {
                  val pm = context.packageManager
                  val intent = Intent(Intent.ACTION_MAIN, null).apply { addCategory(Intent.CATEGORY_LAUNCHER) }
                  pm.queryIntentActivities(intent, 0)
                      .filter { it.activityInfo.packageName != context.packageName }
                      .map { it.loadLabel(pm).toString() to it.activityInfo.packageName }
                      .sortedBy { it.first }
              }

              val displayed = allApps.filter { (label, pkg) ->
                  val matchesSearch = label.contains(query, ignoreCase = true)
                  val matchesFav = !showFavoritesOnly || favorites.contains(pkg)
                  matchesSearch && matchesFav
              }

              Column(Modifier.fillMaxSize().padding(6.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                      Text(
                          text = if (showFavoritesOnly) "شاشة التطبيقات المفضلة (${displayed.size})" else "جميع التطبيقات المثبتة (${displayed.size})",
                          style = MaterialTheme.typography.titleLarge,
                          color = DesignTokens.TextPrimary
                      )
                      Button(onClick = onToggleMode, colors = ButtonDefaults.buttonColors(containerColor = DesignTokens.AmberGold)) {
                          Icon(Icons.Default.Star, contentDescription = null, tint = Color.Black, modifier = Modifier.size(16.dp))
                          Spacer(Modifier.width(4.dp))
                          Text(if (showFavoritesOnly) "عرض كل التطبيقات" else "عرض المفضلة فقط", color = Color.Black, fontWeight = FontWeight.Bold, fontSize = 12.sp)
                      }
                  }

                  OutlinedTextField(
                      value = query,
                      onValueChange = { query = it },
                      placeholder = { Text("ابحث عن تطبيق... (اضغط النجمة لإضافته للمفضلة)") },
                      modifier = Modifier.fillMaxWidth(),
                      singleLine = true
                  )

                  if (displayed.isEmpty()) {
                      Box(Modifier.weight(1f).fillMaxWidth(), contentAlignment = Alignment.Center) {
                          Text(
                              text = if (showFavoritesOnly) "لم تقم بإضافة تطبيقات إلى المفضلة بعد — اضغط رمز النجمة بجانب أي تطبيق." else "لا توجد تطبيقات مطابقة للبحث.",
                              color = DesignTokens.TextSecondary
                          )
                      }
                  } else {
                      LazyVerticalGrid(
                          columns = GridCells.Adaptive(minSize = 155.dp),
                          verticalArrangement = Arrangement.spacedBy(8.dp),
                          horizontalArrangement = Arrangement.spacedBy(8.dp),
                          modifier = Modifier.weight(1f)
                      ) {
                          items(displayed) { (label, pkg) ->
                              val isFav = favorites.contains(pkg)
                              Card(
                                  colors = CardDefaults.cardColors(containerColor = preset.card.copy(alpha = 0.88f)),
                                  border = BorderStroke(1.dp, if (isFav) DesignTokens.AmberGold else preset.border),
                                  modifier = Modifier.clickable {
                                      context.packageManager.getLaunchIntentForPackage(pkg)?.let {
                                          it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                          runCatching { context.startActivity(it) }
                                      }
                                  }
                              ) {
                                  Row(
                                      Modifier.padding(10.dp).fillMaxWidth(),
                                      horizontalArrangement = Arrangement.SpaceBetween,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Text(label, color = DesignTokens.TextPrimary, maxLines = 1, modifier = Modifier.weight(1f), fontSize = 12.sp)
                                      IconButton(
                                          onClick = {
                                              if (storage != null) favorites = storage.toggleFavoritePackage(pkg)
                                          },
                                          modifier = Modifier.size(26.dp)
                                      ) {
                                          Icon(
                                              imageVector = if (isFav) Icons.Default.Star else Icons.Default.StarBorder,
                                              contentDescription = "مفضلة",
                                              tint = if (isFav) DesignTokens.AmberGold else DesignTokens.TextMuted,
                                              modifier = Modifier.size(18.dp)
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

