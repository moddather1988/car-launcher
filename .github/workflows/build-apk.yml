          cat << 'EOF' > "$BASE/core/dock/DockModels.kt"
          package com.universal.carlauncher.core.dock
          import android.content.Context
          import android.content.Intent
          import androidx.compose.ui.graphics.ImageBitmap
          import org.json.JSONArray
          import org.json.JSONObject
          enum class DockActionType { INTERNAL_ROUTE, EXTERNAL_APP, SYSTEM_ACTION }
          data class DockItemConfig(val id: String, val type: DockActionType, val target: String, val labelAr: String)
          data class InstalledAndroidApp(val label: String, val packageName: String, val iconBitmap: ImageBitmap?)
          object DockSerializer {
              fun defaultDockItems(): List<DockItemConfig> = listOf(
                  DockItemConfig("d1", DockActionType.INTERNAL_ROUTE, "NAVIGATION", "الخرائط"),
                  DockItemConfig("d2", DockActionType.INTERNAL_ROUTE, "PHONE_DIALPAD", "الهاتف"),
                  DockItemConfig("d3", DockActionType.INTERNAL_ROUTE, "APPS_INSTALLED", "التطبيقات"),
                  DockItemConfig("d4", DockActionType.INTERNAL_ROUTE, "MUSIC_PLAYER", "الموسيقى"),
                  DockItemConfig("d5", DockActionType.INTERNAL_ROUTE, "RADIO", "الراديو")
              )
              fun toJson(items: List<DockItemConfig>): String {
                  val arr = JSONArray()
                  items.forEach { arr.put(JSONObject().apply { put("id", it.id); put("type", it.type.name); put("target", it.target); put("labelAr", it.labelAr) }) }
                  return arr.toString()
              }
              fun fromJson(json: String?): List<DockItemConfig> {
                  if (json.isNullOrBlank()) return defaultDockItems()
                  return runCatching {
                      val arr = JSONArray(json); val list = mutableListOf<DockItemConfig>()
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          list.add(DockItemConfig(o.getString("id"), DockActionType.valueOf(o.getString("type")), o.getString("target"), o.getString("labelAr")))
                      }
                      if (list.isEmpty()) defaultDockItems() else list
                  }.getOrDefault(defaultDockItems())
              }
              fun queryInstalledLauncherApps(c: Context): List<InstalledAndroidApp> {
                  val pm = c.packageManager
                  val intent = Intent(Intent.ACTION_MAIN, null).apply { addCategory(Intent.CATEGORY_LAUNCHER) }
                  return pm.queryIntentActivities(intent, 0).filter { it.activityInfo.packageName != c.packageName }.map {
                      InstalledAndroidApp(it.loadLabel(pm)?.toString() ?: it.activityInfo.packageName, it.activityInfo.packageName, null)
                  }.distinctBy { it.packageName }
              }
              fun isAppInstalled(c: Context, pkg: String): Boolean = runCatching { c.packageManager.getLaunchIntentForPackage(pkg) != null }.getOrDefault(false)
          }
          EOF

          cat << 'EOF' > "$BASE/core/storage/LauncherStorage.kt"
          package com.universal.carlauncher.core.storage
          import android.content.Context
          import com.universal.carlauncher.core.designsystem.CockpitThemePreset
          import com.universal.carlauncher.core.designsystem.ScenicWallpaperPreset
          import com.universal.carlauncher.core.dock.DockItemConfig
          import com.universal.carlauncher.core.dock.DockSerializer

          class LauncherStorage(context: Context) {
              private val prefs = context.getSharedPreferences("car_launcher_v4_prefs", Context.MODE_PRIVATE)
              val availableBrands = listOf("Ford", "KIA", "Mercedes", "BMW")

              var dockItems: List<DockItemConfig>
                  get() = DockSerializer.fromJson(prefs.getString("dock_items_v10_4_json", null))
                  set(value) = prefs.edit().putString("dock_items_v10_4_json", DockSerializer.toJson(value)).commit().let {}

              fun resetDockToDefault(): List<DockItemConfig> { val d = DockSerializer.defaultDockItems(); dockItems = d; return d }

              var themePreset: CockpitThemePreset get() = CockpitThemePreset.PANORAMIC_TEAL; set(value) {}
              var wallpaperPreset: ScenicWallpaperPreset get() = ScenicWallpaperPreset.ALPINE_NIGHT_LAKE; set(value) {}
              var customWallpaperUri: String? get() = null; set(value) {}
              var isDayMode: Boolean get() = false; set(value) {}
              var carBrandName: String get() = prefs.getString("car_brand", "Ford") ?: "Ford"; set(value) = prefs.edit().putString("car_brand", value).apply()
              fun cycleCarBrand(): String { val n = availableBrands[(availableBrands.indexOf(carBrandName) + 1) % availableBrands.size]; carBrandName = n; return n }
              var use24HourFormat: Boolean get() = false; set(value) {}
              var showHijriDate: Boolean get() = true; set(value) {}
              var useMphUnit: Boolean get() = false; set(value) {}
              var speedAlertLimit: Int get() = 120; set(value) {}
              var audioSpeedAlertEnabled: Boolean get() = true; set(value) {}
              var showPrayerPanel: Boolean get() = true; set(value) {}
              var showTripPanel: Boolean get() = true; set(value) {}
              var showMusicDock: Boolean get() = true; set(value) {}
              var favoritePackages: Set<String> get() = emptySet(); set(value) {}
              fun toggleFavoriteApp(pkg: String) = emptySet<String>()
              var favoriteTrackIds: Set<String> get() = emptySet(); set(value) {}
