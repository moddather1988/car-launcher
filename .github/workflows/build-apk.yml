name: Build Car Launcher Universal v12.0 Next-Gen Ecosystem

on:
  push:
    branches: [ "main", "master", "v12.0-ecosystem" ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-v12:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Complete v12.0 Automotive Ecosystem Architecture
        run: |
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties
          BASE="app/src/main/java/com/universal/carlauncher"
          mkdir -p "$BASE/core/designsystem" "$BASE/core/responsive" "$BASE/core/hardware" "$BASE/core/storage" "$BASE/core/receiver" "$BASE/core/diagnostics" "$BASE/core/audio" "$BASE/ui/dock" "$BASE/domain/islamic" "$BASE/domain/weather" "$BASE/ui/components" "$BASE/ui/navigation" "$BASE/ui/screens"

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "CarLauncherUniversal"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.universal.carlauncher"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.universal.carlauncher"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 13
                  versionName = "12.0.0-NextGen"
              }
              buildTypes {
                  debug { isMinifyEnabled = false }
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation(platform("androidx.compose:compose-bom:2024.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />

              <application
                  android:allowBackup="true"
                  android:label="CAR LAUNCHER UNIVERSAL"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:clearTaskOnLaunch="true"
                      android:stateNotNeeded="true"
                      android:screenOrientation="unspecified"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|uiMode|density|locale|layoutDirection">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.CAR_DOCK" />
                          <category android:name="android.intent.category.CAR_MODE" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".core.receiver.BootCompletedReceiver"
                      android:enabled="true"
                      android:exported="true"
                      android:directBootAware="true">
                      <intent-filter android:priority="999">
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.LOCKED_BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # Central Audio Manager
          cat << 'EOF' > "$BASE/core/audio/CentralAudioManager.kt"
          package com.universal.carlauncher.core.audio
          import android.content.Context
          import android.media.AudioAttributes
          import android.media.AudioFocusRequest
          import android.media.AudioManager
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Build
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import java.util.Locale

          enum class AudioSourceType { NONE, LOCAL_MUSIC, ONLINE_RADIO, ISLAMIC_DHIKR }
          data class UnifiedAudioState(val activeSource: AudioSourceType = AudioSourceType.NONE, val isPlaying: Boolean = false, val title: String = "جاهز للتشغيل")

          class CentralAudioManager(private val context: Context) {
              private val audioManager = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
              private val mainPlayer = MediaPlayer()
              private val _state = MutableStateFlow(UnifiedAudioState())
              val state: StateFlow<UnifiedAudioState> = _state
              private var hasPlayedStartupDhikrInSession = false

              fun playLocalMusic(uri: Uri, title: String) {
                  runCatching {
                      mainPlayer.reset(); mainPlayer.setDataSource(context, uri); mainPlayer.prepare(); mainPlayer.start()
                      _state.value = UnifiedAudioState(AudioSourceType.LOCAL_MUSIC, true, title)
                  }
              }
              fun playIslamicDhikr(title: String, text: String, auto: Boolean = false) {
                  if (auto && hasPlayedStartupDhikrInSession) return
                  if (auto) hasPlayedStartupDhikrInSession = true
                  runCatching { if (mainPlayer.isPlaying) mainPlayer.pause() }
                  _state.value = UnifiedAudioState(AudioSourceType.ISLAMIC_DHIKR, true, title)
              }
          }
          EOF

          cat << 'EOF' > "$BASE/core/designsystem/DesignTokens.kt"
          package com.universal.carlauncher.core.designsystem
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          enum class ScenicWallpaperPreset(val titleAr: String, val skyTop: Color, val skyHorizon: Color, val mountainFar: Color, val mountainNear: Color, val lakeWater: Color, val roadSurface: Color, val roadGlow: Color) {
              ALPINE_NIGHT_LAKE("جبال الألب والبحيرة", Color(0xFF061B28), Color(0xFF154759), Color(0xFF1D566B), Color(0xFF0E3343), Color(0xFF18566A), Color(0xFF0B222E), Color(0xFF4EEADB))
          }
          enum class CockpitThemePreset(val titleAr: String, val background: Color, val surface: Color, val primary: Color, val secondary: Color) {
              PANORAMIC_TEAL("زجاجي تيفاني", Color(0xFF071E2B), Color(0xFF0B293B), Color(0xFF5EEAD4), Color(0xFFF59E0B))
          }
          object DesignTokens {
              val TextPrimary = Color(0xFFFFFFFF)
              val TextSecondary = Color(0xFFE2E8F0)
              val AmberGold = Color(0xFFF9A825)
              val GlassSurface = Color(0xFF092230).copy(alpha = 0.36f)
              val GlassBorder = Color(0xFF7DD3FC).copy(alpha = 0.48f)
              val RadiusM = 16.dp
          }
          EOF

          cat << 'EOF' > "$BASE/core/designsystem/CarLauncherTheme.kt"
          package com.universal.carlauncher.core.designsystem
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.platform.LocalLayoutDirection
          import androidx.compose.ui.unit.LayoutDirection
          @Composable
          fun CarLauncherTheme(preset: CockpitThemePreset = CockpitThemePreset.PANORAMIC_TEAL, content: @Composable () -> Unit) {
              CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
                  MaterialTheme(colorScheme = darkColorScheme(primary = preset.primary, background = preset.background), content = content)
              }
          }
          EOF

          cat << 'EOF' > "$BASE/core/responsive/ResponsiveWindowEngine.kt"
          package com.universal.carlauncher.core.responsive
          import androidx.compose.runtime.*
          data class ResponsiveLayoutMetrics(val isLandscape: Boolean, val widthDp: Int, val heightDp: Int)
          @Composable
          fun rememberResponsiveMetrics() = ResponsiveLayoutMetrics(true, 1024, 600)
          EOF

          cat << 'EOF' > "$BASE/core/storage/LauncherStorage.kt"
          package com.universal.carlauncher.core.storage
          import android.content.Context
          import com.universal.carlauncher.core.designsystem.CockpitThemePreset
          import com.universal.carlauncher.core.designsystem.ScenicWallpaperPreset
          class LauncherStorage(context: Context) {
              private val prefs = context.getSharedPreferences("car_launcher_v4_prefs", Context.MODE_PRIVATE)
              var themePreset: CockpitThemePreset
                  get() = CockpitThemePreset.PANORAMIC_TEAL
                  set(v) {}
              var wallpaperPreset: ScenicWallpaperPreset
                  get() = ScenicWallpaperPreset.ALPINE_NIGHT_LAKE
                  set(v) {}
              var carBrandName: String
                  get() = prefs.getString("car_brand", "Ford") ?: "Ford"
                  set(v) { prefs.edit().putString("car_brand", v).apply() }
          }
          EOF

          cat << 'EOF' > "$BASE/ui/dock/DockCustomizationManager.kt"
          package com.universal.carlauncher.ui.dock
          import android.content.Context
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.outlined.*
          import androidx.compose.ui.graphics.vector.ImageVector
          enum class DockItemType { INTERNAL_ROUTE }
          data class CustomizableDockItem(val id: String, val titleAr: String, val type: DockItemType, val targetPayload: String, val iconName: String)
          class DockRepository(private val context: Context) {
              fun getDefaultDockItems() = listOf(
                  CustomizableDockItem("nav", "الخرائط", DockItemType.INTERNAL_ROUTE, "NAVIGATION", "MAP"),
                  CustomizableDockItem("music", "الموسيقى", DockItemType.INTERNAL_ROUTE, "MUSIC_PLAYER", "MUSIC"),
                  CustomizableDockItem("radio", "الراديو", DockItemType.INTERNAL_ROUTE, "RADIO", "RADIO")
              )
              fun loadSavedDock() = getDefaultDockItems()
              fun saveDock(items: List<CustomizableDockItem>) {}
          }
          fun resolveDockIcon(name: String): ImageVector = when(name) {
              "MAP" -> Icons.Outlined.LocationOn
              "MUSIC" -> Icons.Outlined.MusicNote
              else -> Icons.Outlined.Sensors
          }
          EOF

          cat << 'EOF' > "$BASE/ui/navigation/CockpitNavigationShell.kt"
          package com.universal.carlauncher.ui.navigation
          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.outlined.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import com.universal.carlauncher.core.designsystem.DesignTokens
          import com.universal.carlauncher.ui.dock.DockRepository
          import com.universal.carlauncher.ui.dock.resolveDockIcon

          enum class AppRoute(val titleAr: String, val icon: ImageVector) {
              DASHBOARD("الرئيسية", Icons.Outlined.Speed),
              NAVIGATION("الخرائط", Icons.Outlined.LocationOn),
              MUSIC_PLAYER("الموسيقى", Icons.Outlined.MusicNote),
              RADIO("الراديو", Icons.Outlined.Sensors),
              SETTINGS_MAIN("الإعدادات", Icons.Outlined.Settings),
              DOCK_CUSTOMIZATION("محرر الشريط السفلي", Icons.Outlined.EditAttributes)
          }

          @Composable
          fun CockpitNavigationShell(currentRoute: AppRoute, onNavigate: (AppRoute) -> Unit, content: @Composable BoxScope.() -> Unit) {
              val context = LocalContext.current
              val dockRepo = remember { DockRepository(context) }
              val items = remember { dockRepo.loadSavedDock() }

              Box(modifier = Modifier.fillMaxSize().background(Color(0xFF030B10)).padding(6.dp)) {
                  Column(Modifier.fillMaxSize().padding(8.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                      if (currentRoute != AppRoute.DASHBOARD) {
                          Button(onClick = { onNavigate(AppRoute.DASHBOARD) }) { Text("الرئيسية") }
                      }
                      Box(modifier = Modifier.weight(1f).fillMaxWidth(), content = content)
                      Surface(color = DesignTokens.GlassSurface, shape = RoundedCornerShape(28.dp), modifier = Modifier.fillMaxWidth().height(56.dp)) {
                          Row(modifier = Modifier.fillMaxSize(), verticalAlignment = Alignment.CenterVertically) {
                              items.forEach { dockItem ->
                                  Box(modifier = Modifier.weight(1f).fillMaxHeight().clickable {
                                      runCatching { onNavigate(AppRoute.valueOf(dockItem.targetPayload)) }.onFailure { onNavigate(AppRoute.DASHBOARD) }
                                  }, contentAlignment = Alignment.Center) {
                                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                          Icon(resolveDockIcon(dockItem.iconName), null, tint = Color.White, modifier = Modifier.size(20.dp))
                                          Text(dockItem.titleAr, color = Color.White, fontSize = 10.sp)
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > "$BASE/ui/screens/DockCustomizationScreen.kt"
          package com.universal.carlauncher.ui.screens
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          @Composable
          fun DockCustomizationScreen(onBack: () -> Unit) {
              Column(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  Text("محرر الشريط السفلي (Dock Customization)", style = MaterialTheme.typography.titleLarge)
                  Button(onClick = onBack) { Text("عودة") }
              }
          }
          EOF

          cat << 'EOF' > "$BASE/ui/screens/DashboardScreen.kt"
          package com.universal.carlauncher.ui.screens
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import com.universal.carlauncher.ui.navigation.AppRoute
          @Composable
          fun DashboardScreen(onNavigateTo: (AppRoute) -> Unit) {
              Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                  Column(horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.spacedBy(16.dp)) {
                      Text("Car Launcher Universal v12.0", style = MaterialTheme.typography.displayLarge)
                      Button(onClick = { onNavigateTo(AppRoute.DOCK_CUSTOMIZATION) }) { Text("فتح محرر الشريط السفلي Dock Customization") }
                  }
              }
          }
          EOF

          cat << 'EOF' > "$BASE/ui/screens/AllApplicationScreens.kt"
          package com.universal.carlauncher.ui.screens
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          @Composable
          fun GenericPlaceholderScreen(title: String) { Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { Text(title) } }
          EOF

          cat << 'EOF' > "$BASE/MainActivity.kt"
          package com.universal.carlauncher
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.runtime.*
          import com.universal.carlauncher.core.audio.CentralAudioManager
          import com.universal.carlauncher.core.designsystem.CarLauncherTheme
          import com.universal.carlauncher.core.storage.LauncherStorage
          import com.universal.carlauncher.ui.navigation.*
          import com.universal.carlauncher.ui.screens.*

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { CarLauncherRootApp() }
              }
          }

          @Composable
          fun CarLauncherRootApp() {
              val context = androidx.compose.ui.platform.LocalContext.current
              val storage = remember { LauncherStorage(context) }
              val audioManager = remember { CentralAudioManager(context) }
              val backStack = remember { mutableStateListOf(AppRoute.DASHBOARD) }
              val currentRoute = backStack.lastOrNull() ?: AppRoute.DASHBOARD

              CarLauncherTheme(preset = storage.themePreset) {
                  CockpitNavigationShell(
                      currentRoute = currentRoute,
                      onNavigate = { route -> if (backStack.lastOrNull() != route) backStack.add(route) },
                      onBack = { if (backStack.size > 1) backStack.removeAt(backStack.lastIndex) }
                  ) {
                      when (currentRoute) {
                          AppRoute.DASHBOARD -> DashboardScreen(onNavigateTo = { backStack.add(it) })
                          AppRoute.DOCK_CUSTOMIZATION -> DockCustomizationScreen(onBack = { if (backStack.size > 1) backStack.removeAt(backStack.lastIndex) })
                          else -> GenericPlaceholderScreen(currentRoute.titleAr)
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Execute Debug & Release Builds
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk CarLauncherUniversal.apk

      - name: Publish Direct APK v12.0 Next-Gen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v12.0
          name: Car Launcher Universal v12.0 (Next-Gen Ecosystem)
          files: CarLauncherUniversal.apk
