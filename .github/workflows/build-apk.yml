          }
          EOF

          cat << 'EOF' > "$BASE/ui/components/StateViews.kt"
          package com.universal.carlauncher.ui.components
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          enum class UiStateCondition(val titleAr: String) { NORMAL("الحالة الطبيعية"), LOADING("جاري التحميل") }
          @Composable
          fun StateConditionSelectorBar(currentState: UiStateCondition, onSelectState: (UiStateCondition) -> Unit) {}
          @Composable
          fun UnifiedStateRenderer(condition: UiStateCondition, normalContent: @Composable () -> Unit) { normalContent() }
          EOF

          cat << 'EOF' > "$BASE/ui/navigation/CockpitNavigationShell.kt"
          package com.universal.carlauncher.ui.navigation
          import android.graphics.BitmapFactory
          import android.net.Uri
          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.outlined.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.universal.carlauncher.core.designsystem.DesignTokens
          import com.universal.carlauncher.core.designsystem.LocalCockpitPreset
          import com.universal.carlauncher.core.designsystem.ScenicWallpaperPreset
          import com.universal.carlauncher.core.storage.LauncherStorage

          enum class AppRoute(val titleAr: String, val icon: ImageVector, val category: String) {
              DASHBOARD("الرئيسية", Icons.Outlined.Speed, "MAIN"),
              DOCK_CUSTOMIZATION("تخصيص الشريط السفلي", Icons.Outlined.ViewStream, "SETTINGS"),
              AI_ASSISTANT("المساعد الذكي", Icons.Outlined.SmartToy, "NAV"),
