          # 1. In-App Diagnostics & Event Logger
          cat << 'EOF' > "$BASE/core/diagnostics/AppDiagnosticsLogger.kt"
          package com.universal.carlauncher.core.diagnostics
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.CopyOnWriteArrayList

          object AppDiagnosticsLogger {
              private val logs = CopyOnWriteArrayList<String>()
              private val fmt = SimpleDateFormat("HH:mm:ss", Locale.US)
              var lastSteeringKeyEvent: String = "لم يتم ضغط أزرار الطارة بعد"

              init {
                  log("تم تهيئة نظام Car Launcher Universal v6.0 بنجاح")
              }

              fun log(event: String) {
                  val stamp = fmt.format(Date())
                  logs.add(0, "[$stamp] $event")
                  while (logs.size > 60) {
                      logs.removeAt(logs.lastIndex)
                  }
              }

              fun recordSteeringKey(keyName: String, actionTaken: String) {
                  lastSteeringKeyEvent = "$keyName ➔ $actionTaken"
                  log("زر عجلة القيادة: $lastSteeringKeyEvent")
              }

              fun getLogs(): List<String> = logs.toList()

              fun getMemoryUsageSummary(): String {
                  val rt = Runtime.getRuntime()
                  val usedMb = (rt.totalMemory() - rt.freeMemory()) / (1024 * 1024)
                  val maxMb = rt.maxMemory() / (1024 * 1024)
                  return "استهلاك RAM: $usedMb MB من أصل $maxMb MB"
              }
          }
          EOF

          # 2. Boot Receiver
          cat << 'EOF' > "$BASE/core/receiver/BootCompletedReceiver.kt"
          package com.universal.carlauncher.core.receiver
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import com.universal.carlauncher.MainActivity
          import com.universal.carlauncher.core.diagnostics.AppDiagnosticsLogger
          import com.universal.carlauncher.core.storage.LauncherStorage

          class BootCompletedReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  val action = intent?.action ?: return
                  if (action == Intent.ACTION_BOOT_COMPLETED || action == Intent.ACTION_LOCKED_BOOT_COMPLETED || action == "android.intent.action.QUICKBOOT_POWERON") {
                      val storage = LauncherStorage(context)
                      if (storage.autoStartOnBoot) {
                          AppDiagnosticsLogger.log("تشغيل تلقائي عند بدء المحرك ($action)")
                          runCatching {
                              context.startActivity(Intent(context, MainActivity::class.java).apply {
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                              })
                          }
                      }
                  }
              }
          }
          EOF

