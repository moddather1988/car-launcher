          @Composable
          fun PanoramicSpeedometerWithRealisticCar(
              speed: Int,
              unitText: String,
              isOverSpeed: Boolean = false,
              modifier: Modifier = Modifier
          ) {
              val preset = LocalCockpitPreset.current
              val arcColor = if (isOverSpeed) DesignTokens.StatusDanger else Color(0xFF38BDF8)
              Box(modifier = modifier, contentAlignment = Alignment.Center) {
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      val w = size.width; val h = size.height
                      val radius = minOf(w * 0.45f, h * 0.62f)
                      val diameter = radius * 2f
                      val cx = w / 2f; val cy = h * 0.64f
                      val startAngle = 148f; val sweepAngle = 244f
                      val topLeft = Offset(cx - radius, cy - radius)

                      drawArc(color = arcColor.copy(alpha = 0.22f), startAngle = startAngle, sweepAngle = sweepAngle, useCenter = false, topLeft = topLeft, size = Size(diameter, diameter), style = Stroke(width = 8.dp.toPx(), cap = StrokeCap.Round))
                      drawArc(color = arcColor.copy(alpha = 0.85f), startAngle = startAngle, sweepAngle = sweepAngle, useCenter = false, topLeft = topLeft, size = Size(diameter, diameter), style = Stroke(width = 3.dp.toPx(), cap = StrokeCap.Round))

                      val paint = android.graphics.Paint().apply {
                          color = android.graphics.Color.WHITE
                          textSize = 10.5.dp.toPx()
                          textAlign = android.graphics.Paint.Align.CENTER
                          isAntiAlias = true
                          typeface = android.graphics.Typeface.DEFAULT_BOLD
                      }

                      for (i in 0..26) {
                          val stepSpeed = i * 10
                          val angleDeg = startAngle + (i / 26f) * sweepAngle
                          val rad = Math.toRadians(angleDeg.toDouble())
                          val isMajor = stepSpeed % 20 == 0
                          val outerR = radius - 3.dp.toPx()
                          val innerR = outerR - if (isMajor) 9.dp.toPx() else 5.dp.toPx()

                          drawLine(
                              color = Color.White,
                              start = Offset(cx + (outerR * cos(rad)).toFloat(), cy + (outerR * sin(rad)).toFloat()),
                              end = Offset(cx + (innerR * cos(rad)).toFloat(), cy + (innerR * sin(rad)).toFloat()),
                              strokeWidth = if (isMajor) 2.2.dp.toPx() else 1.2.dp.toPx()
                          )

                          if (isMajor) {
                              val textR = innerR - 13.dp.toPx()
                              val tx = cx + (textR * cos(rad)).toFloat()
                              val ty = cy + (textR * sin(rad)).toFloat() + 4.dp.toPx()
                              drawContext.canvas.nativeCanvas.drawText(stepSpeed.toString(), tx, ty, paint)
                          }
                      }

                      val speedPaint = android.graphics.Paint().apply {
                          color = if (isOverSpeed) android.graphics.Color.parseColor("#EF4444") else android.graphics.Color.WHITE
                          textSize = 46.dp.toPx()
                          textAlign = android.graphics.Paint.Align.CENTER
                          isAntiAlias = true
                          typeface = android.graphics.Typeface.create(android.graphics.Typeface.DEFAULT, android.graphics.Typeface.BOLD)
                      }
                      val unitPaint = android.graphics.Paint().apply {
                          color = android.graphics.Color.parseColor("#E2E8F0")
                          textSize = 13.dp.toPx()
                          textAlign = android.graphics.Paint.Align.CENTER
                          isAntiAlias = true
                          typeface = android.graphics.Typeface.DEFAULT_BOLD
                      }

                      val speedY = cy - radius * 0.26f
                      drawContext.canvas.nativeCanvas.drawText(speed.toString(), cx, speedY, speedPaint)
                      drawContext.canvas.nativeCanvas.drawText(unitText, cx, speedY + 18.dp.toPx(), unitPaint)

                      val carW = radius * 0.64f; val carH = radius * 0.44f
                      val carLeft = cx - carW / 2f; val carTop = cy - carH * 0.02f

                      drawOval(color = Color.Black.copy(alpha = 0.65f), topLeft = Offset(carLeft - 6.dp.toPx(), carTop + carH * 0.82f), size = Size(carW + 12.dp.toPx(), carH * 0.24f))
                      drawRoundRect(color = Color(0xFF090D16), topLeft = Offset(carLeft + carW * 0.03f, carTop + carH * 0.62f), size = Size(carW * 0.17f, carH * 0.36f), cornerRadius = CornerRadius(5f, 5f))
                      drawRoundRect(color = Color(0xFF090D16), topLeft = Offset(carLeft + carW * 0.80f, carTop + carH * 0.62f), size = Size(carW * 0.17f, carH * 0.36f), cornerRadius = CornerRadius(5f, 5f))
                      drawRoundRect(color = Color(0xFFE2E8F0), topLeft = Offset(carLeft - carW * 0.04f, carTop + carH * 0.26f), size = Size(carW * 0.09f, carH * 0.10f), cornerRadius = CornerRadius(4f, 4f))
                      drawRoundRect(color = Color(0xFFE2E8F0), topLeft = Offset(carLeft + carW * 0.95f, carTop + carH * 0.26f), size = Size(carW * 0.09f, carH * 0.10f), cornerRadius = CornerRadius(4f, 4f))

                      val sedanBody = Path().apply {
                          moveTo(carLeft + carW * 0.20f, carTop); lineTo(carLeft + carW * 0.80f, carTop)
                          lineTo(carLeft + carW * 0.94f, carTop + carH * 0.36f); lineTo(carLeft + carW, carTop + carH * 0.56f)
                          lineTo(carLeft + carW * 0.97f, carTop + carH * 0.86f); lineTo(carLeft + carW * 0.03f, carTop + carH * 0.86f)
                          lineTo(carLeft, carTop + carH * 0.56f); lineTo(carLeft + carW * 0.06f, carTop + carH * 0.36f); close()
                      }
                      drawPath(path = sedanBody, brush = Brush.verticalGradient(listOf(Color(0xFFFFFFFF), Color(0xFFF1F5F9), Color(0xFFCBD5E1))))

                      val rearWindshield = Path().apply {
                          moveTo(carLeft + carW * 0.24f, carTop + carH * 0.06f); lineTo(carLeft + carW * 0.76f, carTop + carH * 0.06f)
                          lineTo(carLeft + carW * 0.86f, carTop + carH * 0.34f); lineTo(carLeft + carW * 0.14f, carTop + carH * 0.34f); close()
                      }
                      drawPath(rearWindshield, color = Color(0xFF0F172A))

                      drawLine(color = Color(0xFF94A3B8), start = Offset(carLeft + carW * 0.12f, carTop + carH * 0.48f), end = Offset(carLeft + carW * 0.88f, carTop + carH * 0.48f), strokeWidth = 2.dp.toPx())
                      drawOval(color = Color(0xFF0A3977), topLeft = Offset(cx - carW * 0.05f, carTop + carH * 0.44f), size = Size(carW * 0.10f, carH * 0.07f))

                      drawRoundRect(color = Color(0xFFDC2626), topLeft = Offset(carLeft + carW * 0.04f, carTop + carH * 0.41f), size = Size(carW * 0.25f, carH * 0.15f), cornerRadius = CornerRadius(5f, 5f))
                      drawRoundRect(color = Color(0xFFFECACA), topLeft = Offset(carLeft + carW * 0.08f, carTop + carH * 0.45f), size = Size(carW * 0.14f, carH * 0.06f), cornerRadius = CornerRadius(2f, 2f))
                      drawRoundRect(color = Color(0xFFDC2626), topLeft = Offset(carLeft + carW * 0.71f, carTop + carH * 0.41f), size = Size(carW * 0.25f, carH * 0.15f), cornerRadius = CornerRadius(5f, 5f))
                      drawRoundRect(color = Color(0xFFFECACA), topLeft = Offset(carLeft + carW * 0.78f, carTop + carH * 0.45f), size = Size(carW * 0.14f, carH * 0.06f), cornerRadius = CornerRadius(2f, 2f))

                      drawRoundRect(color = Color(0xFF1E293B), topLeft = Offset(carLeft + carW * 0.37f, carTop + carH * 0.60f), size = Size(carW * 0.26f, carH * 0.15f), cornerRadius = CornerRadius(3f, 3f))
                      drawCircle(color = Color(0xFF64748B), radius = 3.dp.toPx(), center = Offset(carLeft + carW * 0.18f, carTop + carH * 0.83f))
                      drawCircle(color = Color(0xFF64748B), radius = 3.dp.toPx(), center = Offset(carLeft + carW * 0.82f, carTop + carH * 0.83f))
                  }
              }
          }
          EOF

