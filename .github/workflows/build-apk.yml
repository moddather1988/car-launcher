                          Button(onClick = onOpenCompatibility, colors = ButtonDefaults.buttonColors(containerColor = DesignTokens.AmberGold)) {
                              Text("تقرير توافق الهاردوير", color = Color.Black, fontWeight = FontWeight.Bold, fontSize = 12.sp)
                          }
                      }
