                      shape = RoundedCornerShape(12.dp),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Row(Modifier.padding(10.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          Icon(Icons.Default.WarningAmber, contentDescription = null, tint = DesignTokens.StatusWarning)
                          Text(
                              text = "حالة توافق الراديو: الجهاز الحالي لا يوفر واجهة FM Tuner قياسية موثقة (NOT SUPPORTED بدون شريحة الشركة المصنعة).",
                              color = DesignTokens.StatusWarning,
                              fontSize = 12.sp
                          )
                      }
                  }

                  Card(
                      colors = CardDefaults.cardColors(containerColor = preset.card.copy(alpha = 0.88f)),
                      border = BorderStroke(1.dp, preset.border),
                      modifier = Modifier.weight(1f).fillMaxWidth()
                  ) {
                      Column(
                          Modifier.fillMaxSize().padding(16.dp),
                          horizontalAlignment = Alignment.CenterHorizontally,
                          verticalArrangement = Arrangement.SpaceAround
                      ) {
                          Text("${"%.1f".format(freq)} MHz", fontSize = 44.sp, fontWeight = FontWeight.Black, color = preset.primary)
                          Row(horizontalArrangement = Arrangement.spacedBy(14.dp)) {
                              Button(onClick = { freq = (freq - 0.5).coerceAtLeast(87.5) }) { Text("<< مسح") }
                              Button(onClick = { freq = (freq - 0.1).coerceAtLeast(87.5) }) { Text("- 0.1") }
                              Button(onClick = { freq = (freq + 0.1).coerceAtMost(108.0) }) { Text("+ 0.1") }
                              Button(onClick = { freq = (freq + 0.5).coerceAtMost(108.0) }) { Text("مسح >>") }
                          }
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              presets.forEach { (f, name) ->
                                  FilterChip(selected = freq == f, onClick = { freq = f }, label = { Text("$name ($f)") })
                              }
