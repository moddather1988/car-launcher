          import com.universal.carlauncher.ui.dock.DockRepository
          import com.universal.carlauncher.ui.dock.resolveDockIcon

          @Composable
          fun DockCustomizationScreen(onBackToSettings: () -> Unit) {
              val preset = LocalCockpitPreset.current
              val context = LocalContext.current
              val dockRepo = remember { DockRepository(context) }
              val dockList = remember { mutableStateListOf<CustomizableDockItem>().apply { addAll(dockRepo.loadSavedDock()) } }
              val catalog = remember { dockRepo.getCatalogOfAddableItems() }

              Surface(color = DesignTokens.GlassSurface, border = BorderStroke(1.dp, DesignTokens.GlassBorder), shape = RoundedCornerShape(22.dp), modifier = Modifier.fillMaxSize()) {
                  Column(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                          Text("محرر الشريط السفلي المخصص (Dock Customization)", style = MaterialTheme.typography.titleLarge, color = preset.primary)
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              Button(onClick = {
                                  dockRepo.saveDock(dockList)
                                  onBackToSettings()
                              }, colors = ButtonDefaults.buttonColors(containerColor = DesignTokens.AmberGold)) {
                                  Text("حفظ التعديلات", color = Color.Black, fontWeight = FontWeight.Bold)
                              }
                              OutlinedButton(onClick = {
                                  dockList.clear()
                                  dockList.addAll(dockRepo.getDefaultDockItems())
                                  dockRepo.saveDock(dockList)
                              }) {
                                  Text("استعادة الافتراضي")
                              }
                          }
                      }

                      Text("العناصر الحالية في الشريط السفلي (يمكنك حذف أي عنصر أو تغيير ترتيبه):", fontSize = 12.sp, color = DesignTokens.TextSecondary)

                      LazyColumn(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                          itemsIndexed(dockList) { index, item ->
                              Surface(color = DesignTokens.GlassSurface, shape = RoundedCornerShape(12.dp), border = BorderStroke(1.dp, DesignTokens.GlassBorder), modifier = Modifier.fillMaxWidth()) {
                                  Row(Modifier.padding(12.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                      Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                          Icon(resolveDockIcon(item.iconName), null, tint = preset.primary, modifier = Modifier.size(22.dp))
                                          Text(item.titleAr, color = Color.White, fontWeight = FontWeight.Bold)
                                      }
                                      Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                          if (index > 0) {
                                              OutlinedButton(onClick = {
                                                  val prev = dockList[index - 1]
                                                  dockList[index - 1] = item
                                                  dockList[index] = prev
                                              }, contentPadding = PaddingValues(horizontal = 8.dp)) { Text("▲") }
                                          }
                                          if (index < dockList.lastIndex) {
                                              OutlinedButton(onClick = {
                                                  val next = dockList[index + 1]
                                                  dockList[index + 1] = item
                                                  dockList[index] = next
                                              }, contentPadding = PaddingValues(horizontal = 8.dp)) { Text("▼") }
                                          }
                                          Button(onClick = { dockList.removeAt(index) }, colors = ButtonDefaults.buttonColors(containerColor = DesignTokens.StatusDanger)) {
                                              Text("حذف", fontSize = 11.sp)
                                          }
                                      }
                                  }
                              }
                          }
                      }

                      Text("إضافة عنصر جديد إلى الشريط السفلي:", fontSize = 12.sp, color = DesignTokens.AmberGold, fontWeight = FontWeight.Bold)
                      LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          items(catalog.size) { i ->
                              val catItem = catalog[i]
                              OutlinedButton(onClick = {
                                  if (dockList.size < 6 && !dockList.any { it.targetPayload == catItem.targetPayload }) {
                                      dockList.add(catItem)
                                  }
                              }) {
                                  Text("+ ${catItem.titleAr}", fontSize = 11.sp)
                              }
                          }
                      }
                  }
              }
          }
          EOF

