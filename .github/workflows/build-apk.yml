          # 4. Responsive Window Engine
          cat << 'EOF' > "$BASE/core/responsive/ResponsiveWindowEngine.kt"
          package com.universal.carlauncher.core.responsive
          import android.content.res.Configuration
          import androidx.compose.runtime.*
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp

          data class ResponsiveLayoutMetrics(val isLandscape: Boolean, val widthDp: Int, val heightDp: Int, val scaleFactor: Float, val outerPadding: Dp)

          @Composable
          fun rememberResponsiveMetrics(): ResponsiveLayoutMetrics {
              val config = LocalConfiguration.current
              val w = config.screenWidthDp.coerceAtLeast(320)
              val h = config.screenHeightDp.coerceAtLeast(240)
              val isLandscape = config.orientation == Configuration.ORIENTATION_LANDSCAPE || w >= h
              return remember(w, h, isLandscape) {
                  val scale = when { h <= 380 -> 0.80f; h <= 440 -> 0.88f; h <= 540 -> 0.96f; else -> 1.05f }
                  ResponsiveLayoutMetrics(isLandscape, w, h, scale, if (h <= 430) 6.dp else 10.dp)
              }
          }
          EOF

          # 5. Driving Analytics, Fuel Calculator & Plugin Architecture
          cat << 'EOF' > "$BASE/domain/analytics/DrivingAnalyticsCalculator.kt"
          package com.universal.carlauncher.domain.analytics
          import java.util.Locale

          data class DriverProfileSpec(
              val id: String,
              val nameAr: String,
              val speedLimitKmh: Int,
              val preferredThemeName: String
          )

          data class VehicleProfileSpec(
              val id: String,
              val brandName: String,
              val modelLabelAr: String,
              val fuelLitersPer100Km: Float,
              val fuelPricePerLiter: Float,
              val oilServiceIntervalKm: Int
          )

          data class FuelAndSafetyMetrics(
              val estimatedLitersUsed: Float,
              val estimatedFuelCostEgp: Float,
              val averageSpeedKmh: Int,
              val ecoSafetyScorePercent: Int,
              val remainingOilServiceKm: Int
          )

          object DrivingAnalyticsCalculator {
              val defaultDrivers = listOf(
                  DriverProfileSpec("d1", "السائق الرئيسي", 120, "PANORAMIC_TEAL"),
                  DriverProfileSpec("d2", "السائق الثاني (هادئ)", 100, "MERCEDES_OBSIDIAN"),
                  DriverProfileSpec("d3", "الوضع الرياضي", 140, "BMW_M_SPORT")
              )

              val defaultVehicles = listOf(
                  VehicleProfileSpec("v1", "Ford", "Ford Sedan 2.0L", 8.2f, 13.75f, 5000),
                  VehicleProfileSpec("v2", "KIA", "KIA Shuma 1.6L", 7.5f, 13.75f, 5000),
                  VehicleProfileSpec("v3", "Mercedes", "Mercedes C200", 7.8f, 13.75f, 10000),
                  VehicleProfileSpec("v4", "BMW", "BMW 320i", 8.0f, 13.75f, 10000),
                  VehicleProfileSpec("v5", "Toyota", "Toyota Corolla", 6.8f, 13.75f, 10000)
              )

              fun computeMetrics(
                  distanceKm: Float,
                  durationMinutes: Int,
                  maxSpeedKmh: Int,
                  overspeedCount: Int,
                  vehicle: VehicleProfileSpec,
                  totalOdometerKm: Float
              ): FuelAndSafetyMetrics {
                  val safeDist = distanceKm.coerceAtLeast(0f)
                  val liters = (safeDist / 100f) * vehicle.fuelLitersPer100Km
                  val cost = liters * vehicle.fuelPricePerLiter
                  val avgSpeed = if (durationMinutes > 0) ((safeDist / (durationMinutes / 60f)).toInt()).coerceIn(0, 240) else 0
                  val penalty = (overspeedCount * 5) + (if (maxSpeedKmh > 140) 15 else 0)
                  val score = (100 - penalty).coerceIn(40, 100)
                  val remOil = (vehicle.oilServiceIntervalKm - (totalOdometerKm.toInt() % vehicle.oilServiceIntervalKm)).coerceAtLeast(0)
                  return FuelAndSafetyMetrics(
                      estimatedLitersUsed = String.format(Locale.US, "%.2f", liters).toFloat(),
                      estimatedFuelCostEgp = String.format(Locale.US, "%.1f", cost).toFloat(),
                      averageSpeedKmh = avgSpeed,
                      ecoSafetyScorePercent = score,
                      remainingOilServiceKm = remOil
                  )
              }
          }
