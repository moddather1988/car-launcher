          }
          EOF

          # 2. CarLauncherTheme.kt
          cat << 'EOF' > "$BASE/core/designsystem/CarLauncherTheme.kt"
          package com.universal.carlauncher.core.designsystem

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Typography
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.CompositionLocalProvider
          import androidx.compose.runtime.staticCompositionLocalOf
          import androidx.compose.ui.platform.LocalLayoutDirection
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.LayoutDirection
          import androidx.compose.ui.unit.sp

          val LocalCockpitPreset = staticCompositionLocalOf { CockpitThemePreset.PANORAMIC_TEAL }

          @Composable
          fun CarLauncherTheme(
              preset: CockpitThemePreset = CockpitThemePreset.PANORAMIC_TEAL,
              fontScaleMultiplier: Float = 1.0f,
              content: @Composable () -> Unit
          ) {
              val colors = darkColorScheme(
                  primary = preset.primary,
                  secondary = preset.secondary,
                  background = preset.background,
                  surface = preset.surface,
                  surfaceVariant = preset.card,
                  onBackground = DesignTokens.TextPrimary,
                  onSurface = DesignTokens.TextPrimary,
                  error = DesignTokens.StatusDanger
              )

              val typography = Typography(
                  displayLarge = TextStyle(fontFamily = FontFamily.SansSerif, fontWeight = FontWeight.Black, fontSize = (50 * fontScaleMultiplier).sp),
                  headlineMedium = TextStyle(fontFamily = FontFamily.SansSerif, fontWeight = FontWeight.Bold, fontSize = (22 * fontScaleMultiplier).sp),
                  titleLarge = TextStyle(fontFamily = FontFamily.SansSerif, fontWeight = FontWeight.Bold, fontSize = (17 * fontScaleMultiplier).sp),
                  titleMedium = TextStyle(fontFamily = FontFamily.SansSerif, fontWeight = FontWeight.SemiBold, fontSize = (14 * fontScaleMultiplier).sp),
                  bodyLarge = TextStyle(fontFamily = FontFamily.SansSerif, fontWeight = FontWeight.Medium, fontSize = (13 * fontScaleMultiplier).sp),
                  labelMedium = TextStyle(fontFamily = FontFamily.SansSerif, fontWeight = FontWeight.Medium, fontSize = (11 * fontScaleMultiplier).sp)
              )

              CompositionLocalProvider(
                  LocalLayoutDirection provides LayoutDirection.Rtl,
                  LocalCockpitPreset provides preset
              ) {
                  MaterialTheme(
                      colorScheme = colors,
                      typography = typography,
                      content = content
                  )
              }
          }
          EOF

          # 3. StateComponents.kt (The 8 Mandatory Internal Screen States)
          cat << 'EOF' > "$BASE/core/designsystem/StateComponents.kt"
          package com.universal.carlauncher.core.designsystem

          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          enum class ScreenUiStateMode(
              val titleAr: String,
              val descriptionAr: String,
              val badgeColor: Color,
              val icon: ImageVector
          ) {
              NORMAL(
                  titleAr = "الحالة الطبيعية (Live)",
                  descriptionAr = "عرض البيانات الحقيقية المباشرة من النظام والمستشعرات",
                  badgeColor = DesignTokens.StatusSuccess,
                  icon = Icons.Default.CheckCircle
              ),
              EMPTY_DATA(
                  titleAr = "عدم وجود بيانات",
                  descriptionAr = "لا توجد سجلات أو عناصر محفوظة في هذا القسم حاليًا",
                  badgeColor = DesignTokens.StatusInfo,
                  icon = Icons.Default.Inbox
              ),
              NO_INTERNET(
                  titleAr = "عدم وجود إنترنت",
                  descriptionAr = "الجهاز غير متصل بالشبكة — الوظائف المحلية تعمل في وضع Offline",
                  badgeColor = DesignTokens.StatusWarning,
                  icon = Icons.Default.WifiOff
              ),
              PERMISSION_DENIED(
                  titleAr = "عدم منح الصلاحيات",
                  descriptionAr = "يتطلب هذا القسم منح صلاحية النظام (الموقع / الوسائط / جهات الاتصال) للعمل",
                  badgeColor = DesignTokens.StatusWarning,
                  icon = Icons.Default.Lock
              ),
              SENSOR_UNAVAILABLE(
                  titleAr = "عدم توفر المستشعر",
                  descriptionAr = "المستشعر المطلوب (GPS / بوصلة مغناطيسية / حرارة) غير متوفر أو مغلق",
                  badgeColor = DesignTokens.StatusWarning,
                  icon = Icons.Default.SensorsOff
              ),
              LOADING(
                  titleAr = "جاري تحميل البيانات",
                  descriptionAr = "يرجى الانتظار أثناء فحص وتجهيز البيانات المحلية...",
                  badgeColor = DesignTokens.CyanGlow,
                  icon = Icons.Default.Sync
              ),
              ERROR(
                  titleAr = "حدوث خطأ",
                  descriptionAr = "تعذر إتمام العملية بسبب خطأ في قراءة المصدر، يمكنك إعادة المحاولة",
                  badgeColor = DesignTokens.StatusDanger,
                  icon = Icons.Default.ErrorOutline
              ),
              HARDWARE_INCOMPATIBLE(
                  titleAr = "عدم توافق الجهاز",
                  descriptionAr = "هذه الوظيفة تتطلب عتادًا خارجيًا (مثل OBD2 ELM327 أو شريحة FM SPI)",
                  badgeColor = DesignTokens.StatusDanger,
                  icon = Icons.Default.Memory
              )
          }

          @Composable
          fun UnifiedStateContainer(
              stateMode: ScreenUiStateMode,
              screenTitle: String,
              onPrimaryAction: () -> Unit = {},
              primaryActionLabel: String = "إعادة المحاولة / منح الصلاحية",
              normalContent: @Composable () -> Unit
          ) {
              if (stateMode == ScreenUiStateMode.NORMAL) {
                  normalContent()
              } else {
                  val preset = LocalCockpitPreset.current
                  Box(
                      modifier = Modifier.fillMaxSize().padding(16.dp),
                      contentAlignment = Alignment.Center
                  ) {
                      Card(
                          colors = CardDefaults.cardColors(containerColor = preset.card.copy(alpha = 0.92f)),
                          border = BorderStroke(1.5.dp, stateMode.badgeColor.copy(alpha = 0.8f)),
                          shape = RoundedCornerShape(DesignTokens.RadiusL),
                          modifier = Modifier.widthIn(max = 520.dp).fillMaxWidth()
                      ) {
                          Column(
                              modifier = Modifier.padding(24.dp).fillMaxWidth(),
                              horizontalAlignment = Alignment.CenterHorizontally,
                              verticalArrangement = Arrangement.spacedBy(12.dp)
                          ) {
                              Surface(
                                  color = stateMode.badgeColor.copy(alpha = 0.15f),
                                  shape = RoundedCornerShape(50),
                                  border = BorderStroke(1.dp, stateMode.badgeColor)
                              ) {
                                  Text(
                                      text = "حالة الشاشة: ${stateMode.titleAr}",
                                      color = stateMode.badgeColor,
                                      fontSize = 12.sp,
                                      fontWeight = FontWeight.Bold,
                                      modifier = Modifier.padding(horizontal = 14.dp, vertical = 4.dp)
                                  )
                              }

                              if (stateMode == ScreenUiStateMode.LOADING) {
                                  CircularProgressIndicator(color = preset.primary, modifier = Modifier.size(44.dp))
                              } else {
                                  Icon(
                                      imageVector = stateMode.icon,
                                      contentDescription = stateMode.titleAr,
                                      tint = stateMode.badgeColor,
                                      modifier = Modifier.size(48.dp)
                                  )
                              }

                              Text(
                                  text = screenTitle,
                                  style = MaterialTheme.typography.titleLarge,
                                  color = DesignTokens.TextPrimary,
                                  textAlign = TextAlign.Center
                              )

                              Text(
                                  text = stateMode.descriptionAr,
                                  style = MaterialTheme.typography.bodyLarge,
                                  color = DesignTokens.TextSecondary,
                                  textAlign = TextAlign.Center
                              )

                              Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                  Button(
                                      onClick = onPrimaryAction,
                                      colors = ButtonDefaults.buttonColors(containerColor = DesignTokens.AmberGold)
                                  ) {
                                      Text(primaryActionLabel, color = Color.Black, fontWeight = FontWeight.Bold)
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

          # 4. ResponsiveWindowEngine.kt
          cat << 'EOF' > "$BASE/core/responsive/ResponsiveWindowEngine.kt"
          package com.universal.carlauncher.core.responsive

          import android.content.res.Configuration
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.remember
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp

          enum class CockpitWindowClass(val labelAr: String) {
              COMPACT_800x480("شاشة مدمجة 800×480 (7 بوصة)"),
              MEDIUM_1024x600("شاشة قياسية 1024×600 (9 بوصة)"),
              HD_1280x720("شاشة عالية الدقة 1280×720 (10 بوصة)"),
              FHD_1920x1080("شاشة فائقة الدقة 1920×1080 (12+ بوصة)"),
              PORTRAIT_VERTICAL("شاشة طولية (وضع رأسي Portrait)")
          }

          data class ResponsiveLayoutMetrics(
              val windowClass: CockpitWindowClass,
              val isLandscape: Boolean,
              val widthDp: Int,
              val heightDp: Int,
              val scaleFactor: Float,
              val outerPadding: Dp,
              val gridColumns: Int
          )

          @Composable
          fun rememberResponsiveMetrics(): ResponsiveLayoutMetrics {
              val config = LocalConfiguration.current
              val w = config.screenWidthDp.coerceAtLeast(320)
              val h = config.screenHeightDp.coerceAtLeast(240)
              val isLandscape = config.orientation == Configuration.ORIENTATION_LANDSCAPE || w >= h

              return remember(w, h, isLandscape) {
                  val windowClass = when {
                      !isLandscape -> CockpitWindowClass.PORTRAIT_VERTICAL
                      w <= 860 || h <= 490 -> CockpitWindowClass.COMPACT_800x480
                      w <= 1080 || h <= 630 -> CockpitWindowClass.MEDIUM_1024x600
                      w <= 1400 || h <= 780 -> CockpitWindowClass.HD_1280x720
                      else -> CockpitWindowClass.FHD_1920x1080
                  }

                  val scale = when {
                      h <= 420 -> 0.80f
                      h <= 520 -> 0.90f
                      h <= 650 -> 1.00f
                      else -> 1.10f
                  }

                  val cols = when {
                      !isLandscape -> 2
                      w <= 860 -> 2
                      w <= 1300 -> 3
                      else -> 4
                  }

                  ResponsiveLayoutMetrics(
                      windowClass = windowClass,
                      isLandscape = isLandscape,
                      widthDp = w,
                      heightDp = h,
                      scaleFactor = scale,
                      outerPadding = if (h <= 480) 6.dp else 10.dp,
                      gridColumns = cols
                  )
              }
          }
          EOF

          # 5. LauncherStorage.kt
          cat << 'EOF' > "$BASE/core/storage/LauncherStorage.kt"
          package com.universal.carlauncher.core.storage

          import android.content.Context
          import com.universal.carlauncher.core.designsystem.CockpitThemePreset

          class LauncherStorage(context: Context) {
              private val prefs = context.getSharedPreferences("car_launcher_v4_prefs", Context.MODE_PRIVATE)
              val availableBrands = listOf("Ford", "KIA", "Mercedes", "BMW", "Audi", "Porsche", "Tesla", "Toyota")

              var themePreset: CockpitThemePreset
                  get() = runCatching {
                      CockpitThemePreset.valueOf(prefs.getString("theme", CockpitThemePreset.PANORAMIC_TEAL.name)!!)
                  }.getOrDefault(CockpitThemePreset.PANORAMIC_TEAL)
                  set(value) = prefs.edit().putString("theme", value.name).apply()

              var carBrandName: String
                  get() = prefs.getString("car_brand", "Ford") ?: "Ford"
                  set(value) = prefs.edit().putString("car_brand", value).apply()

              fun cycleCarBrand(): String {
                  val idx = availableBrands.indexOf(carBrandName)
                  val next = availableBrands[(idx + 1) % availableBrands.size]
                  carBrandName = next
                  return next
              }

              var use24HourFormat: Boolean
                  get() = prefs.getBoolean("use_24h", false)
                  set(value) = prefs.edit().putBoolean("use_24h", value).apply()

              var showSeconds: Boolean
                  get() = prefs.getBoolean("show_seconds", false)
                  set(value) = prefs.edit().putBoolean("show_seconds", value).apply()

              var showHijriDate: Boolean
                  get() = prefs.getBoolean("show_hijri", true)
                  set(value) = prefs.edit().putBoolean("show_hijri", value).apply()

              var useMphUnit: Boolean
                  get() = prefs.getBoolean("use_mph", false)
                  set(value) = prefs.edit().putBoolean("use_mph", value).apply()

              var speedAlertLimit: Int
                  get() = prefs.getInt("speed_limit", 120)
                  set(value) = prefs.edit().putInt("speed_limit", value).apply()

              var circularGaugeStyle: Boolean
                  get() = prefs.getBoolean("circular_gauge", true)
                  set(value) = prefs.edit().putBoolean("circular_gauge", value).apply()

              var cardAlphaPercent: Int
                  get() = prefs.getInt("card_alpha", 82)
                  set(value) = prefs.edit().putInt("card_alpha", value.coerceIn(50, 100)).apply()

              var prayerCalculationMethod: String
                  get() = prefs.getString("prayer_method", "الهيئة المصرية العامة للمساحة") ?: "الهيئة المصرية العامة للمساحة"
                  set(value) = prefs.edit().putString("prayer_method", value).apply()

              var asrMadhhab: String
                  get() = prefs.getString("asr_madhhab", "جمهور الفقهاء (الشافعي، المالكي، الحنبلي)") ?: "جمهور الفقهاء (الشافعي، المالكي، الحنبلي)"
                  set(value) = prefs.edit().putString("asr_madhhab", value).apply()

              var selectedMuezzin: String
                  get() = prefs.getString("muezzin", "الشيخ عبد الباسط عبد الصمد") ?: "الشيخ عبد الباسط عبد الصمد"
                  set(value) = prefs.edit().putString("muezzin", value).apply()

              var tasbeehCount: Int
                  get() = prefs.getInt("tasbeeh_count", 0)
                  set(value) = prefs.edit().putInt("tasbeeh_count", value).apply()

              var tasbeehTarget: Int
                  get() = prefs.getInt("tasbeeh_target", 100)
                  set(value) = prefs.edit().putInt("tasbeeh_target", value).apply()

              var totalLifetimeTasbeeh: Int
                  get() = prefs.getInt("tasbeeh_lifetime", 0)
                  set(value) = prefs.edit().putInt("tasbeeh_lifetime", value).apply()

              fun isCardVisible(cardKey: String): Boolean = prefs.getBoolean("card_vis_$cardKey", true)
              fun setCardVisible(cardKey: String, visible: Boolean) = prefs.edit().putBoolean("card_vis_$cardKey", visible).apply()

              fun getFavoritePackages(): Set<String> = prefs.getStringSet("fav_apps", emptySet()) ?: emptySet()
              fun toggleFavoritePackage(pkg: String): Set<String> {
                  val current = getFavoritePackages().toMutableSet()
                  if (current.contains(pkg)) current.remove(pkg) else current.add(pkg)
                  prefs.edit().putStringSet("fav_apps", current).apply()
                  return current
              }

              fun getEnabledShortcuts(): List<String> {
                  val raw = prefs.getString("shortcuts_order", "الخرائط,الهاتف,التطبيقات,الموسيقى,الراديو,الأذكار,الطقس,السيارة")
                  return raw?.split(",")?.filter { it.isNotBlank() } ?: emptyList()
              }

              fun saveEnabledShortcuts(list: List<String>) {
                  prefs.edit().putString("shortcuts_order", list.joinToString(",")).apply()
              }

              fun resetAllToDefaults() {
                  prefs.edit().clear().apply()
              }
