              CONTACTS("جهات الاتصال", Icons.Default.Contacts, "PHONE"),

              APPS_INSTALLED("التطبيقات المثبتة", Icons.Default.GridView, "APPS"),
              APPS_FAVORITES("التطبيقات المفضلة", Icons.Default.Star, "APPS"),

              VEHICLE_INFO("معلومات السيارة", Icons.Default.DirectionsCar, "VEHICLE"),
