          @Composable
          private fun MultiPageSmartWidgetsGrid(
              modifier: Modifier,
              telemetry: LiveDrivingTelemetry,
              storage: LauncherStorage,
              onNavigateTo: (AppRoute) -> Unit
          ) {
              val preset = LocalCockpitPreset.current
              val widgetItems = remember {
                  mutableStateListOf(
                      Triple("المساعد الذكي الناطق (AI Copilot)", "اضغط للمحادثة أو قراءة ملخص القيادة صوتياً", AppRoute.AI_ASSISTANT),
                      Triple("مراقب الصيانة الدورية", "متبقي ${telemetry.oilRemainingKm} كم على تغيير الزيت القادم", AppRoute.MAINTENANCE_MANAGER),
                      Triple("الوجهات السريعة (المنزل والعمل)", "منزلك: ${storage.homeLocationQuery}", AppRoute.NAVIGATION),
                      Triple("بروجكتور الزجاج الأمامي HUD", "عكس السرعة ${telemetry.speedKmh ?: 0} كم/س على الزجاج ليلاً", AppRoute.HUD_PROJECTOR),
                      Triple("حاسوب الوقود وتكلفة الرحلة", "الوقود المستهلك: ${"%.2f".format(telemetry.fuelUsedLiters)} لتر", AppRoute.TRIP_DATA),
                      Triple("أتمتة القيادة الذكية والملفات", "السائق: ${storage.driverProfiles[storage.activeDriverIndex].nameAr}", AppRoute.AUTOMATION_RULES)
                  )
              }

              LazyVerticalGrid(
                  columns = GridCells.Fixed(3),
                  modifier = modifier,
                  verticalArrangement = Arrangement.spacedBy(8.dp),
                  horizontalArrangement = Arrangement.spacedBy(8.dp)
              ) {
                  itemsIndexed(widgetItems) { idx, (title, subtitle, route) ->
                      Surface(
                          color = DesignTokens.GlassSurface,
                          shape = RoundedCornerShape(18.dp),
                          border = BorderStroke(1.dp, DesignTokens.GlassBorder),
                          modifier = Modifier.height(88.dp).clickable { onNavigateTo(route) }
                      ) {
                          Column(Modifier.fillMaxSize().padding(10.dp), verticalArrangement = Arrangement.SpaceBetween) {
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                  Text(title, color = preset.primary, fontWeight = FontWeight.Bold, fontSize = 12.sp, maxLines = 1)
                                  Text(
                                      text = "⇄", color = DesignTokens.AmberGold, fontWeight = FontWeight.Bold,
                                      modifier = Modifier.clickable {
                                          val nextIdx = (idx + 1) % widgetItems.size
                                          val tmp = widgetItems[idx]
                                          widgetItems[idx] = widgetItems[nextIdx]
                                          widgetItems[nextIdx] = tmp
                                      }
                                  )
                              }
                              Text(subtitle, color = Color.White, fontSize = 11.sp, maxLines = 2)
                          }
                      }
                  }
              }
          }

