          @Composable
          private fun PanoramicSpeedometerWithCar(
              speed: Int,
              unitText: String,
              modifier: Modifier = Modifier
          ) {
              val preset = LocalCockpitPreset.current
              Box(modifier = modifier, contentAlignment = Alignment.Center) {
                  Canvas(modifier = Modifier.fillMaxSize().padding(4.dp)) {
                      val w = size.width
                      val h = size.height
                      val diameter = minOf(w * 0.88f, h * 0.96f)
                      val radius = diameter / 2f
                      val cx = w / 2f
                      val cy = h * 0.56f

                      // القوس الخارجي المرقّم من 0 إلى 260 (زاوية البدء 150 درجة، والامتداد 240 درجة)
                      val startAngle = 150f
                      val sweepAngle = 240f
                      val topLeft = Offset(cx - radius, cy - radius)

                      drawArc(
                          color = Color(0xFF17374B),
                          startAngle = startAngle,
                          sweepAngle = sweepAngle,
                          useCenter = false,
                          topLeft = topLeft,
                          size = Size(diameter, diameter),
                          style = Stroke(width = 6.dp.toPx(), cap = StrokeCap.Round)
                      )

                      val speedFraction = (speed.coerceIn(0, 260) / 260f)
                      drawArc(
                          brush = Brush.sweepGradient(listOf(preset.primary, Color(0xFF38BDF8), preset.primary)),
                          startAngle = startAngle,
                          sweepAngle = sweepAngle * speedFraction,
                          useCenter = false,
                          topLeft = topLeft,
                          size = Size(diameter, diameter),
                          style = Stroke(width = 7.dp.toPx(), cap = StrokeCap.Round)
                      )

                      // رسم التدريجات والأرقام (0, 20, 40 ... 260)
                      val paint = android.graphics.Paint().apply {
                          color = android.graphics.Color.WHITE
                          textSize = 10.dp.toPx()
                          textAlign = android.graphics.Paint.Align.CENTER
                          isAntiAlias = true
                          typeface = android.graphics.Typeface.DEFAULT_BOLD
                      }

                      val totalTicks = 26 // كل 10 كم/س شرطة، وكل 20 كم/س رقم
                      for (i in 0..totalTicks) {
                          val stepSpeed = i * 10
                          val angleDeg = startAngle + (i.toFloat() / totalTicks) * sweepAngle
                          val rad = Math.toRadians(angleDeg.toDouble())
                          val isMajor = stepSpeed % 20 == 0

                          val outerR = radius - 6.dp.toPx()
                          val innerR = outerR - if (isMajor) 9.dp.toPx() else 5.dp.toPx()

                          val sx = cx + (outerR * cos(rad)).toFloat()
                          val sy = cy + (outerR * sin(rad)).toFloat()
                          val ex = cx + (innerR * cos(rad)).toFloat()
                          val ey = cy + (innerR * sin(rad)).toFloat()

                          drawLine(
                              color = if (stepSpeed <= speed) preset.primary else Color.White.copy(alpha = 0.7f),
                              start = Offset(sx, sy),
                              end = Offset(ex, ey),
                              strokeWidth = if (isMajor) 2.2.dp.toPx() else 1.2.dp.toPx()
                          )

                          if (isMajor) {
                              val textR = innerR - 13.dp.toPx()
                              val tx = cx + (textR * cos(rad)).toFloat()
                              val ty = cy + (textR * sin(rad)).toFloat() + 4.dp.toPx()
                              drawContext.canvas.nativeCanvas.drawText(stepSpeed.toString(), tx, ty, paint)
                          }
                      }

                      // رسم السيارة البيضاء من الخلف فوق الطريق في الجزء السفلي من العداد (مطابق للصورة الأولى)
                      val carW = radius * 0.56f
                      val carH = radius * 0.34f
                      val carLeft = cx - carW / 2f
                      val carTop = cy + radius * 0.16f

                      // ظل السيارة على الأسفلت
                      drawRoundRect(
                          color = Color.Black.copy(alpha = 0.55f),
                          topLeft = Offset(carLeft - 4.dp.toPx(), carTop + carH - 6.dp.toPx()),
                          size = Size(carW + 8.dp.toPx(), 10.dp.toPx()),
                          cornerRadius = CornerRadius(8f, 8f)
                      )

                      // الإطارات الخلفية
                      drawRoundRect(
                          color = Color(0xFF0F172A),
                          topLeft = Offset(carLeft + 2.dp.toPx(), carTop + carH * 0.65f),
                          size = Size(carW * 0.18f, carH * 0.42f),
                          cornerRadius = CornerRadius(4f, 4f)
                      )
                      drawRoundRect(
                          color = Color(0xFF0F172A),
                          topLeft = Offset(carLeft + carW * 0.82f - 2.dp.toPx(), carTop + carH * 0.65f),
                          size = Size(carW * 0.18f, carH * 0.42f),
                          cornerRadius = CornerRadius(4f, 4f)
                      )

                      // جسم السيارة الأبيض والزجاج الخلفي
                      val bodyPath = Path().apply {
                          moveTo(carLeft + carW * 0.18f, carTop)
                          lineTo(carLeft + carW * 0.82f, carTop)
                          lineTo(carLeft + carW, carTop + carH * 0.45f)
                          lineTo(carLeft + carW, carTop + carH * 0.85f)
                          lineTo(carLeft, carTop + carH * 0.85f)
                          lineTo(carLeft, carTop + carH * 0.45f)
                          close()
                      }
                      drawPath(bodyPath, color = Color(0xFFF1F5F9))

                      // الزجاج الخلفي الداكن
                      val glassPath = Path().apply {
                          moveTo(carLeft + carW * 0.23f, carTop + carH * 0.08f)
                          lineTo(carLeft + carW * 0.77f, carTop + carH * 0.08f)
                          lineTo(carLeft + carW * 0.88f, carTop + carH * 0.40f)
                          lineTo(carLeft + carW * 0.12f, carTop + carH * 0.40f)
                          close()
                      }
                      drawPath(glassPath, color = Color(0xFF1E293B))

                      // الاصطبات الخلفية الحمراء المضيئة (Taillights)
                      drawRoundRect(
                          color = Color(0xFFEF4444),
                          topLeft = Offset(carLeft + carW * 0.06f, carTop + carH * 0.48f),
                          size = Size(carW * 0.22f, carH * 0.16f),
                          cornerRadius = CornerRadius(4f, 4f)
                      )
                      drawRoundRect(
                          color = Color(0xFFEF4444),
                          topLeft = Offset(carLeft + carW * 0.72f, carTop + carH * 0.48f),
                          size = Size(carW * 0.22f, carH * 0.16f),
                          cornerRadius = CornerRadius(4f, 4f)
                      )

                      // لوحة الأرقام الخلفية
                      drawRoundRect(
                          color = Color(0xFF0F172A),
                          topLeft = Offset(carLeft + carW * 0.38f, carTop + carH * 0.62f),
                          size = Size(carW * 0.24f, carH * 0.16f),
                          cornerRadius = CornerRadius(3f, 3f)
                      )
                  }

                  // رقم السرعة الكبير في منتصف العداد
                  Column(
                      horizontalAlignment = Alignment.CenterHorizontally,
                      modifier = Modifier.offset(y = (-14).dp)
                  ) {
                      Text(
                          text = "$speed",
                          fontSize = 48.sp,
                          fontWeight = FontWeight.Black,
                          color = Color.White
                      )
                      Text(
                          text = unitText,
                          fontSize = 13.sp,
                          fontWeight = FontWeight.Bold,
                          color = DesignTokens.TextSecondary
                      )
                  }
              }
          }
