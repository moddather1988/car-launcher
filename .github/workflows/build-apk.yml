              ERROR("حدوث خطأ"),
              DEVICE_INCOMPATIBLE("عدم توافق الجهاز")
          }

          @Composable
          fun StateConditionSelectorBar(currentState: UiStateCondition, onSelectState: (UiStateCondition) -> Unit) {
              val preset = LocalCockpitPreset.current
              LazyRow(modifier = Modifier.fillMaxWidth().padding(vertical = 2.dp), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                  items(UiStateCondition.entries) { cond ->
                      val selected = cond == currentState
                      Surface(
                          color = if (selected) preset.primary.copy(alpha = 0.28f) else DesignTokens.GlassSurface,
                          shape = RoundedCornerShape(50),
                          border = BorderStroke(1.dp, if (selected) preset.primary else DesignTokens.GlassBorder),
                          modifier = Modifier.clickable { onSelectState(cond) }
                      ) {
                          Text(cond.titleAr, fontSize = 10.sp, color = if (selected) preset.primary else DesignTokens.TextSecondary, fontWeight = if (selected) FontWeight.Bold else FontWeight.Normal, modifier = Modifier.padding(horizontal = 10.dp, vertical = 4.dp))
                      }
                  }
              }
          }

          @Composable
          fun UnifiedStateRenderer(
              condition: UiStateCondition,
              emptyMessage: String = "لا توجد بيانات متاحة للعرض حاليًا في هذا القسم.",
              sensorMessage: String = "المستشعر المطلوب لهذه الوظيفة غير متوفر في شاشة السيارة الحالية.",
              incompatibleMessage: String = "هذا الجهاز لا يدعم هذه الميزة عتاديًا (Requires Hardware Adapter).",
              onRetryOrRequestPermission: () -> Unit = {},
              normalContent: @Composable () -> Unit
          ) {
              val preset = LocalCockpitPreset.current
              if (condition == UiStateCondition.NORMAL) {
                  normalContent()
                  return
              }
              Surface(
                  color = DesignTokens.GlassSurface,
                  border = BorderStroke(1.2.dp, DesignTokens.GlassBorder),
                  shape = RoundedCornerShape(DesignTokens.RadiusL),
                  modifier = Modifier.fillMaxSize()
              ) {
                  Column(modifier = Modifier.fillMaxSize().padding(24.dp), verticalArrangement = Arrangement.Center, horizontalAlignment = Alignment.CenterHorizontally) {
                      when (condition) {
                          UiStateCondition.LOADING -> {
                              CircularProgressIndicator(color = preset.primary)
                              Spacer(Modifier.height(12.dp))
                              Text("جاري قراءة وتجهيز البيانات...", style = MaterialTheme.typography.titleLarge, color = DesignTokens.TextPrimary)
                          }
                          UiStateCondition.EMPTY_DATA -> {
                              Icon(Icons.Outlined.Inbox, null, tint = DesignTokens.TextMuted, modifier = Modifier.size(48.dp))
                              Spacer(Modifier.height(10.dp))
                              Text("لا توجد بيانات", style = MaterialTheme.typography.titleLarge, color = DesignTokens.TextPrimary)
                              Text(emptyMessage, color = DesignTokens.TextSecondary, textAlign = TextAlign.Center)
                          }
                          UiStateCondition.NO_INTERNET -> {
                              Icon(Icons.Outlined.WifiOff, null, tint = DesignTokens.StatusWarning, modifier = Modifier.size(48.dp))
                              Spacer(Modifier.height(10.dp))
                              Text("لا يوجد اتصال بالإنترنت (وضع Offline)", style = MaterialTheme.typography.titleLarge, color = DesignTokens.StatusWarning)
                              Text("التطبيق يعمل بنظام Offline-First؛ لن يتم عرض أي بيانات خارجية وهمية.", color = DesignTokens.TextSecondary, textAlign = TextAlign.Center)
                          }
                          UiStateCondition.PERMISSION_DENIED -> {
                              Icon(Icons.Outlined.Security, null, tint = DesignTokens.AmberGold, modifier = Modifier.size(48.dp))
                              Spacer(Modifier.height(10.dp))
                              Text("الصلاحية مطلوبة لتشغيل هذه الوحدة", style = MaterialTheme.typography.titleLarge, color = DesignTokens.TextPrimary)
                              Spacer(Modifier.height(12.dp))
                              Button(onClick = onRetryOrRequestPermission, colors = ButtonDefaults.buttonColors(containerColor = DesignTokens.AmberGold)) {
                                  Text("منح الصلاحية الآن", color = Color.Black, fontWeight = FontWeight.Bold)
                              }
                          }
                          UiStateCondition.SENSOR_UNAVAILABLE -> {
                              Icon(Icons.Outlined.SensorsOff, null, tint = DesignTokens.StatusWarning, modifier = Modifier.size(48.dp))
                              Spacer(Modifier.height(10.dp))
                              Text("المستشعر غير متوفر", style = MaterialTheme.typography.titleLarge, color = DesignTokens.StatusWarning)
                              Text(sensorMessage, color = DesignTokens.TextSecondary, textAlign = TextAlign.Center)
                          }
                          UiStateCondition.ERROR -> {
                              Icon(Icons.Outlined.ErrorOutline, null, tint = DesignTokens.StatusDanger, modifier = Modifier.size(48.dp))
                              Spacer(Modifier.height(10.dp))
                              Text("حدث خطأ أثناء معالجة الطلب", style = MaterialTheme.typography.titleLarge, color = DesignTokens.StatusDanger)
                              Spacer(Modifier.height(10.dp))
                              Button(onClick = onRetryOrRequestPermission) { Text("إعادة المحاولة") }
                          }
                          UiStateCondition.DEVICE_INCOMPATIBLE -> {
                              Icon(Icons.Outlined.Hardware, null, tint = DesignTokens.StatusDanger, modifier = Modifier.size(48.dp))
                              Spacer(Modifier.height(10.dp))
                              Text("الجهاز الحالي غير متوافق عتاديًا", style = MaterialTheme.typography.titleLarge, color = DesignTokens.StatusDanger)
                              Text(incompatibleMessage, color = DesignTokens.TextSecondary, textAlign = TextAlign.Center)
                          }
                          else -> {}
                      }
                  }
              }
          }
