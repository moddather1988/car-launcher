          @Composable
          fun DeviceCompatibilityScreen(hardware: HardwareDiagnosticReport) {
              val preset = LocalCockpitPreset.current
              val matrix = hardware.toCapabilityMatrix()

              Column(Modifier.fillMaxSize().padding(6.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                      Text("إدارة توافق الأجهزة (${hardware.deviceModel})", style = MaterialTheme.typography.titleLarge, color = DesignTokens.TextPrimary)
                      Text(hardware.androidVersion, color = preset.primary, fontWeight = FontWeight.Bold, fontSize = 12.sp)
                  }

                  LazyColumn(verticalArrangement = Arrangement.spacedBy(6.dp), modifier = Modifier.weight(1f)) {
                      items(matrix) { item ->
