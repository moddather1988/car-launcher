          package com.universal.carlauncher.domain.automation
          import java.time.LocalTime

          data class AutomationRule(val id: Int, val titleAr: String, val conditionDesc: String, var isEnabled: Boolean)

          object AutomationEngine {
              private var autoMusicTriggeredThisSession = false
              private var restAlertTriggeredThisSession = false

              val defaultRules = mutableListOf(
                  AutomationRule(1, "تشغيل الموسيقى تلقائياً عند انطلاق السيارة", "عند رصد سرعة > 10 كم/س ⬅ بدء تشغيل الموسيقى تلقائياً", true),
                  AutomationRule(2, "التحويل التلقائي للوضع الليلي/النهاري", "عند الساعة 6 مساءً ⬅ الوضع الليلي", true),
                  AutomationRule(3, "تنبيه استراحة السائق الصوتي", "عند اكتمال 120 دقيقة قيادة ⬅ تنبيه صوتي للراحة", true)
              )

              fun executeRealTimeRules(speedKmh: Int, durationMinutes: Int, isPlayingMusic: Boolean, onStartMusic: () -> Unit, onApplyNightMode: (Boolean) -> Unit, onSpeakAlert: (String) -> Unit) {
                  for (rule in defaultRules) {
                      if (!rule.isEnabled) continue
                      when (rule.id) {
                          1 -> if (speedKmh >= 10 && !isPlayingMusic && !autoMusicTriggeredThisSession) { autoMusicTriggeredThisSession = true; onStartMusic() }
                          2 -> onApplyNightMode(LocalTime.now().hour in 6..17)
                          3 -> if (durationMinutes >= 120 && !restAlertTriggeredThisSession) { restAlertTriggeredThisSession = true; onSpeakAlert("تنبيه السلامة: يرجى أخذ قسط من الراحة.") }
                      }
                  }
              }
          }
