name: Build Car Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Complete Android Project Automatically
        run: |
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/universal/carlauncher

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CarLauncherUniversal"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.universal.carlauncher"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.universal.carlauncher"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation(platform("androidx.compose:compose-bom:2024.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"
                  tools:ignore="QueryAllPackagesPermission" />

              <uses-feature android:name="android.hardware.location.gps" android:required="false" />
              <uses-feature android:name="android.hardware.bluetooth" android:required="false" />
              <uses-feature android:name="android.hardware.wifi" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="CAR LAUNCHER UNIVERSAL"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:clearTaskOnLaunch="true"
                      android:stateNotNeeded="true"
                      android:screenOrientation="unspecified"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|uiMode|density|locale|layoutDirection">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.CAR_DOCK" />
                          <category android:name="android.intent.category.CAR_MODE" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/universal/carlauncher/MainActivity.kt
          @file:OptIn(ExperimentalMaterial3Api::class)
          package com.universal.carlauncher

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.location.Location
          import android.location.LocationListener
          import android.location.LocationManager
          import android.os.Bundle
          import android.os.SystemClock
          import android.provider.Settings
          import android.view.WindowManager
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.StrokeCap
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalLayoutDirection
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.LayoutDirection
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.delay
          import java.time.LocalDateTime
          import java.time.chrono.HijrahDate
          import java.time.format.DateTimeFormatter
          import java.time.temporal.ChronoField
          import java.util.Locale

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  setContent {
                      CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
                          MaterialTheme(colorScheme = darkColorScheme(background = Color(0xFF06080E))) {
                              CarLauncherCockpitScreen()
                          }
                      }
                  }
              }
          }

          @SuppressLint("MissingPermission")
          @Composable
          fun CarLauncherCockpitScreen() {
              val context = LocalContext.current
              val config = LocalConfiguration.current
              val isLandscape = config.screenWidthDp >= config.screenHeightDp
              val prefs = remember { context.getSharedPreferences("car_launcher_prefs", Context.MODE_PRIVATE) }

              var timeStr by remember { mutableStateOf("00:00") }
              var secStr by remember { mutableStateOf("00") }
              var gregStr by remember { mutableStateOf("") }
              var hijriStr by remember { mutableStateOf("") }
              var durationStr by remember { mutableStateOf("00:00:00") }
              val startRealtime = remember { SystemClock.elapsedRealtime() }

              var speedKmh by remember { mutableIntStateOf(0) }
              var maxSpeedKmh by remember { mutableIntStateOf(0) }
              var distanceKm by remember { mutableFloatStateOf(0f) }
              var bearingDeg by remember { mutableIntStateOf(0) }
              var lastLocation by remember { mutableStateOf<Location?>(null) }
              var gpsStatus by remember { mutableStateOf("بانتظار صلاحية وإشارة GPS") }

              var tasbeehCount by remember { mutableIntStateOf(prefs.getInt("tasbeeh", 0)) }
              var neonEnabled by remember { mutableStateOf(prefs.getBoolean("neon", true)) }
              var digitalOnly by remember { mutableStateOf(prefs.getBoolean("digital_only", false)) }

              val permissionLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { perms ->
                  val granted = perms[Manifest.permission.ACCESS_FINE_LOCATION] == true
                  gpsStatus = if (granted) "GPS متصل - بانتظار الحركة" else "اضغط لتفعيل صلاحية GPS"
              }

              DisposableEffect(Unit) {
                  val hasPerm = ContextCompat.checkSelfPermission(
                      context, Manifest.permission.ACCESS_FINE_LOCATION
                  ) == PackageManager.PERMISSION_GRANTED

                  val locManager = context.getSystemService(Context.LOCATION_SERVICE) as? LocationManager
                  val listener = LocationListener { loc ->
                      val currentSpd = if (loc.hasSpeed()) (loc.speed * 3.6f).toInt() else 0
                      speedKmh = currentSpd
                      if (currentSpd > maxSpeedKmh) maxSpeedKmh = currentSpd
                      if (loc.hasBearing()) bearingDeg = loc.bearing.toInt()
                      lastLocation?.let { prev ->
                          val deltaMeters = prev.distanceTo(loc)
                          if (deltaMeters > 3f && loc.accuracy <= 35f) {
                              distanceKm += (deltaMeters / 1000f)
                          }
                      }
                      lastLocation = loc
                      gpsStatus = "إشارة GPS نشطة (±${loc.accuracy.toInt()}م)"
                  }

                  if (hasPerm && locManager != null) {
                      runCatching {
                          locManager.requestLocationUpdates(LocationManager.GPS_PROVIDER, 1000L, 1f, listener)
                          gpsStatus = "GPS جاهز وبانتظار التقاط الأقمار"
                      }
                  } else {
                      permissionLauncher.launch(
                          arrayOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION)
                      )
                  }
                  onDispose { runCatching { locManager?.removeUpdates(listener) } }
              }

              LaunchedEffect(Unit) {
                  val hijriMonths = arrayOf(
                      "محرم", "صفر", "ربيع الأول", "ربيع الآخر", "جمادى الأولى", "جمادى الآخرة",
                      "رجب", "شعبان", "رمضان", "شوال", "ذو القعدة", "ذو الحجة"
                  )
                  while (true) {
                      val now = LocalDateTime.now()
                      timeStr = now.format(DateTimeFormatter.ofPattern("hh:mm", Locale.US))
                      secStr = now.format(DateTimeFormatter.ofPattern("ss", Locale.US))
                      gregStr = now.format(DateTimeFormatter.ofPattern("EEEE، dd MMMM yyyy", Locale("ar", "EG")))

                      val hijri = HijrahDate.now()
                      val hDay = hijri.get(ChronoField.DAY_OF_MONTH)
                      val hMonth = hijriMonths[(hijri.get(ChronoField.MONTH_OF_YEAR) - 1).coerceIn(0, 11)]
                      val hYear = hijri.get(ChronoField.YEAR)
                      hijriStr = "$hDay $hMonth $hYear هـ"

                      val elapsed = (SystemClock.elapsedRealtime() - startRealtime) / 1000L
                      durationStr = String.format(Locale.US, "%02d:%02d:%02d", elapsed / 3600, (elapsed % 3600) / 60, elapsed % 60)
                      delay(1000L)
                  }
              }

              val installedApps = remember {
                  val pm = context.packageManager
                  val intent = Intent(Intent.ACTION_MAIN, null).apply { addCategory(Intent.CATEGORY_LAUNCHER) }
                  pm.queryIntentActivities(intent, 0)
                      .filter { it.activityInfo.packageName != context.packageName }
                      .take(10)
                      .map { it.loadLabel(pm).toString() to it.activityInfo.packageName }
              }

              val accentColor = if (neonEnabled) Color(0xFF00F5D4) else Color(0xFF00A8E8)

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color(0xFF06080E))
                      .padding(10.dp),
                  verticalArrangement = Arrangement.spacedBy(10.dp)
              ) {
                  Surface(
                      color = Color(0xFF131C31),
                      shape = RoundedCornerShape(16.dp),
                      border = BorderStroke(1.dp, accentColor.copy(alpha = 0.45f)),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Row(
                          modifier = Modifier.padding(horizontal = 14.dp, vertical = 8.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                              Text(timeStr, fontSize = 26.sp, fontWeight = FontWeight.Black, color = Color.White)
                              Text(secStr, fontSize = 13.sp, color = accentColor, fontWeight = FontWeight.Bold)
                              Column {
                                  Text(gregStr, fontSize = 12.sp, color = Color.White)
                                  Text(hijriStr, fontSize = 12.sp, color = accentColor)
                              }
                          }
                          Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                              FilterChip(
                                  selected = digitalOnly,
                                  onClick = {
                                      digitalOnly = !digitalOnly
                                      prefs.edit().putBoolean("digital_only", digitalOnly).apply()
                                  },
                                  label = { Text(if (digitalOnly) "عداد دائري" else "عداد رقمي") }
                              )
                              FilterChip(
                                  selected = neonEnabled,
                                  onClick = {
                                      neonEnabled = !neonEnabled
                                      prefs.edit().putBoolean("neon", neonEnabled).apply()
                                  },
                                  label = { Text("Neon") }
                              )
                              Button(onClick = {
                                  runCatching {
                                      context.startActivity(Intent(Settings.ACTION_HOME_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                                  }
                              }) { Text("تعيين كلانشر", fontSize = 11.sp) }
                          }
                      }
                  }

                  Row(
                      modifier = Modifier.weight(1f).fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      Card(
                          modifier = Modifier.weight(if (isLandscape) 0.38f else 0.48f).fillMaxHeight(),
                          colors = CardDefaults.cardColors(containerColor = Color(0xFF131C31)),
                          border = BorderStroke(1.5.dp, accentColor),
                          shape = RoundedCornerShape(22.dp)
                      ) {
                          Column(
                              modifier = Modifier.fillMaxSize().padding(12.dp),
                              horizontalAlignment = Alignment.CenterHorizontally,
                              verticalArrangement = Arrangement.SpaceBetween
                          ) {
                              Text(
                                  text = gpsStatus,
                                  fontSize = 12.sp,
                                  color = Color(0xFFFFB703),
                                  modifier = Modifier.clickable {
                                      permissionLauncher.launch(
                                          arrayOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION)
                                      )
                                  }
                              )

                              Box(modifier = Modifier.size(185.dp), contentAlignment = Alignment.Center) {
                                  if (!digitalOnly) {
                                      Canvas(modifier = Modifier.fillMaxSize()) {
                                          val stroke = 14.dp.toPx()
                                          val d = minOf(size.width, size.height) - stroke
                                          drawArc(
                                              color = Color(0xFF1E293B), startAngle = 135f, sweepAngle = 270f,
                                              useCenter = false, topLeft = Offset((size.width - d) / 2f, (size.height - d) / 2f),
                                              size = Size(d, d), style = Stroke(stroke, cap = StrokeCap.Round)
                                          )
                                          val frac = (speedKmh.coerceIn(0, 240) / 240f)
                                          drawArc(
                                              brush = Brush.sweepGradient(listOf(Color(0xFF00A8E8), accentColor)),
                                              startAngle = 135f, sweepAngle = 270f * frac,
                                              useCenter = false, topLeft = Offset((size.width - d) / 2f, (size.height - d) / 2f),
                                              size = Size(d, d), style = Stroke(stroke, cap = StrokeCap.Round)
                                          )
                                      }
                                  }
                                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                      Text("$speedKmh", fontSize = if (digitalOnly) 68.sp else 50.sp, fontWeight = FontWeight.Black, color = Color.White)
                                      Text("كم / ساعة", fontSize = 14.sp, color = accentColor)
                                  }
                              }

                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                                  Text("المسافة: ${"%.2f".format(distanceKm)} كم", fontSize = 11.sp, color = Color.White)
                                  Text("المدة: $durationStr", fontSize = 11.sp, color = accentColor)
                                  Text("الأقصى: $maxSpeedKmh", fontSize = 11.sp, color = Color.White)
                              }
                          }
                      }

                      LazyVerticalGrid(
                          columns = GridCells.Fixed(if (isLandscape) 2 else 1),
                          modifier = Modifier.weight(0.62f).fillMaxHeight(),
                          verticalArrangement = Arrangement.spacedBy(10.dp),
                          horizontalArrangement = Arrangement.spacedBy(10.dp)
                      ) {
                          item {
                              CockpitWidgetCard("القسم الإسلامي والمسبحة", accentColor) {
                                  Text("التاريخ الهجري: $hijriStr", color = Color.White, fontSize = 13.sp)
                                  Text("اتجاه القبلة: 136° جنوب شرق", color = Color(0xFF94A3B8), fontSize = 12.sp)
                                  Spacer(Modifier.height(6.dp))
                                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                      Button(onClick = {
                                          tasbeehCount++
                                          prefs.edit().putInt("tasbeeh", tasbeehCount).apply()
                                      }) { Text("المسبحة: $tasbeehCount") }
                                      OutlinedButton(onClick = {
                                          tasbeehCount = 0
                                          prefs.edit().putInt("tasbeeh", 0).apply()
                                      }) { Text("تصفير") }
                                  }
                              }
                          }
                          item {
                              CockpitWidgetCard("البوصلة والرحلة", accentColor) {
                                  Text("زاوية الاتجاه: $bearingDeg°", color = accentColor, fontSize = 14.sp, fontWeight = FontWeight.Bold)
                                  Text("أعلى سرعة مسجلة: $maxSpeedKmh كم/س", color = Color.White, fontSize = 12.sp)
                                  Spacer(Modifier.height(6.dp))
                                  Button(onClick = {
                                      distanceKm = 0f
                                      maxSpeedKmh = 0
                                  }) { Text("تصفير عداد الرحلة") }
                              }
                          }
                          item {
                              CockpitWidgetCard("الصوتيات والبلوتوث والنظام", accentColor) {
                                  Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                      Button(onClick = {
                                          runCatching { context.startActivity(Intent(Settings.ACTION_BLUETOOTH_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) }
                                      }) { Text("البلوتوث", fontSize = 12.sp) }
                                      Button(onClick = {
                                          runCatching { context.startActivity(Intent(Settings.ACTION_SOUND_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) }
                                      }) { Text("الصوت", fontSize = 12.sp) }
                                      Button(onClick = {
                                          runCatching { context.startActivity(Intent(Settings.ACTION_WIFI_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) }
                                      }) { Text("Wi-Fi", fontSize = 12.sp) }
                                  }
                              }
                          }
                          item {
                              CockpitWidgetCard("تطبيقات الشاشة (${config.screenWidthDp}×${config.screenHeightDp})", accentColor) {
                                  LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                      items(installedApps) { (label, pkg) ->
                                          Surface(
                                              color = Color(0xFF1A2642),
                                              shape = RoundedCornerShape(10.dp),
                                              modifier = Modifier.clickable {
                                                  context.packageManager.getLaunchIntentForPackage(pkg)?.let {
                                                      it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                                      context.startActivity(it)
                                                  }
                                              }
                                          ) {
                                              Text(label, color = Color.White, modifier = Modifier.padding(horizontal = 12.dp, vertical = 8.dp), fontSize = 12.sp)
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun CockpitWidgetCard(title: String, accent: Color, content: @Composable ColumnScope.() -> Unit) {
              Card(
                  colors = CardDefaults.cardColors(containerColor = Color(0xFF131C31)),
                  border = BorderStroke(1.dp, Color(0xFF1E293B)),
                  shape = RoundedCornerShape(16.dp),
                  modifier = Modifier.fillMaxWidth()
              ) {
                  Column(modifier = Modifier.padding(12.dp)) {
                      Text(title, color = accent, fontWeight = FontWeight.Bold, fontSize = 14.sp)
                      Spacer(Modifier.height(6.dp))
                      content()
                  }
              }
          }
          EOF

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Easy Download
        run: cp app/build/outputs/apk/debug/app-debug.apk CarLauncherUniversal.apk

      - name: Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarLauncherUniversal-Ready-APK
          path: CarLauncherUniversal.apk
