                              items(list) { d -> Surface(color = preset.card.copy(alpha = 0.88f), shape = RoundedCornerShape(14.dp), modifier = Modifier.fillMaxWidth()) { Text(d, color = DesignTokens.TextPrimary, modifier = Modifier.padding(14.dp)) } }
