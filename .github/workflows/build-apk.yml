          @Composable
          fun AppsGridScreen(onlyFavorites: Boolean, installedApps: List<InstalledAndroidApp>, storage: LauncherStorage, stateCond: UiStateCondition) {
              val context = LocalContext.current
              var query by remember { mutableStateOf("") }
              var favs by remember { mutableStateOf(storage.favoritePackages) }
              val displayed = installedApps.filter { (!onlyFavorites || favs.contains(it.packageName)) && it.label.contains(query, true) }
              val effectiveCond = if (stateCond == UiStateCondition.NORMAL && displayed.isEmpty()) UiStateCondition.EMPTY_DATA else stateCond

              UnifiedStateRenderer(condition = effectiveCond) {
                  Column(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                      OutlinedTextField(value = query, onValueChange = { query = it }, placeholder = { Text("ابحث في التطبيقات المثبتة (${installedApps.size})...") }, modifier = Modifier.fillMaxWidth(), singleLine = true)
                      LazyVerticalGrid(columns = GridCells.Adaptive(155.dp), verticalArrangement = Arrangement.spacedBy(8.dp), horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.weight(1f)) {
                          items(displayed) { app ->
                              val isFav = favs.contains(app.packageName)
                              Surface(
                                  color = DesignTokens.GlassSurface, shape = RoundedCornerShape(14.dp), border = BorderStroke(1.dp, if (isFav) DesignTokens.AmberGold else DesignTokens.GlassBorder),
                                  modifier = Modifier.clickable {
                                      storage.recordAppLaunch(app.packageName)
                                      context.packageManager.getLaunchIntentForPackage(app.packageName)?.let { it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); runCatching { context.startActivity(it) } }
                                  }
                              ) {
