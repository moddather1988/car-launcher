name: Build Car Launcher Universal v10.0 Phase 5 Full Engine

on:
  push:
    branches: [ "main", "master", "v10.0-phase5" ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-v10-phase5:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Complete v10.0 Phase 5 Architecture
        run: |
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties
          BASE="app/src/main/java/com/universal/carlauncher"
          mkdir -p "$BASE/core/designsystem" "$BASE/core/responsive" "$BASE/core/hardware" "$BASE/core/storage" "$BASE/core/receiver" "$BASE/core/diagnostics" "$BASE/core/audio" "$BASE/ui/dock" "$BASE/domain/islamic" "$BASE/domain/weather" "$BASE/ui/components" "$BASE/ui/navigation" "$BASE/ui/screens"

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "CarLauncherUniversal"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.universal.carlauncher"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.universal.carlauncher"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 11
                  versionName = "10.0.0-Phase5Full"
              }
              buildTypes {
                  debug { isMinifyEnabled = false }
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation(platform("androidx.compose:compose-bom:2024.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />

              <application
                  android:allowBackup="true"
                  android:label="CAR LAUNCHER UNIVERSAL"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:clearTaskOnLaunch="true"
                      android:stateNotNeeded="true"
                      android:screenOrientation="unspecified"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|uiMode|density|locale|layoutDirection">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.CAR_DOCK" />
                          <category android:name="android.intent.category.CAR_MODE" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".core.receiver.BootCompletedReceiver"
                      android:enabled="true"
                      android:exported="true"
                      android:directBootAware="true">
                      <intent-filter android:priority="999">
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.LOCKED_BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # 1. Central Audio Manager
          cat << 'EOF' > "$BASE/core/audio/CentralAudioManager.kt"
          package com.universal.carlauncher.core.audio

          import android.content.Context
          import android.media.AudioAttributes
          import android.media.AudioFocusRequest
          import android.media.AudioManager
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Build
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import java.util.Locale

          enum class AudioSourceType { NONE, LOCAL_MUSIC, ONLINE_RADIO, ISLAMIC_DHIKR }

          data class UnifiedAudioState(
              val activeSource: AudioSourceType = AudioSourceType.NONE,
              val isPlaying: Boolean = false,
              val title: String = "جاهز للتشغيل",
              val subtitle: String = "",
              val currentPosMs: Int = 0,
              val durationMs: Int = 1,
              val isBuffering: Boolean = false,
              val errorText: String? = null
          )

          class CentralAudioManager(private val context: Context) {
              private val audioManager = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
              private val mainPlayer = MediaPlayer()
              private val dhikrPlayer = MediaPlayer()
              private var tts: TextToSpeech? = null

              private val _state = MutableStateFlow(UnifiedAudioState())
              val state: StateFlow<UnifiedAudioState> = _state

              private var hasPlayedStartupDhikrInSession = false
              private var interruptedSource: AudioSourceType = AudioSourceType.NONE
              private var interruptedMusicUri: Uri? = null
              private var interruptedMusicPos: Int = 0
              private var interruptedRadioUrl: String? = null
              private var interruptedTitle: String = ""

              private val focusChangeListener = AudioManager.OnAudioFocusChangeListener { change ->
                  when (change) {
                      AudioManager.AUDIOFOCUS_LOSS, AudioManager.AUDIOFOCUS_LOSS_TRANSIENT -> pauseCurrent()
                      AudioManager.AUDIOFOCUS_LOSS_TRANSIENT_CAN_DUCK -> setVolume(0.25f)
                      AudioManager.AUDIOFOCUS_GAIN -> setVolume(1.0f)
                  }
              }

              init {
                  tts = TextToSpeech(context) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          tts?.language = Locale("ar")
                          tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(utteranceId: String?) {}
                              override fun onDone(utteranceId: String?) { restoreInterruptedAudioAfterDhikr() }
                              override fun onError(utteranceId: String?) { restoreInterruptedAudioAfterDhikr() }
                          })
                      }
                  }
              }

              private fun requestFocus(): Boolean {
                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val req = AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN)
                          .setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build())
                          .setOnAudioFocusChangeListener(focusChangeListener).build()
                      audioManager.requestAudioFocus(req) == AudioManager.AUDIOFOCUS_REQUEST_GRANTED
                  } else {
                      @Suppress("DEPRECATION")
                      audioManager.requestAudioFocus(focusChangeListener, AudioManager.STREAM_MUSIC, AudioManager.AUDIOFOCUS_GAIN) == AudioManager.AUDIOFOCUS_REQUEST_GRANTED
                  }
              }

              fun playLocalMusic(uri: Uri, title: String, artist: String, startPosMs: Int = 0) {
                  requestFocus(); stopDhikrImmediately()
                  runCatching {
                      mainPlayer.reset()
                      mainPlayer.setDataSource(context, uri)
                      mainPlayer.prepare()
                      if (startPosMs > 0) mainPlayer.seekTo(startPosMs)
                      mainPlayer.start()
                      interruptedMusicUri = uri
                      interruptedTitle = title
                      _state.value = UnifiedAudioState(activeSource = AudioSourceType.LOCAL_MUSIC, isPlaying = true, title = title, subtitle = artist, currentPosMs = mainPlayer.currentPosition, durationMs = mainPlayer.duration.coerceAtLeast(1))
                  }.onFailure { err ->
                      _state.value = _state.value.copy(isPlaying = false, errorText = err.localizedMessage)
                  }
              }

              fun playOnlineRadio(streamUrl: String, stationName: String, category: String) {
                  requestFocus(); stopDhikrImmediately()
                  _state.value = UnifiedAudioState(activeSource = AudioSourceType.ONLINE_RADIO, isPlaying = false, isBuffering = true, title = stationName, subtitle = "جاري الاتصال بـ $category...")
                  runCatching {
                      mainPlayer.reset()
                      mainPlayer.setAudioAttributes(AudioAttributes.Builder().setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).setUsage(AudioAttributes.USAGE_MEDIA).build())
                      mainPlayer.setDataSource(streamUrl)
                      mainPlayer.setOnPreparedListener { mp ->
                          mp.start()
                          interruptedRadioUrl = streamUrl
                          interruptedTitle = stationName
                          _state.value = UnifiedAudioState(activeSource = AudioSourceType.ONLINE_RADIO, isPlaying = true, isBuffering = false, title = stationName, subtitle = "بث مباشر • $category")
                      }
                      mainPlayer.setOnErrorListener { _, _, _ ->
                          _state.value = _state.value.copy(isPlaying = false, isBuffering = false, errorText = "فشل اتصال البث المباشر")
                          true
                      }
                      mainPlayer.prepareAsync()
                  }
              }

              fun playIslamicDhikr(dhikrTitle: String, dhikrTextToSpeak: String, isAutoStartup: Boolean = false) {
                  if (isAutoStartup && hasPlayedStartupDhikrInSession) return
                  if (isAutoStartup) hasPlayedStartupDhikrInSession = true

                  if (_state.value.isPlaying) {
                      interruptedSource = _state.value.activeSource
                      if (interruptedSource == AudioSourceType.LOCAL_MUSIC) interruptedMusicPos = runCatching { mainPlayer.currentPosition }.getOrDefault(0)
                      runCatching { mainPlayer.pause() }
                  }
                  _state.value = _state.value.copy(activeSource = AudioSourceType.ISLAMIC_DHIKR, isPlaying = true, title = dhikrTitle, subtitle = "الأذكار الصوتية")
                  tts?.speak(dhikrTextToSpeak, TextToSpeech.QUEUE_FLUSH, null, "DHIKR_UTTERANCE")
              }

              private fun restoreInterruptedAudioAfterDhikr() {
                  when (interruptedSource) {
                      AudioSourceType.LOCAL_MUSIC -> interruptedMusicUri?.let { playLocalMusic(it, interruptedTitle, "استئناف", interruptedMusicPos) }
                      AudioSourceType.ONLINE_RADIO -> interruptedRadioUrl?.let { playOnlineRadio(it, interruptedTitle, "استئناف البث") }
                      else -> { _state.value = _state.value.copy(activeSource = AudioSourceType.NONE, isPlaying = false) }
                  }
                  interruptedSource = AudioSourceType.NONE
              }

              fun stopDhikrImmediately() { runCatching { dhikrPlayer.stop() }; runCatching { tts?.stop() } }
              fun pauseCurrent() { runCatching { if (mainPlayer.isPlaying) mainPlayer.pause() }; _state.value = _state.value.copy(isPlaying = false) }
              fun setVolume(v: Float) { val f = v.coerceIn(0f, 1f); runCatching { mainPlayer.setVolume(f, f) }; runCatching { dhikrPlayer.setVolume(f, f) } }
          }
          EOF

          # 2. Dock Repository & Editor
          cat << 'EOF' > "$BASE/ui/dock/DockCustomizationManager.kt"
          package com.universal.carlauncher.ui.dock

          import android.content.Context
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.outlined.*
          import androidx.compose.ui.graphics.vector.ImageVector
          import org.json.JSONArray
          import org.json.JSONObject

          enum class DockItemType { INTERNAL_ROUTE, INSTALLED_APP, MINI_WIDGET }

          data class CustomizableDockItem(
              val id: String, val titleAr: String, val type: DockItemType,
              val targetPayload: String, val iconName: String, val isVisible: Boolean = true
          )

          class DockRepository(private val context: Context) {
              private val prefs = context.getSharedPreferences("car_launcher_v4_prefs", Context.MODE_PRIVATE)

              fun getDefaultDockItems(): List<CustomizableDockItem> = listOf(
                  CustomizableDockItem("nav", "الخرائط", DockItemType.INTERNAL_ROUTE, "NAVIGATION", "MAP"),
                  CustomizableDockItem("phone", "الهاتف", DockItemType.INTERNAL_ROUTE, "PHONE_DIALPAD", "CALL"),
                  CustomizableDockItem("apps", "التطبيقات", DockItemType.INTERNAL_ROUTE, "APPS_INSTALLED", "APPS"),
                  CustomizableDockItem("music", "الموسيقى", DockItemType.INTERNAL_ROUTE, "MUSIC_PLAYER", "MUSIC"),
                  CustomizableDockItem("radio", "الراديو", DockItemType.INTERNAL_ROUTE, "RADIO", "RADIO")
              )

              fun loadSavedDock(): List<CustomizableDockItem> {
                  val raw = prefs.getString("custom_bottom_dock_v10", null) ?: return getDefaultDockItems()
                  return runCatching {
                      val arr = JSONArray(raw)
                      val list = mutableListOf<CustomizableDockItem>()
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          list.add(CustomizableDockItem(o.getString("id"), o.getString("titleAr"), DockItemType.valueOf(o.getString("type")), o.getString("targetPayload"), o.getString("iconName"), o.optBoolean("isVisible", true)))
                      }
                      if (list.isEmpty()) getDefaultDockItems() else list
                  }.getOrDefault(getDefaultDockItems())
              }

              fun saveDock(items: List<CustomizableDockItem>) {
                  val arr = JSONArray()
                  items.forEach { arr.put(JSONObject().apply { put("id", it.id); put("titleAr", it.titleAr); put("type", it.type.name); put("targetPayload", it.targetPayload); put("iconName", it.iconName); put("isVisible", it.isVisible) }) }
                  prefs.edit().putString("custom_bottom_dock_v10", arr.toString()).apply()
              }
          }

          fun resolveDockIcon(iconName: String): ImageVector = when (iconName) {
              "MAP" -> Icons.Outlined.LocationOn
              "CALL" -> Icons.Outlined.Call
              "APPS" -> Icons.Outlined.GridView
              "MUSIC" -> Icons.Outlined.MusicNote
              "RADIO" -> Icons.Outlined.Sensors
              else -> Icons.Outlined.AppShortcut
          }
          EOF

          # 3. Design Tokens & Scenic Wallpapers
          cat << 'EOF' > "$BASE/core/designsystem/DesignTokens.kt"
          package com.universal.carlauncher.core.designsystem
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp

          enum class ScenicWallpaperPreset(
              val titleAr: String, val skyTop: Color, val skyHorizon: Color,
              val mountainFar: Color, val mountainNear: Color, val lakeWater: Color,
              val roadSurface: Color, val roadGlow: Color
          ) {
              ALPINE_NIGHT_LAKE("جبال الألب والبحيرة (الأصلي)", Color(0xFF061B28), Color(0xFF154759), Color(0xFF1D566B), Color(0xFF0E3343), Color(0xFF18566A), Color(0xFF0B222E), Color(0xFF4EEADB)),
              EMERALD_FOREST_HIGHWAY("طريق الغابات الزمردي", Color(0xFF041F1E), Color(0xFF0F4C45), Color(0xFF155E54), Color(0xFF093530), Color(0xFF11645B), Color(0xFF081F1D), Color(0xFF34D399))
          }

          enum class CockpitThemePreset(
              val titleAr: String, val background: Color, val surface: Color,
              val card: Color, val cardElevated: Color, val primary: Color,
              val secondary: Color, val border: Color
          ) {
              PANORAMIC_TEAL("زجاجي تيفاني (المرجعي)", Color(0xFF071E2B), Color(0xFF0B293B), Color(0xFF0D2B3E), Color(0xFF163C54), Color(0xFF5EEAD4), Color(0xFFF59E0B), Color(0xFF5296A8)),
              MERCEDES_OBSIDIAN("مرسيدس ليل داكن", Color(0xFF05070B), Color(0xFF0C1018), Color(0xFF131926), Color(0xFF1B2436), Color(0xFF38BDF8), Color(0xFFF59E0B), Color(0xFF3B5278))
          }

          object DesignTokens {
              val TextPrimary = Color(0xFFFFFFFF)
              val TextSecondary = Color(0xFFE2E8F0)
              val TextMuted = Color(0xFFCBD5E1)
              val AmberGold = Color(0xFFF9A825)
              val MintFocusGlow = Color(0xFF6EE7B7)
              val GlassSurface = Color(0xFF092230).copy(alpha = 0.36f)
              val GlassBorder = Color(0xFF7DD3FC).copy(alpha = 0.48f)
              val StatusSuccess = Color(0xFF10B981)
              val StatusWarning = Color(0xFFF59E0B)
              val StatusDanger = Color(0xFFEF4444)
              val RadiusS = 10.dp
              val RadiusM = 16.dp
              val RadiusL = 24.dp
              val RadiusPill = 50.dp
          }
          EOF

          cat << 'EOF' > "$BASE/core/designsystem/CarLauncherTheme.kt"
          package com.universal.carlauncher.core.designsystem
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.platform.LocalLayoutDirection
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.LayoutDirection
          import androidx.compose.ui.unit.sp

          val LocalCockpitPreset = staticCompositionLocalOf { CockpitThemePreset.PANORAMIC_TEAL }

          @Composable
          fun CarLauncherTheme(
              preset: CockpitThemePreset = CockpitThemePreset.PANORAMIC_TEAL,
              isDayMode: Boolean = false,
              fontScaleMultiplier: Float = 1.0f,
              content: @Composable () -> Unit
          ) {
              val colors = darkColorScheme(primary = preset.primary, secondary = preset.secondary, background = preset.background, surface = preset.surface)
              val typography = Typography(displayLarge = TextStyle(fontFamily = FontFamily.SansSerif, fontWeight = FontWeight.Black, fontSize = 52.sp))
              CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl, LocalCockpitPreset provides preset) {
                  MaterialTheme(colorScheme = colors, typography = typography, content = content)
              }
          }
          EOF

          # 4. Responsive Engine
          cat << 'EOF' > "$BASE/core/responsive/ResponsiveWindowEngine.kt"
          package com.universal.carlauncher.core.responsive
          import android.content.res.Configuration
          import androidx.compose.runtime.*
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp

          data class ResponsiveLayoutMetrics(val isLandscape: Boolean, val widthDp: Int, val heightDp: Int, val scaleFactor: Float, val outerPadding: Dp)

          @Composable
          fun rememberResponsiveMetrics(): ResponsiveLayoutMetrics {
              val config = LocalConfiguration.current
              val w = config.screenWidthDp.coerceAtLeast(320)
              val h = config.screenHeightDp.coerceAtLeast(240)
              val isLandscape = config.orientation == Configuration.ORIENTATION_LANDSCAPE || w >= h
              return remember(w, h, isLandscape) { ResponsiveLayoutMetrics(isLandscape, w, h, 1.0f, 10.dp) }
          }
          EOF

          # 5. Storage
          cat << 'EOF' > "$BASE/core/storage/LauncherStorage.kt"
          package com.universal.carlauncher.core.storage
          import android.content.Context
          import com.universal.carlauncher.core.designsystem.CockpitThemePreset
          import com.universal.carlauncher.core.designsystem.ScenicWallpaperPreset

          class LauncherStorage(context: Context) {
              private val prefs = context.getSharedPreferences("car_launcher_v4_prefs", Context.MODE_PRIVATE)
              val availableBrands = listOf("Ford", "KIA", "Mercedes", "BMW", "Toyota", "Hyundai")

              var themePreset: CockpitThemePreset
                  get() = runCatching { CockpitThemePreset.valueOf(prefs.getString("theme", CockpitThemePreset.PANORAMIC_TEAL.name)!!) }.getOrDefault(CockpitThemePreset.PANORAMIC_TEAL)
                  set(value) = prefs.edit().putString("theme", value.name).apply()

              var wallpaperPreset: ScenicWallpaperPreset
                  get() = runCatching { ScenicWallpaperPreset.valueOf(prefs.getString("wallpaper_preset", ScenicWallpaperPreset.ALPINE_NIGHT_LAKE.name)!!) }.getOrDefault(ScenicWallpaperPreset.ALPINE_NIGHT_LAKE)
                  set(value) = prefs.edit().putString("wallpaper_preset", value.name).apply()

              fun cycleWallpaper(): ScenicWallpaperPreset {
                  val entries = ScenicWallpaperPreset.entries
                  val next = entries[(entries.indexOf(wallpaperPreset) + 1) % entries.size]
                  wallpaperPreset = next
                  return next
              }

              var carBrandName: String
                  get() = prefs.getString("car_brand", "Ford") ?: "Ford"
                  set(value) = prefs.edit().putString("car_brand", value).apply()

              fun cycleCarBrand(): String {
                  val next = availableBrands[(availableBrands.indexOf(carBrandName) + 1) % availableBrands.size]
                  carBrandName = next
                  return next
              }

              var speedAlertLimit: Int
                  get() = prefs.getInt("speed_limit", 120)
                  set(value) = prefs.edit().putInt("speed_limit", value).apply()

              var showPrayerPanel: Boolean
                  get() = prefs.getBoolean("show_prayer_panel", true)
                  set(value) = prefs.edit().putBoolean("show_prayer_panel", value).apply()

              var showTripPanel: Boolean
                  get() = prefs.getBoolean("show_trip_panel", true)
                  set(value) = prefs.edit().putBoolean("show_trip_panel", value).apply()

              var showMusicDock: Boolean
                  get() = prefs.getBoolean("show_music_dock", true)
                  set(value) = prefs.edit().putBoolean("show_music_dock", value).apply()

              var favoritePackages: Set<String>
                  get() = prefs.getStringSet("fav_pkgs", emptySet()) ?: emptySet()
                  set(value) = prefs.edit().putStringSet("fav_pkgs", value).apply()

              fun toggleFavoriteApp(pkg: String): Set<String> {
                  val current = favoritePackages.toMutableSet()
                  if (current.contains(pkg)) current.remove(pkg) else current.add(pkg)
                  favoritePackages = current
                  return current
              }
          }
          EOF

          # 6. Weather & Hardware & Prayer Engines
          cat << 'EOF' > "$BASE/domain/weather/MultiSourceWeatherProvider.kt"
          package com.universal.carlauncher.domain.weather
          data class WeatherSnapshot(val tempCelsius: Int, val conditionAr: String, val sourceNameAr: String, val highTemp: Int, val lowTemp: Int)
          object MultiSourceWeatherProvider {
              fun getOfflineSeasonalEstimate() = WeatherSnapshot(25, "صافٍ", "التقدير المحلي (Offline)", 30, 18)
          }
          EOF

          cat << 'EOF' > "$BASE/core/hardware/VehicleHardwareService.kt"
          package com.universal.carlauncher.core.hardware
          import android.content.Context
          data class HardwareDiagnosticReport(val hasGpsHardware: Boolean = true, val isGpsEnabled: Boolean = true, val isBluetoothEnabled: Boolean = true, val pairedBluetoothNames: List<String> = emptyList())
          class VehicleHardwareService(private val context: Context) {
              fun inspectHardware() = HardwareDiagnosticReport()
          }
