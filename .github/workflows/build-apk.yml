              val effectiveCond = if (stateCond == UiStateCondition.NORMAL && tracks.isEmpty()) UiStateCondition.EMPTY_DATA else stateCond
              UnifiedStateRenderer(condition = effectiveCond, emptyMessage = "لم يتم العثور على ملفات MP3 على ذاكرة الشاشة أو الفلاشة.", onRetryOrRequestPermission = onRefresh) {
                  Column(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp), verticalAlignment = Alignment.CenterVertically) {
                          OutlinedTextField(value = query, onValueChange = { query = it }, placeholder = { Text("ابحث في قائمة الأغاني (${tracks.size})...") }, modifier = Modifier.weight(1f), singleLine = true)
                          Button(onClick = onRefresh) { Text("فحص الذاكرة") }
                      }
                      LazyColumn(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                          items(tracks.filter { it.title.contains(query, true) || it.artist.contains(query, true) }) { track ->
