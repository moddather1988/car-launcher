          // مشغل الموسيقى المتكامل مع شريط التقدم الحقيقي (Live SeekBar) والعداد الزمني
          @Composable
          fun MusicPlayerFullScreen(
              tracks: List<LocalAudioTrack>, currentIndex: Int, isPlaying: Boolean,
              currentPosMs: Int, durationMs: Int, onSeekTo: (Int) -> Unit,
              shuffleEnabled: Boolean, repeatEnabled: Boolean, storage: LauncherStorage,
              onTogglePlay: () -> Unit, onNext: () -> Unit, onPrev: () -> Unit,
              onToggleShuffle: () -> Unit, onToggleRepeat: () -> Unit,
              onOpenSongList: () -> Unit, stateCond: UiStateCondition
          ) {
              val preset = LocalCockpitPreset.current; val context = LocalContext.current
              val audioManager = remember { context.getSystemService(Context.AUDIO_SERVICE) as? AudioManager }
              val maxVol = remember { audioManager?.getStreamMaxVolume(AudioManager.STREAM_MUSIC) ?: 15 }
              var curVol by remember { mutableIntStateOf(audioManager?.getStreamVolume(AudioManager.STREAM_MUSIC) ?: 10) }
              val current = tracks.getOrNull(currentIndex)
              var favIds by remember { mutableStateOf(storage.favoriteTrackIds) }
              val isFav = current != null && favIds.contains(current.id.toString())

              fun formatMs(ms: Int): String {
                  val totalSec = (ms / 1000).coerceAtLeast(0)
                  return String.format(Locale.US, "%02d:%02d", totalSec / 60, totalSec % 60)
              }

              UnifiedStateRenderer(condition = stateCond) {
                  Surface(color = DesignTokens.GlassSurface, border = BorderStroke(1.dp, DesignTokens.GlassBorder), shape = RoundedCornerShape(22.dp), modifier = Modifier.fillMaxSize()) {
                      Row(Modifier.fillMaxSize().padding(14.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(16.dp)) {
                          Surface(color = Color(0xFF1A2636), shape = RoundedCornerShape(22.dp), border = BorderStroke(1.5.dp, preset.primary), modifier = Modifier.size(115.dp)) {
                              Box(contentAlignment = Alignment.Center) { Icon(Icons.Outlined.MusicNote, null, tint = DesignTokens.AmberGold, modifier = Modifier.size(54.dp)) }
                          }
                          Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(4.dp)) {
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                  Column(Modifier.weight(1f)) {
                                      Text(current?.title ?: "Evening Drive QA", style = MaterialTheme.typography.titleLarge, color = DesignTokens.TextPrimary, maxLines = 1)
                                      Text(current?.artist ?: "MyCar Audio Test", fontSize = 11.sp, color = preset.primary)
                                  }
                                  if (current != null) {
                                      IconButton(onClick = { favIds = storage.toggleFavoriteTrack(current.id) }) {
                                          Icon(if (isFav) Icons.Default.Favorite else Icons.Outlined.FavoriteBorder, null, tint = if (isFav) DesignTokens.StatusDanger else Color.White)
                                      }
                                  }
                              }

                              // شريط التقدم الحقيقي للمقطع الصوتي (Live Audio SeekBar)
                              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  Text(formatMs(currentPosMs), fontSize = 11.sp, color = DesignTokens.AmberGold)
                                  Slider(
                                      value = currentPosMs.toFloat().coerceIn(0f, durationMs.coerceAtLeast(1).toFloat()),
                                      onValueChange = { onSeekTo(it.toInt()) },
                                      valueRange = 0f..durationMs.coerceAtLeast(1).toFloat(),
                                      modifier = Modifier.weight(1f).height(22.dp)
                                  )
                                  Text(formatMs(durationMs), fontSize = 11.sp, color = DesignTokens.TextSecondary)
                              }

                              // شريط التحكم الفعلي في صوت النظام
                              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  Icon(Icons.Outlined.VolumeUp, null, tint = DesignTokens.AmberGold, modifier = Modifier.size(16.dp))
                                  Slider(value = curVol.toFloat(), onValueChange = { curVol = it.toInt(); runCatching { audioManager?.setStreamVolume(AudioManager.STREAM_MUSIC, curVol, 0) } }, valueRange = 0f..maxVol.toFloat(), modifier = Modifier.weight(1f).height(20.dp))
                                  Text("${(curVol * 100) / maxVol.coerceAtLeast(1)}%", fontSize = 10.sp, color = Color.White)
                              }

                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp), verticalAlignment = Alignment.CenterVertically) {
                                      IconButton(onClick = onToggleShuffle) { Icon(Icons.Outlined.Shuffle, null, tint = if (shuffleEnabled) DesignTokens.AmberGold else DesignTokens.TextMuted) }
                                      IconButton(onClick = onNext) { Icon(Icons.Default.SkipNext, null, tint = Color.White, modifier = Modifier.size(28.dp)) }
                                      Surface(shape = CircleShape, color = DesignTokens.AmberGold, modifier = Modifier.size(46.dp).clickable { onTogglePlay() }) {
                                          Box(contentAlignment = Alignment.Center) { Icon(if (isPlaying) Icons.Default.Pause else Icons.Default.PlayArrow, null, tint = Color.Black, modifier = Modifier.size(28.dp)) }
                                      }
                                      IconButton(onClick = onPrev) { Icon(Icons.Default.SkipPrevious, null, tint = Color.White, modifier = Modifier.size(28.dp)) }
                                      IconButton(onClick = onToggleRepeat) { Icon(Icons.Outlined.Repeat, null, tint = if (repeatEnabled) DesignTokens.AmberGold else DesignTokens.TextMuted) }
                                  }
                                  Button(onClick = onOpenSongList) { Text("قوائم التشغيل (${tracks.size})", fontSize = 11.sp) }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun SongListScreen(tracks: List<LocalAudioTrack>, currentIndex: Int, storage: LauncherStorage, onSelectTrack: (Int) -> Unit, onRefresh: () -> Unit, stateCond: UiStateCondition) {
              val preset = LocalCockpitPreset.current
              var query by remember { mutableStateOf("") }
              var onlyFavPlaylist by remember { mutableStateOf(false) }
              val favIds = storage.favoriteTrackIds
              val filtered = tracks.filter { (!onlyFavPlaylist || favIds.contains(it.id.toString())) && (it.title.contains(query, true) || it.artist.contains(query, true)) }
              val effectiveCond = if (stateCond == UiStateCondition.NORMAL && tracks.isEmpty()) UiStateCondition.EMPTY_DATA else stateCond
              UnifiedStateRenderer(condition = effectiveCond, emptyMessage = "لا توجد ملفات صوتية.", onRetryOrRequestPermission = onRefresh) {
                  Column(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp), verticalAlignment = Alignment.CenterVertically) {
                          FilterChip(selected = !onlyFavPlaylist, onClick = { onlyFavPlaylist = false }, label = { Text("الكل (${tracks.size})") })
                          FilterChip(selected = onlyFavPlaylist, onClick = { onlyFavPlaylist = true }, label = { Text("المفضلة (${favIds.size})") })
                          OutlinedTextField(value = query, onValueChange = { query = it }, placeholder = { Text("ابحث...") }, modifier = Modifier.weight(1f), singleLine = true)
                          Button(onClick = onRefresh) { Text("تحديث") }
                      }
                      LazyColumn(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                          items(filtered) { track ->
                              val idx = tracks.indexOf(track)
                              Surface(color = if (idx == currentIndex) preset.primary.copy(alpha = 0.28f) else DesignTokens.GlassSurface, shape = RoundedCornerShape(12.dp), border = BorderStroke(1.dp, if (idx == currentIndex) preset.primary else DesignTokens.GlassBorder), modifier = Modifier.fillMaxWidth().clickable { onSelectTrack(idx) }) {
                                  Row(Modifier.padding(12.dp), horizontalArrangement = Arrangement.SpaceBetween) {
                                      Text(track.title, color = DesignTokens.TextPrimary, fontWeight = FontWeight.Bold, maxLines = 1, modifier = Modifier.weight(1f))
                                      Text(track.artist, color = DesignTokens.TextSecondary, fontSize = 12.sp)
                                  }
                              }
                          }
                      }
                  }
              }
          }

          // شاشة الراديو الهجين الحقيقية (ربط تطبيق شريحة FM للشاشة + بث إذاعي حي يخرج صوتاً حقيقياً)
          @Composable
          fun RadioFmScreen(
              isStreamPlaying: Boolean,
              activeStreamTitle: String,
              onPlayStreamUrl: (String, String) -> Unit,
              onStopStream: () -> Unit,
              stateCond: UiStateCondition
          ) {
              val preset = LocalCockpitPreset.current
              val context = LocalContext.current
              var freq by remember { mutableDoubleStateOf(98.2) }
              var statusNote by remember { mutableStateOf(activeStreamTitle) }

              val liveStreams = listOf(
                  Triple(98.2, "إذاعة القرآن الكريم (بث مباشر)", "https://stream.radiojar.com/8s5u5tpdtwzuv"),
                  Triple(88.2, "تلاوات خاشعة على مدار الساعة", "https://backup.qurango.net/radio/mix"),
                  Triple(100.6, "إذاعة السنة والسيرة النبوية", "https://backup.qurango.net/radio/fiqh")
              )

              fun launchHardwareFmAppIfExists() {
                  val knownFmPackages = listOf(
                      "com.syu.radio", "com.ts.MainUI", "com.tw.radio",
                      "com.android.fmradio", "com.caf.fmradio", "com.sec.android.app.fm",
                      "com.miui.fm"
                  )
                  val pm = context.packageManager
                  val foundPkg = knownFmPackages.firstOrNull { pm.getLaunchIntentForPackage(it) != null }
                  if (foundPkg != null) {
                      pm.getLaunchIntentForPackage(foundPkg)?.let {
                          it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          runCatching { context.startActivity(it) }
                      }
                  } else {
                      statusNote = "هذه الشاشة لا تحتوي على حزمة FM هوائية مستقلة؛ يمكنك تشغيل البث الإذاعي الحي بالأسفل مباشرة."
                  }
              }

              UnifiedStateRenderer(condition = stateCond) {
                  Surface(color = DesignTokens.GlassSurface, border = BorderStroke(1.dp, DesignTokens.GlassBorder), shape = RoundedCornerShape(22.dp), modifier = Modifier.fillMaxSize()) {
                      Column(Modifier.fillMaxSize().padding(14.dp), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.SpaceBetween) {
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              Column {
                                  Text("راديو FM الهجين (Hardware Tuner + بث إذاعي حي)", style = MaterialTheme.typography.titleLarge, color = preset.primary)
                                  Text(statusNote, fontSize = 11.sp, color = DesignTokens.AmberGold)
                              }
                              OutlinedButton(onClick = { launchHardwareFmAppIfExists() }) {
                                  Text("فتح شريحة FM الداخلية للشاشة", fontSize = 11.sp, color = Color.White)
                              }
                          }

                          Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(20.dp)) {
                              Button(onClick = { freq = (freq - 0.2).coerceAtLeast(87.5) }) { Text("- 0.2") }
                              Text("${"%.1f".format(freq)} MHz", fontSize = 42.sp, fontWeight = FontWeight.Black, color = Color.White)
                              Button(onClick = { freq = (freq + 0.2).coerceAtMost(108.0) }, colors = ButtonDefaults.buttonColors(containerColor = DesignTokens.AmberGold)) {
                                  Text("+ 0.2", color = Color.Black, fontWeight = FontWeight.Bold)
                              }
                          }

                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp), verticalAlignment = Alignment.CenterVertically) {
                              liveStreams.forEach { (stationFreq, name, url) ->
                                  Button(
                                      onClick = {
                                          freq = stationFreq
                                          statusNote = "جاري تشغيل البث الحي: $name"
                                          onPlayStreamUrl(url, name)
                                      },
                                      colors = ButtonDefaults.buttonColors(containerColor = if (activeStreamTitle.contains(name)) DesignTokens.StatusSuccess else preset.cardElevated)
                                  ) {
                                      Text("▶ $name", fontSize = 11.sp, color = Color.White)
                                  }
                              }
                              if (isStreamPlaying) {
                                  OutlinedButton(onClick = { statusNote = "تم إيقاف البث الإذاعي"; onStopStream() }) {
                                      Text("إيقاف البث", color = DesignTokens.StatusDanger, fontSize = 11.sp)
                                  }
                              }
                          }
                      }
                  }
              }
          }

