          @Composable
          fun PanoramicSpeedometerWithRealisticCar(speed: Int, unitText: String, isOverSpeed: Boolean, modifier: Modifier = Modifier) {
              Box(modifier = modifier, contentAlignment = Alignment.Center) {
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      val w = size.width; val h = size.height
                      val radius = minOf(w * 0.45f, h * 0.62f)
                      val cx = w / 2f; val cy = h * 0.64f
                      val paint = android.graphics.Paint().apply { color = android.graphics.Color.WHITE; textSize = 48.dp.toPx(); textAlign = android.graphics.Paint.Align.CENTER; isAntiAlias = true; typeface = android.graphics.Typeface.DEFAULT_BOLD }
                      drawContext.canvas.nativeCanvas.drawText(speed.toString(), cx, cy - radius * 0.2f, paint)
                  }
              }
          }
