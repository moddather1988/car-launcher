                  val item = JSONObject().apply {
                      put("date", SimpleDateFormat("yyyy/MM/dd HH:mm", Locale.US).format(Date()))
                      put("dist", String.format(Locale.US, "%.2f", distanceKm))
                      put("dur", durationMin)
                      put("max", maxSpeed)
                      put("fuel", String.format(Locale.US, "%.2f", fuelLiters))
                  }
                  val updated = JSONArray()
                  updated.put(item)
                  for (i in 0 until minOf(arr.length(), 19)) {
                      updated.put(arr.getJSONObject(i))
                  }
                  prefs.edit().putString("trip_history_json", updated.toString()).apply()
              }

              fun getSavedTripRecords(): List<SavedTripRecord> {
                  val arr = runCatching { JSONArray(prefs.getString("trip_history_json", "[]")) }.getOrDefault(JSONArray())
                  val list = mutableListOf<SavedTripRecord>()
                  for (i in 0 until arr.length()) {
                      val o = arr.optJSONObject(i) ?: continue
                      list.add(SavedTripRecord(o.optString("date"), o.optString("dist"), o.optInt("dur"), o.optInt("max"), o.optString("fuel")))
                  }
                  return list
              }

              fun exportBackupJson(): String {
                  val payload = JSONObject().apply {
                      put("version", 8)
                      put("theme", themePreset.name)
                      put("wallpaper", wallpaperPreset.name)
                      put("car_brand", carBrandName)
                      put("driver_idx", activeDriverIndex)
                      put("vehicle_idx", activeVehicleIndex)
                      put("use_24h", use24HourFormat)
                      put("show_hijri", showHijriDate)
                      put("use_mph", useMphUnit)
                      put("speed_limit", speedAlertLimit)
                      put("tasbeeh_count", tasbeehCount)
                      put("odometer_km", totalOdometerKm.toDouble())
                  }
                  val checksum = payload.toString().hashCode().toString(16)
                  return JSONObject().apply {
                      put("checksum", checksum)
                      put("payload", payload)
                  }.toString(2)
              }

              fun importBackupJson(jsonStr: String): Boolean {
                  return runCatching {
                      val root = JSONObject(jsonStr)
                      val obj = if (root.has("payload")) {
                          val p = root.getJSONObject("payload")
                          val expectedHash = root.optString("checksum", "")
                          if (expectedHash.isNotBlank() && p.toString().hashCode().toString(16) != expectedHash) {
                              return false
                          }
                          p
                      } else root

                      if (obj.has("theme")) themePreset = CockpitThemePreset.valueOf(obj.getString("theme"))
                      if (obj.has("wallpaper")) wallpaperPreset = ScenicWallpaperPreset.valueOf(obj.getString("wallpaper"))
                      if (obj.has("car_brand")) carBrandName = obj.getString("car_brand")
                      if (obj.has("driver_idx")) activeDriverIndex = obj.getInt("driver_idx")
                      if (obj.has("vehicle_idx")) activeVehicleIndex = obj.getInt("vehicle_idx")
                      if (obj.has("use_24h")) use24HourFormat = obj.getBoolean("use_24h")
                      if (obj.has("show_hijri")) showHijriDate = obj.getBoolean("show_hijri")
                      if (obj.has("use_mph")) useMphUnit = obj.getBoolean("use_mph")
                      if (obj.has("speed_limit")) speedAlertLimit = obj.getInt("speed_limit")
                      if (obj.has("tasbeeh_count")) tasbeehCount = obj.getInt("tasbeeh_count")
                      if (obj.has("odometer_km")) totalOdometerKm = obj.getDouble("odometer_km").toFloat()
                      true
                  }.getOrDefault(false)
              }

              fun resetAllToDefaults() = prefs.edit().clear().apply()
          }
