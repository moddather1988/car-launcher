          @Composable
          fun AppsGridScreen(onlyFavorites: Boolean, storage: LauncherStorage, stateCond: UiStateCondition) {
              val context = LocalContext.current
              var query by remember { mutableStateOf("") }
              var favs by remember { mutableStateOf(storage.favoritePackages) }
              var hidden by remember { mutableStateOf(storage.hiddenPackages) }
              var recents by remember { mutableStateOf(storage.recentPackages) }
              var selectedCategory by remember { mutableStateOf(if (onlyFavorites) "FAV" else "ALL") }

              val allApps = remember {
                  val pm = context.packageManager
                  val intent = Intent(Intent.ACTION_MAIN, null).apply { addCategory(Intent.CATEGORY_LAUNCHER) }
                  pm.queryIntentActivities(intent, 0).filter { it.activityInfo.packageName != context.packageName }.map { it.loadLabel(pm).toString() to it.activityInfo.packageName }.sortedBy { it.first }
              }
              val displayed = allApps.filter { (label, pkg) ->
                  val matchesQuery = label.contains(query, true)
                  val matchesCat = when (selectedCategory) {
                      "FAV" -> favs.contains(pkg)
                      "RECENT" -> recents.contains(pkg)
                      "HIDDEN" -> hidden.contains(pkg)
                      else -> !hidden.contains(pkg)
                  }
                  matchesQuery && matchesCat
              }
              val effectiveCond = if (stateCond == UiStateCondition.NORMAL && displayed.isEmpty()) UiStateCondition.EMPTY_DATA else stateCond

              UnifiedStateRenderer(condition = effectiveCond) {
                  Column(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                      LazyRow(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          val cats = listOf("ALL" to "الكل", "FAV" to "المفضلة (${favs.size})", "RECENT" to "الأخيرة (${recents.size})", "HIDDEN" to "المخفية (${hidden.size})")
                          items(cats) { (code, name) -> FilterChip(selected = selectedCategory == code, onClick = { selectedCategory = code }, label = { Text(name, fontSize = 11.sp) }) }
                      }
                      OutlinedTextField(value = query, onValueChange = { query = it }, placeholder = { Text("ابحث في التطبيقات...") }, modifier = Modifier.fillMaxWidth(), singleLine = true)
                      LazyVerticalGrid(columns = GridCells.Adaptive(150.dp), verticalArrangement = Arrangement.spacedBy(8.dp), horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.weight(1f)) {
                          items(displayed) { (label, pkg) ->
                              val isFav = favs.contains(pkg)
                              val isHid = hidden.contains(pkg)
                              Surface(
                                  color = DesignTokens.GlassSurface, shape = RoundedCornerShape(14.dp), border = BorderStroke(1.dp, if (isFav) DesignTokens.AmberGold else DesignTokens.GlassBorder),
                                  modifier = Modifier.pointerInput(pkg) {
                                      detectTapGestures(
                                          onTap = { storage.recordAppLaunch(pkg); recents = storage.recentPackages; context.packageManager.getLaunchIntentForPackage(pkg)?.let { it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); runCatching { context.startActivity(it) } } },
                                          onLongPress = { favs = storage.toggleFavoriteApp(pkg) }
                                      )
                                  }
                              ) {
                                  Row(Modifier.padding(10.dp).fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                      Text(label, color = DesignTokens.TextPrimary, maxLines = 1, modifier = Modifier.weight(1f))
                                      IconButton(onClick = { hidden = storage.toggleHiddenApp(pkg) }, modifier = Modifier.size(22.dp)) {
                                          Icon(if (isHid) Icons.Outlined.Visibility else Icons.Outlined.VisibilityOff, null, tint = DesignTokens.TextMuted, modifier = Modifier.size(15.dp))
                                      }
                                      IconButton(onClick = { favs = storage.toggleFavoriteApp(pkg) }, modifier = Modifier.size(24.dp)) {
                                          Icon(if (isFav) Icons.Default.Star else Icons.Default.StarBorder, null, tint = if (isFav) DesignTokens.AmberGold else DesignTokens.TextMuted, modifier = Modifier.size(18.dp))
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          // شاشة السيارة الحقيقية (قراءة فولت وحرارة النظام الفعلية + فحص Bluetooth SPP ELM327 الحقيقي)
          @Composable
          fun VehicleInfoScreen(
              telemetry: LiveDrivingTelemetry,
              hardware: HardwareDiagnosticReport,
              hardwareService: VehicleHardwareService,
              storage: LauncherStorage,
              onOpenMaintenance: () -> Unit,
              stateCond: UiStateCondition
          ) {
              val scope = rememberCoroutineScope()
              val vProfile = storage.getActiveVehicle()
              var obdResult by remember { mutableStateOf<ObdLiveScanResult?>(null) }
              var isScanningObd by remember { mutableStateOf(false) }

              val itemsList = listOf(
                  Triple("ملف السيارة: ${vProfile.brand} - ${vProfile.modelAr}", "استهلاك الوقود: ${vProfile.fuelLitersPer100Km} لتر/100كم • الزيت بعد ${telemetry.oilRemainingKm} كم", "ACTIVE"),
                  Triple("الجهد الكهربائي الفعلي وحرارة النظام (Live Battery Telemetry)", "الفولت: ${hardware.batteryVoltageVolts} V • الحرارة: ${hardware.batteryTempCelsius}°C • الشحن: ${hardware.batteryLevelPercent}%", "LIVE SENSOR"),
                  Triple("سرعة السيارة والبوصلة المغناطيسية", "السرعة: ${telemetry.speedKmh ?: 0} كم/س • الاتجاه المغناطيسي: ${telemetry.magneticAzimuthDeg}°", "LIVE SENSOR"),
                  Triple(
                      "كمبيوتر السيارة OBD-II (بروتوكول Bluetooth SPP ELM327)",
                      obdResult?.let { "الجهاز: ${it.connectedDeviceName ?: "غير مقترن"} • RPM: ${it.rpm} • الحرارة: ${it.coolantTempC} (${it.statusMessageAr})" } ?: "اضغط زر «فحص واتصال OBD2 الحقيقي» بالأعلى للاتصال بأي قطعة ELM327 مقترنة",
                      if (obdResult?.connectedDeviceName != null) "CONNECTED" else "SPP READY"
                  )
              )
              UnifiedStateRenderer(condition = stateCond) {
                  Column(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          Button(
                              onClick = {
                                  isScanningObd = true
                                  scope.launch {
                                      obdResult = hardwareService.queryRealObd2Adapter()
                                      isScanningObd = false
                                  }
                              },
                              colors = ButtonDefaults.buttonColors(containerColor = DesignTokens.StatusSuccess),
                              modifier = Modifier.weight(1f)
                          ) {
                              Text(if (isScanningObd) "جاري الاتصال بـ ELM327..." else "فحص واتصال OBD2 الحقيقي (SPP)", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 12.sp)
                          }
                          Button(onClick = onOpenMaintenance, colors = ButtonDefaults.buttonColors(containerColor = DesignTokens.AmberGold), modifier = Modifier.weight(1f)) {
                              Text("جدول مواعيد الصيانة الدورية", color = Color.Black, fontWeight = FontWeight.Bold, fontSize = 12.sp)
                          }
                      }
                      LazyColumn(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          items(itemsList) { (title, value, status) ->
                              Surface(color = DesignTokens.GlassSurface, shape = RoundedCornerShape(14.dp), border = BorderStroke(1.dp, DesignTokens.GlassBorder), modifier = Modifier.fillMaxWidth()) {
                                  Row(Modifier.padding(12.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                      Column(Modifier.weight(1f)) { Text(title, color = DesignTokens.TextPrimary, fontWeight = FontWeight.Bold, fontSize = 13.sp); Text(value, color = DesignTokens.TextSecondary, fontSize = 11.sp) }
                                      Text(status, color = DesignTokens.StatusSuccess, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                  }
                              }
                          }
                      }
                  }
              }
          }

