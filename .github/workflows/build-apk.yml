                              val locNote = if (telemetry.speedKmh != null) "موقعك الحالي · صافٍ (±${telemetry.accuracyMeters ?: 5}م)" else "موقعك الحالي · صافٍ"
                              Text(locNote, fontSize = 12.sp, color = DesignTokens.TextPrimary, fontWeight = FontWeight.SemiBold)
                              Box(Modifier.width(1.dp).height(16.dp).background(preset.border))
                              Text("25°", fontSize = 14.sp, fontWeight = FontWeight.Bold, color = DesignTokens.TextPrimary)
                              Icon(Icons.Default.NightsStay, null, tint = Color(0xFFFACC15), modifier = Modifier.size(18.dp))
                          }
                      }

                      // اليسار: الـ 4 أزرار المربعة مع الإطار المضيء الأخضر/السيان حول أيقونة الموقع كما في الصورة المرجعية
                      Row(horizontalArrangement = Arrangement.spacedBy(6.dp), verticalAlignment = Alignment.CenterVertically) {
                          TopSquareIconButton(
                              icon = Icons.Default.LocationOn,
                              isHighlightedFocus = true,
                              isActiveState = telemetry.speedKmh != null || hardware.isGpsEnabled,
                              onClick = onRequestGpsPermission
                          )
                          TopSquareIconButton(
                              icon = Icons.Default.Bluetooth,
                              isHighlightedFocus = false,
                              isActiveState = hardware.isBluetoothEnabled,
                              onClick = { runCatching { context.startActivity(Intent(Settings.ACTION_BLUETOOTH_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) } }
                          )
