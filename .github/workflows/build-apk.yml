          cat << 'EOF' > "$BASE/ui/navigation/CockpitNavigationShell.kt"
          package com.universal.carlauncher.ui.navigation
          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.outlined.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.universal.carlauncher.core.designsystem.DesignTokens
          import com.universal.carlauncher.core.designsystem.LocalCockpitPreset
          import com.universal.carlauncher.core.designsystem.ScenicWallpaperPreset
          import com.universal.carlauncher.core.storage.LauncherStorage

          enum class AppRoute(val titleAr: String, val icon: ImageVector) {
              DASHBOARD("الرئيسية", Icons.Outlined.Speed),
              DOCK_CUSTOMIZATION("تخصيص الشريط", Icons.Outlined.ViewStream),
              NAVIGATION("الخرائط", Icons.Outlined.LocationOn),
              MUSIC_PLAYER("الموسيقى", Icons.Outlined.MusicNote),
              SONG_LIST("المكتبة", Icons.Outlined.QueueMusic),
              RADIO("الراديو", Icons.Outlined.Sensors),
              PHONE_DIALPAD("الهاتف", Icons.Outlined.Call),
              APPS_INSTALLED("التطبيقات", Icons.Outlined.GridView),
              SPEEDOMETER_FULL("عداد السرعة", Icons.Outlined.Speed),
              HUD_PROJECTOR("بروجكتور HUD", Icons.Outlined.FlipToFront),
              VEHICLE_INFO("السيارة", Icons.Outlined.DirectionsCar),
              MAINTENANCE_MANAGER("الصيانة", Icons.Outlined.Build),
              TRIP_DATA("الرحلة", Icons.Outlined.Route),
              ISLAMIC_HUB("الاسلامي", Icons.Outlined.Mosque),
              SETTINGS_MAIN("الإعدادات", Icons.Outlined.Settings)
          }

          @Composable
          fun CockpitNavigationShell(currentRoute: AppRoute, wallpaperPreset: ScenicWallpaperPreset, customWallpaperUri: String?, useSideRail: Boolean, storage: LauncherStorage, onNavigate: (AppRoute) -> Unit, onBack: () -> Unit, content: @Composable BoxScope.() -> Unit) {
              val preset = LocalCockpitPreset.current
              val bottomTabs = storage.customDockRoutes.mapNotNull { runCatching { AppRoute.valueOf(it) }.getOrNull() }.ifEmpty {
                  listOf(AppRoute.NAVIGATION, AppRoute.PHONE_DIALPAD, AppRoute.APPS_INSTALLED, AppRoute.MUSIC_PLAYER, AppRoute.RADIO)
              }

