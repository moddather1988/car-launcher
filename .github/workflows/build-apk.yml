              installedAppsMap: Map<String, InstalledAndroidApp>,
              dockIconScale: Float,
              wallpaperPreset: ScenicWallpaperPreset,
              customWallpaperUri: String?,
              useSideRail: Boolean,
              onNavigate: (AppRoute) -> Unit,
              onLaunchVoice: () -> Unit,
              onBack: () -> Unit,
              content: @Composable BoxScope.() -> Unit
          ) {
              val preset = LocalCockpitPreset.current
              val context = LocalContext.current
              val siblingRoutes = AppRoute.entries.filter { it.category == currentRoute.category && it != AppRoute.DASHBOARD }

              fun executeDockItemClick(item: DockItemConfig) {
                  when (item.type) {
                      DockActionType.INTERNAL_ROUTE -> {
                          val route = runCatching { AppRoute.valueOf(item.target) }.getOrNull()
                          if (route != null) {
                              if (currentRoute == route && route != AppRoute.DASHBOARD) onNavigate(AppRoute.DASHBOARD)
                              else onNavigate(route)
                          }
                      }
                      DockActionType.EXTERNAL_APP -> {
                          val launchIntent = context.packageManager.getLaunchIntentForPackage(item.target)
                          if (launchIntent != null) {
                              launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              runCatching { context.startActivity(launchIntent) }
                              InAppDiagnosticsLogger.log("DOCK_EXEC", "Launched external app: ${item.target}")
                          } else {
                              Toast.makeText(context, "التطبيق (${item.labelAr}) غير مثبت حالياً، اضغط مطولاً لتعديله", Toast.LENGTH_SHORT).show()
                          }
                      }
                      DockActionType.SYSTEM_ACTION -> {
                          when (item.target) {
                              "BLUETOOTH_SETTINGS" -> runCatching { context.startActivity(Intent(Settings.ACTION_BLUETOOTH_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) }
                              "WIFI_SETTINGS" -> runCatching { context.startActivity(Intent(Settings.ACTION_WIFI_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) }
                              "VOICE_COMMAND" -> onLaunchVoice()
                          }
                      }
                  }
              }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color(0xFF030B10))
                      .padding(6.dp)
                      .clip(RoundedCornerShape(24.dp))
                      .border(1.2.dp, DesignTokens.GlassBorder, RoundedCornerShape(24.dp))
              ) {
                  ScenicPanoramicWallpaperCanvas(wallpaper = wallpaperPreset, customUri = customWallpaperUri)

                  Row(modifier = Modifier.fillMaxSize()) {
                      if (useSideRail) {
                          Surface(
                              color = DesignTokens.GlassSurface,
                              border = BorderStroke(1.dp, DesignTokens.GlassBorder),
                              modifier = Modifier.width(86.dp).fillMaxHeight().padding(6.dp),
                              shape = RoundedCornerShape(22.dp)
                          ) {
                              LazyColumn(
                                  modifier = Modifier.fillMaxSize().padding(vertical = 8.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally,
                                  verticalArrangement = Arrangement.SpaceEvenly
                              ) {
                                  items(dockItems) { item ->
                                      val isSelected = item.type == DockActionType.INTERNAL_ROUTE && item.target == currentRoute.name
                                      DockSlotView(
                                          item = item,
                                          isSelected = isSelected,
                                          installedApp = installedAppsMap[item.target],
                                          iconScale = dockIconScale,
                                          modifier = Modifier.padding(6.dp),
                                          onClick = { executeDockItemClick(item) },
                                          onLongPress = { onNavigate(AppRoute.DOCK_CUSTOMIZATION) }
                                      )
                                  }
                              }
                          }
                      }

                      Column(
                          modifier = Modifier.weight(1f).fillMaxHeight().padding(horizontal = 12.dp, vertical = 8.dp),
                          verticalArrangement = Arrangement.spacedBy(6.dp)
                      ) {
                          if (currentRoute != AppRoute.DASHBOARD) {
                              Surface(
                                  color = DesignTokens.GlassSurface,
                                  shape = RoundedCornerShape(DesignTokens.RadiusM),
                                  border = BorderStroke(1.dp, DesignTokens.GlassBorder),
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Row(
                                      modifier = Modifier.fillMaxWidth().padding(horizontal = 10.dp, vertical = 5.dp),
                                      horizontalArrangement = Arrangement.SpaceBetween,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                          OutlinedButton(
                                              onClick = onBack,
                                              contentPadding = PaddingValues(horizontal = 10.dp, vertical = 2.dp),
                                              modifier = Modifier.height(32.dp)
                                          ) {
                                              Icon(Icons.Outlined.ArrowForward, null, tint = preset.primary, modifier = Modifier.size(15.dp))
                                              Spacer(Modifier.width(4.dp))
                                              Text("رجوع", fontSize = 11.sp, color = DesignTokens.TextPrimary)
                                          }
                                          Text(currentRoute.titleAr, style = MaterialTheme.typography.titleMedium, color = preset.primary)
                                      }

                                      LazyRow(modifier = Modifier.weight(1f).padding(horizontal = 10.dp), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                          items(siblingRoutes) { subRoute ->
                                              val active = subRoute == currentRoute
                                              Surface(
                                                  color = if (active) DesignTokens.AmberGold else DesignTokens.GlassSurface,
                                                  border = BorderStroke(1.dp, if (active) DesignTokens.AmberGold else DesignTokens.GlassBorder),
                                                  shape = RoundedCornerShape(50),
                                                  modifier = Modifier.clickable { onNavigate(subRoute) }
                                              ) {
                                                  Text(
                                                      subRoute.titleAr,
                                                      fontSize = 11.sp,
                                                      fontWeight = FontWeight.Bold,
                                                      color = if (active) Color.Black else DesignTokens.TextPrimary,
                                                      modifier = Modifier.padding(horizontal = 12.dp, vertical = 4.dp)
                                                  )
                                              }
                                          }
                                      }

                                      Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                          OutlinedButton(
                                              onClick = { onNavigate(AppRoute.DOCK_CUSTOMIZATION) },
                                              contentPadding = PaddingValues(horizontal = 10.dp, vertical = 2.dp),
                                              modifier = Modifier.height(32.dp)
                                          ) {
                                              Icon(Icons.Outlined.ViewStream, null, tint = DesignTokens.AmberGold, modifier = Modifier.size(15.dp))
                                              Spacer(Modifier.width(4.dp))
                                              Text("تخصيص الشريط", fontSize = 11.sp, color = DesignTokens.AmberGold)
                                          }
                                          Button(
                                              onClick = { onNavigate(AppRoute.DASHBOARD) },
                                              colors = ButtonDefaults.buttonColors(containerColor = preset.primary),
                                              contentPadding = PaddingValues(horizontal = 12.dp, vertical = 2.dp),
                                              modifier = Modifier.height(32.dp)
                                          ) {
                                              Icon(Icons.Outlined.Home, null, tint = Color.Black, modifier = Modifier.size(15.dp))
                                              Spacer(Modifier.width(4.dp))
                                              Text("الرئيسية", color = Color.Black, fontWeight = FontWeight.Bold, fontSize = 11.sp)
                                          }
                                      }
                                  }
                              }
                          }

                          Box(modifier = Modifier.weight(1f).fillMaxWidth(), content = content)

                          if (!useSideRail) {
                              Surface(
                                  color = DesignTokens.GlassSurface,
                                  shape = RoundedCornerShape(28.dp),
                                  border = BorderStroke(1.1.dp, DesignTokens.GlassBorder),
                                  modifier = Modifier.fillMaxWidth().height(58.dp)
                              ) {
                                  Row(modifier = Modifier.fillMaxSize(), verticalAlignment = Alignment.CenterVertically) {
                                      dockItems.forEachIndexed { idx, item ->
                                          val isSelected = item.type == DockActionType.INTERNAL_ROUTE && item.target == currentRoute.name
                                          Box(
                                              modifier = Modifier.weight(1f).fillMaxHeight(),
                                              contentAlignment = Alignment.Center
                                          ) {
                                              DockSlotView(
                                                  item = item,
                                                  isSelected = isSelected,
                                                  installedApp = installedAppsMap[item.target],
                                                  iconScale = dockIconScale,
                                                  modifier = Modifier.fillMaxSize(),
                                                  onClick = { executeDockItemClick(item) },
                                                  onLongPress = { onNavigate(AppRoute.DOCK_CUSTOMIZATION) }
                                              )
                                          }
                                          if (idx < dockItems.lastIndex) {
                                              Box(
                                                  modifier = Modifier
                                                      .width(1.dp)
                                                      .fillMaxHeight(0.52f)
                                                      .background(DesignTokens.GlassBorder.copy(alpha = 0.45f))
                                              )
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun DockSlotView(
              item: DockItemConfig,
              isSelected: Boolean,
              installedApp: InstalledAndroidApp?,
              iconScale: Float,
              modifier: Modifier = Modifier,
              onClick: () -> Unit,
              onLongPress: () -> Unit
          ) {
              val preset = LocalCockpitPreset.current
              val context = LocalContext.current
              val iconSizeDp = (22f * iconScale).dp

              Box(
                  modifier = modifier.pointerInput(item.id, item.target) {
                      detectTapGestures(onTap = { onClick() }, onLongPress = { onLongPress() })
                  },
                  contentAlignment = Alignment.Center
              ) {
                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                      when (item.type) {
                          DockActionType.INTERNAL_ROUTE -> {
                              val route = runCatching { AppRoute.valueOf(item.target) }.getOrNull()
                              if (route == AppRoute.RADIO) {
                                  RadioWavesOutlinedIcon(tint = if (isSelected) preset.primary else Color.White, sizeDp = iconSizeDp)
                              } else {
                                  Icon(
                                      imageVector = route?.icon ?: Icons.Outlined.Apps,
                                      contentDescription = item.labelAr,
                                      tint = if (isSelected) preset.primary else Color.White,
                                      modifier = Modifier.size(iconSizeDp)
                                  )
                              }
                          }
                          DockActionType.EXTERNAL_APP -> {
                              val isInstalled = installedApp != null || DockSerializer.isAppInstalled(context, item.target)
                              if (installedApp?.iconBitmap != null) {
                                  Image(bitmap = installedApp.iconBitmap, contentDescription = item.labelAr, modifier = Modifier.size(iconSizeDp).clip(RoundedCornerShape(6.dp)))
                              } else {
                                  Icon(
                                      imageVector = if (isInstalled) Icons.Outlined.Android else Icons.Outlined.ErrorOutline,
                                      contentDescription = item.labelAr,
                                      tint = if (isInstalled) DesignTokens.AmberGold else DesignTokens.StatusDanger,
                                      modifier = Modifier.size(iconSizeDp)
                                  )
                              }
                          }
                          DockActionType.SYSTEM_ACTION -> {
                              val sysIcon = when (item.target) {
                                  "BLUETOOTH_SETTINGS" -> Icons.Outlined.Bluetooth
                                  "WIFI_SETTINGS" -> Icons.Outlined.Wifi
                                  else -> Icons.Outlined.Mic
                              }
                              Icon(sysIcon, item.labelAr, tint = DesignTokens.AmberGold, modifier = Modifier.size(iconSizeDp))
                          }
                      }
                      Spacer(Modifier.height(2.dp))
                      Text(text = item.labelAr, fontSize = 11.5.sp, fontWeight = FontWeight.Bold, color = if (isSelected) preset.primary else Color.White, maxLines = 1)
                  }
              }
          }

          @Composable
          private fun RadioWavesOutlinedIcon(tint: Color, sizeDp: androidx.compose.ui.unit.Dp = 22.dp) {
              Canvas(modifier = Modifier.size(sizeDp)) {
                  val cx = size.width / 2f; val cy = size.height / 2f
                  drawCircle(color = tint, radius = 2.5.dp.toPx(), center = Offset(cx, cy))
                  val stroke = Stroke(width = 1.7.dp.toPx(), cap = StrokeCap.Round)
                  drawArc(color = tint, startAngle = -45f, sweepAngle = 90f, useCenter = false, topLeft = Offset(cx - 6.dp.toPx(), cy - 6.dp.toPx()), size = androidx.compose.ui.geometry.Size(12.dp.toPx(), 12.dp.toPx()), style = stroke)
                  drawArc(color = tint, startAngle = 135f, sweepAngle = 90f, useCenter = false, topLeft = Offset(cx - 6.dp.toPx(), cy - 6.dp.toPx()), size = androidx.compose.ui.geometry.Size(12.dp.toPx(), 12.dp.toPx()), style = stroke)
                  drawArc(color = tint, startAngle = -45f, sweepAngle = 90f, useCenter = false, topLeft = Offset(cx - 10.dp.toPx(), cy - 10.dp.toPx()), size = androidx.compose.ui.geometry.Size(20.dp.toPx(), 20.dp.toPx()), style = stroke)
                  drawArc(color = tint, startAngle = 135f, sweepAngle = 90f, useCenter = false, topLeft = Offset(cx - 10.dp.toPx(), cy - 10.dp.toPx()), size = androidx.compose.ui.geometry.Size(20.dp.toPx(), 20.dp.toPx()), style = stroke)
              }
          }

          @Composable
          private fun ScenicPanoramicWallpaperCanvas(wallpaper: ScenicWallpaperPreset, customUri: String?) {
              val context = LocalContext.current
              val customBitmap = remember(customUri) {
                  if (customUri.isNullOrBlank()) null
                  else runCatching { context.contentResolver.openInputStream(Uri.parse(customUri))?.use { BitmapFactory.decodeStream(it)?.asImageBitmap() } }.getOrNull()
              }

              if (customBitmap != null) {
                  Image(bitmap = customBitmap, contentDescription = null, contentScale = ContentScale.Crop, modifier = Modifier.fillMaxSize())
                  Box(Modifier.fillMaxSize().background(Color(0xFF04141E).copy(alpha = 0.42f)))
              } else {
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      val w = size.width; val h = size.height
                      drawRect(brush = Brush.verticalGradient(listOf(wallpaper.skyTop, wallpaper.skyHorizon, wallpaper.lakeWater, wallpaper.roadSurface)))
                      val farMountains = Path().apply {
                          moveTo(0f, h * 0.42f); lineTo(w * 0.08f, h * 0.14f); lineTo(w * 0.19f, h * 0.30f); lineTo(w * 0.31f, h * 0.18f)
                          lineTo(w * 0.46f, h * 0.38f); lineTo(w * 0.62f, h * 0.22f); lineTo(w * 0.78f, h * 0.10f); lineTo(w * 0.92f, h * 0.26f)
                          lineTo(w, h * 0.16f); lineTo(w, h * 0.46f); lineTo(0f, h * 0.46f); close()
                      }
                      drawPath(path = farMountains, brush = Brush.verticalGradient(listOf(Color.White.copy(alpha = 0.32f), wallpaper.mountainFar)))
                      val nearLeftMountain = Path().apply { moveTo(0f, h * 0.48f); lineTo(w * 0.14f, h * 0.22f); lineTo(w * 0.36f, h * 0.43f); lineTo(0f, h * 0.48f); close() }
                      drawPath(nearLeftMountain, color = wallpaper.mountainNear.copy(alpha = 0.88f))
                      val nearRightMountain = Path().apply { moveTo(w * 0.60f, h * 0.43f); lineTo(w * 0.84f, h * 0.19f); lineTo(w, h * 0.36f); lineTo(w, h * 0.48f); close() }
                      drawPath(nearRightMountain, color = wallpaper.mountainNear.copy(alpha = 0.88f))
                      drawRect(brush = Brush.verticalGradient(listOf(wallpaper.lakeWater.copy(alpha = 0.65f), wallpaper.roadSurface.copy(alpha = 0.90f))), topLeft = Offset(0f, h * 0.43f), size = androidx.compose.ui.geometry.Size(w, h * 0.15f))

                      val vanishX = w * 0.50f; val vanishY = h * 0.36f
                      val roadPolygon = Path().apply { moveTo(vanishX - w * 0.05f, vanishY); lineTo(vanishX + w * 0.05f, vanishY); lineTo(w * 0.86f, h); lineTo(w * 0.14f, h); close() }
                      drawPath(path = roadPolygon, brush = Brush.verticalGradient(listOf(Color(0xFF1A3A4B), Color(0xFF0E2330), Color(0xFF07131B))))
                      drawLine(color = wallpaper.roadGlow.copy(alpha = 0.55f), start = Offset(vanishX - w * 0.045f, vanishY), end = Offset(w * 0.18f, h), strokeWidth = 2.2.dp.toPx())
                      drawLine(color = wallpaper.roadGlow.copy(alpha = 0.55f), start = Offset(vanishX + w * 0.045f, vanishY), end = Offset(w * 0.82f, h), strokeWidth = 2.2.dp.toPx())
                      val centerStripe = Path().apply { moveTo(vanishX - 1.5.dp.toPx(), vanishY + h * 0.06f); lineTo(vanishX + 1.5.dp.toPx(), vanishY + h * 0.06f); lineTo(vanishX + 9.dp.toPx(), h); lineTo(vanishX - 9.dp.toPx(), h); close() }
                      drawPath(centerStripe, color = Color.White.copy(alpha = 0.28f))
                  }
              }
          }
          EOF

          cat << 'EOF' > "$BASE/ui/screens/DashboardScreen.kt"
