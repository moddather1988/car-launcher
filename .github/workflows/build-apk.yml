          @Composable
          fun SettingsAndSystemScreens(
              route: AppRoute, storage: LauncherStorage, hardware: HardwareDiagnosticReport,
              currentPreset: CockpitThemePreset, currentWallpaper: ScenicWallpaperPreset,
              lastSwcKeyInfo: String, lastVoiceText: String,
              onPresetChange: (CockpitThemePreset) -> Unit, onWallpaperChange: (ScenicWallpaperPreset) -> Unit,
              onPickGalleryWallpaper: () -> Unit, onLaunchVoice: () -> Unit,
              onSettingsUpdated: () -> Unit, onNavigate: (AppRoute) -> Unit, stateCond: UiStateCondition
          ) {
              val preset = LocalCockpitPreset.current
              UnifiedStateRenderer(condition = stateCond) {
                  when (route) {
                      AppRoute.SETTINGS_MAIN -> {
                          val subPages = listOf(
                              AppRoute.DOCK_CUSTOMIZATION, AppRoute.DRIVER_VEHICLE_PROFILES, AppRoute.AUTOMATION_RULES,
                              AppRoute.THEME_SELECTOR, AppRoute.UI_CUSTOMIZATION, AppRoute.SETTINGS_SUBPAGES,
                              AppRoute.SWC_VOICE_CONTROL, AppRoute.BACKUP_DIAGNOSTICS, AppRoute.PLUGINS_HUB
                          )
                          LazyVerticalGrid(columns = GridCells.Fixed(3), verticalArrangement = Arrangement.spacedBy(8.dp), horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxSize()) {
                              items(subPages) { page ->
                                  val isDockCard = page == AppRoute.DOCK_CUSTOMIZATION
                                  Surface(
                                      color = if (isDockCard) DesignTokens.AmberGold.copy(alpha = 0.22f) else DesignTokens.GlassSurface,
                                      shape = RoundedCornerShape(16.dp),
                                      border = BorderStroke(if (isDockCard) 1.8.dp else 1.dp, if (isDockCard) DesignTokens.AmberGold else DesignTokens.GlassBorder),
                                      modifier = Modifier.height(68.dp).clickable { onNavigate(page) }
                                  ) {
                                      Row(Modifier.fillMaxSize().padding(horizontal = 10.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                          Icon(page.icon, null, tint = if (isDockCard) DesignTokens.AmberGold else preset.primary, modifier = Modifier.size(22.dp))
                                          Text(page.titleAr, color = DesignTokens.TextPrimary, fontWeight = FontWeight.Bold, fontSize = 11.5.sp)
                                      }
                                  }
                              }
                          }
                      }
                      AppRoute.THEME_SELECTOR -> {
                          var brand by remember { mutableStateOf(storage.carBrandName) }
                          LazyColumn(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              item {
                                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                      Text("الخلفية البانورامية أو المعرض:", color = preset.primary, fontWeight = FontWeight.Bold)
                                      Button(onClick = onPickGalleryWallpaper, colors = ButtonDefaults.buttonColors(containerColor = DesignTokens.AmberGold)) { Text("صورة من المعرض", color = Color.Black, fontWeight = FontWeight.Bold, fontSize = 12.sp) }
                                  }
                                  LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                      items(ScenicWallpaperPreset.entries) { wp -> FilterChip(selected = currentWallpaper == wp && storage.customWallpaperUri == null, onClick = { storage.customWallpaperUri = null; storage.wallpaperPreset = wp; onWallpaperChange(wp) }, label = { Text(wp.titleAr, fontSize = 11.sp) }) }
                                  }
                              }
                              item {
                                  Text("الثيم اللوني:", color = preset.primary, fontWeight = FontWeight.Bold)
                                  LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                      items(CockpitThemePreset.entries) { p -> FilterChip(selected = currentPreset == p, onClick = { storage.themePreset = p; onPresetChange(p) }, label = { Text(p.titleAr, fontSize = 11.sp) }) }
                                  }
                              }
                              item {
                                  Text("شعار السيارة في الشريط العلوي:", color = preset.primary, fontWeight = FontWeight.Bold)
                                  LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                      items(storage.availableBrands) { b -> FilterChip(selected = brand == b, onClick = { brand = b; storage.carBrandName = b; onSettingsUpdated() }, label = { Text(b) }) }
                                  }
                              }
                          }
                      }
                      AppRoute.UI_CUSTOMIZATION -> {
                          var showPrayer by remember { mutableStateOf(storage.showPrayerPanel) }
                          var showTrip by remember { mutableStateOf(storage.showTripPanel) }
                          var showMusic by remember { mutableStateOf(storage.showMusicDock) }
                          var sideRail by remember { mutableStateOf(storage.useSideNavigationRail) }
                          LazyColumn(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                              item {
                                  Button(onClick = { onNavigate(AppRoute.DOCK_CUSTOMIZATION) }, colors = ButtonDefaults.buttonColors(containerColor = DesignTokens.AmberGold), modifier = Modifier.fillMaxWidth()) {
                                      Text("فتح محرر الشريط السفلي المخصص (Dock Customization)", color = Color.Black, fontWeight = FontWeight.Bold)
                                  }
                              }
                              item { ToggleRowItem("إظهار عمود أوقات الصلاة في الرئيسية", showPrayer) { showPrayer = it; storage.showPrayerPanel = it; onSettingsUpdated() } }
                              item { ToggleRowItem("إظهار عمود الساعة وملخص الرحلة في الرئيسية", showTrip) { showTrip = it; storage.showTripPanel = it; onSettingsUpdated() } }
                              item { ToggleRowItem("إظهار شريط المشغل الصوتي الزجاجي في الرئيسية", showMusic) { showMusic = it; storage.showMusicDock = it; onSettingsUpdated() } }
                              item { ToggleRowItem("تحويل شريط التنقل إلى جانبي (Side Rail)", sideRail) { sideRail = it; storage.useSideNavigationRail = it; onSettingsUpdated() } }
                          }
                      }
                      else -> {
                          Surface(color = DesignTokens.GlassSurface, border = BorderStroke(1.dp, DesignTokens.GlassBorder), shape = RoundedCornerShape(22.dp), modifier = Modifier.fillMaxSize()) {
                              Column(Modifier.padding(18.dp), verticalArrangement = Arrangement.SpaceEvenly) {
                                  Text("CAR LAUNCHER UNIVERSAL v10.3 — Real Music & Dock Edition", style = MaterialTheme.typography.headlineMedium, color = preset.primary)
                                  Text("مشغل الموسيقى الحقيقي (MediaStore + Album Art + MediaSession + AudioFocus) ومحرر الشريط السفلي مفعلان بالكامل.", color = DesignTokens.TextPrimary, fontWeight = FontWeight.Bold)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun ToggleRowItem(label: String, checked: Boolean, onCheckedChange: (Boolean) -> Unit) {
              Surface(color = DesignTokens.GlassSurface, border = BorderStroke(1.dp, DesignTokens.GlassBorder), shape = RoundedCornerShape(12.dp), modifier = Modifier.fillMaxWidth()) {
                  Row(Modifier.padding(horizontal = 14.dp, vertical = 6.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                      Text(label, color = DesignTokens.TextPrimary, fontSize = 13.sp)
                      Switch(checked = checked, onCheckedChange = onCheckedChange)
                  }
              }
          }
