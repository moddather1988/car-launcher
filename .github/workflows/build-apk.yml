          @Composable
          private fun RadioWavesOutlinedIcon(tint: Color) {
              Canvas(modifier = Modifier.size(22.dp)) {
                  val cx = size.width / 2f
                  val cy = size.height / 2f
                  drawCircle(color = tint, radius = 2.5.dp.toPx(), center = Offset(cx, cy))
                  val stroke = Stroke(width = 1.7.dp.toPx(), cap = StrokeCap.Round)
                  drawArc(color = tint, startAngle = -45f, sweepAngle = 90f, useCenter = false, topLeft = Offset(cx - 6.dp.toPx(), cy - 6.dp.toPx()), size = androidx.compose.ui.geometry.Size(12.dp.toPx(), 12.dp.toPx()), style = stroke)
                  drawArc(color = tint, startAngle = 135f, sweepAngle = 90f, useCenter = false, topLeft = Offset(cx - 6.dp.toPx(), cy - 6.dp.toPx()), size = androidx.compose.ui.geometry.Size(12.dp.toPx(), 12.dp.toPx()), style = stroke)
                  drawArc(color = tint, startAngle = -45f, sweepAngle = 90f, useCenter = false, topLeft = Offset(cx - 10.dp.toPx(), cy - 10.dp.toPx()), size = androidx.compose.ui.geometry.Size(20.dp.toPx(), 20.dp.toPx()), style = stroke)
                  drawArc(color = tint, startAngle = 135f, sweepAngle = 90f, useCenter = false, topLeft = Offset(cx - 10.dp.toPx(), cy - 10.dp.toPx()), size = androidx.compose.ui.geometry.Size(20.dp.toPx(), 20.dp.toPx()), style = stroke)
              }
          }

          @Composable
          private fun ScenicPanoramicWallpaperCanvas(
              wallpaper: ScenicWallpaperPreset,
              customUri: String?
          ) {
              val context = LocalContext.current
              val customBitmap = remember(customUri) {
                  if (customUri.isNullOrBlank()) null
                  else runCatching {
                      context.contentResolver.openInputStream(Uri.parse(customUri))?.use {
                          BitmapFactory.decodeStream(it)?.asImageBitmap()
                      }
                  }.getOrNull()
              }

              if (customBitmap != null) {
                  Image(
                      bitmap = customBitmap,
                      contentDescription = null,
                      contentScale = ContentScale.Crop,
                      modifier = Modifier.fillMaxSize()
                  )
                  Box(Modifier.fillMaxSize().background(Color(0xFF04141E).copy(alpha = 0.42f)))
              } else {
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      val w = size.width
                      val h = size.height

                      // 1. السماء المتدرجة
                      drawRect(
                          brush = Brush.verticalGradient(
                              colors = listOf(wallpaper.skyTop, wallpaper.skyHorizon, wallpaper.lakeWater, wallpaper.roadSurface)
                          )
                      )

                      // 2. سلسلة الجبال الخلفية البعيدة مع قمم الثلج (كما في الصورة الثانية)
                      val farMountains = Path().apply {
                          moveTo(0f, h * 0.42f)
                          lineTo(w * 0.08f, h * 0.14f)
                          lineTo(w * 0.19f, h * 0.30f)
                          lineTo(w * 0.31f, h * 0.18f)
                          lineTo(w * 0.46f, h * 0.38f)
                          lineTo(w * 0.62f, h * 0.22f)
                          lineTo(w * 0.78f, h * 0.10f)
                          lineTo(w * 0.92f, h * 0.26f)
                          lineTo(w, h * 0.16f)
                          lineTo(w, h * 0.46f)
                          lineTo(0f, h * 0.46f)
                          close()
                      }
                      drawPath(
                          path = farMountains,
                          brush = Brush.verticalGradient(
                              colors = listOf(Color.White.copy(alpha = 0.32f), wallpaper.mountainFar)
                          )
                      )

                      // 3. الجبال القريبة الداكنة على الجانبين
                      val nearLeftMountain = Path().apply {
                          moveTo(0f, h * 0.48f)
                          lineTo(w * 0.14f, h * 0.22f)
                          lineTo(w * 0.36f, h * 0.43f)
                          lineTo(0f, h * 0.48f)
                          close()
                      }
                      drawPath(nearLeftMountain, color = wallpaper.mountainNear.copy(alpha = 0.88f))

                      val nearRightMountain = Path().apply {
                          moveTo(w * 0.60f, h * 0.43f)
                          lineTo(w * 0.84f, h * 0.19f)
                          lineTo(w, h * 0.36f)
                          lineTo(w, h * 0.48f)
                          close()
                      }
                      drawPath(nearRightMountain, color = wallpaper.mountainNear.copy(alpha = 0.88f))

                      // 4. شريط البحيرة المائية العاكسة على اليسار واليمين عند الأفق
                      drawRect(
                          brush = Brush.verticalGradient(
                              colors = listOf(wallpaper.lakeWater.copy(alpha = 0.65f), wallpaper.roadSurface.copy(alpha = 0.90f))
                          ),
                          topLeft = Offset(0f, h * 0.43f),
                          size = androidx.compose.ui.geometry.Size(w, h * 0.15f)
                      )

                      // 5. الطريق السريع المرسوم بالمنظور الهندسي الممتد حتى أسفل الشاشة خلف الأشرطة الزجاجية
                      val vanishX = w * 0.50f
                      val vanishY = h * 0.36f
                      val roadPolygon = Path().apply {
                          moveTo(vanishX - w * 0.05f, vanishY)
                          lineTo(vanishX + w * 0.05f, vanishY)
                          lineTo(w * 0.86f, h)
                          lineTo(w * 0.14f, h)
                          close()
                      }
                      drawPath(
                          path = roadPolygon,
                          brush = Brush.verticalGradient(
                              colors = listOf(Color(0xFF1A3A4B), Color(0xFF0E2330), Color(0xFF07131B))
                          )
                      )

                      // حواف الطريق المضيئة
                      drawLine(
                          color = wallpaper.roadGlow.copy(alpha = 0.55f),
                          start = Offset(vanishX - w * 0.045f, vanishY),
                          end = Offset(w * 0.18f, h),
                          strokeWidth = 2.2.dp.toPx()
                      )
                      drawLine(
                          color = wallpaper.roadGlow.copy(alpha = 0.55f),
                          start = Offset(vanishX + w * 0.045f, vanishY),
                          end = Offset(w * 0.82f, h),
                          strokeWidth = 2.2.dp.toPx()
                      )

                      // الخط الأبيض الوسطي العريض في منتصف الطريق تمامًا كما يظهر خلف زر التشغيل البرتقالي في الصورة الثانية
                      val centerStripe = Path().apply {
                          moveTo(vanishX - 1.5.dp.toPx(), vanishY + h * 0.06f)
                          lineTo(vanishX + 1.5.dp.toPx(), vanishY + h * 0.06f)
                          lineTo(vanishX + 9.dp.toPx(), h)
                          lineTo(vanishX - 9.dp.toPx(), h)
                          close()
                      }
                      drawPath(centerStripe, color = Color.White.copy(alpha = 0.28f))
                  }
              }
          }
