          @Composable
          fun MusicPlayerFullScreen(
              tracks: List<LocalAudioTrack>, currentIndex: Int, isPlaying: Boolean,
              shuffleEnabled: Boolean, repeatEnabled: Boolean, storage: LauncherStorage,
              onTogglePlay: () -> Unit, onNext: () -> Unit, onPrev: () -> Unit,
              onToggleShuffle: () -> Unit, onToggleRepeat: () -> Unit,
              onOpenSongList: () -> Unit, stateCond: UiStateCondition
          ) {
              val preset = LocalCockpitPreset.current; val context = LocalContext.current
              val audioManager = remember { context.getSystemService(Context.AUDIO_SERVICE) as? AudioManager }
              val maxVol = remember { audioManager?.getStreamMaxVolume(AudioManager.STREAM_MUSIC) ?: 15 }
              var curVol by remember { mutableIntStateOf(audioManager?.getStreamVolume(AudioManager.STREAM_MUSIC) ?: 10) }
              val current = tracks.getOrNull(currentIndex)
              var favIds by remember { mutableStateOf(storage.favoriteTrackIds) }
              val isFav = current != null && favIds.contains(current.id.toString())

              UnifiedStateRenderer(condition = stateCond) {
                  Surface(color = DesignTokens.GlassSurface, border = BorderStroke(1.dp, DesignTokens.GlassBorder), shape = RoundedCornerShape(22.dp), modifier = Modifier.fillMaxSize()) {
                      Row(Modifier.fillMaxSize().padding(16.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(18.dp)) {
                          Surface(color = Color(0xFF1A2636), shape = RoundedCornerShape(22.dp), border = BorderStroke(1.5.dp, preset.primary), modifier = Modifier.size(125.dp)) {
                              Box(contentAlignment = Alignment.Center) { Icon(Icons.Outlined.MusicNote, null, tint = DesignTokens.AmberGold, modifier = Modifier.size(60.dp)) }
                          }
                          Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                  Column(Modifier.weight(1f)) {
                                      Text(current?.title ?: "Evening Drive QA", style = MaterialTheme.typography.titleLarge, color = DesignTokens.TextPrimary, maxLines = 1)
                                      Text(current?.artist ?: "MyCar Audio Test", fontSize = 12.sp, color = preset.primary)
                                  }
                                  if (current != null) {
                                      IconButton(onClick = { favIds = storage.toggleFavoriteTrack(current.id) }) {
                                          Icon(if (isFav) Icons.Default.Favorite else Icons.Outlined.FavoriteBorder, null, tint = if (isFav) DesignTokens.StatusDanger else Color.White)
                                      }
                                  }
                              }
                              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  Icon(Icons.Outlined.VolumeUp, null, tint = DesignTokens.AmberGold, modifier = Modifier.size(18.dp))
                                  Slider(value = curVol.toFloat(), onValueChange = { curVol = it.toInt(); runCatching { audioManager?.setStreamVolume(AudioManager.STREAM_MUSIC, curVol, 0) } }, valueRange = 0f..maxVol.toFloat(), modifier = Modifier.weight(1f).height(24.dp))
                                  Text("${(curVol * 100) / maxVol.coerceAtLeast(1)}%", fontSize = 11.sp, color = Color.White)
                              }
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp), verticalAlignment = Alignment.CenterVertically) {
                                      IconButton(onClick = onToggleShuffle) { Icon(Icons.Outlined.Shuffle, null, tint = if (shuffleEnabled) DesignTokens.AmberGold else DesignTokens.TextMuted) }
                                      IconButton(onClick = onNext) { Icon(Icons.Default.SkipNext, null, tint = Color.White, modifier = Modifier.size(30.dp)) }
                                      Surface(shape = CircleShape, color = DesignTokens.AmberGold, modifier = Modifier.size(50.dp).clickable { onTogglePlay() }) {
