          @Composable
          fun VehicleInfoScreen(
              telemetry: LiveDrivingTelemetry, hardware: HardwareDiagnosticReport, hardwareService: VehicleHardwareService,
              storage: LauncherStorage, onOpenMaintenance: () -> Unit, stateCond: UiStateCondition
          ) {
              val scope = rememberCoroutineScope()
              val vProfile = storage.getActiveVehicle()
              var obdResult by remember { mutableStateOf<ObdLiveScanResult?>(null) }
              var isScanningObd by remember { mutableStateOf(false) }

              val itemsList = listOf(
                  Triple("ملف السيارة: ${vProfile.brand} - ${vProfile.modelAr}", "استهلاك الوقود: ${vProfile.fuelLitersPer100Km} لتر/100كم", "ACTIVE"),
                  Triple("الجهد الكهربائي الفعلي وحرارة النظام", "الفولت: ${hardware.batteryVoltageVolts} V • الحرارة: ${hardware.batteryTempCelsius}°C", "LIVE SENSOR"),
                  Triple("كمبيوتر السيارة OBD-II (Bluetooth SPP ELM327)", obdResult?.statusMessageAr ?: "اضغط زر الفحص بالأعلى للاتصال بأي قطعة ELM327 مقترنة", "SPP READY")
              )
              UnifiedStateRenderer(condition = stateCond) {
                  Column(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          Button(onClick = { isScanningObd = true; scope.launch { obdResult = hardwareService.queryRealObd2Adapter(); isScanningObd = false } }, colors = ButtonDefaults.buttonColors(containerColor = DesignTokens.StatusSuccess), modifier = Modifier.weight(1f)) {
                              Text(if (isScanningObd) "جاري الفحص..." else "فحص واتصال OBD2 الحقيقي", color = Color.White, fontWeight = FontWeight.Bold)
                          }
                          Button(onClick = onOpenMaintenance, colors = ButtonDefaults.buttonColors(containerColor = DesignTokens.AmberGold), modifier = Modifier.weight(1f)) {
                              Text("جدول الصيانة الدورية", color = Color.Black, fontWeight = FontWeight.Bold)
                          }
                      }
                      LazyColumn(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          items(itemsList) { (title, value, status) ->
                              Surface(color = DesignTokens.GlassSurface, shape = RoundedCornerShape(14.dp), border = BorderStroke(1.dp, DesignTokens.GlassBorder), modifier = Modifier.fillMaxWidth()) {
                                  Row(Modifier.padding(12.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                      Column(Modifier.weight(1f)) { Text(title, color = DesignTokens.TextPrimary, fontWeight = FontWeight.Bold); Text(value, color = DesignTokens.TextSecondary, fontSize = 11.sp) }
                                      Text(status, color = DesignTokens.StatusSuccess, fontSize = 11.sp, fontWeight = FontWeight.Bold)
