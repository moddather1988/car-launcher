          import java.time.LocalDateTime
          import java.time.chrono.HijrahDate
          import java.time.format.DateTimeFormatter
          import java.time.temporal.ChronoField
          import java.util.Locale

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  enableImmersiveMode()

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {}
                  })

                  setContent {
                      CarLauncherRootApp()
                  }
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) enableImmersiveMode()
              }

              private fun enableImmersiveMode() {
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  val controller = WindowInsetsControllerCompat(window, window.decorView)
                  controller.hide(WindowInsetsCompat.Type.systemBars())
                  controller.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
              }
          }

          @SuppressLint("MissingPermission")
          @Composable
          fun CarLauncherRootApp() {
              val context = androidx.compose.ui.platform.LocalContext.current
              val storage = remember { LauncherStorage(context) }
              val hardwareService = remember { VehicleHardwareService(context) }
              val metrics = rememberResponsiveMetrics()

              var currentPreset by remember { mutableStateOf(storage.themePreset) }
              var settingsTick by remember { mutableIntStateOf(0) }
              var currentSection by remember { mutableStateOf(CockpitSection.DASHBOARD) }

              var timeFormatted by remember { mutableStateOf("07:52") }
              var amPmArabic by remember { mutableStateOf("ص") }
              var gregorianDate by remember { mutableStateOf("") }
              var hijriDate by remember { mutableStateOf("") }
              val tripStartLabel = remember { LocalDateTime.now().format(DateTimeFormatter.ofPattern("hh:mm a", Locale.US)) }
              var tripStartRealtime by remember { mutableLongStateOf(SystemClock.elapsedRealtime()) }
              var durationMinutes by remember { mutableIntStateOf(0) }
              var durationFormatted by remember { mutableStateOf("00:00:00") }

              var liveSpeedKmh by remember { mutableStateOf<Int?>(null) }
              var accuracyMeters by remember { mutableStateOf<Int?>(null) }
              var distanceKm by remember { mutableFloatStateOf(0f) }
              var maxSpeedKmh by remember { mutableIntStateOf(0) }
              var bearingDeg by remember { mutableStateOf<Int?>(null) }
              var currentLat by remember { mutableStateOf<Double?>(null) }
              var currentLon by remember { mutableStateOf<Double?>(null) }
              var lastLoc by remember { mutableStateOf<Location?>(null) }
              var gpsMsg by remember { mutableStateOf("بانتظار إشارة GPS") }
              var hardwareReport by remember { mutableStateOf(hardwareService.inspectHardware()) }

              var audioTracks by remember { mutableStateOf<List<LocalAudioTrack>>(emptyList()) }
              var currentTrackIdx by remember { mutableIntStateOf(0) }
              var isPlayingMusic by remember { mutableStateOf(false) }
              val mediaPlayer = remember { MediaPlayer() }

              fun loadDeviceAudio() {
                  val list = mutableListOf<LocalAudioTrack>()
                  runCatching {
                      val projection = arrayOf(
                          MediaStore.Audio.Media._ID,
                          MediaStore.Audio.Media.TITLE,
                          MediaStore.Audio.Media.ARTIST
                      )
                      context.contentResolver.query(
                          MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,
                          projection,
                          "${MediaStore.Audio.Media.IS_MUSIC} != 0",
                          null,
                          "${MediaStore.Audio.Media.TITLE} ASC"
                      )?.use { cursor ->
                          val idCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                          val titleCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE)
                          val artistCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST)
                          while (cursor.moveToNext() && list.size < 100) {
                              val id = cursor.getLong(idCol)
                              val uri = ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, id)
                              list.add(LocalAudioTrack(id, cursor.getString(titleCol) ?: "مقطع صوتي", cursor.getString(artistCol) ?: "MyCar Audio", uri))
                          }
                      }
                  }
                  audioTracks = list
              }

              fun playTrackAt(index: Int) {
                  val track = audioTracks.getOrNull(index) ?: return
                  runCatching {
                      mediaPlayer.reset()
                      mediaPlayer.setDataSource(context, track.uri)
                      mediaPlayer.prepare()
                      mediaPlayer.start()
                      currentTrackIdx = index
                      isPlayingMusic = true
                  }
              }

              val permLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) {
                  hardwareReport = hardwareService.inspectHardware()
                  loadDeviceAudio()
              }

              LaunchedEffect(Unit) {
                  val perms = mutableListOf(
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION
                  )
                  if (Build.VERSION.SDK_INT >= 33) perms.add(Manifest.permission.READ_MEDIA_AUDIO)
                  else perms.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                  permLauncher.launch(perms.toTypedArray())
                  loadDeviceAudio()
              }

              DisposableEffect(hardwareReport.hasLocationPermission) {
                  val lm = context.getSystemService(Context.LOCATION_SERVICE) as? LocationManager
                  val listener = LocationListener { loc ->
                      val spd = if (loc.hasSpeed()) (loc.speed * 3.6f).toInt() else 0
                      liveSpeedKmh = spd
                      accuracyMeters = loc.accuracy.toInt()
                      currentLat = loc.latitude
                      currentLon = loc.longitude
                      if (loc.hasBearing()) bearingDeg = loc.bearing.toInt()
                      if (spd > maxSpeedKmh) maxSpeedKmh = spd

                      lastLoc?.let { prev ->
                          val d = prev.distanceTo(loc)
                          if (d > 3f && loc.accuracy <= 35f) distanceKm += (d / 1000f)
                      }
                      lastLoc = loc
                      gpsMsg = "دقة الإشارة: ±${loc.accuracy.toInt()} متر"
                  }

                  if (hardwareReport.hasLocationPermission && lm != null) {
                      runCatching { lm.requestLocationUpdates(LocationManager.GPS_PROVIDER, 1000L, 1f, listener) }
                  }
                  onDispose {
                      runCatching { lm?.removeUpdates(listener) }
                      runCatching { mediaPlayer.release() }
                  }
              }

              LaunchedEffect(settingsTick) {
                  val hijriMonths = arrayOf("محرم", "صفر", "ربيع الأول", "ربيع الآخر", "جمادى الأولى", "جمادى الآخرة", "رجب", "شعبان", "رمضان", "شوال", "ذو القعدة", "ذو الحجة")
                  var secCounter = 0
                  while (true) {
                      val now = LocalDateTime.now()
                      val pattern = if (storage.use24HourFormat) "HH:mm" else "hh:mm"
                      timeFormatted = now.format(DateTimeFormatter.ofPattern(pattern, Locale.US))
                      amPmArabic = if (now.hour < 12) "ص" else "م"
                      gregorianDate = now.format(DateTimeFormatter.ofPattern("EEEE، dd MMMM yyyy", Locale("ar", "EG")))

                      val hijri = HijrahDate.now()
                      hijriDate = "${hijri.get(ChronoField.DAY_OF_MONTH)} ${hijriMonths[(hijri.get(ChronoField.MONTH_OF_YEAR) - 1).coerceIn(0, 11)]} ${hijri.get(ChronoField.YEAR)} هـ"

                      val elapsed = (SystemClock.elapsedRealtime() - tripStartRealtime) / 1000L
                      durationMinutes = (elapsed / 60L).toInt()
                      durationFormatted = String.format(Locale.US, "%02d:%02d:%02d", elapsed / 3600, (elapsed % 3600) / 60, elapsed % 60)

                      if (secCounter % 4 == 0) hardwareReport = hardwareService.inspectHardware()
                      secCounter++
                      delay(1000L)
                  }
              }

              val prayers = remember(currentLat, currentLon, timeFormatted) {
                  OfflinePrayerEngine.calculate(lat = currentLat ?: 30.0444, lon = currentLon ?: 31.2357)
              }

              val telemetry = LiveDrivingTelemetry(
                  speedKmh = liveSpeedKmh,
                  accuracyMeters = accuracyMeters,
                  distanceKm = distanceKm,
                  maxSpeedKmh = maxSpeedKmh,
                  bearingDegrees = bearingDeg,
                  durationMinutes = durationMinutes,
                  durationFormatted = durationFormatted,
                  tripStartTimeFormatted = tripStartLabel,
                  gpsStatusMessage = gpsMsg
              )

              CarLauncherTheme(preset = currentPreset, fontScaleMultiplier = metrics.scaleFactor) {
                  CockpitNavigationShell(
                      currentSection = currentSection,
                      onSelectSection = { currentSection = it }
                  ) {
                      when (currentSection) {
                          CockpitSection.DASHBOARD -> DashboardScreen(
                              metrics = metrics,
                              timeFormatted = timeFormatted,
                              amPmArabic = amPmArabic,
                              gregorianDate = gregorianDate,
                              hijriDate = hijriDate,
                              telemetry = telemetry,
                              hardware = hardwareReport,
                              prayers = prayers,
                              currentTrackTitle = audioTracks.getOrNull(currentTrackIdx)?.title ?: "Evening Drive QA",
                              currentTrackArtist = audioTracks.getOrNull(currentTrackIdx)?.artist ?: "MyCar Audio",
                              isPlayingMusic = isPlayingMusic,
                              storage = storage,
                              onToggleMusicPlay = {
                                  if (audioTracks.isEmpty()) loadDeviceAudio()
                                  if (isPlayingMusic) {
                                      runCatching { mediaPlayer.pause() }
                                      isPlayingMusic = false
                                  } else if (audioTracks.isNotEmpty()) {
                                      playTrackAt(currentTrackIdx)
                                  }
                              },
                              onNextTrack = { if (audioTracks.isNotEmpty()) playTrackAt((currentTrackIdx + 1) % audioTracks.size) },
                              onPrevTrack = { if (audioTracks.isNotEmpty()) playTrackAt((currentTrackIdx - 1 + audioTracks.size) % audioTracks.size) },
                              onResetTrip = {
                                  distanceKm = 0f
                                  maxSpeedKmh = 0
                                  tripStartRealtime = SystemClock.elapsedRealtime()
                              },
                              onNavigateTo = { currentSection = it },
                              onRequestGpsPermission = {
                                  permLauncher.launch(arrayOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION))
                              }
                          )
                          CockpitSection.NAVIGATION -> NavigationMapScreen(telemetry, currentLat, currentLon)
                          CockpitSection.MUSIC -> MusicPlayerScreen(
                              tracks = audioTracks,
                              currentIndex = currentTrackIdx,
                              isPlaying = isPlayingMusic,
                              onSelectTrack = { playTrackAt(it) },
                              onTogglePlay = {
                                  if (isPlayingMusic) { runCatching { mediaPlayer.pause() }; isPlayingMusic = false }
                                  else if (audioTracks.isNotEmpty()) playTrackAt(currentTrackIdx)
                              },
                              onNext = { if (audioTracks.isNotEmpty()) playTrackAt((currentTrackIdx + 1) % audioTracks.size) },
                              onPrev = { if (audioTracks.isNotEmpty()) playTrackAt((currentTrackIdx - 1 + audioTracks.size) % audioTracks.size) },
                              onRefreshLibrary = { loadDeviceAudio() }
                          )
                          CockpitSection.RADIO -> RadioFmScreen()
                          CockpitSection.PHONE -> PhoneContactsScreen(hardwareReport)
                          CockpitSection.ISLAMIC -> IslamicHubScreen(prayers, hijriDate, storage)
                          CockpitSection.VEHICLE -> VehicleObdScreen(telemetry, hardwareReport)
                          CockpitSection.APPS -> AppDrawerScreen()
                          CockpitSection.SETTINGS -> SettingsScreen(
                              storage = storage,
                              currentPreset = currentPreset,
                              onPresetChange = { currentPreset = it },
                              onSettingsUpdated = { settingsTick++ }
                          )
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Car Launcher v3 APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare Clean APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CarLauncherUniversal.apk

      - name: Publish Direct APK v3.0 (No ZIP)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0
          name: Car Launcher Universal v3.0 (Panoramic Edition)
          files: CarLauncherUniversal.apk
