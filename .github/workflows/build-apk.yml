          cat << 'EOF' > "$BASE/MainActivity.kt"
          package com.universal.carlauncher
          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.ContentUris
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.location.*
          import android.media.AudioManager
          import android.media.MediaPlayer
          import android.media.ToneGenerator
          import android.os.*
          import android.provider.MediaStore
          import android.speech.RecognizerIntent
          import android.speech.tts.TextToSpeech
          import android.view.KeyEvent
          import android.view.WindowManager
          import androidx.activity.*
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.layout.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.core.content.ContextCompat
          import androidx.core.view.*
          import com.universal.carlauncher.core.designsystem.CarLauncherTheme
          import com.universal.carlauncher.core.diagnostics.InAppDiagnosticsLogger
          import com.universal.carlauncher.core.hardware.VehicleHardwareService
          import com.universal.carlauncher.core.responsive.rememberResponsiveMetrics
          import com.universal.carlauncher.core.storage.LauncherStorage
          import com.universal.carlauncher.domain.automation.AutomationEngine
          import com.universal.carlauncher.domain.islamic.OfflinePrayerEngine
          import com.universal.carlauncher.domain.weather.MultiSourceWeatherProvider
          import com.universal.carlauncher.ui.components.StateConditionSelectorBar
          import com.universal.carlauncher.ui.components.UiStateCondition
          import com.universal.carlauncher.ui.navigation.*
          import com.universal.carlauncher.ui.screens.*
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import java.time.LocalDateTime
          import java.time.chrono.HijrahDate
          import java.time.format.DateTimeFormatter
          import java.time.temporal.ChronoField
          import java.util.Locale
          import kotlin.math.roundToInt

          class MainActivity : ComponentActivity() {
              private val swcKeyEvents = mutableStateOf("في انتظار ضغطة زر...")
              private val mediaKeyAction = mutableIntStateOf(0)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  InAppDiagnosticsLogger.installGlobalCrashShield()
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  enableImmersiveMode()
                  setContent { CarLauncherRootApp(swcKeyEvents.value, mediaKeyAction.intValue) { mediaKeyAction.intValue = 0 } }
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  return when (keyCode) {
                      KeyEvent.KEYCODE_MEDIA_NEXT -> { mediaKeyAction.intValue = 1; true }
                      KeyEvent.KEYCODE_MEDIA_PREVIOUS -> { mediaKeyAction.intValue = 2; true }
                      KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE -> { mediaKeyAction.intValue = 3; true }
                      else -> super.onKeyDown(keyCode, event)
                  }
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) { super.onWindowFocusChanged(hasFocus); if (hasFocus) enableImmersiveMode() }
              private fun enableImmersiveMode() {
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  WindowInsetsControllerCompat(window, window.decorView).apply {
                      hide(WindowInsetsCompat.Type.systemBars())
                      systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
              }
          }

          @SuppressLint("MissingPermission")
          @Composable
          fun CarLauncherRootApp(lastSwcKeyInfo: String, mediaActionSignal: Int, onConsumeMediaSignal: () -> Unit) {
              val context = androidx.compose.ui.platform.LocalContext.current
              val scope = rememberCoroutineScope()
              val storage = remember { LauncherStorage(context) }
              val hardwareService = remember { VehicleHardwareService(context) }
              val metrics = rememberResponsiveMetrics()

              var currentPreset by remember { mutableStateOf(storage.themePreset) }
              var currentWallpaper by remember { mutableStateOf(storage.wallpaperPreset) }
              var customWallpaperUri by remember { mutableStateOf(storage.customWallpaperUri) }
              var settingsTick by remember { mutableIntStateOf(0) }
              var lastVoiceCommandText by remember { mutableStateOf("لم يتم إصدار أمر صوتي") }

              var ttsEngine by remember { mutableStateOf<TextToSpeech?>(null) }
              var islamicBootSpoken by remember { mutableStateOf(false) }

              fun speakArabic(text: String) {
                  ttsEngine?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "car_ai_tts")
              }

              DisposableEffect(Unit) {
                  var instance: TextToSpeech? = null
                  instance = TextToSpeech(context) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          instance?.language = Locale("ar")
                          if (storage.islamicAudioAutoPlayOnBoot && !islamicBootSpoken) {
                              islamicBootSpoken = true
                              speakArabic("سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا")
                          }
                      }
                  }
                  ttsEngine = instance
                  onDispose { runCatching { instance?.stop(); instance?.shutdown() } }
              }

              val initialRoute = remember {
                  if (storage.restoreLastStateOnBoot) runCatching { AppRoute.valueOf(storage.lastSavedRouteName) }.getOrDefault(AppRoute.DASHBOARD) else AppRoute.DASHBOARD
              }
              val backStack = remember { mutableStateListOf(initialRoute) }
              val currentRoute = backStack.lastOrNull() ?: AppRoute.DASHBOARD
              var activeUiCondition by remember { mutableStateOf(UiStateCondition.NORMAL) }

              fun navigateTo(route: AppRoute) {
                  activeUiCondition = UiStateCondition.NORMAL
                  storage.lastSavedRouteName = route.name
                  if (route == AppRoute.DASHBOARD) { backStack.clear(); backStack.add(AppRoute.DASHBOARD) }
                  else if (backStack.lastOrNull() != route) { backStack.add(route) }
              }
              fun popBack() { if (backStack.size > 1) { backStack.removeAt(backStack.lastIndex); storage.lastSavedRouteName = backStack.last().name } }

              val galleryLauncher = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                  if (uri != null) {
                      runCatching { context.contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION) }
                      storage.customWallpaperUri = uri.toString(); customWallpaperUri = uri.toString()
                  }
              }

              val voiceLauncher = rememberLauncherForActivityResult(ActivityResultContracts.StartActivityForResult()) { res ->
                  if (res.resultCode == Activity.RESULT_OK) {
                      val spoken = res.data?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)?.firstOrNull() ?: ""
                      if (spoken.isNotBlank()) {
                          lastVoiceCommandText = spoken
                          when {
                              spoken.contains("خرائط") -> navigateTo(AppRoute.NAVIGATION)
                              spoken.contains("موسيق") -> navigateTo(AppRoute.MUSIC_PLAYER)
                              spoken.contains("راديو") -> navigateTo(AppRoute.RADIO)
                              else -> navigateTo(AppRoute.AI_ASSISTANT)
                          }
                      }
                  }
              }

              var timeFormatted by remember { mutableStateOf("07:52") }
              var amPmArabic by remember { mutableStateOf("ص") }
              var gregorianDate by remember { mutableStateOf("") }
              var hijriDate by remember { mutableStateOf("") }
              var tripStartRealtime by remember { mutableLongStateOf(SystemClock.elapsedRealtime()) }
              var durationMinutes by remember { mutableIntStateOf(0) }

              var liveSpeedKmh by remember { mutableStateOf<Int?>(null) }
              var accuracyMeters by remember { mutableStateOf<Int?>(null) }
              var distanceKm by remember { mutableFloatStateOf(storage.persistedDistanceKm) }
              var maxSpeedKmh by remember { mutableIntStateOf(0) }
              var bearingDeg by remember { mutableIntStateOf(136) }
              var magneticAzimuthDeg by remember { mutableIntStateOf(136) }
              var currentLat by remember { mutableStateOf<Double?>(null) }
              var currentLon by remember { mutableStateOf<Double?>(null) }
              var lastLoc by remember { mutableStateOf<Location?>(null) }
              var hardwareReport by remember { mutableStateOf(hardwareService.inspectHardware()) }
              var weatherSnapshot by remember { mutableStateOf(MultiSourceWeatherProvider.getOfflineSeasonalEstimate()) }

              var audioTracks by remember { mutableStateOf<List<LocalAudioTrack>>(emptyList()) }
              var deviceContacts by remember { mutableStateOf<List<DeviceContactItem>>(emptyList()) }
              var currentTrackIdx by remember { mutableIntStateOf(0) }
              var isPlayingMusic by remember { mutableStateOf(false) }
              var isRadioStreamPlaying by remember { mutableStateOf(false) }
              var activeRadioStreamName by remember { mutableStateOf("اختر محطة للبث المباشر") }
              var audioPosMs by remember { mutableIntStateOf(0) }
              var audioDurationMs by remember { mutableIntStateOf(1) }
              var shuffleMode by remember { mutableStateOf(false) }
              var repeatMode by remember { mutableStateOf(false) }
              val mediaPlayer = remember { MediaPlayer() }
              val toneGen = remember { runCatching { ToneGenerator(AudioManager.STREAM_NOTIFICATION, 75) }.getOrNull() }

              fun loadDeviceContacts() {
                  if (ContextCompat.checkSelfPermission(context, Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED) return
                  val list = mutableListOf<DeviceContactItem>()
                  runCatching {
                      context.contentResolver.query(ContactsContract.CommonDataKinds.Phone.CONTENT_URI, arrayOf(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER), null, null, null)?.use { c ->
                          val nC = c.getColumnIndexOrThrow(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME)
                          val pC = c.getColumnIndexOrThrow(ContactsContract.CommonDataKinds.Phone.NUMBER)
                          while (c.moveToNext() && list.size < 100) { list.add(DeviceContactItem(c.getString(nC) ?: "", c.getString(pC) ?: "")) }
                      }
                  }
                  deviceContacts = list
              }

              fun loadDeviceAudio() {
                  val list = mutableListOf<LocalAudioTrack>()
                  runCatching {
                      context.contentResolver.query(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, arrayOf(MediaStore.Audio.Media._ID, MediaStore.Audio.Media.TITLE, MediaStore.Audio.Media.ARTIST), "${MediaStore.Audio.Media.IS_MUSIC} != 0", null, null)?.use { c ->
                          val idC = c.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                          val tC = c.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE)
                          val aC = c.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST)
                          while (c.moveToNext() && list.size < 120) {
                              list.add(LocalAudioTrack(c.getLong(idC), c.getString(tC) ?: "أغنية", c.getString(aC) ?: "فنان", ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, c.getLong(idC))))
                          }
                      }
                  }
                  audioTracks = list
              }

              fun playTrackAt(idx: Int) {
                  val track = audioTracks.getOrNull(idx) ?: return
                  runCatching {
                      isRadioStreamPlaying = false
                      mediaPlayer.reset(); mediaPlayer.setDataSource(context, track.uri); mediaPlayer.prepare(); mediaPlayer.start()
                      currentTrackIdx = idx; isPlayingMusic = true; audioDurationMs = mediaPlayer.duration.coerceAtLeast(1)
                      mediaPlayer.setOnCompletionListener {
                          if (repeatMode) playTrackAt(idx) else if (audioTracks.isNotEmpty()) playTrackAt((idx + 1) % audioTracks.size)
                      }
                  }
              }

              fun playRadioStreamUrl(url: String, name: String) {
                  scope.launch {
                      runCatching {
                          isPlayingMusic = false; mediaPlayer.reset(); mediaPlayer.setDataSource(url)
                          mediaPlayer.setOnPreparedListener { mp -> mp.start(); isRadioStreamPlaying = true; activeRadioStreamName = "يعمل الآن: $name" }
                          mediaPlayer.prepareAsync()
                      }
                  }
              }

              LaunchedEffect(mediaActionSignal) {
                  if (mediaActionSignal != 0) {
                      when (mediaActionSignal) {
                          1 -> if (audioTracks.isNotEmpty()) playTrackAt((currentTrackIdx + 1) % audioTracks.size)
                          2 -> if (audioTracks.isNotEmpty()) playTrackAt((currentTrackIdx - 1 + audioTracks.size) % audioTracks.size)
                          3 -> { if (isPlayingMusic) { mediaPlayer.pause(); isPlayingMusic = false } else if (audioTracks.isNotEmpty()) playTrackAt(currentTrackIdx) }
                      }
                      onConsumeMediaSignal()
                  }
              }

              val permLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                  hardwareReport = hardwareService.inspectHardware(); loadDeviceAudio(); loadDeviceContacts()
              }

              LaunchedEffect(Unit) {
                  val perms = mutableListOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION, Manifest.permission.READ_CONTACTS)
                  if (Build.VERSION.SDK_INT >= 33) perms.add(Manifest.permission.READ_MEDIA_AUDIO) else perms.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                  if (Build.VERSION.SDK_INT >= 31) perms.add(Manifest.permission.BLUETOOTH_CONNECT)
                  permLauncher.launch(perms.toTypedArray()); loadDeviceAudio(); loadDeviceContacts()
              }

              DisposableEffect(hardwareReport.hasLocationPermission) {
                  val lm = context.getSystemService(Context.LOCATION_SERVICE) as? LocationManager
                  val listener = LocationListener { loc ->
                      val spd = if (loc.hasSpeed()) (loc.speed * 3.6f).toInt() else 0
                      liveSpeedKmh = spd; accuracyMeters = loc.accuracy.toInt(); currentLat = loc.latitude; currentLon = loc.longitude
                      if (spd > maxSpeedKmh) maxSpeedKmh = spd
                      if (spd >= storage.speedAlertLimit && storage.audioSpeedAlertEnabled) runCatching { toneGen?.startTone(ToneGenerator.TONE_PROP_BEEP, 180) }
                      AutomationEngine.executeRealTimeRules(spd, isPlayingMusic) { if (audioTracks.isNotEmpty()) playTrackAt(currentTrackIdx) }
                      lastLoc?.let { prev ->
                          val d = prev.distanceTo(loc)
                          if (d > 3f && loc.accuracy <= 35f) { val delta = d / 1000f; distanceKm += delta; storage.persistedDistanceKm = distanceKm; storage.totalOdometerKm += delta }
                      }
                      lastLoc = loc
                  }
                  if (hardwareReport.hasLocationPermission && lm != null) runCatching { lm.requestLocationUpdates(LocationManager.GPS_PROVIDER, 1000L, 1f, listener) }
                  onDispose { runCatching { lm?.removeUpdates(listener) }; runCatching { mediaPlayer.release() } }
              }

              LaunchedEffect(settingsTick) {
                  var sec = 0
                  while (true) {
                      val now = LocalDateTime.now()
                      timeFormatted = now.format(DateTimeFormatter.ofPattern(if (storage.use24HourFormat) "HH:mm" else "hh:mm", Locale.US))
                      amPmArabic = if (now.hour < 12) "ص" else "م"
                      gregorianDate = now.format(DateTimeFormatter.ofPattern("EEEE، d MMMM yyyy", Locale("ar", "EG")))
                      durationMinutes = ((SystemClock.elapsedRealtime() - tripStartRealtime) / 60000L).toInt()
                      if (isPlayingMusic) runCatching { audioPosMs = mediaPlayer.currentPosition; audioDurationMs = mediaPlayer.duration.coerceAtLeast(1) }
                      sec++; delay(1000L)
                  }
              }

              val prayers = remember(currentLat, currentLon, timeFormatted) { OfflinePrayerEngine.calculate(currentLat ?: 30.0444, currentLon ?: 31.2357) }
              val activeVehicle = storage.getActiveVehicle()
              val fuelUsed = (distanceKm / 100f) * activeVehicle.fuelLitersPer100Km
              val telemetry = LiveDrivingTelemetry(liveSpeedKmh, accuracyMeters, distanceKm, maxSpeedKmh, 55, durationMinutes, bearingDeg, 136, fuelUsed, 98, 3700)

              CarLauncherTheme(preset = currentPreset, isDayMode = storage.isDayMode, fontScaleMultiplier = metrics.scaleFactor) {
                  CockpitNavigationShell(
                      currentRoute = currentRoute,
                      wallpaperPreset = currentWallpaper,
                      customWallpaperUri = customWallpaperUri,
                      useSideRail = storage.useSideNavigationRail,
                      storage = storage,
                      onNavigate = { navigateTo(it) },
                      onBack = { popBack() }
                  ) {
                      if (currentRoute == AppRoute.DASHBOARD) {
                          DashboardScreen(
                              metrics, timeFormatted, amPmArabic, gregorianDate, hijriDate, telemetry, weatherSnapshot, hardwareReport, prayers,
                              if (isRadioStreamPlaying) activeRadioStreamName else (audioTracks.getOrNull(currentTrackIdx)?.title ?: "Evening Drive QA"),
                              audioTracks.getOrNull(currentTrackIdx)?.artist ?: "MyCar Audio Test",
                              isPlayingMusic || isRadioStreamPlaying, storage,
                              onCycleWallpaper = { currentWallpaper = storage.cycleWallpaper(); customWallpaperUri = null },
                              onLaunchVoiceCommand = { runCatching { voiceLauncher.launch(Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)) } },
                              onSpeakSummary = { speakArabic("سرعتك الحالية ${liveSpeedKmh ?: 0} كم في الساعة.") },
                              onToggleMusicPlay = { if (isRadioStreamPlaying) { mediaPlayer.stop(); isRadioStreamPlaying = false } else { if (audioTracks.isEmpty()) loadDeviceAudio(); if (isPlayingMusic) { mediaPlayer.pause(); isPlayingMusic = false } else if (audioTracks.isNotEmpty()) playTrackAt(currentTrackIdx) } },
                              onNextTrack = { if (audioTracks.isNotEmpty()) playTrackAt((currentTrackIdx + 1) % audioTracks.size) },
                              onPrevTrack = { if (audioTracks.isNotEmpty()) playTrackAt((currentTrackIdx - 1 + audioTracks.size) % audioTracks.size) },
                              onResetTrip = { distanceKm = 0f; storage.persistedDistanceKm = 0f; maxSpeedKmh = 0; tripStartRealtime = SystemClock.elapsedRealtime() },
                              onNavigateTo = { navigateTo(it) },
                              onRequestGpsPermission = { permLauncher.launch(arrayOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION)) }
                          )
                      } else {
                          Column(Modifier.fillMaxSize()) {
                              Box(Modifier.weight(1f).fillMaxWidth()) {
                                  when (currentRoute) {
                                      AppRoute.DOCK_CUSTOMIZATION -> DockCustomizationEditorScreen(storage)
                                      AppRoute.AI_ASSISTANT -> SmartAiAssistantScreen(telemetry, hardwareReport, prayers, weatherSnapshot, { speakArabic(it) }, { }, { navigateTo(it) }, UiStateCondition.NORMAL)
                                      AppRoute.MAINTENANCE_MANAGER -> MaintenanceManagerScreen(storage, { speakArabic(it) }, UiStateCondition.NORMAL)
                                      AppRoute.SPEEDOMETER_FULL -> SpeedometerDedicatedScreen(telemetry, storage, { navigateTo(AppRoute.HUD_PROJECTOR) }, UiStateCondition.NORMAL)
                                      AppRoute.HUD_PROJECTOR -> HudProjectorScreen(telemetry, storage)
                                      AppRoute.NAVIGATION -> NavigationMapScreen(telemetry, currentLat, currentLon, storage, UiStateCondition.NORMAL)
                                      AppRoute.WEATHER -> WeatherDetailScreen(weatherSnapshot, storage, { }, UiStateCondition.NORMAL)
                                      AppRoute.MUSIC_PLAYER -> MusicPlayerFullScreen(
                                          audioTracks, currentTrackIdx, isPlayingMusic, audioPosMs, audioDurationMs,
                                          onSeekTo = { runCatching { mediaPlayer.seekTo(it); audioPosMs = it } },
                                          false, false, storage,
                                          onTogglePlay = { if (isPlayingMusic) { mediaPlayer.pause(); isPlayingMusic = false } else if (audioTracks.isNotEmpty()) playTrackAt(currentTrackIdx) },
                                          onNext = { if (audioTracks.isNotEmpty()) playTrackAt((currentTrackIdx + 1) % audioTracks.size) },
                                          onPrev = { if (audioTracks.isNotEmpty()) playTrackAt((currentTrackIdx - 1 + audioTracks.size) % audioTracks.size) },
                                          onToggleShuffle = { },
                                          onToggleRepeat = { },
                                          onOpenSongList = { navigateTo(AppRoute.SONG_LIST) },
                                          stateCond = UiStateCondition.NORMAL
                                      )
                                      AppRoute.SONG_LIST -> SongListScreen(audioTracks, currentTrackIdx, storage, { playTrackAt(it); navigateTo(AppRoute.MUSIC_PLAYER) }, { loadDeviceAudio() }, UiStateCondition.NORMAL)
                                      AppRoute.RADIO -> RadioFmScreen(isRadioStreamPlaying, activeRadioStreamName, { url, name -> playRadioStreamUrl(url, name) }, { mediaPlayer.stop(); isRadioStreamPlaying = false }, UiStateCondition.NORMAL)
                                      AppRoute.PHONE_DIALPAD -> PhoneDialpadScreen(hardwareReport, { navigateTo(AppRoute.CONTACTS) }, UiStateCondition.NORMAL)
                                      AppRoute.CONTACTS -> ContactsScreen(deviceContacts, { permLauncher.launch(arrayOf(Manifest.permission.READ_CONTACTS)); loadDeviceContacts() }, UiStateCondition.NORMAL)
                                      AppRoute.APPS_INSTALLED -> AppsGridScreen(false, storage, UiStateCondition.NORMAL)
                                      AppRoute.APPS_FAVORITES -> AppsGridScreen(true, storage, UiStateCondition.NORMAL)
                                      AppRoute.VEHICLE_INFO -> VehicleInfoScreen(telemetry, hardwareReport, hardwareService, storage, { navigateTo(AppRoute.MAINTENANCE_MANAGER) }, UiStateCondition.NORMAL)
                                      AppRoute.TRIP_DATA -> TripDataScreen(telemetry, storage, { distanceKm = 0f; storage.persistedDistanceKm = 0f; maxSpeedKmh = 0; tripStartRealtime = SystemClock.elapsedRealtime() }, UiStateCondition.NORMAL)
                                      AppRoute.DRIVING_ANALYTICS -> DrivingAnalyticsScreen(telemetry, storage, UiStateCondition.NORMAL)
                                      AppRoute.ISLAMIC_HUB, AppRoute.PRAYER_TIMES, AppRoute.ADHKAR, AppRoute.TASBEEH, AppRoute.QIBLA, AppRoute.HIJRI_CALENDAR ->
                                          IslamicSectionScreens(currentRoute, prayers, hijriDate, 136, storage, { navigateTo(it) }, UiStateCondition.NORMAL)
                                      else -> SettingsAndSystemScreens(
                                          currentRoute, storage, hardwareReport, currentPreset, currentWallpaper,
                                          "ميديا مفعلة", lastVoiceCommandText,
                                          onPresetChange = { currentPreset = it },
                                          onWallpaperChange = { currentWallpaper = it; customWallpaperUri = null },
                                          onPickGalleryWallpaper = { galleryLauncher.launch("image/*") },
                                          onLaunchVoice = { },
                                          onSettingsUpdated = { settingsTick++ },
                                          onNavigate = { navigateTo(it) },
                                          stateCond = UiStateCondition.NORMAL
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Execute Debug & Release Builds
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk CarLauncherUniversal.apk
          cp app/build/outputs/apk/release/app-release.apk CarLauncherUniversal-v10.1-Release.apk

      - name: Push Protected v10.1 Enterprise Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B v10.1-enterprise
          git push -f origin v10.1-enterprise || true

      - name: Publish Direct APK v10.1 Full Functionality
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v10.1
          name: Car Launcher Universal v10.1 (Full Functionality Edition)
          body: |
            ### Car Launcher Universal v10.1 — Full Functionality & Customizable Dock
            - إصلاح خطأ الترجمة البرمجية (Compilation Error) الخاص بدالة `IslamicAudioSettingsScreen`.
            - استقرار تاَم لعملية بناء ملفات الـ APK عبر GitHub Actions مع تفعيل وضع `lint` الآمن.
          files: |
            CarLauncherUniversal.apk
            CarLauncherUniversal-v10.1-Release.apk
