          @Composable
          fun SongListScreen(
              tracks: List<LocalAudioTrack>,
              currentIndex: Int,
              onSelectTrack: (Int) -> Unit,
              onRefreshLibrary: () -> Unit,
              onBackToPlayer: () -> Unit
          ) {
              val preset = LocalCockpitPreset.current
              var query by remember { mutableStateOf("") }
              var selectedTab by remember { mutableStateOf("كل الأغاني") }
              val tabs = listOf("كل الأغاني", "الألبومات", "الفنانين", "المجلدات", "المفضلة", "الأخيرة")

              val filtered = tracks.filter {
                  it.title.contains(query, ignoreCase = true) || it.artist.contains(query, ignoreCase = true)
              }

              Column(Modifier.fillMaxSize().padding(6.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                      Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          tabs.forEach { tab ->
                              FilterChip(
                                  selected = selectedTab == tab,
                                  onClick = { selectedTab = tab },
                                  label = { Text(tab, fontSize = 11.sp) }
                              )
                          }
                      }
                      Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          OutlinedButton(onClick = onRefreshLibrary) { Text("فحص الذاكرة", fontSize = 11.sp) }
                          Button(onClick = onBackToPlayer, colors = ButtonDefaults.buttonColors(containerColor = DesignTokens.AmberGold)) {
                              Text("المشغل", color = Color.Black, fontWeight = FontWeight.Bold, fontSize = 11.sp)
                          }
                      }
                  }

                  OutlinedTextField(
                      value = query,
                      onValueChange = { query = it },
                      placeholder = { Text("ابحث في $selectedTab...") },
                      modifier = Modifier.fillMaxWidth(),
                      singleLine = true
                  )

                  if (filtered.isEmpty()) {
                      Box(Modifier.weight(1f).fillMaxWidth(), contentAlignment = Alignment.Center) {
                          Text("لا توجد ملفات صوتية محلية مطابقة للبحث", color = DesignTokens.TextSecondary)
                      }
                  } else {
                      LazyColumn(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                          items(filtered) { track ->
                              val idx = tracks.indexOf(track)
                              Surface(
                                  color = if (idx == currentIndex) preset.primary.copy(alpha = 0.25f) else preset.card.copy(alpha = 0.85f),
                                  shape = RoundedCornerShape(12.dp),
                                  border = BorderStroke(1.dp, if (idx == currentIndex) preset.primary else preset.border),
                                  modifier = Modifier.fillMaxWidth().clickable {
                                      onSelectTrack(idx)
                                      onBackToPlayer()
                                  }
                              ) {
                                  Row(Modifier.padding(12.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                      Column(Modifier.weight(1f)) {
                                          Text(track.title, color = DesignTokens.TextPrimary, fontWeight = FontWeight.Bold, maxLines = 1)
                                          Text("${track.artist} • ${track.album}", color = DesignTokens.TextSecondary, fontSize = 11.sp)
                                      }
                                      Icon(Icons.Default.PlayArrow, contentDescription = null, tint = preset.primary)
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun RadioFmScreen() {
              val preset = LocalCockpitPreset.current
              var freq by remember { mutableDoubleStateOf(98.2) }
              val presets = listOf(88.2 to "إذاعة القرآن الكريم", 98.2 to "نجوم FM", 100.6 to "راديو مصر", 104.2 to "ميجا FM", 105.8 to "نغم FM")

              Column(Modifier.fillMaxSize().padding(6.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  Surface(
                      color = DesignTokens.StatusWarning.copy(alpha = 0.16f),
