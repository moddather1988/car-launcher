                              Column(Modifier.padding(12.dp).fillMaxWidth(), horizontalAlignment = Alignment.CenterHorizontally) {
                                  Text(name, fontWeight = FontWeight.Bold, color = if (active) preset.primary else DesignTokens.TextSecondary)
