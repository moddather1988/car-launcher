          @Composable
          fun VehicleInfoScreen(
              telemetry: LiveDrivingTelemetry,
              hardware: HardwareDiagnosticReport,
              onOpenTripData: () -> Unit,
              onOpenCompatibility: () -> Unit
          ) {
              val preset = LocalCockpitPreset.current
              val metricsList = listOf(
                  Triple("سرعة السيارة (GPS)", "${telemetry.speedKmh ?: 0} كم/س", CompatibilityLevel.SUPPORTED),
                  Triple("سرعة دوران المحرك RPM", "يتطلب توصيل محول ELM327 OBD2", CompatibilityLevel.REQUIRES_EXTERNAL_HARDWARE),
                  Triple("درجة حرارة المحرك Coolant", "يتطلب توصيل محول ELM327 OBD2", CompatibilityLevel.REQUIRES_EXTERNAL_HARDWARE),
                  Triple("جهد بطارية السيارة Voltage", "يتطلب توصيل محول ELM327 OBD2", CompatibilityLevel.REQUIRES_EXTERNAL_HARDWARE),
                  Triple("مستوى الوقود وأكواد الأعطال DTC", "يتطلب توصيل محول ELM327 OBD2", CompatibilityLevel.REQUIRES_EXTERNAL_HARDWARE)
              )

              Column(Modifier.fillMaxSize().padding(6.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                      Text("معلومات السيارة وكمبيوتر OBD2", style = MaterialTheme.typography.titleLarge, color = DesignTokens.TextPrimary)
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
