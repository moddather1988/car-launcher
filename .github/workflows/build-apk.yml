          EOF

          # 4. CarLauncherTheme
          cat << 'EOF' > "$BASE/core/designsystem/CarLauncherTheme.kt"
          package com.universal.carlauncher.core.designsystem

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Typography
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.CompositionLocalProvider
          import androidx.compose.runtime.staticCompositionLocalOf
          import androidx.compose.ui.platform.LocalLayoutDirection
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.LayoutDirection
          import androidx.compose.ui.unit.sp

          val LocalCockpitPreset = staticCompositionLocalOf { CockpitThemePreset.MERCEDES_OBSIDIAN }

          @Composable
          fun CarLauncherTheme(
              preset: CockpitThemePreset,
              fontScaleMultiplier: Float = 1.0f,
              content: @Composable () -> Unit
          ) {
              val colors = darkColorScheme(
                  primary = preset.primary,
                  secondary = preset.secondary,
                  background = preset.background,
                  surface = preset.surface,
                  surfaceVariant = preset.card,
                  onBackground = DesignTokens.TextPrimary,
                  onSurface = DesignTokens.TextPrimary,
                  error = DesignTokens.StatusDanger
              )

              val typography = Typography(
                  displayLarge = TextStyle(fontFamily = FontFamily.SansSerif, fontWeight = FontWeight.Black, fontSize = (58 * fontScaleMultiplier).sp),
                  headlineMedium = TextStyle(fontFamily = FontFamily.SansSerif, fontWeight = FontWeight.Bold, fontSize = (26 * fontScaleMultiplier).sp),
                  titleLarge = TextStyle(fontFamily = FontFamily.SansSerif, fontWeight = FontWeight.Bold, fontSize = (19 * fontScaleMultiplier).sp),
                  titleMedium = TextStyle(fontFamily = FontFamily.SansSerif, fontWeight = FontWeight.SemiBold, fontSize = (15 * fontScaleMultiplier).sp),
                  bodyLarge = TextStyle(fontFamily = FontFamily.SansSerif, fontWeight = FontWeight.Normal, fontSize = (14 * fontScaleMultiplier).sp),
                  labelMedium = TextStyle(fontFamily = FontFamily.SansSerif, fontWeight = FontWeight.Medium, fontSize = (12 * fontScaleMultiplier).sp)
              )

              CompositionLocalProvider(
                  LocalLayoutDirection provides LayoutDirection.Rtl,
                  LocalCockpitPreset provides preset
              ) {
                  MaterialTheme(
                      colorScheme = colors,
                      typography = typography,
                      content = content
                  )
              }
          }
          EOF

          # 5. Responsive Window Engine
          cat << 'EOF' > "$BASE/core/responsive/ResponsiveWindowEngine.kt"
          package com.universal.carlauncher.core.responsive

          import android.content.res.Configuration
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.remember
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp

          enum class CockpitWindowClass {
              COMPACT_7_INCH,     // 800x480
              MEDIUM_9_INCH,      // 1024x600
              EXPANDED_10_12_INCH,// 1280x720 & 1920x1080
              PORTRAIT_VERTICAL   // Portrait / Tesla Style
          }

          data class ResponsiveLayoutMetrics(
              val windowClass: CockpitWindowClass,
              val isLandscape: Boolean,
              val widthDp: Int,
              val heightDp: Int,
              val gridColumns: Int,
              val scaleFactor: Float,
              val outerPadding: Dp,
              val gaugeDiameter: Dp
          )

          @Composable
          fun rememberResponsiveMetrics(): ResponsiveLayoutMetrics {
              val config = LocalConfiguration.current
              val w = config.screenWidthDp.coerceAtLeast(320)
              val h = config.screenHeightDp.coerceAtLeast(240)
              val isLandscape = config.orientation == Configuration.ORIENTATION_LANDSCAPE || w >= h

              return remember(w, h, isLandscape) {
                  val windowClass = when {
                      !isLandscape -> CockpitWindowClass.PORTRAIT_VERTICAL
                      w <= 850 -> CockpitWindowClass.COMPACT_7_INCH
                      w <= 1100 -> CockpitWindowClass.MEDIUM_9_INCH
                      else -> CockpitWindowClass.EXPANDED_10_12_INCH
                  }

                  val columns = when (windowClass) {
                      CockpitWindowClass.PORTRAIT_VERTICAL -> 2
                      CockpitWindowClass.COMPACT_7_INCH -> 2
                      CockpitWindowClass.MEDIUM_9_INCH -> 2
                      CockpitWindowClass.EXPANDED_10_12_INCH -> 3
                  }

                  val scale = when (windowClass) {
                      CockpitWindowClass.COMPACT_7_INCH -> 0.85f
                      CockpitWindowClass.MEDIUM_9_INCH -> 0.96f
                      CockpitWindowClass.PORTRAIT_VERTICAL -> 0.95f
                      CockpitWindowClass.EXPANDED_10_12_INCH -> 1.08f
                  }

                  val gauge = if (isLandscape) {
                      (h * 0.44f).dp.coerceIn(135.dp, 240.dp)
                  } else {
                      (w * 0.42f).dp.coerceIn(150.dp, 230.dp)
                  }

                  ResponsiveLayoutMetrics(
                      windowClass = windowClass,
                      isLandscape = isLandscape,
                      widthDp = w,
                      heightDp = h,
                      gridColumns = columns,
                      scaleFactor = scale,
                      outerPadding = if (windowClass == CockpitWindowClass.COMPACT_7_INCH) 8.dp else 12.dp,
                      gaugeDiameter = gauge
                  )
              }
          }
          EOF

          # 6. Local Storage & Persistence
          cat << 'EOF' > "$BASE/core/storage/LauncherStorage.kt"
          package com.universal.carlauncher.core.storage

          import android.content.Context
          import com.universal.carlauncher.core.designsystem.CockpitThemePreset

          class LauncherStorage(context: Context) {
              private val prefs = context.getSharedPreferences("car_launcher_v2_prefs", Context.MODE_PRIVATE)

              var themePreset: CockpitThemePreset
                  get() = runCatching {
                      CockpitThemePreset.valueOf(prefs.getString("theme", CockpitThemePreset.MERCEDES_OBSIDIAN.name)!!)
                  }.getOrDefault(CockpitThemePreset.MERCEDES_OBSIDIAN)
                  set(value) = prefs.edit().putString("theme", value.name).apply()

              var use24HourFormat: Boolean
                  get() = prefs.getBoolean("use_24h", false)
                  set(value) = prefs.edit().putBoolean("use_24h", value).apply()

              var showSeconds: Boolean
                  get() = prefs.getBoolean("show_seconds", true)
                  set(value) = prefs.edit().putBoolean("show_seconds", value).apply()

              var showHijriDate: Boolean
                  get() = prefs.getBoolean("show_hijri", true)
                  set(value) = prefs.edit().putBoolean("show_hijri", value).apply()

              var useMphUnit: Boolean
                  get() = prefs.getBoolean("use_mph", false)
                  set(value) = prefs.edit().putBoolean("use_mph", value).apply()

              var speedAlertLimit: Int
                  get() = prefs.getInt("speed_limit", 120)
                  set(value) = prefs.edit().putInt("speed_limit", value).apply()

              var circularGaugeStyle: Boolean
                  get() = prefs.getBoolean("circular_gauge", true)
                  set(value) = prefs.edit().putBoolean("circular_gauge", value).apply()

              var tasbeehCount: Int
                  get() = prefs.getInt("tasbeeh_count", 0)
                  set(value) = prefs.edit().putInt("tasbeeh_count", value).apply()

              var tasbeehTarget: Int
                  get() = prefs.getInt("tasbeeh_target", 100)
                  set(value) = prefs.edit().putInt("tasbeeh_target", value).apply()

              var fontScale: Float
                  get() = prefs.getFloat("font_scale", 1.0f)
                  set(value) = prefs.edit().putFloat("font_scale", value).apply()

              fun isCardVisible(cardKey: String): Boolean = prefs.getBoolean("card_vis_$cardKey", true)
              fun setCardVisible(cardKey: String, visible: Boolean) = prefs.edit().putBoolean("card_vis_$cardKey", visible).apply()

              fun resetAllToDefaults() {
                  prefs.edit().clear().apply()
              }
          }
          EOF

          # 7. Real Hardware & GPS Service
          cat << 'EOF' > "$BASE/core/hardware/VehicleHardwareService.kt"
          package com.universal.carlauncher.core.hardware

          import android.Manifest
          import android.bluetooth.BluetoothManager
          import android.content.Context
          import android.content.pm.PackageManager
          import android.hardware.Sensor
          import android.hardware.SensorManager
          import android.location.LocationManager
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import androidx.core.content.ContextCompat

          data class HardwareDiagnosticReport(
              val hasGpsHardware: Boolean,
              val hasLocationPermission: Boolean,
              val isGpsEnabled: Boolean,
              val hasBluetoothHardware: Boolean,
              val isBluetoothEnabled: Boolean,
              val isInternetConnected: Boolean,
              val connectionTypeAr: String,
              val hasMagnetometerCompass: Boolean,
              val hasAmbientTempSensor: Boolean
          )

          class VehicleHardwareService(private val context: Context) {
              fun inspectHardware(): HardwareDiagnosticReport {
                  val pm = context.packageManager
                  val hasGps = pm.hasSystemFeature(PackageManager.FEATURE_LOCATION_GPS)
                  val hasPerm = ContextCompat.checkSelfPermission(
                      context, Manifest.permission.ACCESS_FINE_LOCATION
                  ) == PackageManager.PERMISSION_GRANTED

                  val lm = context.getSystemService(Context.LOCATION_SERVICE) as? LocationManager
                  val gpsOn = runCatching { lm?.isProviderEnabled(LocationManager.GPS_PROVIDER) == true }.getOrDefault(false)

                  val hasBt = pm.hasSystemFeature(PackageManager.FEATURE_BLUETOOTH)
                  val bm = context.getSystemService(Context.BLUETOOTH_SERVICE) as? BluetoothManager
                  val btOn = runCatching { bm?.adapter?.isEnabled == true }.getOrDefault(false)

                  val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as? ConnectivityManager
                  val caps = cm?.getNetworkCapabilities(cm.activeNetwork)
                  val netConnected = caps != null
                  val netLabel = when {
                      caps == null -> "غير متصل (Offline)"
                      caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) -> "متصل Wi-Fi"
                      caps.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR) -> "متصل بيانات"
                      else -> "متصل"
                  }

                  val sm = context.getSystemService(Context.SENSOR_SERVICE) as? SensorManager
                  val hasCompass = sm?.getDefaultSensor(Sensor.TYPE_MAGNETIC_FIELD) != null
                  val hasTemp = sm?.getDefaultSensor(Sensor.TYPE_AMBIENT_TEMPERATURE) != null

                  return HardwareDiagnosticReport(
                      hasGpsHardware = hasGps,
                      hasLocationPermission = hasPerm,
                      isGpsEnabled = gpsOn,
                      hasBluetoothHardware = hasBt,
                      isBluetoothEnabled = btOn,
                      isInternetConnected = netConnected,
                      connectionTypeAr = netLabel,
                      hasMagnetometerCompass = hasCompass,
                      hasAmbientTempSensor = hasTemp
                  )
              }
          }
          EOF

          # 8. Offline Astronomical Prayer & Qibla Calculator
          cat << 'EOF' > "$BASE/domain/islamic/OfflinePrayerEngine.kt"
          package com.universal.carlauncher.domain.islamic

          import java.util.Calendar
          import java.util.Locale
          import java.util.TimeZone
          import kotlin.math.*

          data class DailyPrayerSchedule(
              val fajr: String,
              val sunrise: String,
              val dhuhr: String,
              val asr: String,
              val maghrib: String,
              val isha: String,
              val nextPrayerName: String,
              val nextPrayerTime: String,
              val qiblaDegrees: Int
          )

          object OfflinePrayerEngine {
              // حساب فلكي محلي دقيق بدون إنترنت (افتراضي القاهرة 30.0444, 31.2357 عند غياب GPS)
              fun calculate(lat: Double = 30.0444, lon: Double = 31.2357, fajrAngle: Double = 19.5, ishaAngle: Double = 17.5): DailyPrayerSchedule {
                  val cal = Calendar.getInstance()
                  val year = cal.get(Calendar.YEAR)
                  val month = cal.get(Calendar.MONTH) + 1
                  val day = cal.get(Calendar.DAY_OF_MONTH)
                  val tzHours = TimeZone.getDefault().getOffset(cal.timeInMillis) / 3600000.0

                  val jd = julianDate(year, month, day) - lon / (15.0 * 24.0)
                  val d = jd - 2451545.0
                  val g = fixAngle(357.529 + 0.98560028 * d)
                  val q = fixAngle(280.459 + 0.98564736 * d)
                  val l = fixAngle(q + 1.915 * sin(Math.toRadians(g)) + 0.020 * sin(Math.toRadians(2 * g)))
                  val e = 23.439 - 0.00000036 * d
                  val decl = Math.toDegrees(asin(sin(Math.toRadians(e)) * sin(Math.toRadians(l))))
                  val ra = Math.toDegrees(atan2(cos(Math.toRadians(e)) * sin(Math.toRadians(l)), cos(Math.toRadians(l)))) / 15.0
                  val eqt = q / 15.0 - fixHour(ra)

                  val dhuhrHour = fixHour(12.0 + tzHours - lon / 15.0 - eqt)
                  val sunriseHour = dhuhrHour - sunAngleTime(0.833, lat, decl)
                  val sunsetHour = dhuhrHour + sunAngleTime(0.833, lat, decl)
                  val fajrHour = dhuhrHour - sunAngleTime(fajrAngle, lat, decl)
                  val ishaHour = dhuhrHour + sunAngleTime(ishaAngle, lat, decl)
                  val asrAngle = -Math.toDegrees(atan(1.0 / (1.0 + tan(Math.toRadians(abs(lat - decl))))))
                  val asrHour = dhuhrHour + sunAngleTime(-asrAngle, lat, decl)

                  val nowHour = cal.get(Calendar.HOUR_OF_DAY) + cal.get(Calendar.MINUTE) / 60.0
                  val list = listOf(
                      "الفجر" to fajrHour,
                      "الظهر" to dhuhrHour,
                      "العصر" to asrHour,
                      "المغرب" to sunsetHour,
                      "العشاء" to ishaHour
                  )
                  val next = list.firstOrNull { it.second > nowHour } ?: ("الفجر" to fajrHour)

                  // حساب زاوية القبلة لمكة المكرمة (21.4225, 39.8262)
                  val mLat = Math.toRadians(21.4225)
                  val mLon = Math.toRadians(39.8262)
                  val uLat = Math.toRadians(lat)
                  val uLon = Math.toRadians(lon)
                  val y = sin(mLon - uLon)
                  val x = cos(uLat) * tan(mLat) - sin(uLat) * cos(mLon - uLon)
                  val qibla = ((Math.toDegrees(atan2(y, x)) + 360.0) % 360.0).toInt()

                  return DailyPrayerSchedule(
                      fajr = formatHour(fajrHour),
                      sunrise = formatHour(sunriseHour),
                      dhuhr = formatHour(dhuhrHour),
                      asr = formatHour(asrHour),
                      maghrib = formatHour(sunsetHour),
                      isha = formatHour(ishaHour),
                      nextPrayerName = next.first,
                      nextPrayerTime = formatHour(next.second),
                      qiblaDegrees = qibla
                  )
              }

              private fun sunAngleTime(angle: Double, lat: Double, decl: Double): Double {
                  val num = -sin(Math.toRadians(angle)) - sin(Math.toRadians(lat)) * sin(Math.toRadians(decl))
                  val den = cos(Math.toRadians(lat)) * cos(Math.toRadians(decl))
                  val cosVal = (num / den).coerceIn(-1.0, 1.0)
                  return Math.toDegrees(acos(cosVal)) / 15.0
              }

              private fun julianDate(year: Int, month: Int, day: Int): Double {
                  var y = year
                  var m = month
                  if (m <= 2) { y -= 1; m += 12 }
                  val a = floor(y / 100.0)
                  val b = 2 - a + floor(a / 4.0)
                  return floor(365.25 * (y + 4716)) + floor(30.6001 * (m + 1)) + day + b - 1524.5
              }

              private fun fixAngle(a: Double): Double = a - 360.0 * floor(a / 360.0)
              private fun fixHour(a: Double): Double = a - 24.0 * floor(a / 24.0)
              private fun formatHour(time: Double): String {
                  val t = fixHour(time + 0.5 / 60.0)
                  val h = floor(t).toInt()
                  val m = floor((t - h) * 60.0).toInt()
                  return String.format(Locale.US, "%02d:%02d", h, m)
              }
          }
          EOF

          # 9. Navigation Shell & Destinations
          cat << 'EOF' > "$BASE/ui/navigation/CockpitNavigationShell.kt"
          package com.universal.carlauncher.ui.navigation

          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.Icon
          import androidx.compose.material3.Surface
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.universal.carlauncher.core.designsystem.DesignTokens
          import com.universal.carlauncher.core.designsystem.LocalCockpitPreset

          enum class CockpitSection(val titleAr: String, val icon: ImageVector) {
              DASHBOARD("الرئيسية", Icons.Default.Speed),
              NAVIGATION("الملاحة", Icons.Default.Explore),
              MUSIC("الموسيقى", Icons.Default.MusicNote),
              RADIO("الراديو", Icons.Default.Radio),
              PHONE("الهاتف", Icons.Default.Call),
              ISLAMIC("الإسلامي", Icons.Default.Mosque),
              VEHICLE("السيارة", Icons.Default.DirectionsCar),
              APPS("التطبيقات", Icons.Default.Apps),
              SETTINGS("الإعدادات", Icons.Default.Settings)
          }

          @Composable
          fun CockpitNavigationShell(
              currentSection: CockpitSection,
              isLandscape: Boolean,
              onSelectSection: (CockpitSection) -> Unit,
              content: @Composable BoxScope.() -> Unit
          ) {
              val preset = LocalCockpitPreset.current
              if (isLandscape) {
                  Row(
                      modifier = Modifier.fillMaxSize().background(preset.background)
                  ) {
                      Surface(
                          color = preset.surface,
                          modifier = Modifier.width(84.dp).fillMaxHeight()
                      ) {
                          LazyColumn(
                              modifier = Modifier.fillMaxSize().padding(vertical = 8.dp),
                              verticalArrangement = Arrangement.spacedBy(6.dp),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              items(CockpitSection.entries) { section ->
                                  NavDestinationItem(
                                      section = section,
                                      selected = section == currentSection,
                                      onClick = { onSelectSection(section) }
                                  )
                              }
                          }
                      }
                      Box(modifier = Modifier.weight(1f).fillMaxHeight(), content = content)
                  }
              } else {
                  Column(
                      modifier = Modifier.fillMaxSize().background(preset.background)
                  ) {
                      Box(modifier = Modifier.weight(1f).fillMaxWidth(), content = content)
                      Surface(
                          color = preset.surface,
                          modifier = Modifier.fillMaxWidth().height(72.dp)
                      ) {
                          LazyRow(
                              modifier = Modifier.fillMaxSize().padding(horizontal = 8.dp),
                              horizontalArrangement = Arrangement.spacedBy(8.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              items(CockpitSection.entries) { section ->
                                  NavDestinationItem(
                                      section = section,
                                      selected = section == currentSection,
                                      onClick = { onSelectSection(section) }
                                  )
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun NavDestinationItem(
              section: CockpitSection,
              selected: Boolean,
              onClick: () -> Unit
          ) {
              val preset = LocalCockpitPreset.current
              Surface(
                  shape = RoundedCornerShape(DesignTokens.RadiusM),
                  color = if (selected) preset.primary.copy(alpha = 0.2f) else Color.Transparent,
                  modifier = Modifier
                      .width(72.dp)
                      .height(60.dp)
                      .clickable(onClick = onClick)
              ) {
                  Column(
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.Center,
                      modifier = Modifier.padding(4.dp)
                  ) {
                      Icon(
                          imageVector = section.icon,
                          contentDescription = section.titleAr,
                          tint = if (selected) preset.primary else DesignTokens.TextSecondary,
                          modifier = Modifier.size(22.dp)
                      )
                      Spacer(Modifier.height(3.dp))
                      Text(
                          text = section.titleAr,
                          fontSize = 11.sp,
                          fontWeight = if (selected) FontWeight.Bold else FontWeight.Normal,
                          color = if (selected) DesignTokens.TextPrimary else DesignTokens.TextSecondary,
                          maxLines = 1
                      )
                  }
              }
          }
          EOF

