          package com.universal.carlauncher

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import com.universal.carlauncher.core.audio.CentralAudioManager
          import com.universal.carlauncher.core.designsystem.CarLauncherTheme
          import com.universal.carlauncher.core.hardware.VehicleHardwareService
          import com.universal.carlauncher.core.responsive.rememberResponsiveMetrics
          import com.universal.carlauncher.core.storage.LauncherStorage
          import com.universal.carlauncher.domain.islamic.OfflinePrayerEngine
          import com.universal.carlauncher.domain.weather.MultiSourceWeatherProvider
          import com.universal.carlauncher.ui.navigation.*
          import com.universal.carlauncher.ui.screens.*
          import com.universal.carlauncher.ui.screens.DashboardScreen
          import com.universal.carlauncher.ui.screens.DockCustomizationScreen

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { CarLauncherRootApp() }
              }
          }

          @Composable
          fun CarLauncherRootApp() {
              val context = androidx.compose.ui.platform.LocalContext.current
              val storage = remember { LauncherStorage(context) }
              val hardwareService = remember { VehicleHardwareService(context) }
              val audioManager = remember { CentralAudioManager(context) }
              val metrics = rememberResponsiveMetrics()

              val backStack = remember { mutableStateListOf(AppRoute.DASHBOARD) }
              val currentRoute = backStack.lastOrNull() ?: AppRoute.DASHBOARD

              fun navigateTo(route: AppRoute) {
                  if (route == AppRoute.DASHBOARD) {
                      backStack.clear(); backStack.add(AppRoute.DASHBOARD)
                  } else if (backStack.lastOrNull() != route) {
                      backStack.add(route)
                  }
              }

              CarLauncherTheme(preset = storage.themePreset) {
                  CockpitNavigationShell(
                      currentRoute = currentRoute,
                      wallpaperPreset = storage.wallpaperPreset,
                      customWallpaperUri = storage.customWallpaperUri,
                      onNavigate = { navigateTo(it) },
                      onBack = { if (backStack.size > 1) backStack.removeAt(backStack.lastIndex) }
                  ) {
                      when (currentRoute) {
                          AppRoute.DASHBOARD -> DashboardScreen(
                              metrics, "07:52", "ص", "الأحد، 15 نوفمبر 2026", "5 جمادى الآخرة 1448 هـ",
                              LiveDrivingTelemetry(speedKmh = 20), MultiSourceWeatherProvider.getOfflineSeasonalEstimate(),
                              hardwareService.inspectHardware(), OfflinePrayerEngine.calculate(),
                              "Evening Drive QA", "MyCar Audio Test", false, storage,
                              {}, {}, {}, {}, {}, {}, {}, { navigateTo(it) }, {}
                          )
                          AppRoute.DOCK_CUSTOMIZATION -> DockCustomizationScreen(onBackToSettings = { navigateTo(AppRoute.SETTINGS_MAIN) })
                          else -> SettingsAndSystemScreens(
                              currentRoute, storage, hardwareService.inspectHardware(), storage.themePreset, storage.wallpaperPreset,
                              "", "", {}, {}, {}, {}, {}, { navigateTo(it) }, {}
                          )
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Execute Debug & Release Builds
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk CarLauncherUniversal.apk

      - name: Publish Direct APK v10.0 Phase 5
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v10.0
          name: Car Launcher Universal v10.0 (Phase 5 Full Engine)
          files: CarLauncherUniversal.apk
