          // القسم الإسلامي مع بوصلة القبلة المغناطيسية الحية التي تدور مع اتجاه الجهاز
          @Composable
          fun IslamicSectionScreens(
              route: AppRoute, prayers: DailyPrayerSchedule, hijriDate: String,
              liveAzimuthDeg: Int, storage: LauncherStorage, onNavigate: (AppRoute) -> Unit, stateCond: UiStateCondition
          ) {
              val preset = LocalCockpitPreset.current
              var tasbeeh by remember { mutableIntStateOf(storage.tasbeehCount) }
              val target = storage.tasbeehTarget
              UnifiedStateRenderer(condition = stateCond) {
                  when (route) {
                      AppRoute.ISLAMIC_HUB -> {
                          LazyVerticalGrid(columns = GridCells.Fixed(3), verticalArrangement = Arrangement.spacedBy(10.dp), horizontalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.fillMaxSize()) {
                              listOf(AppRoute.PRAYER_TIMES, AppRoute.ADHKAR, AppRoute.TASBEEH, AppRoute.QIBLA, AppRoute.HIJRI_CALENDAR).forEach { itemRoute ->
                                  item {
                                      Surface(color = DesignTokens.GlassSurface, shape = RoundedCornerShape(18.dp), border = BorderStroke(1.dp, DesignTokens.GlassBorder), modifier = Modifier.height(100.dp).clickable { onNavigate(itemRoute) }) {
                                          Column(Modifier.fillMaxSize().padding(12.dp), verticalArrangement = Arrangement.Center, horizontalAlignment = Alignment.CenterHorizontally) {
                                              Icon(itemRoute.icon, null, tint = preset.primary, modifier = Modifier.size(28.dp))
                                              Spacer(Modifier.height(6.dp))
                                              Text(itemRoute.titleAr, color = DesignTokens.TextPrimary, fontWeight = FontWeight.Bold)
                                          }
                                      }
                                  }
                              }
                          }
                      }
                      AppRoute.PRAYER_TIMES -> {
                          Surface(color = DesignTokens.GlassSurface, border = BorderStroke(1.dp, DesignTokens.GlassBorder), shape = RoundedCornerShape(22.dp), modifier = Modifier.fillMaxSize()) {
                              Column(Modifier.padding(18.dp), verticalArrangement = Arrangement.SpaceBetween) {
                                  Text("مواقيت الصلاة الخمسة", style = MaterialTheme.typography.titleLarge, color = preset.primary)
                                  Text("الصلاة القادمة: ${prayers.nextPrayerName} (${prayers.nextPrayerTime}) — ${prayers.remainingCountdownText}", color = DesignTokens.AmberGold, fontWeight = FontWeight.Bold)
                                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                      listOf("الفجر" to prayers.fajr, "الظهر" to prayers.dhuhr, "العصر" to prayers.asr, "المغرب" to prayers.maghrib, "العشاء" to prayers.isha).forEach { (n, t) ->
                                          Surface(color = DesignTokens.GlassSurface, border = BorderStroke(1.dp, DesignTokens.GlassBorder), shape = RoundedCornerShape(12.dp)) {
                                              Column(Modifier.padding(12.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                                                  Text(n, color = DesignTokens.TextSecondary, fontSize = 12.sp)
                                                  Text(t, color = DesignTokens.TextPrimary, fontWeight = FontWeight.Bold, fontSize = 15.sp)
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                      AppRoute.ADHKAR -> {
                          val list = listOf(
                              "دعاء ركوب السيارة: «سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ».",
                              "أذكار الصباح: «أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ».",
                              "أذكار المساء: «أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، اللَّهُمَّ بِكَ أَمْسَيْنَا وَبِكَ أَصْبَحْنَا».",
                              "دعاء السفر: «اللَّهُمَّ إِنَّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا الْبِرَّ وَالتَّقْوَى»."
                          )
                          LazyColumn(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              items(list) { d -> Surface(color = DesignTokens.GlassSurface, border = BorderStroke(1.dp, DesignTokens.GlassBorder), shape = RoundedCornerShape(14.dp), modifier = Modifier.fillMaxWidth()) { Text(d, color = DesignTokens.TextPrimary, modifier = Modifier.padding(14.dp)) } }
                          }
                      }
                      AppRoute.TASBEEH -> {
                          Surface(color = DesignTokens.GlassSurface, border = BorderStroke(1.dp, DesignTokens.GlassBorder), shape = RoundedCornerShape(22.dp), modifier = Modifier.fillMaxSize()) {
                              Column(Modifier.fillMaxSize().padding(18.dp), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.SpaceEvenly) {
                                  Text("المسبحة الرقمية", style = MaterialTheme.typography.titleLarge, color = preset.primary)
                                  Text("$tasbeeh / $target", fontSize = 48.sp, fontWeight = FontWeight.Black, color = DesignTokens.TextPrimary)
                                  Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                      Button(onClick = { tasbeeh++; storage.tasbeehCount = tasbeeh }, colors = ButtonDefaults.buttonColors(containerColor = DesignTokens.AmberGold)) { Text("تسبيح (+1)", color = Color.Black, fontWeight = FontWeight.Bold) }
                                      OutlinedButton(onClick = { tasbeeh = 0; storage.tasbeehCount = 0 }) { Text("تصفير") }
                                  }
                              }
                          }
                      }
                      AppRoute.QIBLA -> {
                          val relativeQiblaAngle = ((prayers.qiblaDegrees - liveAzimuthDeg + 360) % 360)
                          Surface(color = DesignTokens.GlassSurface, border = BorderStroke(1.dp, DesignTokens.GlassBorder), shape = RoundedCornerShape(22.dp), modifier = Modifier.fillMaxSize()) {
                              Row(Modifier.fillMaxSize().padding(18.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceEvenly) {
                                  Canvas(modifier = Modifier.size(145.dp)) {
                                      val r = size.minDimension / 2f
                                      drawCircle(color = preset.border, radius = r, style = Stroke(4.dp.toPx()))
                                      // مؤشر الشمال المغناطيسي الحي
                                      val northRad = Math.toRadians((-liveAzimuthDeg - 90).toDouble())
                                      drawLine(color = Color.White.copy(alpha = 0.5f), start = center, end = Offset(center.x + (r * 0.7f * cos(northRad)).toFloat(), center.y + (r * 0.7f * sin(northRad)).toFloat()), strokeWidth = 3.dp.toPx())
                                      // مؤشر اتجاه القبلة النسبي الحي
                                      val qiblaRad = Math.toRadians((relativeQiblaAngle - 90).toDouble())
                                      drawLine(color = DesignTokens.AmberGold, start = center, end = Offset(center.x + (r * 0.85f * cos(qiblaRad)).toFloat(), center.y + (r * 0.85f * sin(qiblaRad)).toFloat()), strokeWidth = 6.dp.toPx())
                                  }
                                  Column(verticalArrangement = Arrangement.spacedBy(6.dp)) {
                                      Text("بوصلة القبلة المغناطيسية الحية", style = MaterialTheme.typography.titleLarge, color = preset.primary)
                                      Text("زاوية القبلة الفلكية: ${prayers.qiblaDegrees}° • اتجاه الجهاز الحالي: $liveAzimuthDeg°", color = Color.White, fontWeight = FontWeight.Bold)
                                      Text(if (relativeQiblaAngle in 350..360 || relativeQiblaAngle in 0..10) "أنت تواجه القبلة الآن بدقة ✓" else "أدر الجهاز بزاوية $relativeQiblaAngle° لمواجهة القبلة", color = DesignTokens.AmberGold)
                                  }
                              }
                          }
                      }
                      else -> {
                          Surface(color = DesignTokens.GlassSurface, border = BorderStroke(1.dp, DesignTokens.GlassBorder), shape = RoundedCornerShape(22.dp), modifier = Modifier.fillMaxSize()) {
                              Column(Modifier.fillMaxSize().padding(18.dp), verticalArrangement = Arrangement.SpaceEvenly, horizontalAlignment = Alignment.CenterHorizontally) {
                                  Text("التقويم الهجري", style = MaterialTheme.typography.titleLarge, color = preset.primary)
                                  Text(hijriDate, fontSize = 32.sp, fontWeight = FontWeight.Black, color = DesignTokens.AmberGold)
                              }
                          }
                      }
                  }
              }
          }

