              UnifiedStateRenderer(condition = stateCond) {
                  when (route) {
                      AppRoute.SETTINGS_MAIN -> {
                          val subPages = listOf(AppRoute.SETTINGS_SUBPAGES, AppRoute.UI_CUSTOMIZATION, AppRoute.THEME_SELECTOR, AppRoute.SHORTCUTS_MANAGER, AppRoute.DEVICE_COMPATIBILITY, AppRoute.APP_INFO)
                          LazyVerticalGrid(columns = GridCells.Fixed(3), verticalArrangement = Arrangement.spacedBy(10.dp), horizontalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.fillMaxSize()) {
                              items(subPages) { page ->
                                  Card(colors = CardDefaults.cardColors(containerColor = preset.card.copy(alpha = 0.88f)), border = BorderStroke(1.dp, preset.border), modifier = Modifier.height(95.dp).clickable { onNavigate(page) }) {
                                      Column(Modifier.fillMaxSize().padding(12.dp), verticalArrangement = Arrangement.Center, horizontalAlignment = Alignment.CenterHorizontally) {
                                          Icon(page.icon, null, tint = preset.primary, modifier = Modifier.size(26.dp))
                                          Spacer(Modifier.height(6.dp))
                                          Text(page.titleAr, color = DesignTokens.TextPrimary, fontWeight = FontWeight.Bold, fontSize = 13.sp)
                                      }
                                  }
                              }
                          }
                      }
                      AppRoute.SETTINGS_SUBPAGES -> {
                          var use24h by remember { mutableStateOf(storage.use24HourFormat) }
                          var showHijri by remember { mutableStateOf(storage.showHijriDate) }
                          var useMph by remember { mutableStateOf(storage.useMphUnit) }
                          var autoBoot by remember { mutableStateOf(storage.autoStartOnBoot) }
                          LazyColumn(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                              item { ToggleRowItem("تنسيق الساعة 24 ساعة", use24h) { use24h = it; storage.use24HourFormat = it; onSettingsUpdated() } }
                              item { ToggleRowItem("إظهار التاريخ الهجري في الشاشة الرئيسية", showHijri) { showHijri = it; storage.showHijriDate = it; onSettingsUpdated() } }
                              item { ToggleRowItem("حساب السرعة بالميل (MPH) بدلًا من كم/س", useMph) { useMph = it; storage.useMphUnit = it; onSettingsUpdated() } }
                              item { ToggleRowItem("التشغيل التلقائي عند إدارة محرك السيارة (Auto Boot)", autoBoot) { autoBoot = it; storage.autoStartOnBoot = it; onSettingsUpdated() } }
                              item {
                                  Row(horizontalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.padding(top = 6.dp)) {
                                      Button(onClick = { runCatching { context.startActivity(Intent(Settings.ACTION_HOME_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) } }) { Text("تعيين كلانشر افتراضي") }
                                      OutlinedButton(onClick = { storage.resetAllToDefaults(); onPresetChange(CockpitThemePreset.PANORAMIC_TEAL); onSettingsUpdated() }) { Text("استعادة الإعدادات الافتراضية") }
                                  }
                              }
                          }
                      }
                      AppRoute.UI_CUSTOMIZATION -> {
                          var showPrayer by remember { mutableStateOf(storage.showPrayerPanel) }
                          var showTrip by remember { mutableStateOf(storage.showTripPanel) }
                          var showMusic by remember { mutableStateOf(storage.showMusicDock) }
                          var sideRail by remember { mutableStateOf(storage.useSideNavigationRail) }
                          LazyColumn(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                              item { ToggleRowItem("إظهار عمود أوقات الصلاة في الرئيسية", showPrayer) { showPrayer = it; storage.showPrayerPanel = it; onSettingsUpdated() } }
                              item { ToggleRowItem("إظهار عمود الساعة وملخص الرحلة في الرئيسية", showTrip) { showTrip = it; storage.showTripPanel = it; onSettingsUpdated() } }
                              item { ToggleRowItem("إظهار شريط المشغل الصوتي السفلي في الرئيسية", showMusic) { showMusic = it; storage.showMusicDock = it; onSettingsUpdated() } }
                              item { ToggleRowItem("تحويل شريط التنقل إلى جانبي (Side Rail) بدلًا من السفلي", sideRail) { sideRail = it; storage.useSideNavigationRail = it; onSettingsUpdated() } }
                          }
                      }
                      AppRoute.THEME_SELECTOR -> {
                          var brand by remember { mutableStateOf(storage.carBrandName) }
                          var dayMode by remember { mutableStateOf(storage.isDayMode) }
                          Column(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              ToggleRowItem("تفعيل الوضع النهاري عالي التباين (Daylight Mode)", dayMode) { dayMode = it; storage.isDayMode = it; onSettingsUpdated() }
                              Text("اختر الثيم اللوني الفاخر:", color = preset.primary, fontWeight = FontWeight.Bold)
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  CockpitThemePreset.entries.forEach { p ->
                                      FilterChip(selected = currentPreset == p, onClick = { storage.themePreset = p; onPresetChange(p) }, label = { Text(p.titleAr, fontSize = 11.sp) })
                                  }
                              }
                              Text("اختر شعار السيارة في الشريط العلوي:", color = preset.primary, fontWeight = FontWeight.Bold)
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  storage.availableBrands.forEach { b ->
                                      FilterChip(selected = brand == b, onClick = { brand = b; storage.carBrandName = b; onSettingsUpdated() }, label = { Text(b) })
                                  }
                              }
                          }
                      }
                      AppRoute.SHORTCUTS_MANAGER -> {
                          Card(colors = CardDefaults.cardColors(containerColor = preset.card.copy(alpha = 0.88f)), modifier = Modifier.fillMaxSize()) {
                              Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                                  Text("إدارة اختصارات التطبيقات المفضلة", style = MaterialTheme.typography.titleLarge, color = preset.primary)
                                  Text("عدد التطبيقات المفضلة المحفوظة: ${storage.favoritePackages.size}", color = DesignTokens.TextPrimary)
                                  Button(onClick = { onNavigate(AppRoute.APPS_FAVORITES) }) { Text("فتح وتعديل التطبيقات المفضلة") }
                              }
                          }
                      }
                      AppRoute.DEVICE_COMPATIBILITY -> {
                          val reportRows = listOf(
                              "مستقبل الأقمار الصناعية GPS" to (if (hardware.hasGpsHardware) "SUPPORTED" else "NOT SUPPORTED"),
                              "وحدة البلوتوث والاتصال" to (if (hardware.hasBluetoothHardware) "SUPPORTED" else "NOT SUPPORTED"),
                              "مستشعر البوصلة المغناطيسي" to (if (hardware.hasCompassSensor) "SUPPORTED" else "NOT SUPPORTED"),
                              "كمبيوتر السيارة OBD2 (ELM327)" to "REQUIRES EXTERNAL HARDWARE",
                              "شريحة استقبال راديو FM الداخلي" to "REQUIRES VENDOR HARDWARE"
                          )
                          LazyColumn(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                              items(reportRows) { (name, state) ->
                                  Surface(color = preset.card.copy(alpha = 0.88f), shape = RoundedCornerShape(12.dp), modifier = Modifier.fillMaxWidth()) {
                                      Row(Modifier.padding(12.dp), horizontalArrangement = Arrangement.SpaceBetween) {
                                          Text(name, color = DesignTokens.TextPrimary, fontWeight = FontWeight.Bold)
                                          Text(state, color = if (state == "SUPPORTED") DesignTokens.StatusSuccess else DesignTokens.AmberGold, fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                      }
                                  }
                              }
                          }
                      }
                      else -> {
                          Card(colors = CardDefaults.cardColors(containerColor = preset.card.copy(alpha = 0.88f)), modifier = Modifier.fillMaxSize()) {
                              Column(Modifier.padding(18.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                                  Text("CAR LAUNCHER UNIVERSAL v5.0", style = MaterialTheme.typography.headlineMedium, color = preset.primary)
                                  Text("الإصدار التجاري: 5.0.0 — Automotive Premium UI (26 Screens + Day/Night + Boot Service)", color = DesignTokens.TextPrimary, fontWeight = FontWeight.Bold)
                                  Text("متوافق 100% مع إعدادات وبيانات الإصدار v4.0", color = DesignTokens.StatusSuccess)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun ToggleRowItem(label: String, checked: Boolean, onCheckedChange: (Boolean) -> Unit) {
              val preset = LocalCockpitPreset.current
              Surface(color = preset.card.copy(alpha = 0.88f), shape = RoundedCornerShape(12.dp), modifier = Modifier.fillMaxWidth()) {
                  Row(Modifier.padding(horizontal = 14.dp, vertical = 6.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                      Text(label, color = DesignTokens.TextPrimary, fontSize = 13.sp)
                      Switch(checked = checked, onCheckedChange = onCheckedChange)
                  }
              }
          }
          EOF

