                      value = searchQuery,
                      onValueChange = { searchQuery = it },
                      placeholder = { Text("ابحث عن أغنية أو ملف صوتي...") },
                      modifier = Modifier.fillMaxWidth(),
                      singleLine = true
                  )

                  if (filtered.isEmpty()) {
                      Box(Modifier.weight(1f).fillMaxWidth(), contentAlignment = Alignment.Center) {
                          Text("لا توجد ملفات صوتية مطابقة", color = DesignTokens.TextSecondary)
                      }
