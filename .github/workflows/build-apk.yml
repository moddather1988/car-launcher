          }

          @Composable
          fun CockpitNavigationShell(
              currentRoute: AppRoute,
              useSideRail: Boolean,
              onNavigate: (AppRoute) -> Unit,
              onBack: () -> Unit,
              content: @Composable BoxScope.() -> Unit
          ) {
              val preset = LocalCockpitPreset.current
              // الشريط السفلي الرئيسي بالـ 5 أيقونات المرجعية في الصورة تمامًا (الخرائط | الهاتف | التطبيقات | الموسيقى | الراديو)
              val primaryFiveTabs = listOf(
                  AppRoute.NAVIGATION to "الخرائط",
                  AppRoute.PHONE_DIALPAD to "الهاتف",
                  AppRoute.APPS_INSTALLED to "التطبيقات",
                  AppRoute.MUSIC_PLAYER to "الموسيقى",
                  AppRoute.RADIO to "الراديو"
              )

              val siblingRoutes = AppRoute.entries.filter { it.category == currentRoute.category && it != AppRoute.DASHBOARD }

              Box(modifier = Modifier.fillMaxSize().background(preset.background)) {
                  // الخلفية البانورامية (جبال خضراء/تيفاني ليلية + طريق سريع ممتد) مطابقة للصورة المرجعية
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      val w = size.width; val h = size.height
                      drawRect(brush = Brush.verticalGradient(listOf(Color(0xFF04131D), preset.background, Color(0xFF082736), Color(0xFF05141E))))
                      val leftMountain = Path().apply {
                          moveTo(0f, h * 0.48f); lineTo(w * 0.16f, h * 0.22f); lineTo(w * 0.36f, h * 0.44f); lineTo(0f, h * 0.48f); close()
                      }
                      drawPath(leftMountain, color = Color(0xFF0E3547).copy(alpha = 0.65f))
                      val rightMountain = Path().apply {
                          moveTo(w * 0.62f, h * 0.44f); lineTo(w * 0.84f, h * 0.20f); lineTo(w, h * 0.40f); lineTo(w, h * 0.50f); lineTo(w * 0.62f, h * 0.44f); close()
                      }
                      drawPath(rightMountain, color = Color(0xFF0E3547).copy(alpha = 0.65f))

                      val road = Path().apply { moveTo(w * 0.43f, h * 0.42f); lineTo(w * 0.57f, h * 0.42f); lineTo(w * 0.82f, h); lineTo(w * 0.18f, h); close() }
                      drawPath(road, brush = Brush.verticalGradient(listOf(Color(0xFF102E40).copy(alpha = 0.45f), Color(0xFF081822).copy(alpha = 0.85f))))
                      drawLine(preset.primary.copy(alpha = 0.35f), Offset(w * 0.44f, h * 0.42f), Offset(w * 0.22f, h), 2.dp.toPx())
                      drawLine(preset.primary.copy(alpha = 0.35f), Offset(w * 0.56f, h * 0.42f), Offset(w * 0.78f, h), 2.dp.toPx())
                      drawLine(Color.White.copy(alpha = 0.22f), Offset(w * 0.50f, h * 0.45f), Offset(w * 0.50f, h), 5.dp.toPx())
                  }

                  Row(modifier = Modifier.fillMaxSize()) {
                      if (useSideRail) {
                          Surface(color = preset.card.copy(alpha = 0.85f), border = BorderStroke(1.dp, preset.border), modifier = Modifier.width(84.dp).fillMaxHeight().padding(6.dp), shape = RoundedCornerShape(22.dp)) {
                              LazyColumn(modifier = Modifier.fillMaxSize().padding(vertical = 8.dp), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.SpaceEvenly) {
                                  items(primaryFiveTabs) { (route, label) ->
                                      val sel = currentRoute == route
                                      Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.clickable { onNavigate(if (sel) AppRoute.DASHBOARD else route) }.padding(6.dp)) {
                                          Icon(route.icon, label, tint = if (sel) preset.primary else DesignTokens.TextPrimary, modifier = Modifier.size(22.dp))
                                          Text(label, fontSize = 10.sp, color = if (sel) preset.primary else DesignTokens.TextPrimary)
                                      }
                                  }
                              }
                          }
                      }

                      Column(modifier = Modifier.weight(1f).fillMaxHeight().padding(horizontal = 10.dp, vertical = 6.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                          if (currentRoute != AppRoute.DASHBOARD) {
                              Surface(color = preset.card.copy(alpha = 0.88f), shape = RoundedCornerShape(DesignTokens.RadiusM), border = BorderStroke(1.dp, preset.border), modifier = Modifier.fillMaxWidth()) {
                                  Row(modifier = Modifier.fillMaxWidth().padding(horizontal = 10.dp, vertical = 6.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                      Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                          OutlinedButton(onClick = onBack, contentPadding = PaddingValues(horizontal = 10.dp, vertical = 2.dp), modifier = Modifier.height(34.dp)) {
                                              Icon(Icons.Default.ArrowForward, null, tint = preset.primary, modifier = Modifier.size(16.dp))
                                              Spacer(Modifier.width(4.dp))
                                              Text("رجوع", fontSize = 11.sp, color = DesignTokens.TextPrimary)
                                          }
                                          Text(currentRoute.titleAr, style = MaterialTheme.typography.titleMedium, color = preset.primary)
                                      }

                                      LazyRow(modifier = Modifier.weight(1f).padding(horizontal = 10.dp), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                          items(siblingRoutes) { subRoute ->
                                              val active = subRoute == currentRoute
                                              Surface(color = if (active) DesignTokens.AmberGold else preset.cardElevated, shape = RoundedCornerShape(50), modifier = Modifier.clickable { onNavigate(subRoute) }) {
                                                  Text(subRoute.titleAr, fontSize = 11.sp, fontWeight = FontWeight.Bold, color = if (active) Color.Black else DesignTokens.TextPrimary, modifier = Modifier.padding(horizontal = 12.dp, vertical = 5.dp))
                                              }
                                          }
                                      }

                                      Button(onClick = { onNavigate(AppRoute.DASHBOARD) }, colors = ButtonDefaults.buttonColors(containerColor = preset.primary), contentPadding = PaddingValues(horizontal = 12.dp, vertical = 2.dp), modifier = Modifier.height(34.dp)) {
                                          Icon(Icons.Default.Home, null, tint = Color.Black, modifier = Modifier.size(16.dp))
                                          Spacer(Modifier.width(4.dp))
                                          Text("الرئيسية", color = Color.Black, fontWeight = FontWeight.Bold, fontSize = 11.sp)
                                      }
                                  }
                              }
                          }

                          Box(modifier = Modifier.weight(1f).fillMaxWidth(), content = content)

                          if (!useSideRail) {
                              // الشريط السفلي البانورامي ذو الـ 5 أقسام كما في الصورة المرجعية بالضبط
                              Surface(
                                  color = preset.card.copy(alpha = 0.78f),
                                  shape = RoundedCornerShape(28.dp),
                                  border = BorderStroke(1.2.dp, preset.border.copy(alpha = 0.85f)),
                                  modifier = Modifier.fillMaxWidth().height(58.dp)
                              ) {
                                  Row(modifier = Modifier.fillMaxSize(), verticalAlignment = Alignment.CenterVertically) {
                                      primaryFiveTabs.forEachIndexed { idx, (tabRoute, label) ->
                                          val isSelected = currentRoute == tabRoute
                                          Box(
                                              modifier = Modifier.weight(1f).fillMaxHeight().clickable {
                                                  if (currentRoute == tabRoute) onNavigate(AppRoute.DASHBOARD) else onNavigate(tabRoute)
                                              },
                                              contentAlignment = Alignment.Center
                                          ) {
                                              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                                  Icon(tabRoute.icon, label, tint = if (isSelected) preset.primary else DesignTokens.TextPrimary, modifier = Modifier.size(22.dp))
                                                  Spacer(Modifier.height(2.dp))
                                                  Text(label, fontSize = 12.sp, fontWeight = FontWeight.Bold, color = if (isSelected) preset.primary else DesignTokens.TextPrimary)
                                              }
                                          }
                                          if (idx < primaryFiveTabs.lastIndex) {
                                              Box(Modifier.width(1.dp).fillMaxHeight(0.55f).background(preset.border.copy(alpha = 0.55f)))
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
