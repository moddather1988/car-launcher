          @Composable
          fun QiblaCompassScreen(qiblaDegrees: Int, currentBearing: Int?) {
              val preset = LocalCockpitPreset.current
              val heading = currentBearing ?: 0

              Row(Modifier.fillMaxSize().padding(6.dp), horizontalArrangement = Arrangement.spacedBy(12.dp), verticalAlignment = Alignment.CenterVertically) {
                  Card(
                      colors = CardDefaults.cardColors(containerColor = preset.card.copy(alpha = 0.88f)),
                      border = BorderStroke(1.dp, preset.border),
                      modifier = Modifier.weight(0.5f).fillMaxHeight()
                  ) {
                      Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Canvas(Modifier.size(180.dp)) {
                              val r = size.minDimension / 2f
                              val c = Offset(size.width / 2f, size.height / 2f)
                              drawCircle(color = preset.border, radius = r, center = c, style = Stroke(4.dp.toPx()))
                              val qRad = Math.toRadians((qiblaDegrees - 90).toDouble())
                              val qEnd = Offset(c.x + (r * 0.8f * cos(qRad)).toFloat(), c.y + (r * 0.8f * sin(qRad)).toFloat())
                              drawLine(color = DesignTokens.AmberGold, start = c, end = qEnd, strokeWidth = 5.dp.toPx())
                          }
                          Text("${qiblaDegrees}°", fontSize = 26.sp, fontWeight = FontWeight.Black, color = DesignTokens.AmberGold)
                      }
                  }

                  Card(
                      colors = CardDefaults.cardColors(containerColor = preset.card.copy(alpha = 0.88f)),
                      border = BorderStroke(1.dp, preset.border),
                      modifier = Modifier.weight(0.5f).fillMaxHeight()
                  ) {
                      Column(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.Center) {
                          Text("بوصلة السيارة واتجاه القبلة", style = MaterialTheme.typography.titleLarge, color = preset.primary)
                          Spacer(Modifier.height(8.dp))
                          Text("• زاوية القبلة من موقعك: $qiblaDegrees° (جنوب شرق)", color = DesignTokens.TextPrimary)
                          Text("• اتجاه السيارة الحالي: $heading°", color = DesignTokens.TextSecondary)
                      }
                  }
              }
          }

          @Composable
          fun HijriCalendarScreen(hijriDate: String, gregorianDate: String) {
              val preset = LocalCockpitPreset.current
              val days = (1..30).toList()

              Column(Modifier.fillMaxSize().padding(6.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
