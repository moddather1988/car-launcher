          @Composable
          fun ScenicHighwayBackground() {
              val preset = LocalCockpitPreset.current
              Canvas(modifier = Modifier.fillMaxSize()) {
                  val w = size.width
                  val h = size.height
                  drawRect(
                      brush = Brush.verticalGradient(
                          colors = listOf(Color(0xFF041019), preset.background, Color(0xFF072331), Color(0xFF05131C))
                      )
                  )
                  val mountainPath = Path().apply {
                      moveTo(0f, h * 0.52f)
                      lineTo(w * 0.15f, h * 0.34f)
                      lineTo(w * 0.32f, h * 0.48f)
                      lineTo(w * 0.50f, h * 0.42f)
                      lineTo(w * 0.70f, h * 0.32f)
                      lineTo(w * 0.88f, h * 0.44f)
                      lineTo(w, h * 0.36f)
                      lineTo(w, h * 0.56f)
                      lineTo(0f, h * 0.56f)
                      close()
                  }
                  drawPath(mountainPath, color = Color(0xFF0A2636).copy(alpha = 0.55f))

                  val roadPath = Path().apply {
                      moveTo(w * 0.44f, h * 0.46f)
                      lineTo(w * 0.56f, h * 0.46f)
                      lineTo(w * 0.78f, h)
                      lineTo(w * 0.22f, h)
                      close()
                  }
                  drawPath(
                      path = roadPath,
                      brush = Brush.verticalGradient(
                          colors = listOf(Color(0xFF0F293A).copy(alpha = 0.35f), Color(0xFF091824).copy(alpha = 0.75f))
                      )
                  )
                  drawLine(preset.primary.copy(alpha = 0.30f), Offset(w * 0.45f, h * 0.46f), Offset(w * 0.25f, h), 2.dp.toPx())
                  drawLine(preset.primary.copy(alpha = 0.30f), Offset(w * 0.55f, h * 0.46f), Offset(w * 0.75f, h), 2.dp.toPx())
                  drawLine(Color.White.copy(alpha = 0.18f), Offset(w * 0.50f, h * 0.48f), Offset(w * 0.50f, h), 4.dp.toPx())
              }
          }
