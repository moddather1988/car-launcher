          import androidx.compose.ui.Modifier
          import com.universal.carlauncher.core.designsystem.CarLauncherTheme
          import com.universal.carlauncher.core.diagnostics.InAppDiagnosticsLogger
          import com.universal.carlauncher.core.hardware.VehicleHardwareService
          import com.universal.carlauncher.core.media.CarMusicEngine
          import com.universal.carlauncher.core.responsive.rememberResponsiveMetrics
          import com.universal.carlauncher.core.storage.LauncherStorage
          import com.universal.carlauncher.domain.islamic.OfflinePrayerEngine
          import com.universal.carlauncher.domain.weather.MultiSourceWeatherProvider
          import com.universal.carlauncher.ui.components.UiStateCondition
          import com.universal.carlauncher.ui.navigation.*
          import com.universal.carlauncher.ui.screens.*
          import kotlinx.coroutines.delay
          import java.time.LocalDateTime
          import java.time.format.DateTimeFormatter
          import java.util.Locale

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  InAppDiagnosticsLogger.installGlobalCrashShield()
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  setContent { CarLauncherRootApp() }
              }
          }

          @SuppressLint("MissingPermission")
          @Composable
          fun CarLauncherRootApp() {
              val context = androidx.compose.ui.platform.LocalContext.current
              val storage = remember { LauncherStorage(context) }
              val hardwareService = remember { VehicleHardwareService(context) }
              val musicEngine = remember { CarMusicEngine(context) }
              val metrics = rememberResponsiveMetrics()

              var activeDockItems by remember { mutableStateOf(storage.dockItems) }
              var currentPreset by remember { mutableStateOf(storage.themePreset) }
              var currentWallpaper by remember { mutableStateOf(storage.wallpaperPreset) }
              var customWallpaperUri by remember { mutableStateOf(storage.customWallpaperUri) }

              val backStack = remember { mutableStateListOf(AppRoute.DASHBOARD) }
              val currentRoute = backStack.lastOrNull() ?: AppRoute.DASHBOARD

              fun navigateTo(route: AppRoute) {
                  if (route == AppRoute.DASHBOARD) { backStack.clear(); backStack.add(AppRoute.DASHBOARD) }
                  else if (backStack.lastOrNull() != route) { backStack.add(route) }
              }
              fun popBack() { if (backStack.size > 1) backStack.removeAt(backStack.lastIndex) }

              val permLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                  musicEngine.checkPermissionAndScan()
              }

              LaunchedEffect(Unit) {
                  permLauncher.launch(arrayOf(musicEngine.requiredAudioPermission(), Manifest.permission.ACCESS_FINE_LOCATION))
              }

              CarLauncherTheme(preset = currentPreset) {
                  CockpitNavigationShell(
                      currentRoute = currentRoute,
                      dockItems = activeDockItems,
                      installedAppsMap = emptyMap(),
                      dockIconScale = storage.dockIconScale,
                      wallpaperPreset = currentWallpaper,
                      customWallpaperUri = customWallpaperUri,
                      useSideRail = storage.useSideNavigationRail,
                      storage = storage,
                      onNavigate = { navigateTo(it) },
                      onBack = { popBack() }
                  ) {
                      if (currentRoute == AppRoute.DASHBOARD) {
                          DashboardScreen(
                              metrics = metrics, timeFormatted = "07:52", amPmArabic = "ص", gregorianDate = "اليوم", hijriDate = "1448 هـ",
                              telemetry = LiveDrivingTelemetry(), weather = MultiSourceWeatherProvider.getOfflineSeasonalEstimate(),
                              hardware = hardwareService.inspectHardware(), prayers = OfflinePrayerEngine.calculate(),
                              currentTrackTitle = musicEngine.currentTrack()?.title ?: "مشغل الموسيقى", currentTrackArtist = musicEngine.currentTrack()?.artist ?: "جاهز",
                              isPlayingMusic = musicEngine.isPlaying, storage = storage,
                              onCycleWallpaper = { currentWallpaper = storage.cycleWallpaper() }, onLaunchVoiceCommand = {}, onResetTrip = {},
                              onToggleMusicPlay = { musicEngine.togglePlayPause() }, onNextTrack = { musicEngine.nextTrack() }, onPrevTrack = { musicEngine.prevTrack() },
                              onNavigateTo = { navigateTo(it) }, onRequestGpsPermission = {}, musicEngine = musicEngine
                          )
                      } else {
                          Column(Modifier.fillMaxSize()) {
                              Box(Modifier.weight(1f).fillMaxWidth()) {
                                  when (currentRoute) {
                                      AppRoute.DOCK_CUSTOMIZATION -> DockCustomizationEditorScreen(
                                          currentDockItems = activeDockItems, storage = storage,
                                          onSave = { storage.dockItems = it; activeDockItems = it },
                                          onBack = { popBack() }
                                      )
                                      AppRoute.MUSIC_PLAYER -> MusicPlayerFullScreen(musicEngine, storage, { permLauncher.launch(arrayOf(musicEngine.requiredAudioPermission())) }, { navigateTo(AppRoute.SONG_LIST) }, UiStateCondition.NORMAL)
                                      AppRoute.SONG_LIST -> SongListScreen(musicEngine, storage, { musicEngine.playTrackAt(it); navigateTo(AppRoute.MUSIC_PLAYER) }, { musicEngine.checkPermissionAndScan() }, UiStateCondition.NORMAL)
                                      AppRoute.RADIO -> RadioFmScreen(false, "إذاعة القرآن الكريم", { url, name -> musicEngine.playRadioStream(url, name) }, { musicEngine.stopRadioStream() }, UiStateCondition.NORMAL)
                                      else -> DashboardScreen(
                                          metrics = metrics, timeFormatted = "07:52", amPmArabic = "ص", gregorianDate = "اليوم", hijriDate = "1448 هـ",
                                          telemetry = LiveDrivingTelemetry(), weather = MultiSourceWeatherProvider.getOfflineSeasonalEstimate(),
                                          hardware = hardwareService.inspectHardware(), prayers = OfflinePrayerEngine.calculate(),
                                          currentTrackTitle = musicEngine.currentTrack()?.title ?: "مشغل الموسيقى", currentTrackArtist = musicEngine.currentTrack()?.artist ?: "جاهز",
                                          isPlayingMusic = musicEngine.isPlaying, storage = storage,
                                          onCycleWallpaper = { currentWallpaper = storage.cycleWallpaper() }, onLaunchVoiceCommand = {}, onResetTrip = {},
                                          onToggleMusicPlay = { musicEngine.togglePlayPause() }, onNextTrack = { musicEngine.nextTrack() }, onPrevTrack = { musicEngine.prevTrack() },
                                          onNavigateTo = { navigateTo(it) }, onRequestGpsPermission = {}, musicEngine = musicEngine
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }
