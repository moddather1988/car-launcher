                      }.toString(2)
                  }.getOrDefault("{}")
              }

              fun importBackupJson(jsonStr: String): Boolean {
                  return runCatching {
                      val obj = JSONObject(jsonStr)
                      if (obj.has("theme")) themePreset = CockpitThemePreset.valueOf(obj.getString("theme"))
                      if (obj.has("wallpaper")) wallpaperPreset = ScenicWallpaperPreset.valueOf(obj.getString("wallpaper"))
                      if (obj.has("carBrand")) carBrandName = obj.getString("carBrand")
                      if (obj.has("driverId")) activeDriverId = obj.getString("driverId")
                      if (obj.has("speedLimit")) speedAlertLimit = obj.getInt("speedLimit")
                      if (obj.has("tasbeehCount")) tasbeehCount = obj.getInt("tasbeehCount")
                      if (obj.has("use24h")) use24HourFormat = obj.getBoolean("use24h")
                      if (obj.has("showHijri")) showHijriDate = obj.getBoolean("showHijri")
                      if (obj.has("useMph")) useMphUnit = obj.getBoolean("useMph")
                      true
                  }.getOrDefault(false)
              }

              fun resetAllToDefaults() = prefs.edit().clear().apply()
          }
