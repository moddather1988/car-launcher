          class MainActivity : ComponentActivity() {
              private val swcKeyEvents = mutableStateOf("في انتظار ضغطة زر من عجلة القيادة...")
              private val mediaKeyAction = mutableIntStateOf(0)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  InAppDiagnosticsLogger.installGlobalCrashShield()
                  InAppDiagnosticsLogger.log("APP", "Car Launcher Universal v9.0 Feature Recovery initialized")
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  enableImmersiveMode()
                  setContent {
                      CarLauncherRootApp(
                          lastSwcKeyInfo = swcKeyEvents.value,
                          mediaActionSignal = mediaKeyAction.intValue,
                          onConsumeMediaSignal = { mediaKeyAction.intValue = 0 }
                      )
                  }
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  val keyName = KeyEvent.keyCodeToString(keyCode)
                  swcKeyEvents.value = "$keyName (Code: $keyCode)"
                  InAppDiagnosticsLogger.log("SWC", "Key captured: $keyName ($keyCode)")
                  return when (keyCode) {
                      KeyEvent.KEYCODE_MEDIA_NEXT -> { mediaKeyAction.intValue = 1; true }
                      KeyEvent.KEYCODE_MEDIA_PREVIOUS -> { mediaKeyAction.intValue = 2; true }
                      KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE, KeyEvent.KEYCODE_MEDIA_PLAY, KeyEvent.KEYCODE_MEDIA_PAUSE -> { mediaKeyAction.intValue = 3; true }
                      else -> super.onKeyDown(keyCode, event)
                  }
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) { super.onWindowFocusChanged(hasFocus); if (hasFocus) enableImmersiveMode() }
              private fun enableImmersiveMode() {
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  WindowInsetsControllerCompat(window, window.decorView).apply {
                      hide(WindowInsetsCompat.Type.systemBars())
                      systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
              }
          }

          @SuppressLint("MissingPermission")
          @Composable
          fun CarLauncherRootApp(
              lastSwcKeyInfo: String,
              mediaActionSignal: Int,
              onConsumeMediaSignal: () -> Unit
          ) {
              val context = androidx.compose.ui.platform.LocalContext.current
              val scope = rememberCoroutineScope()
              val storage = remember { LauncherStorage(context) }
              val hardwareService = remember { VehicleHardwareService(context) }
              val metrics = rememberResponsiveMetrics()

              var currentPreset by remember { mutableStateOf(storage.themePreset) }
              var currentWallpaper by remember { mutableStateOf(storage.wallpaperPreset) }
              var customWallpaperUri by remember { mutableStateOf(storage.customWallpaperUri) }
              var settingsTick by remember { mutableIntStateOf(0) }
              var lastVoiceCommandText by remember { mutableStateOf("لم يتم إصدار أمر صوتي بعد") }

              var ttsEngine by remember { mutableStateOf<TextToSpeech?>(null) }
              DisposableEffect(Unit) {
                  var instance: TextToSpeech? = null
                  instance = TextToSpeech(context) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          instance?.language = Locale("ar")
                          if (storage.voiceGreetingRule) {
                              instance?.speak("مرحباً بك في منظومة القيادة الذكية", TextToSpeech.QUEUE_FLUSH, null, "greet")
                          }
                      }
                  }
                  ttsEngine = instance
                  onDispose { runCatching { instance?.stop(); instance?.shutdown() } }
              }

              fun speakArabic(text: String) {
                  PluginRegistry.executeSandboxed("ai_copilot") {
                      ttsEngine?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "car_ai_tts")
                  }
              }

              val initialRoute = remember {
                  if (storage.restoreLastStateOnBoot) {
                      runCatching { AppRoute.valueOf(storage.lastSavedRouteName) }.getOrDefault(AppRoute.DASHBOARD)
                  } else AppRoute.DASHBOARD
              }
              val backStack = remember { mutableStateListOf(initialRoute) }
              val currentRoute = backStack.lastOrNull() ?: AppRoute.DASHBOARD
              var activeUiCondition by remember { mutableStateOf(UiStateCondition.NORMAL) }

              fun navigateTo(route: AppRoute) {
                  activeUiCondition = UiStateCondition.NORMAL
                  storage.lastSavedRouteName = route.name
                  if (route == AppRoute.DASHBOARD) {
                      backStack.clear()
                      backStack.add(AppRoute.DASHBOARD)
                  } else if (backStack.lastOrNull() != route) {
                      backStack.add(route)
                  }
              }

              fun popBack() {
                  if (backStack.size > 1) {
                      backStack.removeAt(backStack.lastIndex)
                      storage.lastSavedRouteName = backStack.last().name
                  }
              }

              val galleryLauncher = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                  if (uri != null) {
                      runCatching { context.contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION) }
                      storage.customWallpaperUri = uri.toString()
                      customWallpaperUri = uri.toString()
                  }
              }

              val voiceLauncher = rememberLauncherForActivityResult(ActivityResultContracts.StartActivityForResult()) { res ->
                  if (res.resultCode == Activity.RESULT_OK) {
                      val matches = res.data?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)
                      val spoken = matches?.firstOrNull() ?: ""
                      if (spoken.isNotBlank()) {
                          lastVoiceCommandText = spoken
                          InAppDiagnosticsLogger.log("VOICE", "Command: $spoken")
                          when {
                              spoken.contains("بطاري") || spoken.contains("فولت") || spoken.contains("سيار") -> navigateTo(AppRoute.VEHICLE_INFO)
                              spoken.contains("صيان") || spoken.contains("زيت") -> navigateTo(AppRoute.MAINTENANCE_MANAGER)
                              spoken.contains("مساعد") || spoken.contains("ذكي") -> navigateTo(AppRoute.AI_ASSISTANT)
                              spoken.contains("خرائط") || spoken.contains("ملاح") -> navigateTo(AppRoute.NAVIGATION)
                              spoken.contains("موسيق") || spoken.contains("أغان") -> navigateTo(AppRoute.MUSIC_PLAYER)
                              spoken.contains("راديو") || spoken.contains("إذاع") || spoken.contains("قرآن") -> navigateTo(AppRoute.RADIO)
                              spoken.contains("صلا") || spoken.contains("قبلة") -> navigateTo(AppRoute.QIBLA)
                              spoken.contains("بروجكتور") || spoken.contains("زجاج") || spoken.contains("hud", true) -> navigateTo(AppRoute.HUD_PROJECTOR)
                              spoken.contains("إعدادات") -> navigateTo(AppRoute.SETTINGS_MAIN)
                              spoken.contains("رئيسي") -> navigateTo(AppRoute.DASHBOARD)
                          }
                      }
                  }
              }

              fun triggerVoiceAssistant() {
                  runCatching {
                      val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ar-EG")
                          putExtra(RecognizerIntent.EXTRA_PROMPT, "تحدث بالأمر الصوتي...")
                      }
                      voiceLauncher.launch(intent)
                  }.onFailure { lastVoiceCommandText = "محرك الصوت غير متاح" }
              }

              var timeFormatted by remember { mutableStateOf("07:52") }
              var amPmArabic by remember { mutableStateOf("ص") }
              var gregorianDate by remember { mutableStateOf("") }
              var hijriDate by remember { mutableStateOf("") }
              var tripStartRealtime by remember { mutableLongStateOf(SystemClock.elapsedRealtime()) }
              var durationMinutes by remember { mutableIntStateOf(0) }

              var liveSpeedKmh by remember { mutableStateOf<Int?>(null) }
              var accuracyMeters by remember { mutableStateOf<Int?>(null) }
              var distanceKm by remember { mutableFloatStateOf(storage.persistedDistanceKm) }
              var maxSpeedKmh by remember { mutableIntStateOf(0) }
              var bearingDeg by remember { mutableIntStateOf(136) }
              var magneticAzimuthDeg by remember { mutableIntStateOf(136) }
              var currentLat by remember { mutableStateOf<Double?>(null) }
              var currentLon by remember { mutableStateOf<Double?>(null) }
              var lastLoc by remember { mutableStateOf<Location?>(null) }
              var hardwareReport by remember { mutableStateOf(hardwareService.inspectHardware()) }
              var weatherSnapshot by remember { mutableStateOf(MultiSourceWeatherProvider.getOfflineSeasonalEstimate()) }

              var audioTracks by remember { mutableStateOf<List<LocalAudioTrack>>(emptyList()) }
              var deviceContacts by remember { mutableStateOf<List<DeviceContactItem>>(emptyList()) }
              var currentTrackIdx by remember { mutableIntStateOf(0) }
              var isPlayingMusic by remember { mutableStateOf(false) }
              var isRadioStreamPlaying by remember { mutableStateOf(false) }
              var activeRadioStreamName by remember { mutableStateOf("اختر محطة للبث المباشر أو افتح شريحة FM") }
              var audioPosMs by remember { mutableIntStateOf(0) }
              var audioDurationMs by remember { mutableIntStateOf(1) }
              var shuffleMode by remember { mutableStateOf(false) }
              var repeatMode by remember { mutableStateOf(false) }
              val mediaPlayer = remember { MediaPlayer() }
              val toneGen = remember { runCatching { ToneGenerator(AudioManager.STREAM_NOTIFICATION, 75) }.getOrNull() }

              // ربط حقيقي بمستشعر البوصلة المغناطيسية والتسارع (Real Magnetometer + Accelerometer Sensor Fusion)
              DisposableEffect(Unit) {
                  val sm = context.getSystemService(Context.SENSOR_SERVICE) as? SensorManager
                  val accel = sm?.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)
                  val mag = sm?.getDefaultSensor(Sensor.TYPE_MAGNETIC_FIELD)
                  val gravity = FloatArray(3)
                  val geomagnetic = FloatArray(3)
                  var hasGravity = false
                  var hasMag = false

                  val sensorListener = object : SensorEventListener {
                      override fun onSensorChanged(event: SensorEvent?) {
                          if (event == null) return
                          if (event.sensor.type == Sensor.TYPE_ACCELEROMETER) {
                              System.arraycopy(event.values, 0, gravity, 0, 3)
                              hasGravity = true
                          } else if (event.sensor.type == Sensor.TYPE_MAGNETIC_FIELD) {
                              System.arraycopy(event.values, 0, geomagnetic, 0, 3)
                              hasMag = true
                          }
                          if (hasGravity && hasMag) {
                              val r = FloatArray(9)
                              val i = FloatArray(9)
                              if (SensorManager.getRotationMatrix(r, i, gravity, geomagnetic)) {
                                  val orientation = FloatArray(3)
                                  SensorManager.getOrientation(r, orientation)
                                  val deg = ((Math.toDegrees(orientation[0].toDouble()) + 360.0) % 360.0).roundToInt()
                                  magneticAzimuthDeg = deg
                              }
                          }
                      }
                      override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}
                  }

                  if (accel != null && mag != null) {
                      sm.registerListener(sensorListener, accel, SensorManager.SENSOR_DELAY_UI)
                      sm.registerListener(sensorListener, mag, SensorManager.SENSOR_DELAY_UI)
                  }
                  onDispose { runCatching { sm?.unregisterListener(sensorListener) } }
              }

              // قراءة جهات الاتصال الفعلية من الهاتف/الشاشة
              fun loadDeviceContacts() {
                  if (ContextCompat.checkSelfPermission(context, Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED) return
                  val list = mutableListOf<DeviceContactItem>()
                  runCatching {
                      context.contentResolver.query(
                          ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                          arrayOf(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER),
                          null, null,
                          "${ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME} ASC"
                      )?.use { c ->
                          val nCol = c.getColumnIndexOrThrow(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME)
                          val pCol = c.getColumnIndexOrThrow(ContactsContract.CommonDataKinds.Phone.NUMBER)
                          while (c.moveToNext() && list.size < 100) {
                              val name = c.getString(nCol) ?: continue
                              val phone = c.getString(pCol) ?: continue
                              list.add(DeviceContactItem(name, phone))
                          }
                      }
                  }
                  deviceContacts = list.distinctBy { it.name + it.phone }
              }

              fun loadDeviceAudio() {
                  val list = mutableListOf<LocalAudioTrack>()
                  runCatching {
                      context.contentResolver.query(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, arrayOf(MediaStore.Audio.Media._ID, MediaStore.Audio.Media.TITLE, MediaStore.Audio.Media.ARTIST), "${MediaStore.Audio.Media.IS_MUSIC} != 0", null, "${MediaStore.Audio.Media.TITLE} ASC")?.use { c ->
                          val idC = c.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                          val tC = c.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE)
                          val aC = c.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST)
                          while (c.moveToNext() && list.size < 120) {
                              val id = c.getLong(idC)
                              list.add(LocalAudioTrack(id, c.getString(tC) ?: "مقطع صوتي", c.getString(aC) ?: "MyCar Audio", ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, id)))
                          }
                      }
                  }
                  audioTracks = list
              }

              fun playTrackAt(index: Int) {
                  val track = audioTracks.getOrNull(index) ?: return
                  runCatching {
                      isRadioStreamPlaying = false
                      mediaPlayer.reset()
                      mediaPlayer.setDataSource(context, track.uri)
                      mediaPlayer.prepare()
                      mediaPlayer.start()
                      currentTrackIdx = index
                      isPlayingMusic = true
                      audioDurationMs = mediaPlayer.duration.coerceAtLeast(1)
                      mediaPlayer.setOnCompletionListener {
                          if (repeatMode) playTrackAt(currentTrackIdx)
                          else if (audioTracks.isNotEmpty()) {
                              val next = if (shuffleMode) audioTracks.indices.random() else (currentTrackIdx + 1) % audioTracks.size
                              playTrackAt(next)
                          }
                      }
                  }
              }

              fun playRadioStreamUrl(url: String, stationTitle: String) {
                  scope.launch {
                      runCatching {
                          isPlayingMusic = false
                          mediaPlayer.reset()
                          mediaPlayer.setDataSource(url)
                          mediaPlayer.setOnPreparedListener { mp ->
                              mp.start()
                              isRadioStreamPlaying = true
                              activeRadioStreamName = "يعمل الآن: $stationTitle"
                          }
                          mediaPlayer.prepareAsync()
                      }.onFailure {
                          activeRadioStreamName = "تعذر الاتصال بالبث المباشر (تأكد من الإنترنت)"
                      }
                  }
              }

              LaunchedEffect(mediaActionSignal) {
                  if (mediaActionSignal != 0) {
                      when (mediaActionSignal) {
                          1 -> if (audioTracks.isNotEmpty()) playTrackAt((currentTrackIdx + 1) % audioTracks.size)
                          2 -> if (audioTracks.isNotEmpty()) playTrackAt((currentTrackIdx - 1 + audioTracks.size) % audioTracks.size)
                          3 -> {
                              if (isPlayingMusic) { runCatching { mediaPlayer.pause() }; isPlayingMusic = false }
                              else if (audioTracks.isNotEmpty()) playTrackAt(currentTrackIdx)
                          }
                      }
                      onConsumeMediaSignal()
                  }
              }

              fun refreshWeatherNow() {
                  scope.launch {
                      val mode = storage.weatherSourceMode
                      if (mode == 2 || !hardwareReport.isInternetConnected) {
                          weatherSnapshot = MultiSourceWeatherProvider.getOfflineSeasonalEstimate()
                      } else {
                          val live = MultiSourceWeatherProvider.fetchLiveOpenMeteo(currentLat ?: 30.0444, currentLon ?: 31.2357)
                          weatherSnapshot = live ?: MultiSourceWeatherProvider.getOfflineSeasonalEstimate()
                      }
                  }
              }

              val permLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                  hardwareReport = hardwareService.inspectHardware()
                  loadDeviceAudio()
                  loadDeviceContacts()
                  refreshWeatherNow()
              }

              LaunchedEffect(Unit) {
                  val perms = mutableListOf(
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION,
                      Manifest.permission.READ_CONTACTS
                  )
                  if (Build.VERSION.SDK_INT >= 33) perms.add(Manifest.permission.READ_MEDIA_AUDIO) else perms.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                  if (Build.VERSION.SDK_INT >= 31) perms.add(Manifest.permission.BLUETOOTH_CONNECT)
                  permLauncher.launch(perms.toTypedArray())
                  loadDeviceAudio()
                  loadDeviceContacts()
                  refreshWeatherNow()
              }

              DisposableEffect(hardwareReport.hasLocationPermission) {
                  val lm = context.getSystemService(Context.LOCATION_SERVICE) as? LocationManager
                  val listener = LocationListener { loc ->
                      val spd = if (loc.hasSpeed()) (loc.speed * 3.6f).toInt() else 0
                      liveSpeedKmh = spd; accuracyMeters = loc.accuracy.toInt(); currentLat = loc.latitude; currentLon = loc.longitude
                      if (loc.hasBearing()) bearingDeg = loc.bearing.toInt()
                      if (spd > maxSpeedKmh) maxSpeedKmh = spd
                      if (spd >= storage.speedAlertLimit && storage.audioSpeedAlertEnabled) {
                          runCatching { toneGen?.startTone(ToneGenerator.TONE_PROP_BEEP, 180) }
                      }
                      AutomationEngine.executeRealTimeRules(
                          speedKmh = spd,
                          durationMinutes = durationMinutes,
                          isPlayingMusic = isPlayingMusic,
                          onStartMusic = { if (audioTracks.isNotEmpty()) playTrackAt(currentTrackIdx) },
                          onApplyNightMode = { isDay -> storage.isDayMode = isDay },
                          onSpeakAlert = { msg -> speakArabic(msg) }
                      )
                      lastLoc?.let { prev ->
                          val d = prev.distanceTo(loc)
                          if (d > 3f && loc.accuracy <= 35f) {
                              val deltaKm = d / 1000f
                              distanceKm += deltaKm
                              storage.persistedDistanceKm = distanceKm
                              storage.totalOdometerKm += deltaKm
                          }
                      }
                      lastLoc = loc
                  }
                  if (hardwareReport.hasLocationPermission && lm != null) runCatching { lm.requestLocationUpdates(LocationManager.GPS_PROVIDER, 1000L, 1f, listener) }
                  onDispose {
                      runCatching { lm?.removeUpdates(listener) }
                      runCatching { mediaPlayer.release() }
                      runCatching { toneGen?.release() }
                  }
              }

              LaunchedEffect(settingsTick) {
                  val hijriMonths = arrayOf("محرم", "صفر", "ربيع الأول", "ربيع الآخر", "جمادى الأولى", "جمادى الآخرة", "رجب", "شعبان", "رمضان", "شوال", "ذو القعدة", "ذو الحجة")
                  var sec = 0
                  while (true) {
                      val now = LocalDateTime.now()
                      timeFormatted = now.format(DateTimeFormatter.ofPattern(if (storage.use24HourFormat) "HH:mm" else "hh:mm", Locale.US))
                      amPmArabic = if (now.hour < 12) "ص" else "م"
                      gregorianDate = now.format(DateTimeFormatter.ofPattern("EEEE، d MMMM yyyy", Locale("ar", "EG")))
                      val hijri = HijrahDate.now()
                      hijriDate = "${hijri.get(ChronoField.DAY_OF_MONTH)} ${hijriMonths[(hijri.get(ChronoField.MONTH_OF_YEAR) - 1).coerceIn(0, 11)]} ${hijri.get(ChronoField.YEAR)} هـ"
                      durationMinutes = ((SystemClock.elapsedRealtime() - tripStartRealtime) / 60000L).toInt()
                      if (isPlayingMusic) {
                          runCatching {
                              audioPosMs = mediaPlayer.currentPosition
                              audioDurationMs = mediaPlayer.duration.coerceAtLeast(1)
                          }
                      }
                      if (sec % 6 == 0) hardwareReport = hardwareService.inspectHardware()
                      sec++; delay(1000L)
                  }
              }

              val prayers = remember(currentLat, currentLon, timeFormatted) { OfflinePrayerEngine.calculate(currentLat ?: 30.0444, currentLon ?: 31.2357) }
              val activeVehicle = storage.getActiveVehicle()
              val fuelUsed = (distanceKm / 100f) * activeVehicle.fuelLitersPer100Km
              val avgSpd = if (durationMinutes > 0) ((distanceKm / (durationMinutes / 60f)).toInt()).coerceIn(0, maxSpeedKmh.coerceAtLeast(1)) else 0
              val ecoScore = (100 - ((maxSpeedKmh - storage.speedAlertLimit).coerceAtLeast(0) / 2)).coerceIn(60, 100)
              val oilRem = (activeVehicle.oilIntervalKm - (storage.totalOdometerKm - storage.lastOilChangeKm).toInt()).coerceAtLeast(0)

              val telemetry = LiveDrivingTelemetry(
                  speedKmh = liveSpeedKmh,
                  accuracyMeters = accuracyMeters,
                  distanceKm = distanceKm,
                  maxSpeedKmh = maxSpeedKmh,
                  avgSpeedKmh = avgSpd,
                  durationMinutes = durationMinutes,
                  bearingDegrees = bearingDeg,
                  magneticAzimuthDeg = magneticAzimuthDeg,
                  fuelUsedLiters = fuelUsed,
                  ecoScorePercent = ecoScore,
                  oilRemainingKm = oilRem
              )

              val effectiveDayMode = if (storage.autoNightModeRule) {
                  val hr = LocalDateTime.now().hour
                  hr in 6..17 && storage.isDayMode
              } else storage.isDayMode

              CarLauncherTheme(preset = currentPreset, isDayMode = effectiveDayMode, fontScaleMultiplier = metrics.scaleFactor) {
                  CockpitNavigationShell(
                      currentRoute = currentRoute,
                      wallpaperPreset = currentWallpaper,
                      customWallpaperUri = customWallpaperUri,
                      useSideRail = storage.useSideNavigationRail,
                      onNavigate = { navigateTo(it) },
                      onBack = { popBack() }
                  ) {
                      if (currentRoute == AppRoute.DASHBOARD) {
                          DashboardScreen(
                              metrics, timeFormatted, amPmArabic, gregorianDate, hijriDate, telemetry, weatherSnapshot, hardwareReport, prayers,
                              if (isRadioStreamPlaying) activeRadioStreamName else (audioTracks.getOrNull(currentTrackIdx)?.title ?: "Evening Drive QA"),
                              audioTracks.getOrNull(currentTrackIdx)?.artist ?: "MyCar Audio Test",
                              isPlayingMusic || isRadioStreamPlaying, storage,
                              onCycleWallpaper = {
                                  currentWallpaper = storage.cycleWallpaper()
                                  customWallpaperUri = null
                              },
                              onLaunchVoiceCommand = { triggerVoiceAssistant() },
                              onSpeakSummary = {
                                  speakArabic("سرعتك الحالية ${liveSpeedKmh ?: 0} كيلومتر في الساعة، وفولت البطارية ${hardwareReport.batteryVoltageVolts} فولت، والصلاة القادمة ${prayers.nextPrayerName} الساعة ${prayers.nextPrayerTime}.")
                              },
                              onToggleMusicPlay = {
                                  if (isRadioStreamPlaying) {
                                      runCatching { mediaPlayer.stop() }
                                      isRadioStreamPlaying = false
                                  } else {
                                      if (audioTracks.isEmpty()) loadDeviceAudio()
                                      if (isPlayingMusic) { runCatching { mediaPlayer.pause() }; isPlayingMusic = false }
                                      else if (audioTracks.isNotEmpty()) playTrackAt(currentTrackIdx)
                                  }
                              },
                              onNextTrack = { if (audioTracks.isNotEmpty()) playTrackAt(if (shuffleMode) audioTracks.indices.random() else (currentTrackIdx + 1) % audioTracks.size) },
                              onPrevTrack = { if (audioTracks.isNotEmpty()) playTrackAt((currentTrackIdx - 1 + audioTracks.size) % audioTracks.size) },
                              onResetTrip = { distanceKm = 0f; storage.persistedDistanceKm = 0f; maxSpeedKmh = 0; tripStartRealtime = SystemClock.elapsedRealtime() },
                              onNavigateTo = { navigateTo(it) },
                              onRequestGpsPermission = { permLauncher.launch(arrayOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION)) }
                          )
                      } else {
                          Column(Modifier.fillMaxSize()) {
                              StateConditionSelectorBar(currentState = activeUiCondition, onSelectState = { activeUiCondition = it })
                              Box(Modifier.weight(1f).fillMaxWidth()) {
                                  when (currentRoute) {
                                      AppRoute.AI_ASSISTANT -> SmartAiAssistantScreen(telemetry, hardwareReport, prayers, weatherSnapshot, { speakArabic(it) }, { triggerVoiceAssistant() }, { navigateTo(it) }, activeUiCondition)
                                      AppRoute.MAINTENANCE_MANAGER -> MaintenanceManagerScreen(storage, { speakArabic(it) }, activeUiCondition)
                                      AppRoute.SPEEDOMETER_FULL -> SpeedometerDedicatedScreen(telemetry, storage, { navigateTo(AppRoute.HUD_PROJECTOR) }, activeUiCondition)
                                      AppRoute.HUD_PROJECTOR -> HudProjectorScreen(telemetry, storage)
                                      AppRoute.NAVIGATION -> NavigationMapScreen(telemetry, currentLat, currentLon, storage, activeUiCondition)
                                      AppRoute.WEATHER -> WeatherDetailScreen(weatherSnapshot, storage, { refreshWeatherNow() }, activeUiCondition)
                                      AppRoute.MUSIC_PLAYER -> MusicPlayerFullScreen(
                                          audioTracks, currentTrackIdx, isPlayingMusic,
                                          audioPosMs, audioDurationMs,
                                          onSeekTo = { newPos -> runCatching { mediaPlayer.seekTo(newPos); audioPosMs = newPos } },
                                          shuffleMode, repeatMode, storage,
                                          onTogglePlay = { if (isPlayingMusic) { runCatching { mediaPlayer.pause() }; isPlayingMusic = false } else if (audioTracks.isNotEmpty()) playTrackAt(currentTrackIdx) },
                                          onNext = { if (audioTracks.isNotEmpty()) playTrackAt(if (shuffleMode) audioTracks.indices.random() else (currentTrackIdx + 1) % audioTracks.size) },
                                          onPrev = { if (audioTracks.isNotEmpty()) playTrackAt((currentTrackIdx - 1 + audioTracks.size) % audioTracks.size) },
                                          onToggleShuffle = { shuffleMode = !shuffleMode },
                                          onToggleRepeat = { repeatMode = !repeatMode },
                                          onOpenSongList = { navigateTo(AppRoute.SONG_LIST) },
                                          stateCond = activeUiCondition
                                      )
                                      AppRoute.SONG_LIST -> SongListScreen(audioTracks, currentTrackIdx, storage, { playTrackAt(it); navigateTo(AppRoute.MUSIC_PLAYER) }, { loadDeviceAudio() }, activeUiCondition)
                                      AppRoute.RADIO -> RadioFmScreen(
                                          isStreamPlaying = isRadioStreamPlaying,
                                          activeStreamTitle = activeRadioStreamName,
                                          onPlayStreamUrl = { url, name -> playRadioStreamUrl(url, name) },
                                          onStopStream = { runCatching { mediaPlayer.stop() }; isRadioStreamPlaying = false },
                                          stateCond = activeUiCondition
                                      )
                                      AppRoute.PHONE_DIALPAD -> PhoneDialpadScreen(hardwareReport, { navigateTo(AppRoute.CONTACTS) }, activeUiCondition)
                                      AppRoute.CONTACTS -> ContactsScreen(
                                          contacts = deviceContacts,
                                          onRequestContactsPerm = { permLauncher.launch(arrayOf(Manifest.permission.READ_CONTACTS)); loadDeviceContacts() },
                                          stateCond = activeUiCondition
                                      )
                                      AppRoute.APPS_INSTALLED -> AppsGridScreen(false, storage, activeUiCondition)
                                      AppRoute.APPS_FAVORITES -> AppsGridScreen(true, storage, activeUiCondition)
                                      AppRoute.VEHICLE_INFO -> VehicleInfoScreen(telemetry, hardwareReport, hardwareService, storage, { navigateTo(AppRoute.MAINTENANCE_MANAGER) }, activeUiCondition)
                                      AppRoute.TRIP_DATA -> TripDataScreen(telemetry, storage, { distanceKm = 0f; storage.persistedDistanceKm = 0f; maxSpeedKmh = 0; tripStartRealtime = SystemClock.elapsedRealtime() }, activeUiCondition)
                                      AppRoute.DRIVING_ANALYTICS -> DrivingAnalyticsScreen(telemetry, storage, activeUiCondition)
                                      AppRoute.ISLAMIC_HUB, AppRoute.PRAYER_TIMES, AppRoute.ADHKAR, AppRoute.TASBEEH, AppRoute.QIBLA, AppRoute.HIJRI_CALENDAR ->
                                          IslamicSectionScreens(currentRoute, prayers, hijriDate, magneticAzimuthDeg, storage, { navigateTo(it) }, activeUiCondition)
                                      else -> SettingsAndSystemScreens(
                                          currentRoute, storage, hardwareReport, currentPreset, currentWallpaper,
                                          lastSwcKeyInfo, lastVoiceCommandText,
                                          onPresetChange = { currentPreset = it },
                                          onWallpaperChange = { currentWallpaper = it; customWallpaperUri = null },
                                          onPickGalleryWallpaper = { galleryLauncher.launch("image/*") },
                                          onLaunchVoice = { triggerVoiceAssistant() },
                                          onSettingsUpdated = { settingsTick++ },
                                          onNavigate = { navigateTo(it) },
                                          stateCond = activeUiCondition
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Execute Debug & Release Builds
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk CarLauncherUniversal.apk
          cp app/build/outputs/apk/release/app-release.apk CarLauncherUniversal-v9.0-Release.apk

      - name: Push Protected v9.0 Recovery Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B v9.0-recovery
          git push -f origin v9.0-recovery || true

      - name: Publish Direct APK v9.0 Feature Recovery
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v9.0
          name: Car Launcher Universal v9.0 (Feature Recovery Edition)
          body: |
            ### Car Launcher Universal v9.0 — Feature Recovery Edition
            - إصلاح وتفعيل 100% من الوظائف الشكلية والمعطلة مع الحفاظ الكامل على التصميم الزجاجي البانورامي:
              1. ربط حقيقي بمستشعر البوصلة المغناطيسي (`TYPE_MAGNETIC_FIELD` + `TYPE_ACCELEROMETER`) لتوجيه القبلة والبوصلة لحظياً.
              2. ربط حقيقي بجهات اتصال الهاتف (`ContactsContract`) مع البحث والاتصال المباشر.
              3. عميل Bluetooth SPP حقيقي للاتصال بقطعة `ELM327 OBD-II` وقراءة `RPM` والحرارة + قراءة الفولت والحرارة الفعلية من `BatteryManager`.
              4. راديو FM هجين (فتح شريحة FM الداخلية للشاشة + بث إذاعي حي لإذاعة القرآن الكريم من القاهرة).
              5. شريط تقدم حي (`Live SeekBar`) لتقديم وتأخير المقاطع الصوتية في مشغل الموسيقى.
          files: |
            CarLauncherUniversal.apk
            CarLauncherUniversal-v9.0-Release.apk
