          import android.net.NetworkCapabilities
          import android.os.Build
          import androidx.core.content.ContextCompat

          enum class CompatibilityLevel(val labelAr: String, val badgeText: String) {
              SUPPORTED("مدعوم وجاهز", "SUPPORTED"),
              REQUIRES_EXTERNAL_HARDWARE("يتطلب جهازًا خارجيًا", "REQUIRES EXTERNAL HARDWARE"),
              NOT_SUPPORTED("غير مدعوم على الجهاز الحالي", "NOT SUPPORTED")
          }

          data class HardwareCapabilityItem(
              val nameAr: String,
              val detailsAr: String,
              val level: CompatibilityLevel
          )

          data class HardwareDiagnosticReport(
              val androidVersion: String = "Android ${Build.VERSION.RELEASE} (API ${Build.VERSION.SDK_INT})",
              val deviceModel: String = "${Build.MANUFACTURER} ${Build.MODEL}",
              val hasGpsHardware: Boolean = true,
              val hasLocationPermission: Boolean = true,
              val isGpsEnabled: Boolean = true,
              val hasBluetoothHardware: Boolean = true,
              val isBluetoothEnabled: Boolean = true,
              val isInternetConnected: Boolean = false,
              val connectionTypeAr: String = "Offline",
              val hasMagnetometerCompass: Boolean = true,
              val hasAccelerometer: Boolean = true,
              val hasAmbientTempSensor: Boolean = false,
              val hasMicrophone: Boolean = true,
              val hasUsbHost: Boolean = true
          ) {
              fun toCapabilityMatrix(): List<HardwareCapabilityItem> = listOf(
                  HardwareCapabilityItem(
                      "مستقبل الأقمار الصناعية GPS",
                      if (!hasGpsHardware) "الشاشة لا تحتوي على شريحة GPS" else if (!hasLocationPermission) "بانتظار منح صلاحية الموقع" else if (!isGpsEnabled) "مغلق من الإعدادات" else "نشط وجاهز لقراءة السرعة والموقع",
                      if (hasGpsHardware) CompatibilityLevel.SUPPORTED else CompatibilityLevel.NOT_SUPPORTED
                  ),
                  HardwareCapabilityItem(
                      "اتصال البلوتوث Bluetooth",
                      if (!hasBluetoothHardware) "غير متوفر" else if (isBluetoothEnabled) "مفعل ومتاح للهاتف وOBD2" else "مغلق حاليًا",
                      if (hasBluetoothHardware) CompatibilityLevel.SUPPORTED else CompatibilityLevel.NOT_SUPPORTED
                  ),
                  HardwareCapabilityItem(
                      "الاتصال بالشبكة Wi-Fi / Cellular",
                      connectionTypeAr,
                      CompatibilityLevel.SUPPORTED
                  ),
                  HardwareCapabilityItem(
                      "مستشعر البوصلة المغناطيسي Magnetometer",
                      if (hasMagnetometerCompass) "متوفر لتوجيه البوصلة والقبلة" else "غير مدمج بالشاشة (يعتمد على اتجاه حركة GPS)",
                      if (hasMagnetometerCompass) CompatibilityLevel.SUPPORTED else CompatibilityLevel.NOT_SUPPORTED
                  ),
                  HardwareCapabilityItem(
                      "كمبيوتر السيارة والأعطال OBD2 (ELM327)",
                      "قراءة RPM وحرارة المحرك والجهد وأكواد الأعطال DTC عبر Bluetooth/USB",
                      CompatibilityLevel.REQUIRES_EXTERNAL_HARDWARE
                  ),
                  HardwareCapabilityItem(
                      "مستقبل الراديو الأرضي FM Tuner SPI",
                      "لا توجد واجهة Android قياسية موثقة لشريحة FM على هذا الجهاز",
                      CompatibilityLevel.NOT_SUPPORTED
                  ),
                  HardwareCapabilityItem(
                      "حساس درجة الحرارة الخارجية Ambient Sensor",
                      if (hasAmbientTempSensor) "مدمج بالجهاز" else "يتطلب حساس سيارة أو اتصال إنترنت",
                      if (hasAmbientTempSensor) CompatibilityLevel.SUPPORTED else CompatibilityLevel.REQUIRES_EXTERNAL_HARDWARE
                  ),
                  HardwareCapabilityItem(
                      "منفذ الفلاشة والملحقات USB Host",
                      if (hasUsbHost) "مدعوم لتشغيل الصوتيات وملحقات USB" else "غير مدعوم",
                      if (hasUsbHost) CompatibilityLevel.SUPPORTED else CompatibilityLevel.NOT_SUPPORTED
                  )
              )
          }

          class VehicleHardwareService(private val context: Context) {
              fun inspectHardware(): HardwareDiagnosticReport {
                  val pm = context.packageManager
                  val hasGps = pm.hasSystemFeature(PackageManager.FEATURE_LOCATION_GPS)
                  val hasPerm = ContextCompat.checkSelfPermission(
                      context, Manifest.permission.ACCESS_FINE_LOCATION
                  ) == PackageManager.PERMISSION_GRANTED

                  val lm = context.getSystemService(Context.LOCATION_SERVICE) as? LocationManager
                  val gpsOn = runCatching { lm?.isProviderEnabled(LocationManager.GPS_PROVIDER) == true }.getOrDefault(false)

                  val hasBt = pm.hasSystemFeature(PackageManager.FEATURE_BLUETOOTH)
                  val bm = context.getSystemService(Context.BLUETOOTH_SERVICE) as? BluetoothManager
                  val btOn = runCatching { bm?.adapter?.isEnabled == true }.getOrDefault(false)

                  val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as? ConnectivityManager
                  val caps = cm?.getNetworkCapabilities(cm.activeNetwork)
                  val netConnected = caps != null
                  val netLabel = when {
                      caps == null -> "غير متصل (Offline)"
                      caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) -> "Wi-Fi متصل"
                      caps.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR) -> "بيانات الهاتف متصلة"
                      else -> "متصل"
                  }

                  val sm = context.getSystemService(Context.SENSOR_SERVICE) as? SensorManager
                  val hasCompass = sm?.getDefaultSensor(Sensor.TYPE_MAGNETIC_FIELD) != null
                  val hasAccel = sm?.getDefaultSensor(Sensor.TYPE_ACCELEROMETER) != null
                  val hasTemp = sm?.getDefaultSensor(Sensor.TYPE_AMBIENT_TEMPERATURE) != null
                  val hasMic = pm.hasSystemFeature(PackageManager.FEATURE_MICROPHONE)
                  val hasUsb = pm.hasSystemFeature(PackageManager.FEATURE_USB_HOST)

                  return HardwareDiagnosticReport(
                      hasGpsHardware = hasGps,
                      hasLocationPermission = hasPerm,
                      isGpsEnabled = gpsOn,
                      hasBluetoothHardware = hasBt,
                      isBluetoothEnabled = btOn,
                      isInternetConnected = netConnected,
                      connectionTypeAr = netLabel,
                      hasMagnetometerCompass = hasCompass,
                      hasAccelerometer = hasAccel,
                      hasAmbientTempSensor = hasTemp,
                      hasMicrophone = hasMic,
                      hasUsbHost = hasUsb
                  )
              }
          }
