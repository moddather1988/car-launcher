              UI_CUSTOMIZATION("تخصيص الواجهة", Icons.Default.DashboardCustomize, "SETTINGS"),
              THEME_SELECTOR("الثيمات والمظهر", Icons.Default.Palette, "SETTINGS"),
              SHORTCUTS_MANAGER("إدارة الاختصارات", Icons.Default.AppShortcut, "SETTINGS"),
              APP_INFO("معلومات التطبيق", Icons.Default.Info, "SETTINGS"),
