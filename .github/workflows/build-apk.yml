          @Composable
          fun CockpitNavigationShell(
              currentRoute: AppRoute,
              wallpaperPreset: ScenicWallpaperPreset,
              customWallpaperUri: String?,
              onNavigate: (AppRoute) -> Unit,
              onBack: () -> Unit,
              content: @Composable BoxScope.() -> Unit
          ) {
              val preset = LocalCockpitPreset.current
              val context = LocalContext.current
              val dockRepo = remember { DockRepository(context) }
              val currentDockItems = remember { mutableStateOf(dockRepo.loadSavedDock()) }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color(0xFF030B10))
                      .padding(6.dp)
                      .clip(RoundedCornerShape(24.dp))
                      .border(1.2.dp, DesignTokens.GlassBorder, RoundedCornerShape(24.dp))
              ) {
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      drawRect(brush = Brush.verticalGradient(listOf(wallpaperPreset.skyTop, wallpaperPreset.skyHorizon, wallpaperPreset.lakeWater, wallpaperPreset.roadSurface)))
                  }

                  Column(
                      modifier = Modifier.fillMaxSize().padding(horizontal = 12.dp, vertical = 8.dp),
                      verticalArrangement = Arrangement.spacedBy(6.dp)
                  ) {
                      if (currentRoute != AppRoute.DASHBOARD) {
                          Surface(
                              color = DesignTokens.GlassSurface,
                              shape = RoundedCornerShape(DesignTokens.RadiusM),
                              border = BorderStroke(1.dp, DesignTokens.GlassBorder),
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              Row(
                                  modifier = Modifier.fillMaxWidth().padding(horizontal = 10.dp, vertical = 6.dp),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Button(onClick = onBack) { Text("رجوع") }
                                  Text(currentRoute.titleAr, color = preset.primary)
                                  Button(onClick = { onNavigate(AppRoute.DASHBOARD) }) { Text("الرئيسية") }
                              }
                          }
                      }

                      Box(modifier = Modifier.weight(1f).fillMaxWidth(), content = content)

                      // الشريط السفلي الديناميكي المخصص بالكامل
                      Surface(
                          color = DesignTokens.GlassSurface,
                          shape = RoundedCornerShape(28.dp),
                          border = BorderStroke(1.1.dp, DesignTokens.GlassBorder),
                          modifier = Modifier.fillMaxWidth().height(56.dp)
                      ) {
                          Row(modifier = Modifier.fillMaxSize(), verticalAlignment = Alignment.CenterVertically) {
                              val items = currentDockItems.value
                              items.forEachIndexed { idx, dockItem ->
                                  val isSelected = currentRoute.name == dockItem.targetPayload
                                  Box(
                                      modifier = Modifier
                                          .weight(1f)
                                          .fillMaxHeight()
                                          .clickable {
                                              runCatching {
                                                  val route = AppRoute.valueOf(dockItem.targetPayload)
                                                  onNavigate(route)
                                              }.onFailure {
                                                  onNavigate(AppRoute.DASHBOARD)
                                              }
                                          },
                                      contentAlignment = Alignment.Center
                                  ) {
                                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                          Icon(resolveDockIcon(dockItem.iconName), dockItem.titleAr, tint = if (isSelected) preset.primary else Color.White, modifier = Modifier.size(20.dp))
                                          Text(dockItem.titleAr, fontSize = 11.sp, fontWeight = FontWeight.Bold, color = if (isSelected) preset.primary else Color.White)
                                      }
                                  }
                                  if (idx < items.lastIndex) {
                                      Box(Modifier.width(1.dp).fillMaxHeight(0.5f).background(DesignTokens.GlassBorder.copy(alpha = 0.5f)))
                                  }
                              }
                          }
                      }
                  }
              }
          }
