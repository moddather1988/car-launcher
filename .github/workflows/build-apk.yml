          data class LocalAudioTrack(val id: Long, val title: String, val artist: String, val uri: Uri)

          @Composable
          fun NavigationMapScreen(telemetry: LiveDrivingTelemetry, lat: Double?, lon: Double?) {
              val preset = LocalCockpitPreset.current
              val context = LocalContext.current
              Column(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  Text("الملاحة والخرائط", style = MaterialTheme.typography.headlineMedium, color = DesignTokens.TextPrimary)
                  Card(
                      colors = CardDefaults.cardColors(containerColor = preset.card),
                      border = BorderStroke(1.dp, preset.border),
                      modifier = Modifier.weight(1f).fillMaxWidth()
                  ) {
                      Column(
                          Modifier.fillMaxSize().padding(20.dp),
                          verticalArrangement = Arrangement.Center,
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Icon(Icons.Default.Navigation, contentDescription = null, tint = preset.primary, modifier = Modifier.size(56.dp))
                          Spacer(Modifier.height(10.dp))
                          val coordsText = if (lat != null && lon != null) "الإحداثيات الحالية: ${"%.5f".format(lat)} , ${"%.5f".format(lon)}" else "بانتظار تحديد الموقع عبر GPS"
                          Text(coordsText, style = MaterialTheme.typography.titleLarge, color = DesignTokens.TextPrimary)
                          Spacer(Modifier.height(6.dp))
                          Text("السرعة الحالية: ${telemetry.speedKmh ?: 0} كم/س • المسافة: ${"%.2f".format(telemetry.distanceKm)} كم", color = DesignTokens.TextSecondary)
                          Spacer(Modifier.height(16.dp))
                          Button(onClick = {
                              val geoUri = if (lat != null && lon != null) Uri.parse("geo:$lat,$lon?q=$lat,$lon") else Uri.parse("geo:0,0?q=")
                              runCatching { context.startActivity(Intent(Intent.ACTION_VIEW, geoUri).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) }
                          }) {
                              Text("فتح الملاحة الكاملة في تطبيق الخرائط")
                          }
                      }
                  }
              }
          }

          @Composable
          fun MusicPlayerScreen(
              tracks: List<LocalAudioTrack>,
              currentIndex: Int,
              isPlaying: Boolean,
              onSelectTrack: (Int) -> Unit,
              onTogglePlay: () -> Unit,
              onNext: () -> Unit,
              onPrev: () -> Unit,
              onRefreshLibrary: () -> Unit
          ) {
              val preset = LocalCockpitPreset.current
              var searchQuery by remember { mutableStateOf("") }
              val filtered = tracks.filter { it.title.contains(searchQuery, ignoreCase = true) || it.artist.contains(searchQuery, ignoreCase = true) }

              Column(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                      Text("مشغل الموسيقى المحلي (${tracks.size})", style = MaterialTheme.typography.headlineMedium, color = DesignTokens.TextPrimary)
                      OutlinedButton(onClick = onRefreshLibrary) { Text("تحديث الملفات") }
                  }

                  OutlinedTextField(
                      value = searchQuery,
                      onValueChange = { searchQuery = it },
                      placeholder = { Text("ابحث عن ملف صوتي أو فنان...") },
                      modifier = Modifier.fillMaxWidth(),
                      singleLine = true
                  )

                  // شريط التحكم السفلي المباشر
                  Surface(color = preset.card, shape = RoundedCornerShape(DesignTokens.RadiusM), modifier = Modifier.fillMaxWidth()) {
                      Row(Modifier.padding(12.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                          val current = tracks.getOrNull(currentIndex)
                          Column(Modifier.weight(1f)) {
                              Text(current?.title ?: "لا يوجد ملف قيد التشغيل", style = MaterialTheme.typography.titleMedium, color = DesignTokens.TextPrimary, maxLines = 1)
                              Text(current?.artist ?: "اختر من القائمة بالأسفل", fontSize = 12.sp, color = DesignTokens.TextSecondary)
                          }
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              IconButton(onClick = onPrev) { Icon(Icons.Default.SkipPrevious, null, tint = DesignTokens.TextPrimary) }
                              Button(onClick = onTogglePlay) { Text(if (isPlaying) "إيقاف" else "تشغيل") }
                              IconButton(onClick = onNext) { Icon(Icons.Default.SkipNext, null, tint = DesignTokens.TextPrimary) }
                          }
                      }
                  }

                  if (filtered.isEmpty()) {
                      Box(Modifier.weight(1f).fillMaxWidth(), contentAlignment = Alignment.Center) {
                          Text("لم يتم العثور على ملفات صوتية محلية أو بانتظار صلاحية الوسائط.", color = DesignTokens.TextSecondary)
                      }
                  } else {
                      LazyColumn(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                          items(filtered) { track ->
                              val actualIdx = tracks.indexOf(track)
                              Surface(
                                  color = if (actualIdx == currentIndex) preset.primary.copy(alpha = 0.2f) else preset.card,
                                  shape = RoundedCornerShape(12.dp),
                                  modifier = Modifier.fillMaxWidth().clickable { onSelectTrack(actualIdx) }
                              ) {
                                  Row(Modifier.padding(12.dp), horizontalArrangement = Arrangement.SpaceBetween) {
                                      Text(track.title, color = DesignTokens.TextPrimary, maxLines = 1, modifier = Modifier.weight(1f))
                                      Text(track.artist, color = DesignTokens.TextSecondary, fontSize = 12.sp)
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun RadioFmScreen() {
              val preset = LocalCockpitPreset.current
              var freq by remember { mutableDoubleStateOf(98.2) }
              val favorites = listOf(88.2 to "إذاعة القرآن الكريم", 98.2 to "نجوم FM", 100.6 to "راديو مصر", 104.2 to "ميجا FM")

              Column(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  Text("راديو FM", style = MaterialTheme.typography.headlineMedium, color = DesignTokens.TextPrimary)
                  Surface(
                      color = DesignTokens.StatusWarning.copy(alpha = 0.15f),
                      border = BorderStroke(1.dp, DesignTokens.StatusWarning),
                      shape = RoundedCornerShape(12.dp),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text(
                          text = "حالة الهاردوير: هذا الجهاز لا يكشف عن واجهة برمجية قياسية لمستقبل FM (NOT SUPPORTED عبر API قياسي). واجهة الترددات جاهزة للربط مع محول الشركة المصنعة فقط.",
                          color = DesignTokens.StatusWarning,
                          fontSize = 13.sp,
                          modifier = Modifier.padding(12.dp)
                      )
                  }

                  Card(colors = CardDefaults.cardColors(containerColor = preset.card), modifier = Modifier.fillMaxWidth()) {
                      Column(Modifier.padding(20.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                          Text("${"%.1f".format(freq)} MHz", fontSize = 42.sp, fontWeight = FontWeight.Black, color = preset.primary)
                          Spacer(Modifier.height(10.dp))
                          Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                              Button(onClick = { freq = (freq - 0.2).coerceAtLeast(87.5) }) { Text("- 0.2 MHz") }
                              Button(onClick = { freq = (freq + 0.2).coerceAtMost(108.0) }) { Text("+ 0.2 MHz") }
                          }
                      }
                  }

                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      favorites.forEach { (f, name) ->
                          FilterChip(selected = freq == f, onClick = { freq = f }, label = { Text("$name ($f)") })
                      }
                  }
              }
          }

          @Composable
          fun PhoneContactsScreen(hardware: HardwareDiagnosticReport) {
              val preset = LocalCockpitPreset.current
              val context = LocalContext.current
              var dialNumber by remember { mutableStateOf("") }

              Column(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  Text("الهاتف والاتصالات", style = MaterialTheme.typography.headlineMedium, color = DesignTokens.TextPrimary)
                  Text(
                      text = if (hardware.isBluetoothEnabled) "البلوتوث مفعل وجاهز لربط الهاتف" else "البلوتوث مغلق حاليًا - اضغط لفتحه",
                      color = if (hardware.isBluetoothEnabled) DesignTokens.StatusSuccess else DesignTokens.StatusWarning
                  )

                  OutlinedTextField(
                      value = dialNumber,
                      onValueChange = { dialNumber = it },
                      label = { Text("أدخل رقم الهاتف") },
                      modifier = Modifier.fillMaxWidth(),
                      singleLine = true
                  )

                  Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                      Button(onClick = {
                          val uri = Uri.parse("tel:$dialNumber")
                          runCatching { context.startActivity(Intent(Intent.ACTION_DIAL, uri).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) }
                      }) { Text("اتصال عبر تطبيق الهاتف") }

                      OutlinedButton(onClick = {
                          runCatching { context.startActivity(Intent(Settings.ACTION_BLUETOOTH_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) }
                      }) { Text("إعدادات البلوتوث") }
                  }
              }
          }

          @Composable
          fun IslamicHubScreen(
              prayers: DailyPrayerSchedule,
              hijriDate: String,
              storage: LauncherStorage
          ) {
              val preset = LocalCockpitPreset.current
              var tasbeeh by remember { mutableIntStateOf(storage.tasbeehCount) }
              var target by remember { mutableIntStateOf(storage.tasbeehTarget) }

              val adhkarList = listOf(
                  "دعاء ركوب السيارة: «سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ».",
                  "أذكار الصباح والمساء: «أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ».",
                  "سيد الاستغفار: «اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ خَلَقْتَنِي وَأَنَا عَبْدُكَ...».",
                  "ذكر السفر: «اللَّهُمَّ هَوِّنْ عَلَيْنَا سَفَرَنَا هَذَا وَاطْوِ عَنَّا بُعْدَهُ»."
              )

              LazyColumn(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  item {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                          Text("القسم الإسلامي الشامل", style = MaterialTheme.typography.headlineMedium, color = DesignTokens.TextPrimary)
                          Text(hijriDate, style = MaterialTheme.typography.titleMedium, color = preset.secondary)
                      }
                  }

                  item {
                      Card(colors = CardDefaults.cardColors(containerColor = preset.card), modifier = Modifier.fillMaxWidth()) {
                          Column(Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Text("مواقيت الصلاة المحلية (القادمة: ${prayers.nextPrayerName} - ${prayers.nextPrayerTime})", color = preset.primary, fontWeight = FontWeight.Bold)
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                  PrayerPill("الفجر", prayers.fajr, prayers.nextPrayerName == "الفجر")
                                  PrayerPill("الظهر", prayers.dhuhr, prayers.nextPrayerName == "الظهر")
                                  PrayerPill("العصر", prayers.asr, prayers.nextPrayerName == "العصر")
                                  PrayerPill("المغرب", prayers.maghrib, prayers.nextPrayerName == "المغرب")
                                  PrayerPill("العشاء", prayers.isha, prayers.nextPrayerName == "العشاء")
                              }
                              Text("اتجاه القبلة المحسوب لموقعك: ${prayers.qiblaDegrees}°", color = DesignTokens.StatusSuccess, fontSize = 13.sp)
                          }
                      }
                  }

                  item {
                      Card(colors = CardDefaults.cardColors(containerColor = preset.card), modifier = Modifier.fillMaxWidth()) {
                          Row(Modifier.padding(14.dp).fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              Column {
                                  Text("المسبحة الإلكترونية", style = MaterialTheme.typography.titleLarge, color = DesignTokens.TextPrimary)
                                  Text("العدد: $tasbeeh / الهدف: $target", color = preset.secondary)
                              }
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  Button(onClick = {
                                      tasbeeh++
                                      storage.tasbeehCount = tasbeeh
                                  }) { Text("سبّح (+1)") }
                                  OutlinedButton(onClick = {
                                      tasbeeh = 0
                                      storage.tasbeehCount = 0
                                  }) { Text("تصفير") }
                              }
                          }
                      }
                  }

                  items(adhkarList) { dhikr ->
                      Surface(color = preset.card, shape = RoundedCornerShape(12.dp), modifier = Modifier.fillMaxWidth()) {
                          Text(dhikr, color = DesignTokens.TextPrimary, modifier = Modifier.padding(14.dp), lineHeight = 22.sp)
                      }
                  }
              }
          }

          @Composable
          private fun PrayerPill(name: String, time: String, active: Boolean) {
              val preset = LocalCockpitPreset.current
              Surface(
                  color = if (active) preset.primary.copy(alpha = 0.25f) else preset.background,
                  shape = RoundedCornerShape(10.dp),
                  border = if (active) BorderStroke(1.dp, preset.primary) else null
              ) {
                  Column(Modifier.padding(horizontal = 12.dp, vertical = 8.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                      Text(name, fontSize = 12.sp, color = DesignTokens.TextSecondary)
                      Text(time, fontSize = 14.sp, fontWeight = FontWeight.Bold, color = DesignTokens.TextPrimary)
                  }
              }
          }

          @Composable
          fun VehicleObdScreen(telemetry: LiveDrivingTelemetry, hardware: HardwareDiagnosticReport) {
              val preset = LocalCockpitPreset.current
              val itemsList = listOf(
                  Triple("سرعة السيارة (GPS)", "${telemetry.speedKmh ?: 0} كم/س", if (hardware.hasGpsHardware) "SUPPORTED" else "NOT SUPPORTED"),
                  Triple("حساس البوصلة المغناطيسي", if (hardware.hasMagnetometerCompass) "متاح" else "غير متوفر بالشاشة", if (hardware.hasMagnetometerCompass) "SUPPORTED" else "NOT SUPPORTED"),
                  Triple("سرعة المحرك RPM (OBD2)", "بانتظار محول ELM327", "REQUIRES EXTERNAL HARDWARE"),
                  Triple("حرارة المحرك Coolant", "بانتظار محول ELM327", "REQUIRES EXTERNAL HARDWARE"),
                  Triple("جهد البطارية Voltage", "بانتظار محول ELM327", "REQUIRES EXTERNAL HARDWARE"),
                  Triple("قراءة الأعطال DTC", "بانتظار محول ELM327", "REQUIRES EXTERNAL HARDWARE")
              )

              Column(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  Text("بيانات السيارة وتشخيص OBD2", style = MaterialTheme.typography.headlineMedium, color = DesignTokens.TextPrimary)
                  LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      items(itemsList) { (title, value, status) ->
                          val badgeColor = when (status) {
                              "SUPPORTED" -> DesignTokens.StatusSuccess
                              "REQUIRES EXTERNAL HARDWARE" -> DesignTokens.StatusWarning
                              else -> DesignTokens.StatusDanger
                          }
                          Surface(color = preset.card, shape = RoundedCornerShape(12.dp), modifier = Modifier.fillMaxWidth()) {
                              Row(Modifier.padding(14.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                  Column {
                                      Text(title, color = DesignTokens.TextPrimary, fontWeight = FontWeight.Bold)
                                      Text(value, color = DesignTokens.TextSecondary, fontSize = 12.sp)
                                  }
                                  Text(status, color = badgeColor, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun AppDrawerScreen() {
              val preset = LocalCockpitPreset.current
              val context = LocalContext.current
              var query by remember { mutableStateOf("") }

              val allApps = remember {
                  val pm = context.packageManager
                  val intent = Intent(Intent.ACTION_MAIN, null).apply { addCategory(Intent.CATEGORY_LAUNCHER) }
                  pm.queryIntentActivities(intent, 0)
                      .filter { it.activityInfo.packageName != context.packageName }
                      .map { it.loadLabel(pm).toString() to it.activityInfo.packageName }
                      .sortedBy { it.first }
              }

              val filtered = allApps.filter { it.first.contains(query, ignoreCase = true) }

              Column(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  Text("جميع التطبيقات المثبتة (${allApps.size})", style = MaterialTheme.typography.headlineMedium, color = DesignTokens.TextPrimary)
                  OutlinedTextField(
                      value = query,
                      onValueChange = { query = it },
                      placeholder = { Text("ابحث عن تطبيق...") },
                      modifier = Modifier.fillMaxWidth(),
                      singleLine = true
                  )
                  LazyVerticalGrid(
                      columns = GridCells.Adaptive(minSize = 150.dp),
                      verticalArrangement = Arrangement.spacedBy(8.dp),
                      horizontalArrangement = Arrangement.spacedBy(8.dp),
                      modifier = Modifier.weight(1f)
                  ) {
                      items(filtered) { (label, pkg) ->
                          Card(
                              colors = CardDefaults.cardColors(containerColor = preset.card),
                              border = BorderStroke(1.dp, preset.border),
                              modifier = Modifier.clickable {
                                  context.packageManager.getLaunchIntentForPackage(pkg)?.let {
                                      it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                      runCatching { context.startActivity(it) }
                                  }
                              }
                          ) {
                              Box(Modifier.padding(14.dp).fillMaxWidth(), contentAlignment = Alignment.Center) {
                                  Text(label, color = DesignTokens.TextPrimary, maxLines = 1)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun SettingsScreen(
              storage: LauncherStorage,
              currentPreset: CockpitThemePreset,
              onPresetChange: (CockpitThemePreset) -> Unit,
              onSettingsUpdated: () -> Unit
          ) {
              val context = LocalContext.current
              var use24h by remember { mutableStateOf(storage.use24HourFormat) }
              var showSec by remember { mutableStateOf(storage.showSeconds) }
              var showHijri by remember { mutableStateOf(storage.showHijriDate) }
              var useMph by remember { mutableStateOf(storage.useMphUnit) }
              var circular by remember { mutableStateOf(storage.circularGaugeStyle) }
              var visTrip by remember { mutableStateOf(storage.isCardVisible("trip")) }
              var visPrayer by remember { mutableStateOf(storage.isCardVisible("prayer")) }
              var visMusic by remember { mutableStateOf(storage.isCardVisible("music")) }

              LazyColumn(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  item {
                      Text("الإعدادات والتخصيص الشامل", style = MaterialTheme.typography.headlineMedium, color = DesignTokens.TextPrimary)
                  }

                  item {
                      Text("1. اختيار هوية وثيم السيارة:", color = currentPreset.primary, fontWeight = FontWeight.Bold)
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxWidth()) {
                          CockpitThemePreset.entries.forEach { presetItem ->
                              FilterChip(
                                  selected = currentPreset == presetItem,
                                  onClick = {
                                      storage.themePreset = presetItem
                                      onPresetChange(presetItem)
                                  },
                                  label = { Text(presetItem.titleAr, fontSize = 12.sp) }
                              )
                          }
                      }
                  }

                  item {
                      SettingToggleRow("نظام 24 ساعة", use24h) { use24h = it; storage.use24HourFormat = it; onSettingsUpdated() }
                      SettingToggleRow("إظهار الثواني في الساعة", showSec) { showSec = it; storage.showSeconds = it; onSettingsUpdated() }
                      SettingToggleRow("إظهار التاريخ الهجري", showHijri) { showHijri = it; storage.showHijriDate = it; onSettingsUpdated() }
                      SettingToggleRow("وحدة السرعة بالميل (MPH)", useMph) { useMph = it; storage.useMphUnit = it; onSettingsUpdated() }
                      SettingToggleRow("عداد السرعة الدائري الفاخر", circular) { circular = it; storage.circularGaugeStyle = it; onSettingsUpdated() }
                  }

                  item {
                      Text("2. إظهار وإخفاء بطاقات الرئيسية:", color = currentPreset.primary, fontWeight = FontWeight.Bold)
                      SettingToggleRow("بطاقة بيانات الرحلة", visTrip) { visTrip = it; storage.setCardVisible("trip", it); onSettingsUpdated() }
                      SettingToggleRow("بطاقة مواقيت الصلاة", visPrayer) { visPrayer = it; storage.setCardVisible("prayer", it); onSettingsUpdated() }
                      SettingToggleRow("بطاقة مشغل الموسيقى", visMusic) { visMusic = it; storage.setCardVisible("music", it); onSettingsUpdated() }
                  }

                  item {
                      Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                          Button(onClick = {
                              runCatching { context.startActivity(Intent(Settings.ACTION_HOME_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) }
                          }) { Text("تعيين كلانشر افتراضي للشاشة") }

                          OutlinedButton(onClick = {
                              storage.resetAllToDefaults()
                              onPresetChange(CockpitThemePreset.MERCEDES_OBSIDIAN)
                              onSettingsUpdated()
                          }) { Text("استعادة الإعدادات الافتراضية") }
                      }
                  }
              }
          }

          @Composable
          private fun SettingToggleRow(label: String, checked: Boolean, onCheckedChange: (Boolean) -> Unit) {
              val preset = LocalCockpitPreset.current
              Surface(color = preset.card, shape = RoundedCornerShape(12.dp), modifier = Modifier.fillMaxWidth().padding(vertical = 3.dp)) {
                  Row(Modifier.padding(horizontal = 14.dp, vertical = 6.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                      Text(label, color = DesignTokens.TextPrimary)
                      Switch(checked = checked, onCheckedChange = onCheckedChange)
                  }
              }
          }
