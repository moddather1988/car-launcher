          data class LiveDrivingTelemetry(
              val speedKmh: Int? = null,
              val accuracyMeters: Int? = null,
              val distanceKm: Float = 0f,
              val maxSpeedKmh: Int = 0,
              val durationMinutes: Int = 0,
              val bearingDegrees: Int = 136
          )

          @Composable
          fun DashboardScreen(
              metrics: ResponsiveLayoutMetrics,
              timeFormatted: String,
              amPmArabic: String,
              gregorianDate: String,
              hijriDate: String,
              telemetry: LiveDrivingTelemetry,
              hardware: HardwareDiagnosticReport,
              prayers: DailyPrayerSchedule,
              currentTrackTitle: String,
              currentTrackArtist: String,
              isPlayingMusic: Boolean,
              storage: LauncherStorage,
              onToggleMusicPlay: () -> Unit,
              onNextTrack: () -> Unit,
              onPrevTrack: () -> Unit,
              onResetTrip: () -> Unit,
              onNavigateTo: (AppRoute) -> Unit,
              onRequestGpsPermission: () -> Unit
          ) {
              val preset = LocalCockpitPreset.current
              val context = LocalContext.current
              var carBrand by remember { mutableStateOf(storage.carBrandName) }
              var isLibraryMode by remember { mutableStateOf(true) }

              val rawSpeed = telemetry.speedKmh ?: 0
              val displaySpeed = if (storage.useMphUnit) (rawSpeed * 0.621371f).toInt() else rawSpeed
              val unitText = if (storage.useMphUnit) "MPH" else "كم/س"

