          @Composable
          fun MaintenanceManagerScreen(storage: LauncherStorage, onSpeakText: (String) -> Unit, stateCond: UiStateCondition) {
              val preset = LocalCockpitPreset.current
              val vProfile = storage.getActiveVehicle()
              var odo by remember { mutableFloatStateOf(storage.totalOdometerKm) }
              var lastOil by remember { mutableFloatStateOf(storage.lastOilChangeKm) }
              var lastBrakes by remember { mutableFloatStateOf(storage.lastBrakesCheckKm) }
              var lastTires by remember { mutableFloatStateOf(storage.lastTiresCheckKm) }

              val oilRem = (vProfile.oilIntervalKm - (odo - lastOil).toInt()).coerceAtLeast(0)
              val brakesRem = (20000 - (odo - lastBrakes).toInt()).coerceAtLeast(0)
              val tiresRem = (40000 - (odo - lastTires).toInt()).coerceAtLeast(0)

              UnifiedStateRenderer(condition = stateCond) {
                  Surface(color = DesignTokens.GlassSurface, border = BorderStroke(1.dp, DesignTokens.GlassBorder), shape = RoundedCornerShape(22.dp), modifier = Modifier.fillMaxSize()) {
                      Column(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              Column {
                                  Text("إدارة الصيانة الدورية (${vProfile.brand})", style = MaterialTheme.typography.titleLarge, color = preset.primary)
                                  Text("عداد المسافة الإجمالي (Odometer): ${odo.toInt()} كم", color = DesignTokens.AmberGold, fontWeight = FontWeight.Bold)
                              }
                              Button(onClick = { onSpeakText("المتبقي على تغيير الزيت القادم حوالي $oilRem كيلومتر، وعلى فحص الفرامل $brakesRem كيلومتر.") }) { Text("قراءة صوتية") }
                          }
                          MaintenanceItemRow("تغيير زيت المحرك والفلتر (كل ${vProfile.oilIntervalKm} كم)", "متبقي $oilRem كم", oilRem > 500) {
                              lastOil = odo; storage.lastOilChangeKm = odo
                          }
                          MaintenanceItemRow("فحص تيل وطنابير الفرامل (كل 20,000 كم)", "متبقي $brakesRem كم", brakesRem > 1500) {
                              lastBrakes = odo; storage.lastBrakesCheckKm = odo
                          }
                          MaintenanceItemRow("تبديل وموازنة الإطارات (كل 40,000 كم)", "متبقي $tiresRem كم", tiresRem > 3000) {
                              lastTires = odo; storage.lastTiresCheckKm = odo
                          }
                      }
                  }
              }
          }

