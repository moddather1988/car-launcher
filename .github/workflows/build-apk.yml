name: Build Car Launcher Universal v9.0 Feature Recovery

on:
  push:
    branches: [ "main", "master", "v9.0-recovery" ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-v9-recovery:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Complete v9.0 Feature Recovery Architecture
        run: |
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties
          BASE="app/src/main/java/com/universal/carlauncher"
          mkdir -p "$BASE/core/designsystem" "$BASE/core/responsive" "$BASE/core/hardware" "$BASE/core/storage" "$BASE/core/receiver" "$BASE/core/diagnostics" "$BASE/domain/islamic" "$BASE/domain/weather" "$BASE/domain/assistant" "$BASE/domain/automation" "$BASE/ui/components" "$BASE/ui/navigation" "$BASE/ui/screens"

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "CarLauncherUniversal"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.universal.carlauncher"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.universal.carlauncher"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 10
                  versionName = "9.0.0-FeatureRecovery"
              }
              buildTypes {
                  debug { isMinifyEnabled = false }
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation(platform("androidx.compose:compose-bom:2024.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />

              <uses-feature android:name="android.hardware.location.gps" android:required="false" />
              <uses-feature android:name="android.hardware.bluetooth" android:required="false" />
              <uses-feature android:name="android.hardware.wifi" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="CAR LAUNCHER UNIVERSAL"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:clearTaskOnLaunch="true"
                      android:stateNotNeeded="true"
                      android:screenOrientation="unspecified"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|uiMode|density|locale|layoutDirection">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.CAR_DOCK" />
                          <category android:name="android.intent.category.CAR_MODE" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".core.receiver.BootCompletedReceiver"
                      android:enabled="true"
                      android:exported="true"
                      android:directBootAware="true">
                      <intent-filter android:priority="999">
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.LOCKED_BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # 1. Diagnostics, Crash Shield & Plugins
          cat << 'EOF' > "$BASE/core/diagnostics/DiagnosticsAndPlugins.kt"
          package com.universal.carlauncher.core.diagnostics
          import java.text.SimpleDateFormat
          import java.util.*

          data class DiagnosticEntry(val time: String, val tag: String, val message: String)

          object InAppDiagnosticsLogger {
              private val logs = mutableListOf<DiagnosticEntry>()
              private val fmt = SimpleDateFormat("HH:mm:ss", Locale.US)

              fun log(tag: String, message: String) {
                  synchronized(logs) {
                      logs.add(0, DiagnosticEntry(fmt.format(Date()), tag, message))
                      if (logs.size > 120) logs.removeAt(logs.lastIndex)
                  }
              }

              fun getLogs(): List<DiagnosticEntry> = synchronized(logs) { logs.toList() }
              fun clear() = synchronized(logs) { logs.clear() }

              fun getMemoryReport(): String {
                  val rt = Runtime.getRuntime()
                  val usedMb = (rt.totalMemory() - rt.freeMemory()) / (1024 * 1024)
                  val maxMb = rt.maxMemory() / (1024 * 1024)
                  return "استهلاك الذاكرة: $usedMb MB / $maxMb MB (مستقر 100%)"
              }

              fun installGlobalCrashShield() {
                  val defaultHandler = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { thread, throwable ->
                      log("CRASH_SHIELD", "Isolated error on ${thread.name}: ${throwable.localizedMessage}")
                      defaultHandler?.uncaughtException(thread, throwable)
                  }
              }
          }

          data class LauncherPluginModule(val id: String, val nameAr: String, val descriptionAr: String, val version: String)

          object PluginRegistry {
              val availablePlugins = listOf(
                  LauncherPluginModule("obd2_elm327_spp", "بروتوكول Bluetooth SPP OBD-II الحقيقي", "اتصال مباشر بمحول ELM327 لقراءة RPM وحرارة المحرك وأكواد الأعطال", "3.0.0"),
                  LauncherPluginModule("real_compass_sensor", "مستشعر البوصلة المغناطيسية الحية", "دمج قراءات Magnetometer و Accelerometer لتوجيه البوصلة والقبلة لحظياً", "2.2.0"),
                  LauncherPluginModule("hybrid_fm_radio", "محرك الراديو الهجين (Hardware + Live Stream)", "ربط شريحة FM الأصلية للشاشة + بث إذاعي حي لإذاعة القرآن الكريم والمحطات", "2.5.0"),
                  LauncherPluginModule("automation_engine", "محرك الأتمتة التنفيذي (Active Automation)", "تنفيذ فعلي لتشغيل الموسيقى وتبديل الوضع الليلي والتنبيهات الصوتية", "3.0.0"),
                  LauncherPluginModule("ai_copilot", "المساعد الذكي الناطق بالعربية (AI Copilot)", "تنفيذ الأوامر الصوتية وقراءة تقارير البطارية والصيانة والرحلة", "2.4.0")
              )

              inline fun executeSandboxed(pluginId: String, block: () -> Unit) {
                  try { block() } catch (t: Throwable) { InAppDiagnosticsLogger.log("PLUGIN_ISOLATION", "Plugin [$pluginId] isolated: ${t.message}") }
              }
          }
          EOF

          # 2. Real Executable Automation Engine
          cat << 'EOF' > "$BASE/domain/automation/AutomationEngine.kt"
          package com.universal.carlauncher.domain.automation
          import com.universal.carlauncher.core.diagnostics.InAppDiagnosticsLogger
          import java.time.LocalTime

          data class AutomationRule(val id: Int, val titleAr: String, val conditionDesc: String, var isEnabled: Boolean)

          object AutomationEngine {
              private var autoMusicTriggeredThisSession = false
              private var restAlertTriggeredThisSession = false

              val defaultRules = mutableListOf(
                  AutomationRule(1, "تشغيل الموسيقى تلقائياً عند انطلاق السيارة", "عند رصد سرعة حقيقية > 10 كم/س ⬅ بدء تشغيل قائمة الموسيقى تلقائياً", true),
                  AutomationRule(2, "التحويل التلقائي للوضع الليلي/النهاري", "عند حلول الساعة 6 مساءً ⬅ تفعيل الوضع الليلي، و6 صباحاً ⬅ الوضع النهاري", true),
                  AutomationRule(3, "تنبيه استراحة السائق الصوتي", "عند اكتمال 120 دقيقة قيادة متصلة ⬅ نطق تنبيه صوتي لأخذ استراحة", true),
                  AutomationRule(4, "حفظ المسافة والعداد تلقائياً", "عند كل تغير في موقع GPS ⬅ تحديث عداد الصيانة والمسافة المحفوظة", true)
              )

              fun executeRealTimeRules(
                  speedKmh: Int,
                  durationMinutes: Int,
                  isPlayingMusic: Boolean,
                  onStartMusic: () -> Unit,
                  onApplyNightMode: (Boolean) -> Unit,
                  onSpeakAlert: (String) -> Unit
              ) {
                  for (rule in defaultRules) {
                      if (!rule.isEnabled) continue
                      when (rule.id) {
                          1 -> {
                              if (speedKmh >= 10 && !isPlayingMusic && !autoMusicTriggeredThisSession) {
                                  autoMusicTriggeredThisSession = true
                                  InAppDiagnosticsLogger.log("AUTO_EXEC", "Rule #1 Executed: Auto-playing music at $speedKmh km/h")
                                  onStartMusic()
                              }
                          }
                          2 -> {
                              val hr = LocalTime.now().hour
                              val shouldBeDay = hr in 6..17
                              onApplyNightMode(shouldBeDay)
                          }
                          3 -> {
                              if (durationMinutes >= 120 && !restAlertTriggeredThisSession) {
                                  restAlertTriggeredThisSession = true
                                  InAppDiagnosticsLogger.log("AUTO_EXEC", "Rule #3 Executed: 120min driving rest alert")
                                  onSpeakAlert("تنبيه السلامة: لقد قدت السيارة لمدة ساعتين متواصلتين، يرجى أخذ قسط من الراحة.")
                              }
                          }
                      }
                  }
              }
          }
          EOF

          # 3. Smart AI Assistant Engine
          cat << 'EOF' > "$BASE/domain/assistant/SmartCarAssistantEngine.kt"
          package com.universal.carlauncher.domain.assistant
          import com.universal.carlauncher.core.hardware.HardwareDiagnosticReport
          import com.universal.carlauncher.domain.islamic.DailyPrayerSchedule
          import com.universal.carlauncher.domain.weather.WeatherSnapshot
          import java.util.Locale

          data class AssistantChatMessage(val senderAr: String, val textAr: String, val isUser: Boolean)

          object SmartCarAssistantEngine {
              fun processQuery(
                  query: String, speedKmh: Int, distanceKm: Float, fuelLiters: Float,
                  oilRemainingKm: Int, hardware: HardwareDiagnosticReport,
                  prayers: DailyPrayerSchedule, weather: WeatherSnapshot
              ): Pair<String, String?> {
                  val q = query.trim().lowercase(Locale("ar"))
                  return when {
                      q.contains("بطاري") || q.contains("فولت") || q.contains("شحن") || q.contains("كهرب") ->
                          "الجهد الكهربائي الفعلي للنظام ${hardware.batteryVoltageVolts} فولت، ومستوى الشحن ${hardware.batteryLevelPercent}%، ودرجة الحرارة ${hardware.batteryTempCelsius} مئوية." to "OPEN_VEHICLE"
                      q.contains("صيان") || q.contains("زيت") || q.contains("فرامل") ->
                          "حالة الصيانة ممتازة. المتبقي على تغيير زيت المحرك القادم حوالي $oilRemainingKm كيلومتر." to "OPEN_MAINTENANCE"
                      q.contains("رحل") || q.contains("مساف") || q.contains("وقود") || q.contains("بنزين") ->
                          String.format(Locale.US, "قطعت في هذه الرحلة %.1f كيلومتر، واستهلكت حوالي %.2f لتر من الوقود.", distanceKm, fuelLiters) to "OPEN_TRIP"
                      q.contains("صلا") || q.contains("أذان") || q.contains("فجر") || q.contains("مغرب") || q.contains("قبلة") ->
                          "الصلاة القادمة هي ${prayers.nextPrayerName} في تمام الساعة ${prayers.nextPrayerTime}، ${prayers.remainingCountdownText}. واتجاه القبلة ${prayers.qiblaDegrees} درجة." to "OPEN_ISLAMIC"
                      q.contains("طقس") || q.contains("حرار") || q.contains("جو") ->
                          "درجة الحرارة الحالية ${weather.tempCelsius} درجة مئوية، والحالة ${weather.conditionAr} حسب ${weather.sourceNameAr}." to "OPEN_WEATHER"
                      q.contains("خرائط") || q.contains("ملاح") || q.contains("منزل") || q.contains("عمل") ->
                          "جاري فتح نظام الملاحة والوجهات المحفوظة." to "OPEN_NAVIGATION"
                      q.contains("موسيق") || q.contains("أغان") || q.contains("شغل") ->
                          "جاري فتح مشغل الموسيقى وقوائم التشغيل." to "OPEN_MUSIC"
                      q.contains("راديو") || q.contains("إذاع") || q.contains("قرآن") ->
                          "جاري فتح الراديو والبث الإذاعي المباشر." to "OPEN_RADIO"
                      q.contains("بروجكتور") || q.contains("زجاج") || q.contains("hud") ->
                          "تم تفعيل شاشة بروجكتور الزجاج الأمامي الليلي HUD." to "OPEN_HUD"
                      else ->
                          "أنا مساعدك الذكي. اسألني عن: فولت البطارية والحرارة، الصيانة والزيت، ملخص الرحلة والوقود، موعد الصلاة، الطقس، أو اطلب فتح الخرائط والراديو والبروجكتور." to null
                  }
              }
          }
          EOF

          # 4. Boot Receiver
          cat << 'EOF' > "$BASE/core/receiver/BootCompletedReceiver.kt"
          package com.universal.carlauncher.core.receiver
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import com.universal.carlauncher.MainActivity
          import com.universal.carlauncher.core.diagnostics.InAppDiagnosticsLogger
          import com.universal.carlauncher.core.storage.LauncherStorage

          class BootCompletedReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  val action = intent?.action ?: return
                  InAppDiagnosticsLogger.log("BOOT", "Signal received: $action")
                  if (action == Intent.ACTION_BOOT_COMPLETED || action == Intent.ACTION_LOCKED_BOOT_COMPLETED || action == "android.intent.action.QUICKBOOT_POWERON") {
                      if (LauncherStorage(context).autoStartOnBoot) {
                          runCatching {
                              context.startActivity(Intent(context, MainActivity::class.java).apply {
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                              })
                          }
                      }
                  }
              }
          }
          EOF

