          @Composable
          fun CockpitNavigationShell(currentRoute: AppRoute, wallpaperPreset: ScenicWallpaperPreset, customWallpaperUri: String?, useSideRail: Boolean, storage: LauncherStorage, onNavigate: (AppRoute) -> Unit, onBack: () -> Unit, content: @Composable BoxScope.() -> Unit) {
              val preset = LocalCockpitPreset.current
              val customKeys = storage.customDockRoutes
              val bottomTabs = customKeys.mapNotNull { runCatching { AppRoute.valueOf(it) }.getOrNull() }.ifEmpty {
                  listOf(AppRoute.NAVIGATION, AppRoute.PHONE_DIALPAD, AppRoute.APPS_INSTALLED, AppRoute.MUSIC_PLAYER, AppRoute.RADIO)
              }

              Box(modifier = Modifier.fillMaxSize().background(Color(0xFF030B10)).padding(6.dp).clip(RoundedCornerShape(24.dp)).border(1.2.dp, DesignTokens.GlassBorder, RoundedCornerShape(24.dp))) {
                  val context = LocalContext.current
                  val customBitmap = remember(customWallpaperUri) {
                      if (customWallpaperUri.isNullOrBlank()) null else runCatching { context.contentResolver.openInputStream(Uri.parse(customWallpaperUri))?.use { BitmapFactory.decodeStream(it)?.asImageBitmap() } }.getOrNull()
                  }
                  if (customBitmap != null) {
                      Image(bitmap = customBitmap, contentDescription = null, contentScale = ContentScale.Crop, modifier = Modifier.fillMaxSize())
                      Box(Modifier.fillMaxSize().background(Color(0xFF04141E).copy(alpha = 0.42f)))
                  } else {
                      Canvas(modifier = Modifier.fillMaxSize()) {
                          drawRect(brush = Brush.verticalGradient(listOf(wallpaperPreset.skyTop, wallpaperPreset.skyHorizon, wallpaperPreset.lakeWater, wallpaperPreset.roadSurface)))
                      }
                  }

                  Column(modifier = Modifier.fillMaxSize().padding(horizontal = 12.dp, vertical = 8.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                      if (currentRoute != AppRoute.DASHBOARD) {
                          Surface(color = DesignTokens.GlassSurface, shape = RoundedCornerShape(DesignTokens.RadiusM), border = BorderStroke(1.dp, DesignTokens.GlassBorder), modifier = Modifier.fillMaxWidth()) {
                              Row(modifier = Modifier.fillMaxWidth().padding(horizontal = 10.dp, vertical = 5.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                  OutlinedButton(onClick = onBack, contentPadding = PaddingValues(horizontal = 10.dp, vertical = 2.dp), modifier = Modifier.height(32.dp)) {
                                      Text("رجوع", fontSize = 11.sp, color = DesignTokens.TextPrimary)
                                  }
                                  Text(currentRoute.titleAr, style = MaterialTheme.typography.titleMedium, color = preset.primary)
                                  Button(onClick = { onNavigate(AppRoute.DASHBOARD) }, colors = ButtonDefaults.buttonColors(containerColor = preset.primary), contentPadding = PaddingValues(horizontal = 12.dp, vertical = 2.dp), modifier = Modifier.height(32.dp)) {
                                      Text("الرئيسية", color = Color.Black, fontWeight = FontWeight.Bold, fontSize = 11.sp)
                                  }
                              }
                          }
                      }

                      Box(modifier = Modifier.weight(1f).fillMaxWidth(), content = content)

                      Surface(color = DesignTokens.GlassSurface, shape = RoundedCornerShape(28.dp), border = BorderStroke(1.1.dp, DesignTokens.GlassBorder), modifier = Modifier.fillMaxWidth().height(56.dp)) {
                          Row(modifier = Modifier.fillMaxSize(), verticalAlignment = Alignment.CenterVertically) {
                              bottomTabs.forEachIndexed { idx, tabRoute ->
                                  val isSelected = currentRoute == tabRoute
                                  Box(modifier = Modifier.weight(1f).fillMaxHeight().clickable { onNavigate(if (currentRoute == tabRoute) AppRoute.DASHBOARD else tabRoute) }, contentAlignment = Alignment.Center) {
                                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                          Icon(tabRoute.icon, tabRoute.titleAr, tint = if (isSelected) preset.primary else Color.White, modifier = Modifier.size(22.dp))
                                          Text(tabRoute.titleAr.take(8), fontSize = 11.sp, fontWeight = FontWeight.Bold, color = if (isSelected) preset.primary else Color.White, maxLines = 1)
                                      }
                                  }
                                  if (idx < bottomTabs.lastIndex) Box(Modifier.width(1.dp).fillMaxHeight(0.52f).background(DesignTokens.GlassBorder.copy(alpha = 0.45f)))
                              }
                          }
                      }
                  }
              }
          }
