          # 9. Real Hardware Service (Live Battery Voltage/Temp + Real Bluetooth SPP ELM327 OBD-II Client)
          cat << 'EOF' > "$BASE/core/hardware/VehicleHardwareService.kt"
          package com.universal.carlauncher.core.hardware
          import android.Manifest
          import android.annotation.SuppressLint
          import android.bluetooth.BluetoothManager
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.hardware.Sensor
          import android.hardware.SensorManager
          import android.location.LocationManager
          import android.net.ConnectivityManager
          import android.os.BatteryManager
          import android.os.Build
          import androidx.core.content.ContextCompat
          import com.universal.carlauncher.core.diagnostics.InAppDiagnosticsLogger
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.util.Locale
          import java.util.UUID

          data class HardwareDiagnosticReport(
              val hasGpsHardware: Boolean = true,
              val hasLocationPermission: Boolean = true,
              val isGpsEnabled: Boolean = true,
              val hasBluetoothHardware: Boolean = true,
              val isBluetoothEnabled: Boolean = true,
              val pairedBluetoothNames: List<String> = emptyList(),
              val isInternetConnected: Boolean = true,
              val hasCompassSensor: Boolean = true,
              val hasAmbientTempSensor: Boolean = false,
              val batteryVoltageVolts: String = "12.6",
              val batteryTempCelsius: String = "31.0",
              val batteryLevelPercent: Int = 100,
              val isCharging: Boolean = true
          )

          data class ObdLiveScanResult(
              val connectedDeviceName: String?,
              val rpm: String,
              val coolantTempC: String,
              val statusMessageAr: String
          )

          class VehicleHardwareService(private val context: Context) {
              @SuppressLint("MissingPermission")
              fun inspectHardware(): HardwareDiagnosticReport {
                  val pm = context.packageManager
                  val hasGps = pm.hasSystemFeature(PackageManager.FEATURE_LOCATION_GPS)
                  val hasPerm = ContextCompat.checkSelfPermission(context, Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED
                  val lm = context.getSystemService(Context.LOCATION_SERVICE) as? LocationManager
                  val gpsOn = runCatching { lm?.isProviderEnabled(LocationManager.GPS_PROVIDER) == true }.getOrDefault(false)
                  val hasBt = pm.hasSystemFeature(PackageManager.FEATURE_BLUETOOTH)
                  val bm = context.getSystemService(Context.BLUETOOTH_SERVICE) as? BluetoothManager
                  val btOn = runCatching { bm?.adapter?.isEnabled == true }.getOrDefault(false)
                  val btPermGranted = if (Build.VERSION.SDK_INT >= 31) {
                      ContextCompat.checkSelfPermission(context, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED
                  } else true
                  val pairedList = if (btOn && btPermGranted) {
                      runCatching { bm?.adapter?.bondedDevices?.mapNotNull { it.name }?.take(8) ?: emptyList() }.getOrDefault(emptyList())
                  } else emptyList()
                  val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as? ConnectivityManager
                  val caps = cm?.getNetworkCapabilities(cm.activeNetwork)
                  val sm = context.getSystemService(Context.SENSOR_SERVICE) as? SensorManager

                  // قراءة الفولت والحرارة ومستوى الطاقة الفعليين من BatteryManager
                  val batteryIntent = runCatching { context.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED)) }.getOrNull()
                  val voltageMv = batteryIntent?.getIntExtra(BatteryManager.EXTRA_VOLTAGE, 4150) ?: 4150
                  val voltageStr = String.format(Locale.US, "%.2f", voltageMv / 1000.0f)
                  val tempTenths = batteryIntent?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 320) ?: 320
                  val tempStr = String.format(Locale.US, "%.1f", tempTenths / 10.0f)
                  val level = batteryIntent?.getIntExtra(BatteryManager.EXTRA_LEVEL, 100) ?: 100
                  val status = batteryIntent?.getIntExtra(BatteryManager.EXTRA_STATUS, -1) ?: -1
                  val charging = status == BatteryManager.BATTERY_STATUS_CHARGING || status == BatteryManager.BATTERY_STATUS_FULL

                  return HardwareDiagnosticReport(
                      hasGpsHardware = hasGps,
                      hasLocationPermission = hasPerm,
                      isGpsEnabled = gpsOn,
                      hasBluetoothHardware = hasBt,
                      isBluetoothEnabled = btOn,
                      pairedBluetoothNames = pairedList,
                      isInternetConnected = caps != null,
                      hasCompassSensor = sm?.getDefaultSensor(Sensor.TYPE_MAGNETIC_FIELD) != null,
                      hasAmbientTempSensor = sm?.getDefaultSensor(Sensor.TYPE_AMBIENT_TEMPERATURE) != null,
                      batteryVoltageVolts = voltageStr,
                      batteryTempCelsius = tempStr,
                      batteryLevelPercent = level,
                      isCharging = charging
                  )
              }

              // اتصال حقيقي بمحول ELM327 OBD-II عبر بروتوكول Bluetooth SPP القياسي
              @SuppressLint("MissingPermission")
              suspend fun queryRealObd2Adapter(): ObdLiveScanResult = withContext(Dispatchers.IO) {
                  runCatching {
                      val bm = context.getSystemService(Context.BLUETOOTH_SERVICE) as? BluetoothManager
                      val bonded = bm?.adapter?.bondedDevices.orEmpty()
                      val obdDevice = bonded.firstOrNull {
                          val n = (it.name ?: "").uppercase(Locale.US)
                          n.contains("OBD") || n.contains("ELM") || n.contains("VLINK") || n.contains("CAR")
                      } ?: return@withContext ObdLiveScanResult(
                          null,
                          "غير متصل",
                          "غير متصل",
                          "لم يتم العثور على قطعة ELM327/OBD2 ضمن أجهزة البلوتوث المقترنة (${bonded.size} أجهزة مقترنة حالياً)."
                      )

                      val sppUuid = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB")
                      val socket = obdDevice.createRfcommSocketToServiceRecord(sppUuid)
                      socket.use { s ->
                          s.connect()
                          val outStream = s.outputStream
                          val inStream = s.inputStream

                          fun sendObdCommand(cmd: String): String {
                              outStream.write("$cmd\r".toByteArray())
                              outStream.flush()
                              Thread.sleep(220)
                              val buf = ByteArray(128)
                              val readLen = if (inStream.available() > 0) inStream.read(buf) else 0
                              return if (readLen > 0) String(buf, 0, readLen).trim() else ""
                          }

                          sendObdCommand("ATZ")
                          sendObdCommand("ATE0")
                          val rpmRaw = sendObdCommand("010C")
                          val tempRaw = sendObdCommand("0105")
                          InAppDiagnosticsLogger.log("OBD2_SPP", "Connected to ${obdDevice.name} | RPM_RAW=$rpmRaw | TEMP_RAW=$tempRaw")

                          ObdLiveScanResult(
                              connectedDeviceName = obdDevice.name,
                              rpm = if (rpmRaw.isNotBlank()) rpmRaw else "متصل (بانتظار دوران المحرك)",
