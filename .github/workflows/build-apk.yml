          @Composable
          fun PrayerTimesScreen(prayers: DailyPrayerSchedule, storage: LauncherStorage?) {
              val preset = LocalCockpitPreset.current
              var method by remember { mutableStateOf(storage?.prayerCalculationMethod ?: "الهيئة المصرية العامة للمساحة") }
              var madhhab by remember { mutableStateOf(storage?.asrMadhhab ?: "جمهور الفقهاء") }

              Column(Modifier.fillMaxSize().padding(6.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  Card(
                      colors = CardDefaults.cardColors(containerColor = preset.card.copy(alpha = 0.88f)),
                      border = BorderStroke(1.dp, preset.primary),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Row(Modifier.padding(16.dp).fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                          Column {
                              Text("الصلاة القادمة: ${prayers.nextPrayerName}", style = MaterialTheme.typography.headlineMedium, color = preset.primary)
                              Text("موعد الأذان: ${prayers.nextPrayerTime} • ${prayers.remainingCountdownText}", color = DesignTokens.TextPrimary)
                          }
                          Text("الشروق: ${prayers.sunrise}", color = DesignTokens.AmberGold, fontWeight = FontWeight.Bold)
                      }
                  }

                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      listOf(
                          "الفجر" to prayers.fajr,
                          "الظهر" to prayers.dhuhr,
                          "العصر" to prayers.asr,
                          "المغرب" to prayers.maghrib,
                          "العشاء" to prayers.isha
                      ).forEach { (name, time) ->
                          val active = prayers.nextPrayerName == name
                          Card(
                              colors = CardDefaults.cardColors(containerColor = if (active) preset.primary.copy(alpha = 0.25f) else preset.card.copy(alpha = 0.88f)),
                              border = BorderStroke(1.dp, if (active) preset.primary else preset.border),
                              modifier = Modifier.weight(1f)
