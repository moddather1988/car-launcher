              val preset = LocalCockpitPreset.current
              UnifiedStateRenderer(condition = stateCond) {
                  Surface(color = DesignTokens.GlassSurface, border = BorderStroke(1.dp, DesignTokens.GlassBorder), shape = RoundedCornerShape(22.dp), modifier = Modifier.fillMaxSize()) {
                      Column(Modifier.fillMaxSize().padding(18.dp), verticalArrangement = Arrangement.SpaceBetween) {
                          Text("الطقس متعدد المصادر: ${weather.tempCelsius}°C (${weather.conditionAr})", style = MaterialTheme.typography.titleLarge, color = preset.primary)
                          Text("المصدر: ${weather.sourceNameAr} • العظمى ${weather.highTemp}° / الصغرى ${weather.lowTemp}°", color = DesignTokens.TextSecondary)
                          Button(onClick = onRefreshWeather, colors = ButtonDefaults.buttonColors(containerColor = DesignTokens.AmberGold)) { Text("تحديث الآن", color = Color.Black, fontWeight = FontWeight.Bold) }
                      }
                  }
              }
          }

          @Composable
          fun SettingsAndSystemScreens(
              route: AppRoute, storage: LauncherStorage, hardware: HardwareDiagnosticReport,
              currentPreset: CockpitThemePreset, currentWallpaper: ScenicWallpaperPreset,
              lastSwcKeyInfo: String, lastVoiceText: String,
              onPresetChange: (CockpitThemePreset) -> Unit, onWallpaperChange: (ScenicWallpaperPreset) -> Unit,
              onPickGalleryWallpaper: () -> Unit, onLaunchVoice: () -> Unit,
              onSettingsUpdated: () -> Unit, onNavigate: (AppRoute) -> Unit, stateCond: UiStateCondition
          ) {
              val preset = LocalCockpitPreset.current; val context = LocalContext.current
              UnifiedStateRenderer(condition = stateCond) {
                  when (route) {
                      AppRoute.SETTINGS_MAIN -> {
                          val subPages = listOf(
                              AppRoute.DRIVER_VEHICLE_PROFILES, AppRoute.AUTOMATION_RULES, AppRoute.THEME_SELECTOR,
                              AppRoute.UI_CUSTOMIZATION, AppRoute.SETTINGS_SUBPAGES, AppRoute.SWC_VOICE_CONTROL,
                              AppRoute.BACKUP_DIAGNOSTICS, AppRoute.PLUGINS_HUB, AppRoute.DEVICE_COMPATIBILITY
                          )
                          LazyVerticalGrid(columns = GridCells.Fixed(3), verticalArrangement = Arrangement.spacedBy(8.dp), horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxSize()) {
                              items(subPages) { page ->
                                  Surface(color = DesignTokens.GlassSurface, shape = RoundedCornerShape(16.dp), border = BorderStroke(1.dp, DesignTokens.GlassBorder), modifier = Modifier.height(74.dp).clickable { onNavigate(page) }) {
                                      Row(Modifier.fillMaxSize().padding(horizontal = 12.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                          Icon(page.icon, null, tint = preset.primary, modifier = Modifier.size(22.dp))
                                          Text(page.titleAr, color = DesignTokens.TextPrimary, fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                      }
                                  }
                              }
                          }
                      }
                      AppRoute.AUTOMATION_RULES -> {
                          LazyColumn(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                              items(AutomationEngine.defaultRules) { rule ->
                                  var en by remember { mutableStateOf(rule.isEnabled) }
                                  Surface(color = DesignTokens.GlassSurface, border = BorderStroke(1.dp, DesignTokens.GlassBorder), shape = RoundedCornerShape(12.dp), modifier = Modifier.fillMaxWidth()) {
                                      Row(Modifier.padding(12.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                          Column(Modifier.weight(1f)) {
                                              Text(rule.titleAr, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 13.sp)
                                              Text(rule.conditionDesc, color = DesignTokens.TextSecondary, fontSize = 11.sp)
                                          }
                                          Switch(checked = en, onCheckedChange = { en = it; rule.isEnabled = it; onSettingsUpdated() })
                                      }
                                  }
                              }
                          }
                      }
                      AppRoute.DRIVER_VEHICLE_PROFILES -> {
                          var dIdx by remember { mutableIntStateOf(storage.activeDriverIndex) }
                          var vIdx by remember { mutableIntStateOf(storage.activeVehicleIndex) }
                          Column(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              Text("اختر السائق:", color = preset.primary, fontWeight = FontWeight.Bold)
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  storage.driverProfiles.forEach { dp ->
                                      FilterChip(selected = dIdx == dp.id, onClick = { dIdx = dp.id; storage.activeDriverIndex = dp.id; onSettingsUpdated() }, label = { Text(dp.nameAr) })
                                  }
                              }
                              Text("اختر السيارة:", color = preset.primary, fontWeight = FontWeight.Bold)
                              LazyColumn(verticalArrangement = Arrangement.spacedBy(6.dp)) {
                                  items(storage.vehicleProfiles) { vp ->
                                      Surface(color = if (vIdx == vp.id) preset.primary.copy(alpha = 0.25f) else DesignTokens.GlassSurface, border = BorderStroke(1.dp, DesignTokens.GlassBorder), shape = RoundedCornerShape(12.dp), modifier = Modifier.fillMaxWidth().clickable { vIdx = vp.id; storage.activeVehicleIndex = vp.id; onSettingsUpdated() }) {
                                          Row(Modifier.padding(12.dp), horizontalArrangement = Arrangement.SpaceBetween) {
                                              Text("${vp.brand} — ${vp.modelAr}", color = Color.White, fontWeight = FontWeight.Bold)
                                          }
                                      }
                                  }
                              }
                          }
                      }
                      AppRoute.THEME_SELECTOR -> {
                          var brand by remember { mutableStateOf(storage.carBrandName) }
                          LazyColumn(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              item {
                                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                      Text("الخلفية البانورامية أو المعرض:", color = preset.primary, fontWeight = FontWeight.Bold)
                                      Button(onClick = onPickGalleryWallpaper, colors = ButtonDefaults.buttonColors(containerColor = DesignTokens.AmberGold)) { Text("صورة من المعرض", color = Color.Black, fontWeight = FontWeight.Bold, fontSize = 12.sp) }
                                  }
                                  LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                      items(ScenicWallpaperPreset.entries) { wp -> FilterChip(selected = currentWallpaper == wp && storage.customWallpaperUri == null, onClick = { storage.customWallpaperUri = null; storage.wallpaperPreset = wp; onWallpaperChange(wp) }, label = { Text(wp.titleAr, fontSize = 11.sp) }) }
                                  }
                              }
                              item {
                                  Text("الثيم اللوني:", color = preset.primary, fontWeight = FontWeight.Bold)
                                  LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                      items(CockpitThemePreset.entries) { p -> FilterChip(selected = currentPreset == p, onClick = { storage.themePreset = p; onPresetChange(p) }, label = { Text(p.titleAr, fontSize = 11.sp) }) }
                                  }
                              }
                          }
                      }
                      AppRoute.SWC_VOICE_CONTROL -> {
                          Surface(color = DesignTokens.GlassSurface, border = BorderStroke(1.dp, DesignTokens.GlassBorder), shape = RoundedCornerShape(22.dp), modifier = Modifier.fillMaxSize()) {
                              Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.SpaceBetween) {
                                  Text("أزرار عجلة القيادة والأوامر الصوتية", style = MaterialTheme.typography.titleLarge, color = preset.primary)
                                  Text("آخر زر تم التقاطه: $lastSwcKeyInfo", color = DesignTokens.AmberGold, fontWeight = FontWeight.Bold)
                                  Button(onClick = onLaunchVoice, colors = ButtonDefaults.buttonColors(containerColor = DesignTokens.AmberGold)) { Text("أمر صوتي", color = Color.Black, fontWeight = FontWeight.Bold) }
                              }
                          }
                      }
                      AppRoute.BACKUP_DIAGNOSTICS -> {
                          var statusNote by remember { mutableStateOf(InAppDiagnosticsLogger.getMemoryReport()) }
                          Column(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Text(statusNote, color = preset.primary, fontWeight = FontWeight.Bold, fontSize = 12.sp)
                              Button(onClick = {
                                  val json = storage.exportBackupJson()
                                  val cm = context.getSystemService(Context.CLIPBOARD_SERVICE) as? ClipboardManager
                                  cm?.setPrimaryClip(ClipData.newPlainText("CarLauncherBackupV8", json))
                                  statusNote = "تم تصدير النسخة الاحتياطية المشفرة مع بصمة الأمان!"
                              }) { Text("تصدير JSON محمي") }
                          }
                      }
                      AppRoute.PLUGINS_HUB -> {
                          LazyColumn(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                              items(PluginRegistry.availablePlugins) { pl ->
                                  var isEn by remember { mutableStateOf(storage.isPluginEnabled(pl.id)) }
                                  Surface(color = DesignTokens.GlassSurface, border = BorderStroke(1.dp, DesignTokens.GlassBorder), shape = RoundedCornerShape(14.dp), modifier = Modifier.fillMaxWidth()) {
                                      Row(Modifier.padding(12.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                          Column(Modifier.weight(1f)) { Text(pl.nameAr, color = Color.White, fontWeight = FontWeight.Bold); Text(pl.descriptionAr, color = DesignTokens.TextSecondary, fontSize = 11.sp) }
                                          Switch(checked = isEn, onCheckedChange = { isEn = it; storage.setPluginEnabled(pl.id, it) })
                                      }
                                  }
                              }
                          }
                      }
                      else -> {
                          Surface(color = DesignTokens.GlassSurface, border = BorderStroke(1.dp, DesignTokens.GlassBorder), shape = RoundedCornerShape(22.dp), modifier = Modifier.fillMaxSize()) {
                              Column(Modifier.padding(18.dp), verticalArrangement = Arrangement.SpaceEvenly) {
                                  Text("CAR LAUNCHER UNIVERSAL v8.0", style = MaterialTheme.typography.headlineMedium, color = preset.primary)
                                  Text("منظومة سيارات ذكية متكاملة (Smart Automotive Ecosystem) — 35 شاشة.", color = DesignTokens.TextPrimary, fontWeight = FontWeight.Bold)
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Execute Debug & Release Builds
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk CarLauncherUniversal.apk
          cp app/build/outputs/apk/release/app-release.apk CarLauncherUniversal-v8.0-Release.apk

      - name: Push Protected v8.0 Enterprise Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B v8.0-enterprise
          git push -f origin v8.0-enterprise || true

      - name: Publish Direct APK v8.0 Enterprise Ecosystem
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.0
          name: Car Launcher Universal v8.0 (Enterprise Ecosystem)
          body: |
            ### Car Launcher Universal v8.0 — Enterprise Ecosystem
            - الحفاظ الكامل 100% على التصميم الزجاجي البانورامي (v7.0) وكافة الميزات السابقة.
            - التوسع إلى المنظومة الذكية المتكاملة:
              1. محرك الأتمتة الذكية (Automotive Automation Rules Engine).
              2. مركز التحكم بالأجهزة الخارجية (Device Integration Hub).
              3. المساعد الذكي الناطق بالعربية (AI Copilot + TTS).
              4. مراقب الصيانة الدورية وسجل الرحلات وزيت المحرك.
              5. النسخ الاحتياطي المشفر مع بصمة الأمان (Checksum Backup).
          files: |
            CarLauncherUniversal.apk
            CarLauncherUniversal-v8.0-Release.apk
