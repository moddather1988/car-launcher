          enum class CockpitSection(val titleAr: String, val icon: ImageVector) {
              DASHBOARD("الرئيسية", Icons.Default.Speed),
              NAVIGATION("الخرائط", Icons.Default.LocationOn),
              PHONE("الهاتف", Icons.Default.Call),
              APPS("التطبيقات", Icons.Default.GridView),
              MUSIC("الموسيقى", Icons.Default.MusicNote),
              RADIO("الراديو", Icons.Default.Radio),
              ISLAMIC("الإسلامي", Icons.Default.Mosque),
              VEHICLE("السيارة", Icons.Default.DirectionsCar),
              SETTINGS("الإعدادات", Icons.Default.Settings)
          }

          @Composable
          fun CockpitNavigationShell(
              currentSection: CockpitSection,
              onSelectSection: (CockpitSection) -> Unit,
              content: @Composable BoxScope.() -> Unit
          ) {
              val preset = LocalCockpitPreset.current
              // العناصر الخمسة الرئيسية في الشريط السفلي كما في الصورة الأولى تمامًا + الوصول السريع لبقية الأقسام
              val bottomTabs = listOf(
                  CockpitSection.NAVIGATION,
                  CockpitSection.PHONE,
                  CockpitSection.APPS,
                  CockpitSection.MUSIC,
                  CockpitSection.RADIO,
                  CockpitSection.ISLAMIC,
                  CockpitSection.VEHICLE
              )

              Box(modifier = Modifier.fillMaxSize().background(preset.background)) {
                  // خلفية الجبال والطريق السريع البانورامية المستوحاة من الصورة الأولى
                  ScenicHighwayBackground()

                  Column(
                      modifier = Modifier.fillMaxSize().padding(horizontal = 10.dp, vertical = 6.dp),
                      verticalArrangement = Arrangement.spacedBy(6.dp)
                  ) {
                      // شريط عودة سريع إذا كان المستخدم داخل شاشة فرعية
                      if (currentSection != CockpitSection.DASHBOARD) {
                          Surface(
                              color = preset.card.copy(alpha = 0.85f),
                              shape = RoundedCornerShape(DesignTokens.RadiusM),
                              border = BorderStroke(1.dp, preset.border),
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              Row(
                                  modifier = Modifier.fillMaxWidth().padding(horizontal = 14.dp, vertical = 6.dp),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text(
                                      text = "القسم الحالي: ${currentSection.titleAr}",
                                      style = MaterialTheme.typography.titleMedium,
                                      color = preset.primary
                                  )
                                  Button(
                                      onClick = { onSelectSection(CockpitSection.DASHBOARD) },
                                      colors = ButtonDefaults.buttonColors(containerColor = DesignTokens.AmberGold),
                                      contentPadding = PaddingValues(horizontal = 16.dp, vertical = 4.dp)
                                  ) {
                                      Icon(Icons.Default.Home, contentDescription = null, tint = Color.Black, modifier = Modifier.size(18.dp))
                                      Spacer(Modifier.width(6.dp))
                                      Text("العودة لشاشة القيادة الرئيسية", color = Color.Black, fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                  }
                              }
                          }
                      }

                      // محتوى الشاشة
                      Box(modifier = Modifier.weight(1f).fillMaxWidth(), content = content)

                      // الشريط السفلي الزجاجي العريض المطابق للصورة الأولى
                      Surface(
                          color = preset.card.copy(alpha = 0.78f),
                          shape = RoundedCornerShape(26.dp),
                          border = BorderStroke(1.2.dp, preset.border.copy(alpha = 0.85f)),
                          modifier = Modifier.fillMaxWidth().height(58.dp)
                      ) {
                          Row(
                              modifier = Modifier.fillMaxSize(),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              bottomTabs.forEachIndexed { idx, section ->
                                  val isSelected = currentSection == section
                                  Box(
                                      modifier = Modifier
                                          .weight(1f)
                                          .fillMaxHeight()
                                          .clickable {
                                              if (currentSection == section && section != CockpitSection.DASHBOARD) {
                                                  onSelectSection(CockpitSection.DASHBOARD)
                                              } else {
                                                  onSelectSection(section)
                                              }
                                          },
                                      contentAlignment = Alignment.Center
                                  ) {
                                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                          Icon(
                                              imageVector = section.icon,
                                              contentDescription = section.titleAr,
                                              tint = if (isSelected) preset.primary else DesignTokens.TextPrimary,
                                              modifier = Modifier.size(21.dp)
                                          )
                                          Spacer(Modifier.height(2.dp))
                                          Text(
                                              text = section.titleAr,
                                              fontSize = 11.sp,
                                              fontWeight = if (isSelected) FontWeight.Bold else FontWeight.Medium,
                                              color = if (isSelected) preset.primary else DesignTokens.TextPrimary
                                          )
                                      }
                                  }
                                  if (idx < bottomTabs.lastIndex) {
                                      Box(
                                          modifier = Modifier
                                              .width(1.dp)
                                              .fillMaxHeight(0.55f)
                                              .background(preset.border.copy(alpha = 0.55f))
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun ScenicHighwayBackground() {
              val preset = LocalCockpitPreset.current
              Canvas(modifier = Modifier.fillMaxSize()) {
                  val w = size.width
                  val h = size.height

                  // تدرج السماء الليلية والجبال
                  drawRect(
                      brush = Brush.verticalGradient(
                          colors = listOf(
                              Color(0xFF041019),
                              preset.background,
                              Color(0xFF072331),
                              Color(0xFF05131C)
                          )
                      )
                  )

                  // سلسلة الجبال الخلفية اليسرى واليمنى
                  val mountainPath = Path().apply {
                      moveTo(0f, h * 0.52f)
                      lineTo(w * 0.15f, h * 0.34f)
                      lineTo(w * 0.32f, h * 0.48f)
                      lineTo(w * 0.50f, h * 0.42f)
                      lineTo(w * 0.70f, h * 0.32f)
                      lineTo(w * 0.88f, h * 0.44f)
                      lineTo(w, h * 0.36f)
                      lineTo(w, h * 0.56f)
                      lineTo(0f, h * 0.56f)
                      close()
                  }
                  drawPath(mountainPath, color = Color(0xFF0A2636).copy(alpha = 0.55f))

                  // الطريق السريع الممتد من مركز العداد إلى أسفل الشاشة
                  val roadPath = Path().apply {
                      moveTo(w * 0.44f, h * 0.46f)
                      lineTo(w * 0.56f, h * 0.46f)
                      lineTo(w * 0.78f, h)
                      lineTo(w * 0.22f, h)
                      close()
                  }
                  drawPath(
                      path = roadPath,
                      brush = Brush.verticalGradient(
                          colors = listOf(
                              Color(0xFF0F293A).copy(alpha = 0.35f),
                              Color(0xFF091824).copy(alpha = 0.75f)
                          )
                      )
                  )

                  // خطوط حارات الطريق المضيئة
                  drawLine(
                      color = preset.primary.copy(alpha = 0.30f),
                      start = Offset(w * 0.45f, h * 0.46f),
                      end = Offset(w * 0.25f, h),
                      strokeWidth = 2.dp.toPx()
                  )
                  drawLine(
                      color = preset.primary.copy(alpha = 0.30f),
                      start = Offset(w * 0.55f, h * 0.46f),
                      end = Offset(w * 0.75f, h),
                      strokeWidth = 2.dp.toPx()
                  )
                  drawLine(
                      color = Color.White.copy(alpha = 0.18f),
                      start = Offset(w * 0.50f, h * 0.48f),
                      end = Offset(w * 0.50f, h),
                      strokeWidth = 4.dp.toPx()
                  )
              }
          }
          EOF

